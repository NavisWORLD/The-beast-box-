# Beast Box drop-in for the Muse Linux Device SDK service.
# Installed by integrations/muse-gadget/install.sh as
# /etc/systemd/system/musegadget.service.d/beastbox.conf.
# The name the gadget registers with Muse. The Bluetooth name stays
# MuseGadgetXXXXXX: the Muse app requires that format.
[Service]
Environment="MUSEGADGET_DISPLAY_NAME=@DISPLAY_NAME@"
