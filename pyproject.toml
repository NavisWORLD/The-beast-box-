[build-system]
requires = ["setuptools==78.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-beast-box"
version = "0.4.0"
description = "Local-first COSMOS/CST runtime: memory, state control, model adapters, provenance. IBM Quantum is optional and not required."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "NavisWORLD"}]
keywords = ["ai", "local-llm", "memory", "provenance", "cst", "cosmos", "runtime"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
quantum = ["qiskit>=2.5.0", "qiskit-ibm-runtime>=0.47.0"]
huggingface = ["huggingface-hub>=0.27"]
ml = ["torch>=2.2", "numpy>=2.0"]
local-llm = ["llama-cpp-python>=0.3.9"]
dev = ["pytest>=8.0", "coverage>=7.0", "ruff>=0.12", "mypy>=1.17", "numpy>=2.0"]

[project.urls]
Homepage = "https://github.com/NavisWORLD/The-beast-box-"
DOI = "https://doi.org/10.5281/zenodo.17574447"
Canonical = "https://github.com/NavisWORLD/The-beast-box-"

[project.scripts]
beastbox = "beastbox.cli:main"
"cosmic.cypher-cli" = "beastbox.cypher.cli:main"
cosmic-cypher = "beastbox.cypher.cli:main"
cypher = "beastbox.cypher.cli:main"
zeref = "beastbox.cypher.easy_ollama:main"
beast-arms = "beastbox.arms.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["beastbox*"]
exclude = ["tests*", "scripts*", "docs*", "experiments*", "evidence*", "QUANTUM_BEAST_STARTER*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
files = [
  "beastbox/logging_config.py",
  "beastbox/hashutil.py",
  "beastbox/aliases.py",
]

[tool.coverage.run]
source = ["beastbox"]
omit = ["beastbox/descendant/*", "beastbox/arms/*", "beastbox/autonomy/*", "beastbox/soul/*"]

[tool.coverage.report]
fail_under = 20
show_missing = true
