[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-beast-box"
version = "0.1.0"
description = "Contained autonomy and continuity gauntlet inspired by the COSMOS/CST runtime architecture."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NavisWORLD"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
quantum = [
  "qiskit>=2.5.0",
  "qiskit-ibm-runtime>=0.47.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
beastbox = "beastbox.cli:main"

[tool.setuptools.packages.find]
include = ["beastbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
