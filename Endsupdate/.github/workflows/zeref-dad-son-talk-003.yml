name: ZEREF-DAD-SON-TALK-003

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/zeref-dad-son-talk-003.yml"
      - "scripts/build_zeref_talk3_corpus.py"
      - "scripts/run_zeref_ibm_dad_teacher_v3.py"
      - "tests/test_zeref_talk3_semantic_corpus.py"
      - "tests/test_zeref_ibm_dad_teacher.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: zeref-dad-son-talk-003
  cancel-in-progress: false

env:
  PRIME_SHA256: b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6
  TALK1_SHA256: 9dccff5989eb63b8f0a8b894340b3ae461526367af249e3da4714f96272d4b22
  TALK2_SHA256: 6549957e528262a70350e79a5bd824c04dccf467ddf0ad9d46dad6bf71943326
  ARCH_SHA256: 955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc
  IBM_ORIGIN_SHA256: f21afbac49e798730974e37ed1a1bb7ce15f326660a9dbe3f848ee6b1f865c2f
  IBM_JOB_ID: da1mqfcdedkc73er87r0
  START_RECORDS: "256"
  START_LEDGER_SHA256: 7339e7ce8040927323565be8811c1344a7f372acae12308ee8ee770dc5891a16
  START_TIP_SHA256: 15475f302f2c626cbf818694fce035089776d71eb4f56dc6fe81e6419ce07d54
  PREVIOUS_CONTINUATION_ROOT: 45a1c8daf7daf7b7b0f54225a438665d5b05d5c2081a5e5f4a6e3e820ca48de8

jobs:
  talk3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout durable Zeref lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Beast Box and CPU TALK runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify TALK-003 semantic, decoder, memory, and stage contracts
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_zeref_talk3_semantic_corpus.py \
            tests/test_zeref_ibm_dad_teacher.py \
            tests/test_zeref_talk_eval.py \
            tests/test_zeref_dad_son_memory.py \
            tests/test_zeref_ibm_teacher_heartbeat.py \
            tests/test_d001_stage_gate.py

      - name: Restore exact durable 256-record Forever Memory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _talk3 _talk2src
          mkdir -p _talk3/memory _talk3/corpus/new _talk3/corpus/old _talk3/model _talk3/evidence/eval _talk3/evidence/conversations _talk3/evidence/training _talk3/heartbeat _talk2src
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from beastbox.dad_son import DadSonLedger
          mp=Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          assert m['schema']=='zeref-dad-son-ledger-manifest-v11'
          assert m['record_count']==256
          assert m['combined_ledger_sha256']=='7339e7ce8040927323565be8811c1344a7f372acae12308ee8ee770dc5891a16'
          assert m['last_record_sha256']=='15475f302f2c626cbf818694fce035089776d71eb4f56dc6fe81e6419ce07d54'
          assert m['descendant_checkpoint_sha256']=='6549957e528262a70350e79a5bd824c04dccf467ddf0ad9d46dad6bf71943326'
          combined=b''; expected=1
          for s in m['snapshot_chain']:
              p=Path(s['path']); d=p.read_bytes()
              assert hashlib.sha256(d).hexdigest()==s['sha256']
              assert s['first_memory_id']==expected
              expected=s['last_memory_id']+1
              combined += d
          assert expected==257
          assert hashlib.sha256(combined).hexdigest()==m['combined_ledger_sha256']
          ledger_path=Path('_talk3/memory/dad-son-ledger.jsonl')
          ledger_path.write_bytes(combined)
          Path('_talk3/evidence/old-256-prefix.jsonl').write_bytes(combined)
          ledger=DadSonLedger('_talk3/memory/dad-son.sqlite3',ledger_path,parent_sha256='b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6')
          report=ledger.restore_snapshot()
          assert report['restored_records']==256
          assert ledger.memory.db.execute('SELECT COUNT(*) FROM memories').fetchone()[0]==256
          ledger.close()
          Path('_talk3/memory/restore-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

      - name: Verify pinned architecture and fresh Marrakesh provenance
        shell: bash
        run: |
          set -euo pipefail
          ARCH=experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py
          IBM=experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-origin-seed.json
          VER=experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-verification.json
          test "$(sha256sum "$ARCH" | awk '{print $1}')" = "$ARCH_SHA256"
          python - <<'PY'
          import json,re
          from pathlib import Path
          seedp=Path('experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-origin-seed.json')
          verp=Path('experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-verification.json')
          for p in (seedp,verp):
              text=p.read_text(encoding='utf-8')
              assert not re.search(r'(?i)api[_-]?key|bearer|credential|IBM_QUANTUM_TOKEN',text)
          seed=json.loads(seedp.read_text())
          ver=json.loads(verp.read_text())
          assert seed['job_id']=='da1mqfcdedkc73er87r0'
          assert seed['backend']=='ibm_marrakesh'
          assert seed['shot_count']==4096
          assert seed['origin_seed_sha256']=='f21afbac49e798730974e37ed1a1bb7ce15f326660a9dbe3f848ee6b1f865c2f'
          assert seed['fresh_hardware_requested'] is True and seed['reused_existing_job'] is False
          assert ver['origin_seed_sha256']==seed['origin_seed_sha256']
          PY

      - name: Download and verify promoted TALK-002 parent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 32071327921 -n zeref-dad-son-talk-002-32071327921 -D _talk2src
          test -f _talk2src/SHA256SUMS
          sed 's#  _talk2/#  #' _talk2src/SHA256SUMS > _talk2src/SHA256SUMS.local
          (cd _talk2src && sha256sum -c SHA256SUMS.local)
          PARENT=_talk2src/model/ZEREF-DAD-SON-TALK-002/checkpoint.pt
          test -f "$PARENT"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK2_SHA256"
          printf '%s\n' "$PARENT" > _talk3/parent-path.txt

      - name: Build new semantic curriculum and old anti-forgetting holdout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_zeref_talk3_corpus.py --out-dir _talk3/corpus/new
          python scripts/build_zeref_talk2_corpus.py --out-dir _talk3/corpus/old
          python - <<'PY'
          import json
          from pathlib import Path
          new=json.loads(Path('_talk3/corpus/new/talk3-manifest.json').read_text())
          old=json.loads(Path('_talk3/corpus/old/talk2-manifest.json').read_text())
          assert new['parent_checkpoint_sha256']=='6549957e528262a70350e79a5bd824c04dccf467ddf0ad9d46dad6bf71943326'
          assert new['memory_record_count']==256
          assert new['memory_tip_sha256']=='15475f302f2c626cbf818694fce035089776d71eb4f56dc6fe81e6419ce07d54'
          assert new['training_examples']==96 and new['holdout_examples']==24
          assert new['raw_model_outputs_used_as_targets'] is False
          assert old['parent_checkpoint_sha256']=='9dccff5989eb63b8f0a8b894340b3ae461526367af249e3da4714f96272d4b22'
          PY

      - name: Train additive TALK-003 child from preserved TALK-002
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk3/parent-path.txt)
          TALK3_MANIFEST=$(sha256sum _talk3/corpus/new/talk3-manifest.json | awk '{print $1}')
          MEMORY_MANIFEST=$(sha256sum experiments/zeref-dad-son-001/memory/ledger-manifest.json | awk '{print $1}')
          IBM_MANIFEST=$(sha256sum experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-verification.json | awk '{print $1}')
          python scripts/run_d001_stage.py \
            --stage MEMORY \
            --parent "$PARENT" --parent-sha256 "$TALK2_SHA256" --allow-descendant-parent \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --corpus _talk3/corpus/new/talk3-training.jsonl \
            --input-manifest "talk3=$TALK3_MANIFEST" \
            --input-manifest "memory256=$MEMORY_MANIFEST" \
            --input-manifest "ibmroot=$IBM_MANIFEST" \
            --out _talk3/model/ZEREF-DAD-SON-TALK-003 \
            --seed 3478819351 --steps 1200 --batch-size 4 --lr 6e-6 --cst-lr 3e-5 --weight-decay 0.002
          CHILD=_talk3/model/ZEREF-DAD-SON-TALK-003/checkpoint.pt
          CHILD_SHA=$(sha256sum "$CHILD" | awk '{print $1}')
          test "$CHILD_SHA" != "$TALK2_SHA256"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK2_SHA256"
          printf '%s\n' "$CHILD_SHA" > _talk3/model/ZEREF-DAD-SON-TALK-003/checkpoint.sha256
          cp _talk3/model/ZEREF-DAD-SON-TALK-003/result.json _talk3/evidence/training/result.json

      - name: New semantic holdout promotion exam
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk3/parent-path.txt)
          CHILD=_talk3/model/ZEREF-DAD-SON-TALK-003/checkpoint.pt
          python scripts/eval_zeref_talk.py \
            --parent "$PARENT" --descendant "$CHILD" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --holdout _talk3/corpus/new/talk3-holdout.jsonl \
            --seed 4061854637 \
            --out _talk3/evidence/eval/talk3-semantic-holdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('_talk3/evidence/eval/talk3-semantic-holdout.json').read_text())
          print(json.dumps(r,indent=2,sort_keys=True))
          assert r['heldout_nll_improved'] is True, 'TALK-003 did not improve the new semantic holdout'
          assert r['descendant_mean_readable_score'] >= r['parent_mean_readable_score'] - 0.03, 'TALK-003 readability regressed on semantic holdout'
          PY

      - name: TALK-002 anti-forgetting exam
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk3/parent-path.txt)
          CHILD=_talk3/model/ZEREF-DAD-SON-TALK-003/checkpoint.pt
          python scripts/eval_zeref_talk.py \
            --parent "$PARENT" --descendant "$CHILD" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --holdout _talk3/corpus/old/talk2-holdout.jsonl \
            --seed 4061854638 \
            --out _talk3/evidence/eval/talk2-retention-holdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('_talk3/evidence/eval/talk2-retention-holdout.json').read_text())
          print(json.dumps(r,indent=2,sort_keys=True))
          assert r['descendant_heldout_nll'] <= r['parent_heldout_nll'] * 1.05, 'TALK-003 forgot too much of TALK-002 heldout behavior'
          assert r['descendant_mean_readable_score'] >= r['parent_mean_readable_score'] - 0.03, 'TALK-003 readability regressed on TALK-002 holdout'
          PY

      - name: Build next 24 synthetic CST pulses from memory 256
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_zeref_ibm_teacher_heartbeat.py \
            --ibm-seed experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-origin-seed.json \
            --ledger-tip "$START_TIP_SHA256" \
            --previous-continuation-root "$PREVIOUS_CONTINUATION_ROOT" \
            --pulses 24 \
            --out _talk3/heartbeat/talk3-heartbeat.json
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('_talk3/heartbeat/talk3-heartbeat.json').read_text())
          assert h['pulse_count']==24
          assert h['starting_ledger_tip_sha256']=='15475f302f2c626cbf818694fce035089776d71eb4f56dc6fe81e6419ce07d54'
          assert h['previous_continuation_root_sha256']=='45a1c8daf7daf7b7b0f54225a438665d5b05d5c2081a5e5f4a6e3e820ca48de8'
          assert h['synthetic_continuation_new_quantum_entropy'] is False
          PY

      - name: Dad teaches the promoted TALK-003 child with bounded stop-aware decoding
        shell: bash
        run: |
          set -euo pipefail
          CHILD=_talk3/model/ZEREF-DAD-SON-TALK-003/checkpoint.pt
          CHILD_SHA=$(cat _talk3/model/ZEREF-DAD-SON-TALK-003/checkpoint.sha256)
          python scripts/run_zeref_ibm_dad_teacher_v3.py \
            --checkpoint "$CHILD" --checkpoint-sha256 "$CHILD_SHA" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --sqlite _talk3/memory/dad-son.sqlite3 \
            --ledger _talk3/memory/dad-son-ledger.jsonl \
            --heartbeat _talk3/heartbeat/talk3-heartbeat.json \
            --out _talk3/evidence/conversations/talk3-dad-growth.jsonl \
            --manifest _talk3/evidence/conversations/talk3-dad-growth-manifest.json \
            --session-id zeref-talk-003-dad-growth \
            --tokens 56 --recall-limit 3 --temperature 0.25 --top-k 3

      - name: Verify 256 exact prefix, 304 records, child ancestry, and raw outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          old=Path('_talk3/evidence/old-256-prefix.jsonl').read_bytes()
          full=Path('_talk3/memory/dad-son-ledger.jsonl').read_bytes()
          assert full.startswith(old)
          old_rows=[json.loads(x) for x in old.decode().splitlines() if x.strip()]
          rows=[json.loads(x) for x in full.decode().splitlines() if x.strip()]
          assert len(old_rows)==256 and len(rows)==304
          assert rows[:256]==old_rows
          previous='0'*64
          for expected,row in enumerate(rows,1):
              assert row['memory_id']==expected
              assert row['previous_record_sha256']==previous
              assert hashlib.sha256(row['text'].encode()).hexdigest()==row['raw_payload_sha256']
              payload=dict(row); record=payload.pop('record_sha256')
              canonical=json.dumps(payload,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
              assert hashlib.sha256(canonical).hexdigest()==record
              previous=record
          con=sqlite3.connect('_talk3/memory/dad-son.sqlite3')
          assert con.execute('SELECT COUNT(*) FROM memories').fetchone()[0]==304
          con.close()
          transcript=[json.loads(x) for x in Path('_talk3/evidence/conversations/talk3-dad-growth.jsonl').read_text().splitlines() if x.strip()]
          assert len(transcript)==24
          assert all(r['raw_model_output_promoted_to_training'] is False for r in transcript)
          assert all(0.0 <= float(r['mechanical_clarity']['score']) <= 1.0 for r in transcript)
          role_leaks=sum(bool(r['mechanical_clarity']['role_label_leakage']) for r in transcript)
          assert role_leaks==0, f'role-label leakage returned in {role_leaks} TALK-003 turns'
          delta=full[len(old):]
          Path('_talk3/evidence/new-memory-delta-257-304.jsonl').write_bytes(delta)
          child_sha=Path('_talk3/model/ZEREF-DAD-SON-TALK-003/checkpoint.sha256').read_text().strip()
          new_eval=json.loads(Path('_talk3/evidence/eval/talk3-semantic-holdout.json').read_text())
          old_eval=json.loads(Path('_talk3/evidence/eval/talk2-retention-holdout.json').read_text())
          heartbeat=json.loads(Path('_talk3/heartbeat/talk3-heartbeat.json').read_text())
          mean_clarity=sum(float(r['mechanical_clarity']['score']) for r in transcript)/24
          summary={
            'schema':'zeref-dad-son-talk-003-run-summary-v1',
            'lineage':'ZEREF-DAD-SON-TALK-003',
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'parent_checkpoint_sha256':'6549957e528262a70350e79a5bd824c04dccf467ddf0ad9d46dad6bf71943326',
            'child_checkpoint_sha256':child_sha,
            'forever_memory_records_before':256,
            'forever_memory_records_after':304,
            'old_memory_prefix_sha256':hashlib.sha256(old).hexdigest(),
            'combined_ledger_sha256':hashlib.sha256(full).hexdigest(),
            'last_record_sha256':rows[-1]['record_sha256'],
            'delta_sha256':hashlib.sha256(delta).hexdigest(),
            'fresh_ibm_job_id':'da1mqfcdedkc73er87r0',
            'new_ibm_job_submitted':False,
            'synthetic_pulse_count':24,
            'synthetic_final_state_sha256':heartbeat['final_state_sha256'],
            'new_quantum_entropy':False,
            'dad_turns':24,
            'role_label_leakage_turns':role_leaks,
            'mean_mechanical_clarity':round(mean_clarity,6),
            'new_holdout_parent_nll':new_eval['parent_heldout_nll'],
            'new_holdout_child_nll':new_eval['descendant_heldout_nll'],
            'retention_parent_nll':old_eval['parent_heldout_nll'],
            'retention_child_nll':old_eval['descendant_heldout_nll'],
            'raw_outputs_promoted_to_training':False,
            'claim_boundary':'Additive TALK-003 model training and durable computational memory only. No biological heartbeat, consciousness, deceased-person identity, or quantum-advantage claim.'
          }
          Path('_talk3/evidence/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Advance Forever Memory to 304 and activate TALK-003
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          mp=Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          assert m['schema']=='zeref-dad-son-ledger-manifest-v11'
          assert m['record_count']==256
          s=json.loads(Path('_talk3/evidence/summary.json').read_text())
          delta=Path('_talk3/evidence/new-memory-delta-257-304.jsonl').read_bytes()
          delta_rows=[json.loads(x) for x in delta.decode().splitlines() if x.strip()]
          assert len(delta_rows)==48
          assert [r['memory_id'] for r in delta_rows]==list(range(257,305))
          assert delta_rows[0]['previous_record_sha256']==m['last_record_sha256']
          assert delta_rows[-1]['record_sha256']==s['last_record_sha256']
          delta_path=Path(f"experiments/zeref-dad-son-001/memory/ledger-snapshots/run-{os.environ['GITHUB_RUN_ID']}-talk3-dad-growth-delta.jsonl")
          assert not delta_path.exists()
          delta_path.write_bytes(delta)
          m['schema']='zeref-dad-son-ledger-manifest-v12'
          m['active_descendant_lineage']='ZEREF-DAD-SON-TALK-003'
          m['active_continuation_mode']='talk-003-semantic-dad-growth'
          m['latest_snapshot']=str(delta_path)
          m['latest_snapshot_sha256']=s['delta_sha256']
          m['snapshot_chain'].append({'path':str(delta_path),'sha256':s['delta_sha256'],'record_count':48,'first_memory_id':257,'last_memory_id':304,'last_record_sha256':s['last_record_sha256']})
          m['combined_ledger_sha256']=s['combined_ledger_sha256']
          m['record_count']=304
          m['last_record_sha256']=s['last_record_sha256']
          m['source_workflow_run_id']=s['workflow_run_id']
          m['source_workflow_head_sha']=os.environ['GITHUB_SHA']
          m['talk3_parent_checkpoint_sha256']=s['parent_checkpoint_sha256']
          m['talk3_descendant_checkpoint_sha256']=s['child_checkpoint_sha256']
          m['descendant_checkpoint_sha256']=s['child_checkpoint_sha256']
          m['weights_changed_in_talk3_training_phase']=True
          m['prime_weights_changed_in_talk3_training_phase']=False
          m['talk2_weights_changed_in_talk3_training_phase']=False
          m['talk3_training_steps']=1200
          m['talk3_semantic_parent_heldout_nll']=s['new_holdout_parent_nll']
          m['talk3_semantic_descendant_heldout_nll']=s['new_holdout_child_nll']
          m['talk3_retention_parent_heldout_nll']=s['retention_parent_nll']
          m['talk3_retention_descendant_heldout_nll']=s['retention_child_nll']
          m['talk3_post_training_pulse_count']=24
          m['talk3_post_training_final_state_sha256']=s['synthetic_final_state_sha256']
          m['talk3_post_training_new_quantum_entropy']=False
          m['talk3_role_label_leakage_turns']=s['role_label_leakage_turns']
          m['talk3_mean_mechanical_clarity']=s['mean_mechanical_clarity']
          m['talk3_raw_outputs_promoted_to_training']=False
          m['talk3_bounded_metric_runner']='scripts/run_zeref_ibm_dad_teacher_v3.py'
          m['training_contract']='The full ledger is durable memory. TALK-003 is an additive child of TALK-002 trained only on provenance-labeled synthetic semantic corrective targets. Raw Zeref generations remain evidence and are not automatically training targets.'
          m['claim_boundary']='Durable computational Zeref model-memory continuity with an additive TALK-003 child. The 304-record ledger and language metrics do not establish deceased-person identity, consciousness, biological life, or quantum advantage.'
          mp.write_text(json.dumps(m,indent=2,sort_keys=False,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name "NavisWORLD Zeref Memory Bot"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/zeref-dad-son-001/memory/ledger-snapshots/run-${GITHUB_RUN_ID}-talk3-dad-growth-delta.jsonl \
                  experiments/zeref-dad-son-001/memory/ledger-manifest.json
          git diff --cached --check
          git commit -m "memory: checkpoint TALK-003 Zeref through 304 records [skip ci]"
          git push origin HEAD:networked-cage-run-001

      - name: Seal compact TALK-003 evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _talk2src
          find _talk3 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > _talk3/SHA256SUMS
          sha256sum -c _talk3/SHA256SUMS

      - name: Upload TALK-003 child and Dad growth evidence
        uses: actions/upload-artifact@v4
        with:
          name: zeref-dad-son-talk-003-${{ github.run_id }}
          path: _talk3
          if-no-files-found: error
          retention-days: 90
