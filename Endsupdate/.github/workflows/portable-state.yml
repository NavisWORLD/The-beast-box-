name: Portable state Linux to Windows
on:
  workflow_call:
  push:
    branches: [polish/beast-box-launch-003]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir "$RUNNER_TEMP/wheel"
      - run: python -m pip install "$RUNNER_TEMP"/wheel/*.whl
      - name: Export through the installed package
        run: |
          mkdir -p "$RUNNER_TEMP/handoff"
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/scripts/check_portable_handoff.py" export --bundle "$RUNNER_TEMP/handoff/snapshot" --state "$RUNNER_TEMP/machine-a" --receipt "$RUNNER_TEMP/handoff/source.json"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-handoff
          path: ${{ runner.temp }}/handoff
  import:
    needs: export
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: portable-handoff
          path: ${{ runner.temp }}/handoff
      - shell: bash
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir "$RUNNER_TEMP/wheel"
          python -m pip install "$RUNNER_TEMP"/wheel/*.whl
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/scripts/check_portable_handoff.py" import --bundle "$RUNNER_TEMP/handoff/snapshot" --state "$RUNNER_TEMP/machine-b" --receipt "$RUNNER_TEMP/handoff/source.json"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-handoff-result
          path: ${{ runner.temp }}/handoff/handoff-result.json
