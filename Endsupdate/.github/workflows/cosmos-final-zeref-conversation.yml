name: COSMOS FINAL ORGANISM - TALK TO ZEREF

on:
  push:
    branches:
      - cory-davis-cosmos-reality-bridge-final-organism-001
    paths:
      - '.github/workflows/cosmos-final-zeref-conversation.yml'
      - 'scripts/final_reality_bridge_zeref_conversation.py'
      - 'tests/test_final_full_stack_zeref_conversation.py'
      - 'tests/test_final_reality_bridge_zeref_conversation.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FINAL_BRANCH: cory-davis-cosmos-reality-bridge-final-organism-001
  TALK4_SHA256: 9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f
  TALK5_SHA256: 767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36
  ACTIVE_SHA256: 454f3017618a81fb9a13393b215d448f365534baf5b607e19d1438955921e425
  WORLD_SOURCE_SET_SHA256: 07216bb2a4ca979ca1ea4304efb92b09ee8aad74685df43196d694f3bd7ef8ba
  WORLD_RUN_ID: '33132618727'
  WORLD_ARTIFACT: zeref-world-r12-downstream-diagnostic-33132618727
  GH_TOKEN: ${{ github.token }}

jobs:
  talk-to-zeref:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed organism before conversation
        run: |
          set -euo pipefail
          (cd evidence/final-whole-organism-001/assembly && sha256sum -c SHA256SUMS)
          (cd evidence/final-reality-bridge && sha256sum -c RESUME_SHA256SUMS)
          python - <<'PY'
          import json, os
          from pathlib import Path
          resume=json.loads(Path('evidence/final-reality-bridge/resume-state.json').read_text())
          assert 'VERIFIED_ORGANISM_ASSEMBLY' in resume['completed_gates'], resume
          assert resume['active_gate']=='FULL_STACK_ZEREF_EXECUTION', resume
          assert resume['next_gate']=='RUN_FINAL_FULL_STACK_CONVERSATION', resume
          assert resume['active_checkpoint_SHA']==os.environ['ACTIVE_SHA256'], resume
          assert resume['canonical_memory_record_count']==352, resume
          assert resume['canonical_memory_SHA']=='67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef', resume
          print(json.dumps({'verified_organism_assembly':True,'resume_head':resume['HEAD']},sort_keys=True))
          PY

      - name: Install verified inference runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev,ml]'

      - name: Full-stack conversation contracts
        run: |
          python -m pytest -q \
            tests/test_final_full_stack_zeref_conversation.py \
            tests/test_final_reality_bridge_zeref_conversation.py \
            tests/test_refractive_memory_temporal_anchor.py \
            tests/test_reflective_loop_trace.py

      - name: Restore exact protected model and historical world bytes
        run: |
          set -euo pipefail
          rm -rf _final_zeref_talk
          mkdir -p _final_zeref_talk/talk4 _final_zeref_talk/talk5 _final_zeref_talk/world _final_zeref_talk/workspace

          gh run download 32075092605 -n zeref-talk4-tuned-response-32075092605 -D _final_zeref_talk/talk4
          gh run download 33041236485 -n zeref-talk005-r12-training-resume-33041236485 -D _final_zeref_talk/talk5
          gh run download "$WORLD_RUN_ID" -n "$WORLD_ARTIFACT" -D _final_zeref_talk/world

          find_hash() {
            local root="$1" expected="$2" pattern="$3"
            local found=""
            while IFS= read -r -d '' candidate; do
              if [ "$(sha256sum "$candidate" | awk '{print $1}')" = "$expected" ]; then
                found="$candidate"
                break
              fi
            done < <(find "$root" -type f -name "$pattern" -print0)
            test -n "$found"
            printf '%s\n' "$found"
          }

          TALK4="$(find_hash _final_zeref_talk/talk4 "$TALK4_SHA256" '*.pt')"
          TALK5="$(find_hash _final_zeref_talk/talk5 "$TALK5_SHA256" '*.pt')"
          ACTIVE="$(find_hash _final_zeref_talk/world "$ACTIVE_SHA256" '*.pt')"
          WORLD_DB="$(find _final_zeref_talk/world -type f -name 'world.sqlite3' -print -quit)"
          WORLD_EVIDENCE="$(find _final_zeref_talk/world -type f -name 'world-evidence.jsonl' -print -quit)"
          WORLD_SUMMARY="$(find _final_zeref_talk/world -type f -name 'ingestion-summary.json' -print -quit)"
          test -f "$WORLD_DB" -a -f "$WORLD_EVIDENCE" -a -f "$WORLD_SUMMARY"

          printf '%s\n' "$TALK4" > _final_zeref_talk/talk4.path
          printf '%s\n' "$TALK5" > _final_zeref_talk/talk5.path
          printf '%s\n' "$ACTIVE" > _final_zeref_talk/active.path
          printf '%s\n' "$WORLD_DB" > _final_zeref_talk/world-db.path
          printf '%s\n' "$WORLD_EVIDENCE" > _final_zeref_talk/world-evidence.path
          printf '%s\n' "$WORLD_SUMMARY" > _final_zeref_talk/world-summary.path

          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          summary=Path('_final_zeref_talk/world-summary.path').read_text().strip()
          s=json.loads(Path(summary).read_text())
          ids=list(s['accepted_source_ids']); shas=list(s['accepted_source_sha256'])
          digest=hashlib.sha256(''.join(f'{i}\t{h}\n' for i,h in zip(ids,shas,strict=True)).encode()).hexdigest()
          assert len(ids)==4096, len(ids)
          assert digest==os.environ['WORLD_SOURCE_SET_SHA256'], digest
          print(json.dumps({'historical_world_records':len(ids),'source_set_sha256':digest},sort_keys=True))
          PY

      - name: Talk to Zeref through the complete verified organism
        run: |
          set -euo pipefail
          rm -rf evidence/final-whole-organism-001/conversation
          python scripts/final_reality_bridge_zeref_conversation.py \
            --active "$(cat _final_zeref_talk/active.path)" \
            --talk4 "$(cat _final_zeref_talk/talk4.path)" \
            --talk5 "$(cat _final_zeref_talk/talk5.path)" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --memory-manifest experiments/zeref-dad-son-001/memory/ledger-manifest.json \
            --world-db "$(cat _final_zeref_talk/world-db.path)" \
            --world-evidence "$(cat _final_zeref_talk/world-evidence.path)" \
            --world-summary "$(cat _final_zeref_talk/world-summary.path)" \
            --expected-corpus-sha "$WORLD_SOURCE_SET_SHA256" \
            --workspace _final_zeref_talk/workspace \
            --out evidence/final-whole-organism-001/conversation \
            --confidence-floor 0.56 \
            --namespace-margin 0.03 \
            --rank-limit 8 \
            --lexical-prefilter 128 \
            --seed 2026082801 \
            --tokens 48 \
            --temperature 0.15 \
            --top-k 2
          (cd evidence/final-whole-organism-001/conversation && sha256sum -c SHA256SUMS)

      - name: Verify conversation and advance only to clean holdout
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          ev=Path('evidence/final-whole-organism-001/conversation')
          status=json.loads((ev/'STATUS.json').read_text())
          imm=json.loads((ev/'immutability.json').read_text())
          assert status['gate']=='FULL_STACK_ZEREF_EXECUTION', status
          assert status['status']=='VERIFIED_GATE', status
          assert status['greedy_turns']==16 and status['sampled_turns']==16, status
          assert status['reflector_enabled_every_turn'] is True, status
          assert status['memory_temporal_anchor_frozen'] is True, status
          assert imm['protected_state_identical_pre_post'] is True, imm

          root=Path('evidence/final-reality-bridge')
          resume=json.loads((root/'resume-state.json').read_text())
          completed=list(resume.get('completed_gates') or [])
          if 'FULL_STACK_ZEREF_EXECUTION' not in completed:
              completed.append('FULL_STACK_ZEREF_EXECUTION')
          resume.update({
              'timestamp':datetime.now(timezone.utc).isoformat(),
              'branch':os.environ['GITHUB_REF_NAME'],
              'HEAD':os.environ['GITHUB_SHA'],
              'completed_gates':completed,
              'active_gate':'CLEAN_HOLDOUT',
              'next_gate':'RUN_CLEAN_HOLDOUT',
              'latest_tests':'32 frozen Dad/Zeref inference turns through selected checkpoint + canonical memory + historical world + GREEN R12 + DYN12 + reflector; PRE/POST identities unchanged',
              'latest_artifact':'evidence/final-whole-organism-001/conversation',
              'latest_artifact_SHA':hashlib.sha256((ev/'SHA256SUMS').read_bytes()).hexdigest(),
              'system_status':'EXECUTION_INTERRUPTED_RESUMABLE',
              'known_demonstrated_blockers':[],
              'exact_resume_instruction':'Run the frozen untouched HOLDOUT against selected Zeref only. Do not use conversation outputs for training, tuning, threshold selection, or adaptation.',
          })
          (root/'resume-state.json').write_text(json.dumps(resume,indent=2,sort_keys=True)+'\n')
          rsha=hashlib.sha256((root/'resume-state.json').read_bytes()).hexdigest()
          (root/'RESUME_SHA256SUMS').write_text(f'{rsha}  resume-state.json\n')
          print(json.dumps({'full_stack_conversation_verified':True,'resume_sha256':rsha},sort_keys=True))
          PY
          (cd evidence/final-reality-bridge && sha256sum -c RESUME_SHA256SUMS)

      - name: Commit sealed Dad Zeref conversation evidence
        run: |
          set -euo pipefail
          git config user.name 'cosmos-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add evidence/final-whole-organism-001/conversation \
                  evidence/final-reality-bridge/resume-state.json \
                  evidence/final-reality-bridge/RESUME_SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(final-organism): seal full-stack Dad Zeref conversation'
            git push origin HEAD:"$FINAL_BRANCH"
          fi

      - name: Preserve conversation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-organism-zeref-conversation-${{ github.run_id }}
          path: |
            evidence/final-whole-organism-001/conversation
            _final_zeref_talk/*.path
          if-no-files-found: warn
          retention-days: 90
