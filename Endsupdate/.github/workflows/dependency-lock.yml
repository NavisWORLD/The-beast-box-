name: Dependency lock

on:
  push:
    branches: ["**"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-lock.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-lock.yml"

permissions:
  contents: read

concurrency:
  group: dependency-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.11"
      - name: Verify committed lock is current
        run: |
          uv lock --check
          python - <<'PY'
          import json
          from pathlib import Path
          Path("build").mkdir(exist_ok=True)
          Path("build/dependency-lock.json").write_text(
              json.dumps({"schema": "dependency-lock-v1", "passed": True, "uv": "0.12.11"}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: build/dependency-lock.json
          if-no-files-found: warn
