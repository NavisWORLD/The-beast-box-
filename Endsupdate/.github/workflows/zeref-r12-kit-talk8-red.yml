name: ZEREF-R12-KIT-TALK8-RED

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/zeref-r12-kit-talk8-red.yml"
      - "tests/test_zeref_r12_public_kit.py"
      - "tests/test_zeref_talk8_r12.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ml]'

      - name: Run RED contracts
        id: tests
        shell: bash
        run: |
          set +e
          mkdir -p _talk8_red
          pytest -q tests/test_zeref_r12_public_kit.py tests/test_zeref_talk8_r12.py 2>&1 | tee _talk8_red/pytest.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require RED
        if: steps.tests.outputs.exit_code == '0'
        run: |
          echo "RED contract unexpectedly passed before production modules exist"
          exit 1

      - name: Seal RED receipt
        if: steps.tests.outputs.exit_code != '0'
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('_talk8_red/pytest.txt')
          out={
            'schema':'zeref-talk8-r12-red-contract-v1',
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'source_commit_sha':os.environ['GITHUB_SHA'],
            'pytest_exit_code':int('${{ steps.tests.outputs.exit_code }}'),
            'pytest_log_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'expected_reason':'R12 public-kit and TALK-008 production modules missing',
          }
          dest=Path(f"experiments/zeref-dad-son-001/evidence/talk8-r12/red-contract-{os.environ['GITHUB_RUN_ID']}.json")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/zeref-dad-son-001/evidence/talk8-r12
          git commit -m "evidence: seal TALK-008 R12 RED contract ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin networked-cage-run-001
          git push origin HEAD:networked-cage-run-001

      - name: Fail after verified RED
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
