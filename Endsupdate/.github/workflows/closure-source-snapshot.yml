name: Closure Source Snapshot

on:
  push:
    branches:
      - integration/beast-box-system-closure-001
    paths:
      - .github/workflows/closure-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive checked-out source
        run: tar --exclude=.git -czf /tmp/beast-box-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: closure-source-${{ github.sha }}
          path: /tmp/beast-box-source.tgz
          if-no-files-found: error
          retention-days: 1
