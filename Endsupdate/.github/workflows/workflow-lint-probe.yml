name: Workflow Lint Probe

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/workflow-lint-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Validate Networked Cage workflow
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@latest -color .github/workflows/networked-cage-live-v2.yml
