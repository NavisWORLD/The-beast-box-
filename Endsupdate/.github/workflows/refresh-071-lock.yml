name: Refresh v0.7.1 dependency lock

on:
  push:
    branches: [release/v0.7.1]
    paths:
      - '.github/workflows/refresh-071-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.7.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate with the same pinned uv used by the lock gate
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.12.11'
          uv lock
          git status --short
          changed=$(git status --short | awk '{print $2}')
          test "$changed" = 'uv.lock'
          uv lock --check
      - name: Commit only the regenerated lock
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git diff --cached --quiet && exit 0
          git commit -m 'build: refresh uv lock for 0.7.1'
          git push origin HEAD:release/v0.7.1