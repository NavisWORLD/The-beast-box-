name: ZEREF-SCALE Run Status Collector

on:
  push:
    branches: [zeref-scale-training-001]
    paths:
      - 'experiments/zeref-scale-001/status-request-*.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sanitized workflow-run status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p experiments/zeref-scale-001/actions/status
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=zeref-scale-training-001&per_page=40" \
            > /tmp/runs.json
          python - <<'PY'
          import json, pathlib, os
          src=json.load(open('/tmp/runs.json'))
          wanted=(
            'ZEREF-SCALE-001 Qwen Dad Talk',
            'ZEREF-SCALE-001 CPU LoRA Proof',
            'ZEREF-SCALE-001 CPU 1.7B LoRA',
            'ZEREF-SCALE-001 Fresh IBM Root',
            'ZEREF-SCALE Actions Probe'
          )
          rows=[]
          for r in src.get('workflow_runs',[]):
            if r.get('name') in wanted:
              rows.append({k:r.get(k) for k in ('id','name','event','status','conclusion','run_attempt','head_branch','head_sha','created_at','updated_at','html_url')})
          out={'schema':'zeref-scale-run-status-v1','collector_run_id':os.environ['GITHUB_RUN_ID'],'runs':rows}
          p=pathlib.Path(f"experiments/zeref-scale-001/actions/status/collector-{os.environ['GITHUB_RUN_ID']}.json")
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Commit status snapshot
        shell: bash
        run: |
          git config user.name "zeref-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/zeref-scale-001/actions/status/
          git commit -m "evidence: collect Zeref Scale run status ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin zeref-scale-training-001
          git push origin HEAD:zeref-scale-training-001
