name: Zeref quantum divergence

on:
  push:
    branches:
      - 'agent/zeref-quantum-divergence'
    paths:
      - 'beastbox/quantum_divergence/**'
      - 'tests/test_quantum_divergence_*.py'
      - '.github/workflows/zeref-quantum-divergence.yml'
      - 'docs/ZEREF_QUANTUM_DIVERGENCE.md'
  pull_request:
    paths:
      - 'beastbox/quantum_divergence/**'
      - 'tests/test_quantum_divergence_*.py'
      - '.github/workflows/zeref-quantum-divergence.yml'
  workflow_dispatch:

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,quantum]'
      - name: Run divergence tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q tests/test_quantum_divergence_*.py | tee quantum-divergence-pytest.log
      - name: Run evidence validation
        run: python -m beastbox.quantum_divergence.cli validate --output evidence/zeref-quantum-divergence-validation
      - name: Verify and print summary
        run: python -m beastbox.quantum_divergence.cli analyze evidence/zeref-quantum-divergence-validation
      - name: Upload complete validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-quantum-divergence-validation-${{ github.run_id }}
          path: |
            evidence/zeref-quantum-divergence-validation/**
            quantum-divergence-pytest.log
          if-no-files-found: warn

  live-ibm-zeref:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/zeref-quantum-divergence' && contains(github.event.head_commit.message, '[resume-ibm]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
      IBM_EXISTING_JOB_ID: da1l0maein7c73bdi2d0
      IBM_EXISTING_BACKEND: ibm_marrakesh
      IBM_EXISTING_CIRCUIT_SHA256: 8ccea7c430e7e42a664d92ce99f8b8107b1983f2e5710e2763aef9c3458c4c85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify encrypted IBM secret is available
        shell: bash
        run: |
          test -n "$IBM_QUANTUM_TOKEN"
          echo "IBM_QUANTUM_TOKEN_PRESENT=1"
      - name: Install Beast Box, IBM, and native COSMOS runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[quantum]'
          pip install 'huggingface-hub>=0.34'
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Inspect original IBM job without resubmitting
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' | tee ibm-probe.log
          import os
          from beastbox.quantum import _service
          service = _service()
          job = service.job(os.environ["IBM_EXISTING_JOB_ID"])
          status = job.status()
          print("IBM_AUTH=PASS")
          print(f"IBM_EXISTING_JOB_ID={job.job_id()}")
          print(f"IBM_EXISTING_JOB_STATUS={status}")
          if status in {"ERROR", "CANCELLED"}:
              raise RuntimeError(f"original IBM job entered terminal status {status}: {job.error_message()}")
          PY
      - name: Fetch native QC67 COSMOS CST runtime and checkpoint
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          for path in (
              'serving/cosmos_serve.py',
              'architecture/cosmos_spark_cst.py',
              'weights/spark_cst.pt',
          ):
              got = hf_hub_download('phera-ra/QC67_cosmo', path, repo_type='model', local_dir='qc67')
              print(f'FETCHED={path} -> {got}')
          PY
      - name: Start native QC67 COSMOS CST server
        shell: bash
        run: |
          set -o pipefail
          COSMOS_SERVE_TAGS_NATIVE_ONLY=1 \
            python qc67/serving/cosmos_serve.py 11500 --upstream http://127.0.0.1:9 \
            > cosmos-native-server.log 2>&1 &
          echo $! > cosmos-native-server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:11500/health > cosmos-native-health.json; then
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('cosmos-native-health.json').read_text())
          meta = (data.get('native') or {}).get('cosmos-cst')
          assert meta, data
          assert meta.get('architecture') == 'Cosmos-Spark-CST-QuantumBorn', meta
          assert int(meta.get('d54') or 0) == 54, meta
          assert int(meta.get('cst_tensor_count') or 0) == 12, meta
          assert int(meta.get('missing_keys') or 0) == 0, meta
          assert int(meta.get('unexpected_keys') or 0) == 0, meta
          print('QC67_NATIVE_HEALTH=PASS')
          print(json.dumps(meta, sort_keys=True))
          PY
              exit 0
            fi
            if ! kill -0 "$(cat cosmos-native-server.pid)" 2>/dev/null; then
              cat cosmos-native-server.log
              exit 1
            fi
            sleep 1
          done
          cat cosmos-native-server.log
          exit 1
      - name: Resume real paired IBM entropy experiment
        shell: bash
        run: |
          set -o pipefail
          python -m beastbox.quantum_divergence.live_cli \
            --output evidence/zeref-quantum-divergence-live \
            --model cosmos-cst \
            --provider-kind ollama \
            --ollama-url http://127.0.0.1:11500 \
            --width 12 \
            --shots 2048 \
            --max-steps 8 \
            --existing-ibm-job-id "$IBM_EXISTING_JOB_ID" \
            --existing-ibm-backend "$IBM_EXISTING_BACKEND" \
            --existing-circuit-sha256 "$IBM_EXISTING_CIRCUIT_SHA256" | tee live-run.log
      - name: Verify live evidence chain and summary
        shell: bash
        run: |
          set -o pipefail
          python -m beastbox.quantum_divergence.cli analyze evidence/zeref-quantum-divergence-live | tee live-analysis.log
      - name: Capture native COSMOS server log
        if: always()
        shell: bash
        run: cat cosmos-native-server.log > native-cosmos-server.log 2>&1 || true
      - name: Upload complete live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-quantum-divergence-LIVE-${{ github.run_id }}
          path: |
            evidence/zeref-quantum-divergence-live/**
            live-run.log
            live-analysis.log
            native-cosmos-server.log
            cosmos-native-health.json
            ibm-probe.log
          if-no-files-found: warn
