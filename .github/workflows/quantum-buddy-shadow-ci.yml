name: Quantum Buddy shadow-only CI
on:
  push:
    branches: [feature/quantum-buddy-shadow-core-001]
    paths:
      - '.github/workflows/quantum-buddy-shadow-ci.yml'
      - 'beastbox/quantum_buddy/**'
      - 'beastbox/bridge.py'
      - 'beastbox/cns.py'
      - 'beastbox/synaptic.py'
      - 'beastbox/runtime.py'
      - 'models/rawrphos/architecture/**'
      - 'models/rawrphos/inference/**'
      - 'models/rawrphos/tests/test_quantum_buddy_metric.py'
      - 'tests/test_quantum_buddy*'
      - 'apps/beastbox-cloud/bridge/owner_bridge.py'
      - 'apps/beastbox-cloud/bridge/tests/test_quantum_buddy_shadow.py'
      - 'scripts/run_quantum_buddy*'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quantum-buddy-shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies, no quantum/cloud credentials
        run: |
          python -m pip install --quiet 'pytest>=8,<10' 'ruff>=0.12,<1' 'azure-cosmos>=4.9,<5' 'azure-identity>=1.17' 
          python -m pip install --quiet -e .
      - name: Run existing baseline + current Quantum Buddy tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_beastbox.py tests/test_full_runtime.py tests/test_optional_resources.py
          for file in tests/test_quantum_buddy*.py; do
            if [ -f "$file" ]; then python -m pytest -q "$file"; fi
          done
          if [ -f apps/beastbox-cloud/bridge/tests/test_quantum_buddy_shadow.py ]; then
            python -m pytest -q apps/beastbox-cloud/bridge/tests/test_quantum_buddy_shadow.py
          fi
      - name: Lint new core
        run: |
          if [ -d beastbox/quantum_buddy ]; then ruff check beastbox/quantum_buddy; fi
  native:
    if: github.repository == 'NavisWORLD/The-beast-box-'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native CPU model test requirements
        run: |
          python -m pip install --quiet 'torch>=2.2' 'tokenizers>=0.20,<0.24' 'safetensors>=0.4.5,<1' 'numpy>=1.26,<3' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'pytest>=8,<10'
          python -m pip install --quiet -e .
      - name: Model baseline and Quantum Buddy metric contract
        env:
          PYTHONPATH: models
        run: |
          set -euo pipefail
          python -m pytest -q models/rawrphos/tests/test_architecture.py models/rawrphos/tests/test_inference.py
          if [ -f models/rawrphos/tests/test_quantum_buddy_metric.py ]; then
            python -m pytest -q models/rawrphos/tests/test_quantum_buddy_metric.py
          fi
      - name: Hardware and deployment explicitly out of scope
        run: echo 'NO_QPU NO_COSMOS_LIVE_WRITE NO_DEPLOY'
