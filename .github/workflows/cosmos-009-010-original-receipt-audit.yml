name: COSMOS 009 and 010 immutable original full combined research audit
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/experiments/cosmos-end-to-end-009-summary.json"
      - "docs/experiments/cosmos-native-length-010-summary.json"
      - "docs/experiments/COSMOS_009_010_RESULTS.md"
      - "scripts/verify_cosmos_009_010_receipts.py"
      - "tests/test_cosmos_009_010_receipts.py"
      - ".github/workflows/cosmos-009-010-original-receipt-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source-only-original-null-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest==8.4.2
      - run: |
          python -m pytest -q tests/test_cosmos_009_010_receipts.py
          python -m scripts.verify_cosmos_009_010_receipts
