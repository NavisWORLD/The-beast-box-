name: macOS Zeref app

on:
  pull_request:
    branches: [main]
    paths:
      - 'beastbox/**'
      - 'macos/**'
      - 'scripts/build_macos_dist.sh'
      - 'scripts/zeref_app_entry.py'
      - 'START_ZEREF.command'
      - 'tests/test_macos_packaging.py'
      - '.github/workflows/macos-zeref.yml'
      - 'pyproject.toml'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            artifact: zeref-macos-apple-silicon
          - name: Intel
            runner: macos-15-intel
            artifact: zeref-macos-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install pyinstaller
      - name: Verify packaging contract
        run: pytest -q tests/test_macos_packaging.py tests/test_easy_ollama.py
      - name: Build Zeref.app and DMG
        run: |
          chmod +x scripts/build_macos_dist.sh macos/Zeref START_ZEREF.command
          ./scripts/build_macos_dist.sh
      - name: Verify app and disk image
        shell: zsh {0}
        run: |
          APP='dist/Zeref.app'
          test -d "$APP"
          test -x "$APP/Contents/MacOS/Zeref"
          test -x "$APP/Contents/Resources/zeref-cli"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          file "$APP/Contents/Resources/zeref-cli"
          for dmg in dist/*.dmg; do /usr/bin/hdiutil verify "$dmg"; done
          cat dist/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.app.zip
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: zeref-macos-*
          path: release
          merge-multiple: true
      - name: Publish macOS installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
