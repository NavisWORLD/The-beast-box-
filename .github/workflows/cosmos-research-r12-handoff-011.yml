name: COSMOS 011 safe synthetic CNS to R12 handoff in real durable host
on:
  pull_request:
    branches: [experiment/cosmos-end-to-end-reasoning-009]
    paths:
      - "scripts/cosmos_research_r12_handoff_011.py"
      - "tests/test_cosmos_research_r12_handoff_011.py"
      - ".github/workflows/cosmos-research-r12-handoff-011.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-host-opt-in-research-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest==8.4.2
      - name: Original host state+memory checkpointing, provenance and failure rollback
        run: python -m pytest -q tests/test_cosmos_research_r12_handoff_011.py
