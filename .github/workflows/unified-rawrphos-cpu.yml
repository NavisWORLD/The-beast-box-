name: Unified RAWRPHOS native CPU and bridge compatibility (test-only)

on:
  push:
    branches: [feature/cosmos-rawrphos-unified-runtime-001]
    paths:
      - models/rawrphos/**
      - beastbox/**
      - apps/beastbox-cloud/bridge/**
      - tests/test_unified_host_semantic_wiring.py
      - .github/workflows/unified-rawrphos-cpu.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-rawrphos-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-fixture-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned public CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e . -e './models/rawrphos[serve]' pytest==8.4.2
      - name: Native model actually trains a tiny synthetic CPU fixture and serves authenticated inference
        run: |
          mkdir -p build
          python -m pytest -o addopts= -q --junitxml=build/unified-rawrphos-native-junit.xml models/rawrphos/tests/test_inference.py
      - name: Legacy + latest-main owner bridge compatibility checks
        run: |
          python -m unittest discover -s apps/beastbox-cloud/bridge/tests -v
          python -m pytest -q tests/test_unified_host_semantic_wiring.py tests/test_finisher_semantic_retrieval.py
      - name: Assert machine receipt without making trained-checkpoint claims
        if: success()
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse("build/unified-rawrphos-native-junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("./testsuite"))
          assert suites, "no actual native test suites"
          totals = {k:sum(int(s.attrib.get(k,0)) for s in suites)
                    for k in ("tests","failures","errors","skipped")}
          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          assert passed >= 6 and totals["failures"] == totals["errors"] == 0
          receipt = {
              "schema": "beastbox-unified-native-synthetic-fixture-cpu-v1",
              "source": "exact triggering commit from checked-out GitHub Actions ref",
              "actual_native_fixture_tests_passed": passed,
              "tests_skipped": totals["skipped"],
              "not_a_published_14k_18k_inference_test": True,
              "not_production_memory_or_operator_authority": True,
              "real_cpu_generated_from_tiny_newly_trained_synthetic_model": True
          }
          Path("build/unified-native-machine-receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("UNIFIED_NATIVE_CPU_FIXTURE_RECEIPT="+json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-native-source-test-receipts
          path: |
            build/unified-rawrphos-native-junit.xml
            build/unified-native-machine-receipt.json
          if-no-files-found: warn
