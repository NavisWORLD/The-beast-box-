name: Persistent substrate real model swap 002

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/persistent-substrate-model-swap-001
    paths:
      - '.github/workflows/persistent-substrate-model-swap-002.yml'
      - 'scripts/run_persistent_substrate_model_swap_002.py'
      - 'scripts/run_persistent_substrate_model_swap_002_frozen.py'
      - 'experiments/persistent-substrate-model-swap-002-historical-b4e53/**'
      - 'beastbox/persistent_substrate/**'
      - 'tests/fixtures/persistent-substrate/prompts-v2.json'
      - 'tests/test_persistent_substrate_*.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: persistent-substrate-real-model-swap-002-${{ github.sha }}
  cancel-in-progress: false

env:
  EXPERIMENT_ID: persistent-substrate-model-swap-002-historical-b4e53
  MODEL_A_SHA256: 454f3017618a81fb9a13393b215d448f365534baf5b607e19d1438955921e425
  MODEL_A_ARCH_SHA256: 955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc
  MODEL_A_SOURCE_RUN_ID: '33132618727'
  MODEL_A_SOURCE_ARTIFACT: zeref-world-r12-downstream-diagnostic-33132618727
  MODEL_A_SOURCE_ARTIFACT_ID: '9670847045'
  MODEL_A_SOURCE_ARTIFACT_DIGEST: sha256:8f27aabe3e1bac5edf1c51b958be1f50ff1d076105c3f41e3901d780e7aa3083
  MODEL_B_REPO: HuggingFaceTB/SmolLM2-135M
  MODEL_B_REVISION: 4e53f736cbb20a9a0f56b4c4bf378d9f306ff915
  WORLD_DB_SHA256: 919947f5adeadb2d9fdfb31f2ae55d6e4d8fb8825b73a7736dea1a9dae4bb16a
  WORLD_EVIDENCE_SHA256: 3ecd3efe1627dcb9c74232c3c5760825b5f56b5fec0ce2f99f2985ee809e6535
  WORLD_SUMMARY_SHA256: 9e2e6cf0965691db9a4ecd3affe9ccb8b33195f6cf7f2341ace1e1f43e549d3b
  R12_STATE_SHA256: cc42753463e7467e58626f8a81c75716183406c29d15acc2a1aee352a0570162
  R12_HISTORY_SHA256: cc42753463e7467e58626f8a81c75716183406c29d15acc2a1aee352a0570162
  REALITY_EVENTS_SHA256: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
  PROMPT_BATTERY_SHA256: 3d0c25488546fd46e6591362811d3fbe18e2b170781c9151836499fa47278796

jobs:
  execute-real-aba:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify frozen preregistration and committed seed bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path.cwd()
          prereg_path = root / 'experiments/persistent-substrate-model-swap-002-historical-b4e53/preregistration.json'
          prereg = json.loads(prereg_path.read_text(encoding='utf-8'))
          assert prereg['experiment_id'] == os.environ['EXPERIMENT_ID']
          assert prereg['model_a']['checkpoint_sha256'] == os.environ['MODEL_A_SHA256']
          assert prereg['model_a']['architecture_sha256'] == os.environ['MODEL_A_ARCH_SHA256']
          assert prereg['model_b']['repository'] == os.environ['MODEL_B_REPO']
          assert prereg['model_b']['revision'] == os.environ['MODEL_B_REVISION']

          checks = {
              root / 'experiments/persistent-substrate-model-swap-002-historical-b4e53/inputs/r12-state.json': os.environ['R12_STATE_SHA256'],
              root / 'experiments/persistent-substrate-model-swap-002-historical-b4e53/inputs/r12-history.jsonl': os.environ['R12_HISTORY_SHA256'],
              root / 'experiments/persistent-substrate-model-swap-002-historical-b4e53/inputs/reality-events.jsonl': os.environ['REALITY_EVENTS_SHA256'],
              root / 'tests/fixtures/persistent-substrate/prompts-v2.json': os.environ['PROMPT_BATTERY_SHA256'],
              root / 'experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py': os.environ['MODEL_A_ARCH_SHA256'],
          }
          for path, expected in checks.items():
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(f'frozen input mismatch: {path} expected={expected} observed={observed}')
              print(f'VERIFIED {path} {observed}')
          print(f'FROZEN_COMMIT={os.environ.get("GITHUB_SHA", "") or "UNKNOWN"}')
          PY

      - name: Download preserved real Model A and world-store artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.MODEL_A_SOURCE_ARTIFACT }}
          path: .persistent-substrate/source
          github-token: ${{ github.token }}
          repository: NavisWORLD/The-beast-box-
          run-id: ${{ env.MODEL_A_SOURCE_RUN_ID }}

      - name: Verify preserved artifact payload hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          checks = {
              Path('.persistent-substrate/source/SELECTED-WORLD-R12.pt'): os.environ['MODEL_A_SHA256'],
              Path('.persistent-substrate/source/world/world.sqlite3'): os.environ['WORLD_DB_SHA256'],
              Path('.persistent-substrate/source/world/world-evidence.jsonl'): os.environ['WORLD_EVIDENCE_SHA256'],
              Path('.persistent-substrate/source/world/ingestion-summary.json'): os.environ['WORLD_SUMMARY_SHA256'],
          }
          for path, expected in checks.items():
              if not path.is_file():
                  raise SystemExit(f'missing preserved artifact payload: {path}')
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(f'preserved artifact hash mismatch: {path} expected={expected} observed={observed}')
              print(f'VERIFIED {path} {observed}')
          PY

      - name: Install frozen execution dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install 'numpy==2.3.3' 'transformers==4.57.1' 'safetensors==0.6.2' 'huggingface_hub==0.36.0' 'pytest==8.4.2'
          python -m pip install -e . --no-deps
          python - <<'PY'
          import torch, transformers, huggingface_hub, numpy
          print('torch', torch.__version__)
          print('transformers', transformers.__version__)
          print('huggingface_hub', huggingface_hub.__version__)
          print('numpy', numpy.__version__)
          PY

      - name: Resolve exact historical Model B revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import model_info
          repo = os.environ['MODEL_B_REPO']
          revision = os.environ['MODEL_B_REVISION']
          info = model_info(repo, revision=revision)
          if info.sha != revision:
              raise SystemExit(f'Model B revision mismatch: requested={revision} resolved={info.sha}')
          print(f'MODEL_B_RESOLVED={repo}@{info.sha}')
          PY

      - name: Run persistent-substrate contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_persistent_substrate_models.py \
            tests/test_persistent_substrate_metrics.py \
            tests/test_persistent_substrate_prompts.py \
            tests/test_persistent_substrate_paired_runner.py \
            tests/test_persistent_substrate_substrate.py

      - name: Reject hidden training paths
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'optimizer|backward\(|loss\.backward|trainer|fit\(' -- \
            beastbox/persistent_substrate \
            scripts/run_persistent_substrate_model_swap_002.py \
            scripts/run_persistent_substrate_model_swap_002_frozen.py; then
            echo 'Training path detected in frozen execution layer.' >&2
            exit 1
          fi
          echo 'NO_HIDDEN_TRAINING_PATHS'

      - name: Execute real A0 to B1 to A2 and all controls
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .persistent-substrate/evidence .persistent-substrate/work
          python scripts/run_persistent_substrate_model_swap_002_frozen.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --model-a-checkpoint "$GITHUB_WORKSPACE/.persistent-substrate/source/SELECTED-WORLD-R12.pt" \
            --model-a-architecture "$GITHUB_WORKSPACE/experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py" \
            --world-db "$GITHUB_WORKSPACE/.persistent-substrate/source/world/world.sqlite3" \
            --world-evidence "$GITHUB_WORKSPACE/.persistent-substrate/source/world/world-evidence.jsonl" \
            --world-summary "$GITHUB_WORKSPACE/.persistent-substrate/source/world/ingestion-summary.json" \
            --output "$GITHUB_WORKSPACE/.persistent-substrate/evidence/result.json" \
            --workspace "$GITHUB_WORKSPACE/.persistent-substrate/work" \
            2>&1 | tee .persistent-substrate/evidence/run.log

      - name: Seal successful evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path.cwd()
          evidence = root / '.persistent-substrate/evidence'
          result_path = evidence / 'result.json'
          result = json.loads(result_path.read_text(encoding='utf-8'))
          if result.get('classification') != 'COMPLETED_DESCRIPTIVE_MEASUREMENT':
              raise SystemExit(f"unexpected classification: {result.get('classification')}")
          gates = dict(result.get('structural_gates') or {})
          if not gates or not all(bool(value) for value in gates.values()):
              raise SystemExit(f'structural gates not all green: {gates}')

          paths = {
              'result': result_path,
              'run_log': evidence / 'run.log',
              'preregistration': root / 'experiments/persistent-substrate-model-swap-002-historical-b4e53/preregistration.json',
              'runner': root / 'scripts/run_persistent_substrate_model_swap_002.py',
              'frozen_execution_shim': root / 'scripts/run_persistent_substrate_model_swap_002_frozen.py',
              'r12_state': root / 'experiments/persistent-substrate-model-swap-002-historical-b4e53/inputs/r12-state.json',
              'r12_history': root / 'experiments/persistent-substrate-model-swap-002-historical-b4e53/inputs/r12-history.jsonl',
              'reality_events': root / 'experiments/persistent-substrate-model-swap-002-historical-b4e53/inputs/reality-events.jsonl',
              'prompt_battery': root / 'tests/fixtures/persistent-substrate/prompts-v2.json',
              'model_a_architecture': root / 'experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py',
              'model_a_checkpoint': root / '.persistent-substrate/source/SELECTED-WORLD-R12.pt',
              'world_db': root / '.persistent-substrate/source/world/world.sqlite3',
              'world_evidence': root / '.persistent-substrate/source/world/world-evidence.jsonl',
              'world_summary': root / '.persistent-substrate/source/world/ingestion-summary.json',
          }
          files = {}
          for name, path in paths.items():
              data = path.read_bytes()
              files[name] = {'path': str(path.relative_to(root)), 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}

          manifest = {
              'schema': 'persistent-substrate-model-swap-002-evidence-manifest-v1',
              'experiment_id': os.environ['EXPERIMENT_ID'],
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'github_sha': os.environ['GITHUB_SHA'],
              'source_artifact': {
                  'run_id': os.environ['MODEL_A_SOURCE_RUN_ID'],
                  'artifact_id': os.environ['MODEL_A_SOURCE_ARTIFACT_ID'],
                  'name': os.environ['MODEL_A_SOURCE_ARTIFACT'],
                  'digest': os.environ['MODEL_A_SOURCE_ARTIFACT_DIGEST'],
              },
              'model_a_checkpoint_sha256': os.environ['MODEL_A_SHA256'],
              'model_b': f"{os.environ['MODEL_B_REPO']}@{os.environ['MODEL_B_REVISION']}",
              'classification': result['classification'],
              'structural_gates': gates,
              'files': files,
              'claim_boundary': 'software continuity measurement only; no consciousness, biological-life, deceased-person identity, soul, quantum-advantage, or new-physics claim',
          }
          manifest_path = evidence / 'manifest.json'
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('EVIDENCE_RESULT_SHA256=' + files['result']['sha256'])
          print('ALL_STRUCTURAL_GATES_GREEN')
          PY

      - name: Record terminal job metadata
        if: always()
        shell: bash
        env:
          TERMINAL_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .persistent-substrate/evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('.persistent-substrate/evidence/job-metadata.json')
          path.write_text(json.dumps({
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'github_sha': os.environ['GITHUB_SHA'],
              'job_status_at_metadata_step': os.environ.get('TERMINAL_JOB_STATUS'),
              'experiment_id': os.environ['EXPERIMENT_ID'],
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persistent-substrate-model-swap-002-evidence-${{ github.run_id }}
          path: .persistent-substrate/evidence
          if-no-files-found: error
          retention-days: 90

      - name: Emit final machine-readable summary
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('.persistent-substrate/evidence/result.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'classification': result['classification'],
              'structural_gates': result['structural_gates'],
              'stage_means': result['paired_metrics']['stage_mean'],
          }, sort_keys=True))
          PY
