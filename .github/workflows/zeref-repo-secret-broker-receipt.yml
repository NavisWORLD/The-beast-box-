name: Record Zeref repo-secret broker completion

on:
  workflow_run:
    workflows:
      - 'Zeref repo-secret brokered Trinity run'
    types:
      - completed

permissions:
  contents: write

jobs:
  record:
    if: github.event.workflow_run.head_branch == 'agent/zeref-quantum-divergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zeref-quantum-divergence
          fetch-depth: 0
      - name: Write sanitized workflow receipt
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          out = Path('evidence/final/zeref-secret-brokered-workflow-latest.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              'schema': 'zeref.secret-brokered-workflow-receipt.v1',
              'github_run_id': int(os.environ['RUN_ID']),
              'conclusion': os.environ['CONCLUSION'],
              'passed': os.environ['CONCLUSION'] == 'success',
              'head_sha': os.environ['HEAD_SHA'],
              'run_url': os.environ['RUN_URL'],
              'secret_value_persisted': False,
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/zeref-quantum-divergence
          git add evidence/final/zeref-secret-brokered-workflow-latest.json
          git commit -m "evidence: record secret-brokered workflow ${RUN_ID}" || true
          git push origin HEAD:agent/zeref-quantum-divergence
