# One owner-authorized physical IBM QPU execution. Owner requested on 2026-10-09.
name: Beast Reality Prober — One Real IBM QPU Job
on:
  pull_request:
    paths:
      - 'scripts/ibm_beast_onejob_reality_probe.py'
      - '.github/workflows/ibm-beast-onejob-hardware.yml'
permissions:
  contents: read
concurrency:
  group: navisworld-one-ibm-qpu-probe-20261009
  cancel-in-progress: false
jobs:
  one-real-hardware-job:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/ibm-beast-reality-probe-20261009' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert quota and failure guard
        run: python -m unittest discover -s tests -p test_ibm_open_plan_preflight.py -v
      - name: Install pinned compatible IBM Qiskit client
        run: python -m pip install 'qiskit-ibm-runtime>=0.45,<0.50' 'qiskit>=2.1,<2.5'
      - name: Verify Open Plan and submit at most one bounded REAL QPU job
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          BEAST_REAL_QPU_ONE_JOB: YES_ONE_REAL_JOB
        run: python scripts/ibm_beast_onejob_reality_probe.py
      - name: Preserve actual submission receipt even if results timed out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beast-real-ibm-onejob-${{ github.run_id }}
          path: _ibm_beast_reality_probe/
          retention-days: 30
          if-no-files-found: warn
