name: Zeref Trinity implementation verification

on:
  push:
    branches:
      - 'agent/zeref-quantum-divergence'
    paths:
      - '.github/workflows/zeref-trinity-tests-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-trinity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zeref-quantum-divergence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Trinity tests and capture status
        id: tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest -q \
            tests/test_quantum_divergence_trinity_state.py \
            tests/test_quantum_divergence_trinity_feedback.py \
            tests/test_quantum_divergence_native_trinity.py \
            tests/test_quantum_divergence_trinity_final.py \
            2>&1 | tee /tmp/trinity-tests.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Write sanitized verification receipt
        if: always()
        env:
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          p = Path('/tmp/trinity-tests.log')
          text = p.read_text(encoding='utf-8', errors='replace') if p.exists() else ''
          patterns = [
              r'(?i)IBM_QUANTUM_TOKEN\s*[:=]\s*\S+',
              r'(?i)hf_[A-Za-z0-9]{20,}',
              r'(?i)sk-[A-Za-z0-9_-]{20,}',
          ]
          for pattern in patterns:
              text = re.sub(pattern, '[REDACTED]', text)
          code = int(os.environ.get('TEST_EXIT') or 1)
          payload = {
              'schema': 'zeref.trinity-test-once.v1',
              'tested_head_sha': os.environ['TESTED_SHA'],
              'run_id': int(os.environ['RUN_ID']),
              'exit_code': code,
              'passed': code == 0,
              'log_sha256': hashlib.sha256(text.encode('utf-8')).hexdigest(),
              'log_tail': text.splitlines()[-120:],
          }
          root = Path('evidence/dev')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'trinity-test-once.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Commit verification receipt
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/zeref-quantum-divergence
          git add evidence/dev/trinity-test-once.json
          git commit -m "evidence: record Trinity implementation verification ${GITHUB_RUN_ID}" || true
          git push origin HEAD:agent/zeref-quantum-divergence
      - name: Enforce verification result
        if: always()
        env:
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
        run: exit "${TEST_EXIT:-1}"
