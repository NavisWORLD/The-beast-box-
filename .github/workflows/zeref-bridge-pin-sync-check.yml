name: Zeref bridge pin sync check (live served model must match the public pin)
# After a promotion merges, Railway rebuilds cosmos-owner-bridge (watch pattern includes the pin JSON).
# Pass only when GET /healthz reports served_checkpoint_sha256 equal to the pin and serving_pin true.
# The script retries through the rebuild window, then fails loudly if the served model is still a different sha.
on:
  push:
    branches: [main]
    paths: ['apps/beastbox-cloud/lib/rawrphos-public-pin.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/zeref_promote_pin.py --await-bridge
