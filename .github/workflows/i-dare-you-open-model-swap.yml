name: I Dare You - Open Model Swap

on:
  push:
    branches: [experiment/i-dare-you-smollm-phos-001]
    paths:
      - '.github/workflows/i-dare-you-open-model-swap.yml'
      - 'i dare you/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-model-swap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PHOS_REVISION: b414724c627300c41b099dcc6853766d08fd27a4
      PHOS_EXPECTED_SHA256: bdcd4a39aa54bfc6c274580e210f993e528214d7207cb19dc258a2f801f6b84d
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public model runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers>=4.45,<5' 'huggingface-hub>=0.27' safetensors
          python -m py_compile 'i dare you/open_swap.py'
      - name: Verify external state recorder before model calls
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s 'i dare you/tests' -p 'test_open_swap.py' -v
      - name: Fetch exact published PHOS weight and architecture
        id: phos
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import snapshot_download
          import hashlib, os
          root = Path(snapshot_download(
              repo_id="phera-ra/QC67_cosmo",
              revision=os.environ["PHOS_REVISION"],
              local_dir="_real_phos",
              allow_patterns=["weights/phos.pt", "architecture/*.py"]))
          p = root / "weights/phos.pt"
          if not p.is_file():
              raise SystemExit("Authentic PHOS checkpoint unavailable")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == os.environ["PHOS_EXPECTED_SHA256"], "PHOS pin mismatch"
          print("PHOS_PUBLIC_CHECKPOINT_SHA256=" + digest)
          print("PHOS_PUBLIC_ARCH_FILES=" + ",".join(sorted(x.name for x in (root/"architecture").glob("*.py"))))
          PY
      - name: Execute actual A0-B0-A1 with append-only ledger
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python 'i dare you/open_swap.py' --output "$RUNNER_TEMP/open-model-swap-$GITHUB_RUN_ID" \
            --phos-checkpoint '_real_phos/weights/phos.pt' \
            --phos-source '_real_phos' \
            --phos-revision "$PHOS_REVISION"
      - name: Stage permitted evidence without model weights
        if: always()
        shell: bash
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
          PHOS_DOWNLOAD_OUTCOME: ${{ steps.phos.outcome }}
        run: |
          set -u
          mkdir -p _open_model_evidence
          if [[ -d "$RUNNER_TEMP/open-model-swap-$GITHUB_RUN_ID" ]]; then
            cp "$RUNNER_TEMP/open-model-swap-$GITHUB_RUN_ID/events.jsonl" _open_model_evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/open-model-swap-$GITHUB_RUN_ID/summary.json" _open_model_evidence/ 2>/dev/null || true
            cp "$RUNNER_TEMP/open-model-swap-$GITHUB_RUN_ID/checkpoint_1.json" _open_model_evidence/ 2>/dev/null || true
          fi
          python - <<'PY'
          import json,os,pathlib
          pathlib.Path("_open_model_evidence/ci_receipt.json").write_text(json.dumps({
              "run_id":os.getenv("GITHUB_RUN_ID"),
              "head_sha":os.getenv("GITHUB_SHA"),
              "experiment_outcome":os.getenv("EXPERIMENT_OUTCOME"),
              "phos_download_outcome":os.getenv("PHOS_DOWNLOAD_OUTCOME"),
              "model_weight_files_uploaded":False
          },indent=2)+"\n")
          PY
      - name: Upload exact result ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i-dare-you-open-models-${{ github.run_id }}
          path: _open_model_evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify actual experiment phases
        if: steps.experiment.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,pathlib
          f=pathlib.Path("_open_model_evidence/summary.json")
          if not f.is_file(): raise SystemExit("missing real execution summary")
          result=json.loads(f.read_text())
          print("PHASES="+json.dumps(result["phases"],sort_keys=True))
          if not all(result["phases"].get(phase)=="executed" for phase in ["A0","B0","A1"]):
              raise SystemExit("not all real inference phases executed; review artifact")
          print("REAL_A_B_A=PASS")
          PY
