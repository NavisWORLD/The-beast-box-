name: Zeref 006 - resumable real native RAWRPHOS learning heartbeat
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'apps/beastbox-cloud/tests/rawrphos-native-observed-play.cjs'
      - 'scripts/zeref_continuation_006.py'
      - 'scripts/zeref_chat_corpus.py'
      - 'scripts/zeref_served_shape.py'
      - 'scripts/zeref_resume_parent.py'
      - 'tests/test_zeref_resume_parent.py'
      - 'tests/test_zeref_served_shape.py'
      - '.github/workflows/zeref-continuous-learning-006.yml'
      - 'tests/zeref_continuation_006_contract.test.cjs'
      - 'scripts/zeref_round_recovery.py'
      - 'models/rawrphos/tests/test_round_recovery.py'
      - 'tests/zeref_round_recovery_contract.test.cjs'
      - 'scripts/zeref_promotion_rule.py'
      - 'tests/test_zeref_promotion_rule.py'
      - 'tests/zeref_recovery_decision_contract.test.cjs'
      - 'scripts/zeref_english_mix.py'
      - 'scripts/zeref_english_clarity.py'
      - 'scripts/zeref_english_corpus_build.py'
      - 'tests/test_zeref_english_corpus.py'
      - 'evidence/zeref-english-001/**'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write   # only to publish approved Zeref checkpoints as durable release assets
  actions: read
jobs:
  train-zeref:
    # Same global lineage lock, scoped to training so contract/recovery scoring
    # cannot wait behind an unrelated running training job.
    concurrency:
      group: zeref-006-single-approved-learning-lineage
      cancel-in-progress: false
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feature/zeref-resumable-continuous-learning-006-20261011' || startsWith(github.head_ref, 'feature/zeref-manual-cpu-') || startsWith(github.head_ref, 'cursor/w4-training-'))) }}
    runs-on: ubuntu-24.04
    # A round is one 320-attempt control plus four 320-attempt candidates.
    # The old 2400s candidate-start clock skipped candidates 2 and 3, and the
    # 90-minute job killed the train step before the gate. 240 minutes covers
    # five variants at the existing 2700s cap, plus the final unchanged gate.
    timeout-minutes: 280
    env:
      GH_TOKEN: ${{ github.token }}
      # 4 logical CPUs on the hosted runner. 2 left half of them idle in the update loop.
      # Clocks, learning steps, the pin, and the gates are unchanged.
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      NAVISWORLD_NATIVE_TRAINING_BEAST: zeref
      NAVISWORLD_NATIVE_TRAINING_CYCLE: ${{ github.run_id }}
    steps:
      # Explicit owner-requested controlled CPU continuation after Azure Blob read/write proof.
      # Still the established 006 lineage: this does NOT endorse rejected experiment 011,
      # grant browser/camera/microphone consent, or invoke IBM/Azure quantum workloads.
      - name: Record training scope and non-promotional experiment boundaries
        run: |
          echo 'ZEREF_TRAINING_SCOPE=CPU_ONLY_NATIVE_GAME_OBSERVATION_IMITATION'
          echo 'ZEREF_PRIVATE_CAMERA_MICROPHONE_CHAT=NOT_INCLUDED'
          echo 'ZEREF_QUANTUM_PROVIDER_JOBS_SUBMITTED=0'
          echo 'ZEREF_011_REJECTED_CANDIDATE=NOT_PARENT_OR_PROMOTED'
          echo 'ZEREF_PREVIOUS_APPROVED_CHECKPOINT=MANDATORY_SHA_VERIFICATION'
          python - <<'PY'
          import os,platform
          from pathlib import Path
          cpu=next((line.split(':',1)[1].strip() for line in Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name')), 'unknown')
          print('ZEREF_RUNNER_CPU='+cpu)
          print('ZEREF_RUNNER_LOGICAL_CPUS='+str(os.cpu_count()))
          print('ZEREF_RUNNER_PLATFORM='+platform.platform())
          PY
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify lineage and bounded training invariants
        run: |
          set -Eeuo pipefail
          node --test tests/zeref_continuation_006_contract.test.cjs
          node --check apps/beastbox-cloud/tests/rawrphos-native-observed-play.cjs
          python -m py_compile scripts/zeref_continuation_006.py scripts/zeref_resume_parent.py scripts/zeref_served_shape.py scripts/zeref_chat_corpus.py
          python -m unittest discover -s tests -p test_zeref_resume_parent.py
          python -m unittest discover -s tests -p test_zeref_served_shape.py
      - name: Resume ONLY the canonical SHA-pinned Zeref 006 model and AdamW state
        run: |
          set -Eeuo pipefail
          mkdir -p build/zeref-006
          # GitHub artifacts are paginated; scanning only the latest 100
          # made the last real run silently fork from the older 004 weights.
          # An EXACT fixed artifact name keeps canonical descendants
          # discoverable regardless of unrelated repo CI artifact volume.
          canonical_name="zeref-006-canonical-37ca3f8f"
          # 2026-11-09: the public pin stays the gate bar. Weights may resume from a
          # later accepted zeref-006-cycle release, but only when its recorded
          # parent sha chain leads back to this pin, its gate record accepted it,
          # and the tarball and model shas match. A same-cycle sibling that fails
          # that chain falls through. Nothing qualifying falls back to the pin.
          # The pin file is not modified. Unpromoted weights still cannot move the bar.
          pin_tag="$(python -c "import json;p=json.load(open('apps/beastbox-cloud/lib/rawrphos-public-pin.json'));print((p.get('promotion') or {}).get('release_tag') or '')")"
          pin_ok=0
          PIN=""
          train_tag=""
          if [ -n "$pin_tag" ] && gh release view "$pin_tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "RESUME_PUBLIC_PIN_RELEASE=$pin_tag"
            mkdir -p build/zeref-006/pin-release build/zeref-006/pin
            gh release download "$pin_tag" --repo "${{ github.repository }}" -D build/zeref-006/pin-release
            (cd build/zeref-006/pin-release && sha256sum -c ./*.sha256)
            tar -C build/zeref-006/pin -xzf build/zeref-006/pin-release/*.tar.gz
            rm -f build/zeref-006/pin-release/*.tar.gz
            PIN="$(find build/zeref-006/pin -type d -name accepted-checkpoint -print -quit)"
            test -n "$PIN"
            pin_ok=1
            pin_sha="$(python -c "import json;print(json.load(open('apps/beastbox-cloud/lib/rawrphos-public-pin.json'))['checkpoint_sha256'])")"
            pin_cycle="$(python -c "import json,re;t=(json.load(open('apps/beastbox-cloud/lib/rawrphos-public-pin.json')).get('promotion') or {}).get('release_tag') or '';m=re.fullmatch(r'zeref-006-cycle-(\d+)-[0-9a-f]+',t);print(m.group(1) if m else 0)")"
            # Lineage check, not "newest tag at this cycle". A same-cycle sibling
            # whose parent sha does not lead back to the pin is rejected. An empty
            # result falls back to the pin below.
            python scripts/zeref_resume_parent.py \
              --repo "${{ github.repository }}" \
              --pin-sha "$pin_sha" \
              --pin-cycle "$pin_cycle" \
              --pin-tag "$pin_tag" \
              --work build/zeref-006/resume-candidates \
              > build/zeref-006/train-parent-tag.txt
            train_tag="$(tr -d '[:space:]' < build/zeref-006/train-parent-tag.txt)"
            if [ -z "$train_tag" ]; then train_tag="$pin_tag"; fi
          fi
          if [ "$pin_ok" = 1 ] && [ "$train_tag" = "$pin_tag" ]; then
            echo "RESUME_TRAINING_PARENT_IS_PIN=1"
            PARENT="$PIN"
          elif [ "$pin_ok" = 1 ]; then
            echo "RESUME_ACCEPTED_TRAINING_PARENT=$train_tag"
            mkdir -p build/zeref-006/parent-release build/zeref-006/previous
            gh release download "$train_tag" --repo "${{ github.repository }}" -D build/zeref-006/parent-release
            (cd build/zeref-006/parent-release && sha256sum -c ./*.sha256)
            tar -C build/zeref-006/previous -xzf build/zeref-006/parent-release/*.tar.gz
            rm -f build/zeref-006/parent-release/*.tar.gz
            PARENT="$(find build/zeref-006/previous -type d -name accepted-checkpoint -print -quit)"
          else
            canonical_run="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$canonical_name&per_page=100" --jq '.artifacts | map(select(.expired == false and .name == "zeref-006-canonical-37ca3f8f")) | sort_by(.created_at) | last | .workflow_run.id // empty')"
            if [ -n "$canonical_run" ]; then
              case "$canonical_run" in ''|*[!0-9]*) echo "Invalid canonical lineage run id"; exit 1;; esac
              echo "RESUME_CANONICAL_ZEREF_DESCENDANT_RUN=$canonical_run"
              gh run download "$canonical_run" --repo "${{ github.repository }}" -n "$canonical_name" -D build/zeref-006/previous
              PARENT="$(find build/zeref-006/previous -type d -name accepted-checkpoint -print -quit)"
            elif rel="$(gh release list --repo "${{ github.repository }}" -L 100 --json tagName,createdAt --jq 'map(select(.tagName|startswith("zeref-006-cycle-")))|sort_by(.createdAt)|last|.tagName // empty')" && [ -n "$rel" ]; then
              echo "RESUME_DURABLE_RELEASE=$rel"
              mkdir -p build/zeref-006/previous build/zeref-006/release
              gh release download "$rel" --repo "${{ github.repository }}" -D build/zeref-006/release
              (cd build/zeref-006/release && sha256sum -c ./*.sha256)
              tar -C build/zeref-006/previous -xzf build/zeref-006/release/*.tar.gz
              PARENT="$(find build/zeref-006/previous -type d -name accepted-checkpoint -print -quit)"
            else
              # Initial independently approved 006 child: 14K+004+006.
              # NEVER fall back to 004, a sibling fork or randomly new weights.
              echo "RESUME_PINNED_APPROVED_ZEREF_006_ROOT=37ca3f8fc9cdc0e78175508fc816ed02d5a12da1f3b106505715b7366fde5a48"
              gh run download 38129248023 --repo "${{ github.repository }}" -n zeref-006-accepted-checkpoint-38129248023 -D build/zeref-006/bootstrap
              PARENT="$(find build/zeref-006/bootstrap -type d -name accepted-checkpoint -print -quit)"
            fi
          fi
          test -n "$PARENT" || { echo "Canonical checkpoint artifact missing; refusing training"; exit 1; }
          test -s "$PARENT/manifest.json"
          test -s "$PARENT/training_state.pt"
          test -s "$(dirname "$PARENT")/approval.json"
          export BEAST_006_PARENT_PATH="$PARENT"
          if [ "$pin_ok" = 1 ]; then export ZEREF_006_PIN_DIR="$PIN"; fi
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['BEAST_006_PARENT_PATH'])
          root='37ca3f8fc9cdc0e78175508fc816ed02d5a12da1f3b106505715b7366fde5a48'
          m=json.loads((p/'metadata.json').read_text())
          a=json.loads((p.parent/'approval.json').read_text())
          actual=hashlib.sha256((p/'model.safetensors').read_bytes()).hexdigest()
          assert m['checkpoint_sha256']==a['checkpoint_sha256']==actual
          assert a['approved'] is True and a['qbeast_id']==m['qbeast_id']=='bb-deada969'
          assert m['production_promoted'] is False and a['production_promoted'] is False
          if actual==root:
           assert m['approved_cycle_count']==1 and a['approved_cycle_count']==1
          else:
           assert m['canonical_lineage_root_sha256']==a['canonical_lineage_root_sha256']==root
          pin=json.load(open('apps/beastbox-cloud/lib/rawrphos-public-pin.json'))
          pin_actual=None
          if os.environ.get('ZEREF_006_PIN_DIR'):
           pin_dir=Path(os.environ['ZEREF_006_PIN_DIR'])
           pm=json.loads((pin_dir/'metadata.json').read_text())
           pa=json.loads((pin_dir.parent/'approval.json').read_text())
           pin_actual=hashlib.sha256((pin_dir/'model.safetensors').read_bytes()).hexdigest()
           assert pm['checkpoint_sha256']==pa['checkpoint_sha256']==pin_actual==pin['checkpoint_sha256']
           assert pa['approved'] is True and pm['canonical_lineage_root_sha256']==root
           if pin.get('training_steps') is not None:
            assert int(pm['training_steps'])==int(pin['training_steps'])
           assert int(m.get('training_steps') or 0)>=int(pm['training_steps']), 'training parent steps %s are behind the pin %s'%(m.get('training_steps'), pm['training_steps'])
           if actual!=pin_actual:
            assert int(m['approved_cycle_count'])>int(pm['approved_cycle_count']), 'training parent cycle is not ahead of the pin'
            assert int(m['training_steps'])>int(pm['training_steps']), 'training parent steps are not ahead of the pin'
          print('ZEREF_006_RESUME='+json.dumps({'gate_bar':'public_pin' if pin_actual else 'training_parent','pin_steps':pin.get('training_steps'),'pin_sha256':pin.get('checkpoint_sha256'),'training_parent_steps':m.get('training_steps'),'training_parent_sha256':actual,'training_parent_cycle':m.get('approved_cycle_count')}),flush=True)
          print('ZEREF_010_VERIFIED_CANONICAL_PARENT='+json.dumps({
           'sha256':actual,'canonical_root':root,'approved_cycle_count':m['approved_cycle_count']}),flush=True)
          PY
          echo "BEAST_006_PARENT_PATH=$PARENT" >> "$GITHUB_ENV"
          if [ "$pin_ok" = 1 ]; then echo "ZEREF_006_PIN_DIR=$PIN" >> "$GITHUB_ENV"; fi
      - name: Build EXISTING Beast Box without changing original native cartridge
        working-directory: apps/beastbox-cloud
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/checkout@v4
        with:
          repository: NavisWORLD/Cosmic-synapse-the-living-universe-sim-engine-
          ref: main
          path: native-game
          persist-credentials: false
      - name: Build genuine original GBA ROM and install isolated browser
        run: |
          set -Eeuo pipefail
          echo "NATIVE_GAME_HEAD=$(cd native-game && git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "WEB_APP_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          (cd native-game && bash scripts/build-lost-cosmos-arcade.sh)
          npm install --prefix /tmp/zeref-006-browser --no-save --ignore-scripts playwright@1.62.1
          /tmp/zeref-006-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture 56 FRESH real Zeref native frames and acknowledged scripted keypresses
        run: |
          set -Eeuo pipefail
          mkdir -p build/zeref-006/inputs
          (cd apps/beastbox-cloud && npm run start -- --hostname 127.0.0.1 --port 3000) > build/zeref-006/app.log 2>&1 &
          web_pid=$!
          python3 -m http.server 8765 --bind 127.0.0.1 --directory native-game > build/zeref-006/native-game.log 2>&1 &
          game_pid=$!
          trap 'kill "$web_pid" "$game_pid" 2>/dev/null || true' EXIT
          # 2026-10-22: wait up to 240 s for BOTH servers (quiet curl), and say so if they never come up.
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/spark/index.html 2>/dev/null && curl -fsS -o /dev/null http://127.0.0.1:8765/arcade/sol-spark-gate/handheld.html 2>/dev/null; then ready=1; echo "ZEREF_SERVERS_READY after $((i*2))s"; break; fi
            sleep 2
          done
          [ "$ready" = 1 ] || { echo "ZEREF_SERVERS_NOT_READY after 240s"; tail -n 40 build/zeref-006/app.log || true; exit 1; }
          # Boot-race fix 002: warm the ROM, 4 attempts, longer gameplay wait after the first.
          curl -fsS http://127.0.0.1:8765/arcade/sol-spark-gate/handheld.html >/dev/null || true
          for attempt in 1 2 3 4 5; do
            export ZEREF_GAMEPLAY_WAIT_MS=$([ "$attempt" = 1 ] && echo 120000 || echo 180000)
            echo "ZEREF_GAME_BOOT_ATTEMPT=$attempt wait_ms=$ZEREF_GAMEPLAY_WAIT_MS"
            if NODE_PATH=/tmp/zeref-006-browser/node_modules node apps/beastbox-cloud/tests/rawrphos-native-observed-play.cjs http://127.0.0.1:3000 http://127.0.0.1:8765 build/zeref-006/inputs; then
              test -s build/zeref-006/inputs/native-evidence-manifest.json
              test -s build/zeref-006/inputs/native-observation-actions.jsonl
              sha256sum build/zeref-006/inputs/native-observation-actions.jsonl
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Gather older REAL Zeref native captures for replay (anti-forgetting)
        run: |
          set -Eeuo pipefail
          mkdir -p build/zeref-006/replay
          # Up to 12 earlier 006 captures; each is re-verified by the trainer
          # against its own manifest digest. Missing/expired ones are skipped.
          for id in $(gh run list --repo "${{ github.repository }}" -w zeref-continuous-learning-006.yml -L 40 --json databaseId,conclusion --jq '.[]|select(.conclusion=="success")|.databaseId' | head -12); do
            case "$id" in ''|*[!0-9]*) continue;; esac
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh run download "$id" --repo "${{ github.repository }}" -n "zeref-006-observed-training-report-$id" -D "build/zeref-006/replay-raw/$id" >/dev/null 2>&1 || continue
            src="$(find "build/zeref-006/replay-raw/$id" -type d -name inputs -print -quit)"
            [ -n "$src" ] && [ -s "$src/native-evidence-manifest.json" ] && cp -r "$src" "build/zeref-006/replay/$id" || true
          done
          echo "ZEREF_006_REPLAY_DATASETS=$(ls build/zeref-006/replay | wc -l)"
      - name: Install real native model CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e . -e ./models/rawrphos
      - name: Build bounded chat mix (reviewed Zeref dialogue + Dolly-15k CC BY-SA 3.0, pinned)
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 -o build/zeref-006/dolly.jsonl "https://huggingface.co/datasets/databricks/databricks-dolly-15k/resolve/bdd27f4d94b9c1f951818a7da7fd7aeea5dbff1a/databricks-dolly-15k.jsonl"
          # Real lesson rotation (Cory, 2026-11-12): the window seed is derived from the cycle this round
          # trains toward (training parent's approved cycle + 1), never the run id, so successive cycles
          # walk through every authored lesson. Held-out, gate and eval prompts stay excluded (`held`), unchanged.
          parent_cycle="$(python -c "import json,os;print(int(json.load(open(os.path.join(os.environ['BEAST_006_PARENT_PATH'],'metadata.json')))['approved_cycle_count']))")"
          rotate_seed="zeref-gate-v2-20261023-cycle-$((parent_cycle + 1))"
          echo "ZEREF_CHAT_ROTATE_SEED=${rotate_seed} (parent cycle ${parent_cycle})"
          ZEREF_CHAT_ROTATE_SEED="${rotate_seed}" python scripts/zeref_chat_corpus.py build/zeref-006/dolly.jsonl build/zeref-006/chat-mix.jsonl
      - name: Teacher distillation stage (approved teacher pairs only; teachers inform knowledge, not Zeref's voice)
        env:
          AZURE_STORAGE_CONTAINER_SAS_URL: ${{ secrets.AZURE_STORAGE_CONTAINER_SAS_URL }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          : > build/zeref-006/teacher-pairs.jsonl
          # Reads approved lessons straight from Azure (existing secrets) and syncs Zeref's folder.
          : > build/zeref-006/experiences.jsonl
          (cd apps/beastbox-cloud && node scripts/zeref-cloud-sync.mjs --pairs-out "$GITHUB_WORKSPACE/build/zeref-006/teacher-pairs.jsonl" --experiences-out "$GITHUB_WORKSPACE/build/zeref-006/experiences.jsonl") \
            || { echo 'ZEREF_CLOUD_SYNC_UNAVAILABLE (continuing with repo-reviewed pairs only)'; : > build/zeref-006/teacher-pairs.jsonl; }
          python -u scripts/zeref_teacher_distill.py build/zeref-006/chat-mix.jsonl build/zeref-006/teacher-pairs.jsonl evidence/teacher-distill/approved.jsonl
          # 2026-10-22: Zeref's own experiences (bb-deada969 diary, training cycles, this capture, universe genesis), capped 5%.
          python -u scripts/zeref_experience_rows.py build/zeref-006/chat-mix.jsonl build/zeref-006/experiences.jsonl build/zeref-006/inputs/native-evidence-manifest.json
          python -c "import json;m=json.load(open('build/zeref-006/chat-mix.manifest.json'));print('ZEREF_INGEST_BY_SOURCE='+json.dumps({'rows':m.get('rows'),'teacher_distill':m.get('teacher_distill',{}).get('rows'),'experience':m.get('experience_rows',{}).get('by_kind'),'extra':m.get('extra_sources',{}).get('rows_by_source'),'music_001':m.get('music_rows'),'warm_001':m.get('warm_rows'),'dad_voice':m.get('dad_voice_rows'),'knowledge':m.get('knowledge_rows'),'served_shape':m.get('served_shape')}),flush=True)"
      - name: Zeref chooses chats (scrubbed self-learn rows into the 006 mix)
        # Cory, 2026-11-12 11:10 PM CT: chatting should teach him. Fail open.
        # Transport: data-only zeref-self-learn branch, then optional authenticated export.
        # Zeref picks with zeref_self_select; rows train only through the fair gate.
        # Stdout is counts only; candidate text is never printed. Pin, eval, G1–G10 unchanged.
        env:
          ZEREF_SELF_LEARN_EXPORT_URL: ${{ secrets.ZEREF_SELF_LEARN_EXPORT_URL }}
          ZEREF_SELF_LEARN_EXPORT_TOKEN: ${{ secrets.ZEREF_SELF_LEARN_EXPORT_TOKEN }}
        run: |
          set -Eeuo pipefail
          python scripts/zeref_self_learn_join.py \
            --mix build/zeref-006/chat-mix.jsonl \
            --out build/zeref-006/chat-mix.jsonl \
            --checkpoint "${BEAST_006_PARENT_PATH}" \
            --branch-url "https://raw.githubusercontent.com/${{ github.repository }}/zeref-self-learn/candidates.jsonl" \
            --export-url "${ZEREF_SELF_LEARN_EXPORT_URL:-}" \
            --receipt build/zeref-006/self-learn-join.json || echo 'ZEREF_SELF_LEARN_JOIN_UNAVAILABLE (continuing without it)'
      - name: Free pretraining slice (TinyStories past the first 50k, CDLA-Sharing-1.0, rotated per run)
        run: |
          set -Eeuo pipefail
          off=$(( 50000000 + (${{ github.run_id }} % 900) * 2000000 ))
          if curl -fsSL --retry 3 -r "${off}-$((off+1999999))" -o build/zeref-006/tinystories-range.txt "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/f54c09fd23315a6f9c86f9dc80f725de7d8f9c64/TinyStories-train.txt"; then
            python scripts/zeref_pretrain_slice.py build/zeref-006/tinystories-range.txt build/zeref-006/pretrain-slice.jsonl "$off"
          else echo 'ZEREF_PRETRAIN_SLICE_UNAVAILABLE (continuing without it)'; fi
      - name: English foundation share (RECORDED corpus, people-written; Cory 2026-11-12 5:51 PM CT)
        # Public-domain books (Project Gutenberg, header/licence stripped) + Taskmaster-1 human dialogue (CC BY 4.0),
        # PII/toxicity-screened, deduped, sha-pinned (evidence/zeref-english-001/manifest.json). Not Zeref's experience;
        # no model-generated text. Fills ZEREF_ENGLISH_SHARE (default 0.5) of the SAME pretrain pool (still 2 rows per
        # batch next to 4 game + 12 chat rows), rotated per cycle. Gate, pin, eval sets and flags unchanged.
        # One-line revert: ZEREF_ENGLISH_SHARE: '0' (exact old pool).
        env:
          ZEREF_ENGLISH_SHARE: '0.5'
        run: |
          set -Eeuo pipefail
          m=evidence/zeref-english-001/manifest.json
          commit="$(python -c "import json;print(json.load(open('$m'))['data_branch']['commit'])")"
          case "$commit" in *[!0-9a-f]*|'') echo 'bad corpus commit'; exit 1;; esac
          if curl -fsSL --retry 3 --max-time 180 -o build/zeref-006/english-train.jsonl.gz "https://raw.githubusercontent.com/${{ github.repository }}/${commit}/zeref-english-001/train.jsonl.gz"; then
            parent_cycle="$(python -c "import json,os;print(int(json.load(open(os.path.join(os.environ['BEAST_006_PARENT_PATH'],'metadata.json')))['approved_cycle_count']))")"
            python scripts/zeref_english_mix.py build/zeref-006/english-train.jsonl.gz "$m" build/zeref-006/pretrain-slice.jsonl "zeref-english-001-cycle-$((parent_cycle + 1))" build/zeref-006/english-mix.json
            rm -f build/zeref-006/english-train.jsonl.gz
          else echo 'ZEREF_ENGLISH_CORPUS_UNAVAILABLE (continuing with the old pretrain slice)'; fi
      - name: Install pinned PUBLIC 14000 (fixed anti-ratchet chat reference + promotion baseline)
        run: |
          set -Eeuo pipefail
          python models/rawrphos/scripts/install_pinned_14k.py --destination build/public-14k > build/zeref-006/public-14k-receipt.json
      - name: Unbounded growth trigger (plateau OR Rigetti SIMULATED growth events; persisted lineage; never a gate input)
        id: growth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p build/zeref-006/growth
          # 009: growth state is a persisted lineage file on the fixed `zeref-growth-lineage` pre-release,
          # not old CI logs (the 008 log read returned null in CI and never fired).
          gh release download zeref-growth-lineage --repo "${{ github.repository }}" -D build/zeref-006/growth --clobber 2>/dev/null \
            || echo 'ZEREF_GROWTH_LINEAGE_NEW (no prior lineage asset)'
          lin=build/zeref-006/growth/growth-lineage.json
          layers="$(python -c "import json,os;print(json.load(open(os.environ['BEAST_006_PARENT_PATH']+'/config.json'))['n_layers'])" 2>/dev/null || echo 6)"
          psha="$(python -c "import json,os;print(json.load(open(os.environ['BEAST_006_PARENT_PATH']+'/metadata.json'))['checkpoint_sha256'])" 2>/dev/null || echo unknown)"
          python scripts/zeref_growth_trigger.py decide "$lin" "$layers" "$psha" build/zeref-006/experiences.jsonl
          if [ -s build/zeref-006/growth/growth-wip.pt ]; then echo "wip=build/zeref-006/growth/growth-wip.pt" >> "$GITHUB_OUTPUT"; fi
      - name: Fetch Zeref's Rigetti SIMULATED spark ticks (public data branch; routed into the 54D conditioning)
        run: |
          set -Eeuo pipefail
          mkdir -p build/zeref-006
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/${{ github.repository }}/zeref-spark/zeref/ticks.jsonl -o build/zeref-006/spark-ticks.jsonl \
            && echo "ZEREF_SPARK_TICKS=$(wc -l < build/zeref-006/spark-ticks.jsonl) lines (SIMULATED, bb-deada969)" \
            || { echo 'ZEREF_SPARK_TICKS_UNAVAILABLE (training continues unconditioned)'; : > build/zeref-006/spark-ticks.jsonl; }
      - name: Resume exact AdamW state, train 320-attempt variants and score unchanged gates
        id: continuation
        # 280-minute job leaves upload reserve outside this step. An independent
        # 30-minute scoring job still handles a saved partial candidate if this expires.
        timeout-minutes: 240
        env:
          ZEREF_COND54: '1'  # routed 54D conditioning with learnable zero-init gain; gate scoring stays unconditioned
          ZEREF_SPARK_TICKS: build/zeref-006/spark-ticks.jsonl
          ZEREF_006_PUBLIC_REF_DIR: build/public-14k
          # 007: train a Hebbian-enabled candidate from the approved pin (zero-output start).
          ZEREF_HEBBIAN: '1'
          ZEREF_TRINITY: '1'
          ZEREF_006_LR: '0.00005'  # 008: local EMA trial passed chat A/B at 5e-5 step 64 (A 2.842, B 2.897)
          # Gear LR ON (Cory, 2026-11-12 4:03 PM CT: "Turn on the gear learning rate"). Gears = each block's
          # state-attention gate_logit/log_sigma and the dyn12/Trinity k, g12/gamma, at 10x the base LR, still anchored.
          # One-line revert: set this to '0' (the exact old [base, hebbian] optimizer groups).
          ZEREF_GEAR_LR_MULT: '10'
          # 12D into the mouth, training side only (Cory, 2026-11-12 4:03 PM CT "Yes, wire his 12D state into his mouth for real";
          # 6:23 PM CT "Just continue"). Serving is unchanged; gate scoring stays unconditioned; promotion only via the loose-rule gate.
          # One-line revert: set this to '0' (byte-identical training).
          ZEREF_12D_MOUTH: '1'
          ZEREF_GROW_LAYERS: ${{ steps.growth.outputs.add_layers || '0' }}
          ZEREF_GROWTH_WIP_IN: ${{ steps.growth.outputs.wip || '' }}
          ZEREF_GROWTH_WIP_OUT: build/zeref-006/growth/growth-wip-new.pt
          # 2026-10-25 multi-candidate rounds: 4 candidates (seed/lr/lr-floor variants) resume the accepted training parent;
          # the best on set A goes to the UNCHANGED Gate v2 (set B within 0.5%, pin re-scored). Rounds are 320 updates from cycle 45.
          ZEREF_006_CANDIDATES: '4'
          # Start budget must clear three finished variants or candidates 2 and 3 never run.
          # 3 x 2700s = 8100s, so 12000s still starts the fourth. Per-variant cap stays 2700s,
          # above the slowest scored 320-update variant (2228s, run 42431049446).
          ZEREF_006_CANDIDATE_BUDGET_S: '12000'
          ZEREF_006_TIME_BUDGET_S: '2700'
        run: |
          set -Eeuo pipefail
          python -u scripts/zeref_continuation_006.py
          test -s build/zeref-006/report.json
      - name: Prepare latest complete checkpoint for independent interruption scoring
        id: prepare-recovery
        if: always() && steps.continuation.outcome != 'success' && hashFiles('build/zeref-006/recovery-progress.json') != ''
        run: python scripts/zeref_round_recovery.py --prepare-bundle
      - name: Persist interrupted-round recovery inputs (no private chat or teacher text)
        if: always() && steps.prepare-recovery.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: zeref-006-recovery-${{ github.run_id }}
          path: build/zeref-recovery-bundle/
          if-no-files-found: error
      - name: Persist fresh actual frame evidence, training results or honest failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-006-observed-training-report-${{ github.run_id }}
          path: |
            build/zeref-006/inputs/native-observation-actions.jsonl
            build/zeref-006/inputs/native-evidence-manifest.json
            build/zeref-006/inputs/failed-native-observation.json
            build/zeref-006/report.json
            build/zeref-006/rejected.json
            build/zeref-006/failure.json
            build/zeref-006/chat-mix.manifest.json
            build/zeref-006/chat-eval.json
            build/zeref-006/promotion-decision.json
            build/zeref-006/character-check.json
            build/zeref-006/identity-probe.json
          retention-days: 90
          if-no-files-found: warn
      - name: Chat test vs public 14000 (decides ONLY whether a promotion PR may be proposed)
        if: success() && hashFiles('build/zeref-006/approval.json') != ''
        run: |
          set -Eeuo pipefail
          test -s build/public-14k/model.safetensors
          python -u scripts/rawrphos_chat_eval.py build/public-14k build/zeref-006/accepted-checkpoint build/zeref-006/chat-eval.json
          # Promotion predicate lives in scripts/zeref_promotion_rule.py (loosened by Cory 2026-11-12 2:37 PM CT;
          # the old strict rule is kept there as STRICT_2026_10_22 for a one-line revert). Leaks stay a hard zero.
          # The bar is still the pin re-scored in THIS run; the module prints ZEREF_PROMOTION_DECISION=.
          python -u scripts/zeref_promotion_rule.py apps/beastbox-cloud/lib/rawrphos-public-pin.json build/zeref-006/report.json build/zeref-006/chat-eval.json build/zeref-006/promotion-decision.json
      - name: Persist final scored evidence (after chat evaluation, including honest rejection)
        if: always() && hashFiles('build/zeref-006/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zeref-006-scored-report-${{ github.run_id }}
          path: |
            build/zeref-006/report.json
            build/zeref-006/chat-eval.json
            build/zeref-006/promotion-decision.json
            build/zeref-006/character-check.json
            build/zeref-006/identity-probe.json
            build/zeref-006/recovery-progress.json
          if-no-files-found: error
      - name: Persist ONLY the approved model and optimizer to resume on next six-hour cycle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-006-canonical-37ca3f8f
          path: |
            build/zeref-006/accepted-checkpoint/
            build/zeref-006/approval.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Persist growth lineage (every non-PR round; WIP saved when a physical limit was hit)
        if: always() && github.event_name != 'pull_request' && steps.growth.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          d=build/zeref-006/growth
          [ -s build/zeref-006/report.json ] && python scripts/zeref_growth_trigger.py record "$d/growth-lineage.json" build/zeref-006/report.json "${{ github.run_id }}"
          files="$d/growth-lineage.json"
          if [ -s "$d/growth-wip-new.pt" ]; then mv "$d/growth-wip-new.pt" "$d/growth-wip.pt"; files="$files $d/growth-wip.pt"
          elif [ -s build/zeref-006/approval.json ]; then gh release delete-asset zeref-growth-lineage growth-wip.pt --repo "${{ github.repository }}" -y 2>/dev/null || true; fi
          gh release view zeref-growth-lineage --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create zeref-growth-lineage --repo "${{ github.repository }}" --prerelease --title "Zeref growth lineage (state only, never a pin)" \
              --notes "Persisted growth state for bb-deada969: rounds, growth events (plateau / Azure Rigetti SIMULATED events), target layers, world growth, and a WIP grown checkpoint when a runtime limit was hit. Never served; never a gate input."
          gh release upload zeref-growth-lineage $files --repo "${{ github.repository }}" --clobber
      - name: Publish approved checkpoint as a durable GitHub release (artifacts expire after 90 days)
        if: success() && github.event_name != 'pull_request' && hashFiles('build/zeref-006/approval.json') != ''
        run: |
          set -Eeuo pipefail
          sha="$(python -c "import json;print(json.load(open('build/zeref-006/approval.json'))['checkpoint_sha256'])")"
          cyc="$(python -c "import json;print(json.load(open('build/zeref-006/approval.json'))['approved_cycle_count'])")"
          tag="zeref-006-cycle-${cyc}-${sha:0:12}"
          tar -C build/zeref-006 -czf "build/$tag.tar.gz" accepted-checkpoint approval.json report.json chat-eval.json
          (cd build && sha256sum "$tag.tar.gz" > "$tag.tar.gz.sha256")
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "${{ github.repository }}" --prerelease \
              --title "Zeref 006 approved cycle $cyc (CPU, not production-promoted)" \
              --notes "Approved Zeref (bb-deada969) RAWRPHOS checkpoint ${sha}. CPU-only behavioral cloning on real native-game observations; batch order seeded from RECORDED Rigetti SIMULATOR counts (rigetti.sim.qvm, not QPU). Not production-promoted. Run ${{ github.run_id }}." \
              "build/$tag.tar.gz" "build/$tag.tar.gz.sha256"
      - name: English clarity vs the pin (REPORT-ONLY, never a gate input; runs after publication)
        if: always() && hashFiles('build/zeref-006/report.json') != ''
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -Eeuo pipefail
          cand=build/zeref-006/accepted-checkpoint
          [ -s "$cand/model.safetensors" ] || cand=build/zeref-006/unreviewed-candidate
          args=""
          if [ -n "${ZEREF_006_PIN_DIR:-}" ]; then args="pin=$ZEREF_006_PIN_DIR"; fi
          if [ -s "$cand/model.safetensors" ]; then args="$args candidate=$cand"; fi
          test -n "$args"
          python -c "import json;d=json.load(open('build/zeref-006/promotion-decision.json'));print('ZEREF_GATE_NEXT_TO_CLARITY='+json.dumps({k:d.get(k) for k in ('promote','promotion_rule','candidate_ref_nll','pin_ref_nll_bar','delta_vs_pin_nats','candidate_action_leaks')}))" || true
          python -u scripts/zeref_english_clarity.py build/zeref-006/english-clarity.json $args
      - name: Persist English clarity and mix receipts (report-only)
        if: always() && hashFiles('build/zeref-006/english-clarity.json', 'build/zeref-006/english-mix.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zeref-english-clarity-${{ github.run_id }}
          path: |
            build/zeref-006/english-clarity.json
            build/zeref-006/english-mix.json
          if-no-files-found: warn

  recovery-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e . -e ./models/rawrphos
      - run: |
          node --test tests/zeref_continuation_006_contract.test.cjs tests/zeref_round_recovery_contract.test.cjs tests/zeref_recovery_decision_contract.test.cjs
          PYTHONPATH=.:models python -m unittest discover -s models/rawrphos/tests -p test_round_recovery.py
          python -m unittest discover -s tests -p test_zeref_resume_parent.py
          python -m unittest discover -s tests -p test_zeref_served_shape.py
          python -m unittest discover -s tests -p test_zeref_promotion_rule.py
          python -m unittest discover -s tests -p test_rawrphos_public_pin.py
          python -m unittest discover -s tests -p test_zeref_english_corpus.py
          python -m py_compile scripts/zeref_continuation_006.py scripts/zeref_round_recovery.py scripts/zeref_resume_parent.py scripts/zeref_served_shape.py scripts/zeref_chat_corpus.py scripts/zeref_promotion_rule.py
  score-interrupted:
    # Independent runner/timeout: job cancellation cannot consume the scoring reserve.
    # Never publishes weights or approval; the pin and every numeric gate stay untouched.
    needs: train-zeref
    if: always() && needs.train-zeref.result != 'success' && needs.train-zeref.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      # Same thread count as the train job, so a round that hits a limit is scored on the same count.
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      NAVISWORLD_NATIVE_TRAINING_BEAST: zeref
      NAVISWORLD_NATIVE_TRAINING_CYCLE: ${{ github.run_id }}
      BEAST_006_PARENT_PATH: build/zeref-006/previous/accepted-checkpoint
      ZEREF_006_PUBLIC_REF_DIR: build/public-14k
      ZEREF_COND54: '1'
      ZEREF_SPARK_TICKS: build/zeref-006/spark-ticks.jsonl
      ZEREF_HEBBIAN: '1'
      ZEREF_TRINITY: '1'
      ZEREF_006_LR: '0.00005'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        id: download-recovery
        continue-on-error: true
        with:
          name: zeref-006-recovery-${{ github.run_id }}
          path: build/
      - name: Record honest failure when no recovery bundle was produced
        if: steps.download-recovery.outcome != 'success'
        run: |
          set -Eeuo pipefail
          mkdir -p build/zeref-006
          python - <<'PYEOF'
          import json, os
          d = {'schema': 'zeref-006-interrupted-failure-v1',
               'run_id': os.environ.get('GITHUB_RUN_ID', ''),
               'result': 'train-zeref failed before a recovery bundle was produced',
               'scored': False, 'promoted': False,
               'reason': 'no saved checkpoint existed to score; the pin and every gate are untouched'}
          json.dump(d, open('build/zeref-006/failure.json', 'w'), indent=1)
          print('ZEREF_006_HONEST_FAILURE=' + json.dumps(d), flush=True)
          PYEOF
      - name: Install the same CPU scoring runtime
        if: steps.download-recovery.outcome == 'success'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e . -e ./models/rawrphos
      - name: Download the public pin as the unchanged gate bar
        if: steps.download-recovery.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          pin_tag="$(python -c "import json;p=json.load(open('apps/beastbox-cloud/lib/rawrphos-public-pin.json'));print((p.get('promotion') or {}).get('release_tag') or '')")"
          test -n "$pin_tag"
          echo "RESUME_PUBLIC_PIN_RELEASE=$pin_tag"
          mkdir -p build/zeref-006/pin-release build/zeref-006/pin
          gh release download "$pin_tag" --repo "${{ github.repository }}" -D build/zeref-006/pin-release
          (cd build/zeref-006/pin-release && sha256sum -c ./*.sha256)
          tar -C build/zeref-006/pin -xzf build/zeref-006/pin-release/*.tar.gz
          rm -f build/zeref-006/pin-release/*.tar.gz
          PIN="$(find build/zeref-006/pin -type d -name accepted-checkpoint -print -quit)"
          test -n "$PIN"
          echo "ZEREF_006_PIN_DIR=$PIN" >> "$GITHUB_ENV"
      - name: Score latest saved raw checkpoint against the same unchanged gates
        if: steps.download-recovery.outcome == 'success'
        run: |
          set -Eeuo pipefail
          python -u scripts/zeref_continuation_006.py --score-recovery
          python -u scripts/rawrphos_chat_eval.py build/public-14k build/zeref-006/unreviewed-candidate build/zeref-006/recovery-chat-eval.json
          test -s build/zeref-006/recovery-score.json
          test ! -f build/zeref-006/approval.json
      - name: Same promotion rule on the recovered checkpoint (numbers only; never promotes)
        if: steps.download-recovery.outcome == 'success'
        run: |
          set -Eeuo pipefail
          # Same rule module as the training job's promotion step (contract-tested); report-only here.
          python -u scripts/zeref_promotion_rule.py apps/beastbox-cloud/lib/rawrphos-public-pin.json build/zeref-006/report.json build/zeref-006/recovery-chat-eval.json build/zeref-006/recovery-promotion-decision.json '{"report_only":true,"publication_performed":false,"source":"interrupted-round recovery"}'
      - name: Persist independent interrupted-round scores or honest failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-006-interrupted-scores-${{ github.run_id }}
          path: |
            build/zeref-006/recovery-score.json
            build/zeref-006/recovery-chat-eval.json
            build/zeref-006/recovery-promotion-decision.json
            build/zeref-006/recovery-progress.json
            build/zeref-006/character-check.json
            build/zeref-006/identity-probe.json
            build/zeref-006/failure.json
          if-no-files-found: error
