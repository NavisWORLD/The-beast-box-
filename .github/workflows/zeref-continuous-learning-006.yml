name: Zeref 006 - resumable real native RAWRPHOS learning heartbeat
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'apps/beastbox-cloud/tests/rawrphos-native-observed-play.cjs'
      - 'scripts/zeref_continuation_006.py'
      - '.github/workflows/zeref-continuous-learning-006.yml'
      - 'tests/zeref_continuation_006_contract.test.cjs'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write   # only to publish approved Zeref checkpoints as durable release assets
  actions: read
# Manual CPU training uses the existing frozen lineage and same global serialized runner.
concurrency:
  group: zeref-006-single-approved-learning-lineage
  cancel-in-progress: false
jobs:
  train-zeref:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feature/zeref-resumable-continuous-learning-006-20261011' || startsWith(github.head_ref, 'feature/zeref-manual-cpu-'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      NAVISWORLD_NATIVE_TRAINING_BEAST: zeref
      NAVISWORLD_NATIVE_TRAINING_CYCLE: ${{ github.run_id }}
    steps:
      # Explicit owner-requested controlled CPU continuation after Azure Blob read/write proof.
      # Still the established 006 lineage: this does NOT endorse rejected experiment 011,
      # grant browser/camera/microphone consent, or invoke IBM/Azure quantum workloads.
      - name: Record training scope and non-promotional experiment boundaries
        run: |
          echo 'ZEREF_TRAINING_SCOPE=CPU_ONLY_NATIVE_GAME_OBSERVATION_IMITATION'
          echo 'ZEREF_PRIVATE_CAMERA_MICROPHONE_CHAT=NOT_INCLUDED'
          echo 'ZEREF_QUANTUM_PROVIDER_JOBS_SUBMITTED=0'
          echo 'ZEREF_011_REJECTED_CANDIDATE=NOT_PARENT_OR_PROMOTED'
          echo 'ZEREF_PREVIOUS_APPROVED_CHECKPOINT=MANDATORY_SHA_VERIFICATION'
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify lineage and bounded training invariants
        run: |
          set -Eeuo pipefail
          node --test tests/zeref_continuation_006_contract.test.cjs
          node --check apps/beastbox-cloud/tests/rawrphos-native-observed-play.cjs
          python -m py_compile scripts/zeref_continuation_006.py
      - name: Resume ONLY the canonical SHA-pinned Zeref 006 model and AdamW state
        run: |
          set -Eeuo pipefail
          mkdir -p build/zeref-006
          # GitHub artifacts are paginated; scanning only the latest 100
          # made the last real run silently fork from the older 004 weights.
          # An EXACT fixed artifact name keeps canonical descendants
          # discoverable regardless of unrelated repo CI artifact volume.
          canonical_name="zeref-006-canonical-37ca3f8f"
          # Training fix 002 (2026-10-17): parent AND anchor = the PUBLIC PIN's approved release.
          # Unpromoted cycles never become parents (chaining off them drifted chat 3.946 -> 4.573).
          pin_tag="$(python -c "import json;p=json.load(open('apps/beastbox-cloud/lib/rawrphos-public-pin.json'));print((p.get('promotion') or {}).get('release_tag') or '')")"
          if [ -n "$pin_tag" ] && gh release view "$pin_tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "RESUME_PUBLIC_PIN_RELEASE=$pin_tag"
            mkdir -p build/zeref-006/previous build/zeref-006/release
            gh release download "$pin_tag" --repo "${{ github.repository }}" -D build/zeref-006/release
            (cd build/zeref-006/release && sha256sum -c ./*.sha256)
            tar -C build/zeref-006/previous -xzf build/zeref-006/release/*.tar.gz
            canonical_name="__pin_used__"
          fi
          canonical_run=""; [ "$canonical_name" = "__pin_used__" ] || canonical_run="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$canonical_name&per_page=100" --jq '.artifacts | map(select(.expired == false and .name == "zeref-006-canonical-37ca3f8f")) | sort_by(.created_at) | last | .workflow_run.id // empty')"
          if [ "$canonical_name" = "__pin_used__" ]; then
            PARENT="$(find build/zeref-006/previous -type d -name accepted-checkpoint -print -quit)"
          elif [ -n "$canonical_run" ]; then
            case "$canonical_run" in ''|*[!0-9]*) echo "Invalid canonical lineage run id"; exit 1;; esac
            echo "RESUME_CANONICAL_ZEREF_DESCENDANT_RUN=$canonical_run"
            gh run download "$canonical_run" --repo "${{ github.repository }}" -n "$canonical_name" -D build/zeref-006/previous
            PARENT="$(find build/zeref-006/previous -type d -name accepted-checkpoint -print -quit)"
          elif rel="$(gh release list --repo "${{ github.repository }}" -L 100 --json tagName,createdAt --jq 'map(select(.tagName|startswith("zeref-006-cycle-")))|sort_by(.createdAt)|last|.tagName // empty')" && [ -n "$rel" ]; then
            # Canonical artifact expired: resume from the newest DURABLE approved release.
            echo "RESUME_DURABLE_RELEASE=$rel"
            mkdir -p build/zeref-006/previous
            gh release download "$rel" --repo "${{ github.repository }}" -D build/zeref-006/release
            (cd build/zeref-006/release && sha256sum -c ./*.sha256)
            tar -C build/zeref-006/previous -xzf build/zeref-006/release/*.tar.gz
            PARENT="$(find build/zeref-006/previous -type d -name accepted-checkpoint -print -quit)"
          else
            # Initial independently approved 006 child: 14K+004+006.
            # NEVER fall back to 004, a sibling fork or randomly new weights.
            echo "RESUME_PINNED_APPROVED_ZEREF_006_ROOT=37ca3f8fc9cdc0e78175508fc816ed02d5a12da1f3b106505715b7366fde5a48"
            gh run download 38129248023 --repo "${{ github.repository }}" -n zeref-006-accepted-checkpoint-38129248023 -D build/zeref-006/bootstrap
            PARENT="$(find build/zeref-006/bootstrap -type d -name accepted-checkpoint -print -quit)"
          fi
          test -n "$PARENT" || { echo "Canonical checkpoint artifact missing; refusing training"; exit 1; }
          test -s "$PARENT/manifest.json"
          test -s "$PARENT/training_state.pt"
          test -s "$(dirname "$PARENT")/approval.json"
          export BEAST_006_PARENT_PATH="$PARENT"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['BEAST_006_PARENT_PATH'])
          root='37ca3f8fc9cdc0e78175508fc816ed02d5a12da1f3b106505715b7366fde5a48'
          m=json.loads((p/'metadata.json').read_text())
          a=json.loads((p.parent/'approval.json').read_text())
          actual=hashlib.sha256((p/'model.safetensors').read_bytes()).hexdigest()
          assert m['checkpoint_sha256']==a['checkpoint_sha256']==actual
          assert a['approved'] is True and a['qbeast_id']==m['qbeast_id']=='bb-deada969'
          assert m['production_promoted'] is False and a['production_promoted'] is False
          if actual==root:
           assert m['approved_cycle_count']==1 and a['approved_cycle_count']==1
          else:
           assert m['canonical_lineage_root_sha256']==a['canonical_lineage_root_sha256']==root
          # Always-latest-pin guard (2026-10-19): when a public pin exists the parent MUST be exactly that checkpoint.
          pin=json.load(open('apps/beastbox-cloud/lib/rawrphos-public-pin.json'))
          if (pin.get('promotion') or {}).get('release_tag'):
           assert actual==pin['checkpoint_sha256'],'parent is not the current public pin; refusing to train from a stale checkpoint'
          print('ZEREF_PARENT_IS_CURRENT_PIN='+json.dumps({'pin_steps':pin.get('training_steps'),'sha256':actual}),flush=True)
          print('ZEREF_010_VERIFIED_CANONICAL_PARENT='+json.dumps({
           'sha256':actual,'canonical_root':root,'approved_cycle_count':m['approved_cycle_count']}),flush=True)
          PY
          echo "BEAST_006_PARENT_PATH=$PARENT" >> "$GITHUB_ENV"
      - name: Build EXISTING Beast Box without changing original native cartridge
        working-directory: apps/beastbox-cloud
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/checkout@v4
        with:
          repository: NavisWORLD/Cosmic-synapse-the-living-universe-sim-engine-
          ref: main
          path: native-game
          persist-credentials: false
      - name: Build genuine original GBA ROM and install isolated browser
        run: |
          set -Eeuo pipefail
          echo "NATIVE_GAME_HEAD=$(cd native-game && git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "WEB_APP_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          (cd native-game && bash scripts/build-lost-cosmos-arcade.sh)
          npm install --prefix /tmp/zeref-006-browser --no-save --ignore-scripts playwright@1.62.1
          /tmp/zeref-006-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture 56 FRESH real Zeref native frames and acknowledged scripted keypresses
        run: |
          set -Eeuo pipefail
          mkdir -p build/zeref-006/inputs
          (cd apps/beastbox-cloud && npm run start -- --hostname 127.0.0.1 --port 3000) > build/zeref-006/app.log 2>&1 &
          web_pid=$!
          python3 -m http.server 8765 --bind 127.0.0.1 --directory native-game > build/zeref-006/native-game.log 2>&1 &
          game_pid=$!
          trap 'kill "$web_pid" "$game_pid" 2>/dev/null || true' EXIT
          # 2026-10-22: wait up to 240 s for BOTH servers (quiet curl), and say so if they never come up.
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/spark/index.html 2>/dev/null && curl -fsS -o /dev/null http://127.0.0.1:8765/arcade/sol-spark-gate/handheld.html 2>/dev/null; then ready=1; echo "ZEREF_SERVERS_READY after $((i*2))s"; break; fi
            sleep 2
          done
          [ "$ready" = 1 ] || { echo "ZEREF_SERVERS_NOT_READY after 240s"; tail -n 40 build/zeref-006/app.log || true; exit 1; }
          # Boot-race fix 002: warm the ROM, 4 attempts, longer gameplay wait after the first.
          curl -fsS http://127.0.0.1:8765/arcade/sol-spark-gate/handheld.html >/dev/null || true
          for attempt in 1 2 3 4 5; do
            export ZEREF_GAMEPLAY_WAIT_MS=$([ "$attempt" = 1 ] && echo 120000 || echo 180000)
            echo "ZEREF_GAME_BOOT_ATTEMPT=$attempt wait_ms=$ZEREF_GAMEPLAY_WAIT_MS"
            if NODE_PATH=/tmp/zeref-006-browser/node_modules node apps/beastbox-cloud/tests/rawrphos-native-observed-play.cjs http://127.0.0.1:3000 http://127.0.0.1:8765 build/zeref-006/inputs; then
              test -s build/zeref-006/inputs/native-evidence-manifest.json
              test -s build/zeref-006/inputs/native-observation-actions.jsonl
              sha256sum build/zeref-006/inputs/native-observation-actions.jsonl
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Gather older REAL Zeref native captures for replay (anti-forgetting)
        run: |
          set -Eeuo pipefail
          mkdir -p build/zeref-006/replay
          # Up to 12 earlier 006 captures; each is re-verified by the trainer
          # against its own manifest digest. Missing/expired ones are skipped.
          for id in $(gh run list --repo "${{ github.repository }}" -w zeref-continuous-learning-006.yml -L 40 --json databaseId,conclusion --jq '.[]|select(.conclusion=="success")|.databaseId' | head -12); do
            case "$id" in ''|*[!0-9]*) continue;; esac
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh run download "$id" --repo "${{ github.repository }}" -n "zeref-006-observed-training-report-$id" -D "build/zeref-006/replay-raw/$id" >/dev/null 2>&1 || continue
            src="$(find "build/zeref-006/replay-raw/$id" -type d -name inputs -print -quit)"
            [ -n "$src" ] && [ -s "$src/native-evidence-manifest.json" ] && cp -r "$src" "build/zeref-006/replay/$id" || true
          done
          echo "ZEREF_006_REPLAY_DATASETS=$(ls build/zeref-006/replay | wc -l)"
      - name: Install real native model CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e . -e ./models/rawrphos
      - name: Build bounded chat mix (reviewed Zeref dialogue + Dolly-15k CC BY-SA 3.0, pinned)
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 -o build/zeref-006/dolly.jsonl "https://huggingface.co/datasets/databricks/databricks-dolly-15k/resolve/bdd27f4d94b9c1f951818a7da7fd7aeea5dbff1a/databricks-dolly-15k.jsonl"
          ZEREF_CHAT_ROTATE_SEED="${{ github.run_id }}" python scripts/zeref_chat_corpus.py build/zeref-006/dolly.jsonl build/zeref-006/chat-mix.jsonl
      - name: Teacher distillation stage (approved teacher pairs only; teachers inform knowledge, not Zeref's voice)
        env:
          AZURE_STORAGE_CONTAINER_SAS_URL: ${{ secrets.AZURE_STORAGE_CONTAINER_SAS_URL }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          : > build/zeref-006/teacher-pairs.jsonl
          # Reads approved lessons straight from Azure (existing secrets) and syncs Zeref's folder.
          : > build/zeref-006/experiences.jsonl
          (cd apps/beastbox-cloud && node scripts/zeref-cloud-sync.mjs --pairs-out "$GITHUB_WORKSPACE/build/zeref-006/teacher-pairs.jsonl" --experiences-out "$GITHUB_WORKSPACE/build/zeref-006/experiences.jsonl") \
            || { echo 'ZEREF_CLOUD_SYNC_UNAVAILABLE (continuing with repo-reviewed pairs only)'; : > build/zeref-006/teacher-pairs.jsonl; }
          python -u scripts/zeref_teacher_distill.py build/zeref-006/chat-mix.jsonl build/zeref-006/teacher-pairs.jsonl evidence/teacher-distill/approved.jsonl
          # 2026-10-22: Zeref's own experiences (bb-deada969 diary, training cycles, this capture, universe genesis), capped 5%.
          python -u scripts/zeref_experience_rows.py build/zeref-006/chat-mix.jsonl build/zeref-006/experiences.jsonl build/zeref-006/inputs/native-evidence-manifest.json
          python -c "import json;m=json.load(open('build/zeref-006/chat-mix.manifest.json'));print('ZEREF_INGEST_BY_SOURCE='+json.dumps({'rows':m.get('rows'),'teacher_distill':m.get('teacher_distill',{}).get('rows'),'experience':m.get('experience_rows',{}).get('by_kind'),'extra':m.get('extra_sources',{}).get('rows_by_source'),'music_001':m.get('music_rows'),'warm_001':m.get('warm_rows'),'dad_voice':m.get('dad_voice_rows'),'knowledge':m.get('knowledge_rows')}),flush=True)"
      - name: Free pretraining slice (TinyStories past the first 50k, CDLA-Sharing-1.0, rotated per run)
        run: |
          set -Eeuo pipefail
          off=$(( 50000000 + (${{ github.run_id }} % 900) * 2000000 ))
          if curl -fsSL --retry 3 -r "${off}-$((off+1999999))" -o build/zeref-006/tinystories-range.txt "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/f54c09fd23315a6f9c86f9dc80f725de7d8f9c64/TinyStories-train.txt"; then
            python scripts/zeref_pretrain_slice.py build/zeref-006/tinystories-range.txt build/zeref-006/pretrain-slice.jsonl "$off"
          else echo 'ZEREF_PRETRAIN_SLICE_UNAVAILABLE (continuing without it)'; fi
      - name: Install pinned PUBLIC 14000 (fixed anti-ratchet chat reference + promotion baseline)
        run: |
          set -Eeuo pipefail
          python models/rawrphos/scripts/install_pinned_14k.py --destination build/public-14k > build/zeref-006/public-14k-receipt.json
      - name: Resume exact AdamW state, perform up to 64 new CPU updates and test heldout/retention
        env:
          ZEREF_006_PUBLIC_REF_DIR: build/public-14k
          # 007: train a Hebbian-enabled candidate from the approved pin (zero-output start).
          ZEREF_HEBBIAN: '1'
          ZEREF_TRINITY: '1'
        run: |
          set -Eeuo pipefail
          python -u scripts/zeref_continuation_006.py
          test -s build/zeref-006/report.json
      - name: Persist fresh actual frame evidence, training results or honest failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-006-observed-training-report-${{ github.run_id }}
          path: |
            build/zeref-006/inputs/native-observation-actions.jsonl
            build/zeref-006/inputs/native-evidence-manifest.json
            build/zeref-006/inputs/failed-native-observation.json
            build/zeref-006/report.json
            build/zeref-006/rejected.json
            build/zeref-006/failure.json
            build/zeref-006/chat-mix.manifest.json
            build/zeref-006/chat-eval.json
            build/zeref-006/promotion-decision.json
            build/zeref-006/character-check.json
            build/zeref-006/identity-probe.json
          retention-days: 90
          if-no-files-found: warn
      - name: Chat test vs public 14000 (decides ONLY whether a promotion PR may be proposed)
        if: success() && hashFiles('build/zeref-006/approval.json') != ''
        run: |
          set -Eeuo pipefail
          test -s build/public-14k/model.safetensors
          python -u scripts/rawrphos_chat_eval.py build/public-14k build/zeref-006/accepted-checkpoint build/zeref-006/chat-eval.json
          # Absolute promotion bar (fix 002): not worse than 14000 on every metric AND ref_nll below the CURRENT pin's.
          python - <<'PY'
          import json
          pin=json.load(open('apps/beastbox-cloud/lib/rawrphos-public-pin.json'));ev=json.load(open('build/zeref-006/chat-eval.json'))
          bar=(pin.get('promotion') or {}).get('candidate_ref_nll') or ev['baseline']['ref_nll']
          c=ev['candidate']['ref_nll'];tol=0.005;ok=bool(ev['chat_not_worse'] and c<=bar*(1+tol))  # 2026-10-22: 0.5% tolerance on the selection set; the strict check is fresh set B in the training gate
          d={'schema':'zeref-promotion-decision-v1','candidate_ref_nll':c,'pin_ref_nll_bar':bar,'tolerance':tol,'rule':'within 0.5% of pin on set A AND fresh held-out set B not worse (training gate)','chat_not_worse_vs_14000':ev['chat_not_worse'],'promote':ok}
          json.dump(d,open('build/zeref-006/promotion-decision.json','w'),indent=1)
          print('ZEREF_PROMOTION_DECISION='+json.dumps(d),flush=True)
          PY
      - name: Persist ONLY the approved model and optimizer to resume on next six-hour cycle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-006-canonical-37ca3f8f
          path: |
            build/zeref-006/accepted-checkpoint/
            build/zeref-006/approval.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Publish approved checkpoint as a durable GitHub release (artifacts expire after 90 days)
        if: success() && github.event_name != 'pull_request' && hashFiles('build/zeref-006/approval.json') != ''
        run: |
          set -Eeuo pipefail
          sha="$(python -c "import json;print(json.load(open('build/zeref-006/approval.json'))['checkpoint_sha256'])")"
          cyc="$(python -c "import json;print(json.load(open('build/zeref-006/approval.json'))['approved_cycle_count'])")"
          tag="zeref-006-cycle-${cyc}-${sha:0:12}"
          tar -C build/zeref-006 -czf "build/$tag.tar.gz" accepted-checkpoint approval.json report.json chat-eval.json
          (cd build && sha256sum "$tag.tar.gz" > "$tag.tar.gz.sha256")
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "${{ github.repository }}" --prerelease \
              --title "Zeref 006 approved cycle $cyc (CPU, not production-promoted)" \
              --notes "Approved Zeref (bb-deada969) RAWRPHOS checkpoint ${sha}. CPU-only behavioral cloning on real native-game observations; batch order seeded from RECORDED Rigetti SIMULATOR counts (rigetti.sim.qvm, not QPU). Not production-promoted. Run ${{ github.run_id }}." \
              "build/$tag.tar.gz" "build/$tag.tar.gz.sha256"
