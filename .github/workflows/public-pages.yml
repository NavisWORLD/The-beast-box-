name: Public Beast Box site

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/public-beast-box-site-2e73
    paths:
      - 'site/**'
      - 'scripts/stage_public_site_weights.py'
      - 'tests/test_public_beast_box_site.py'
      - '.github/workflows/public-pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/stage_public_site_weights.py'
      - 'tests/test_public_beast_box_site.py'
      - '.github/workflows/public-pages.yml'

permissions:
  contents: read

concurrency:
  group: public-beast-box-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the static site and gauntlet receipt
        run: |
          python -m pip install pytest
          python -m pytest tests/test_public_beast_box_site.py
      - name: Stage pinned RAWRPHOS 14K inference files
        run: python scripts/stage_public_site_weights.py --destination site/weights
      - name: Match browser dyn12 greedy tokens to the Python transcript
        run: node site/check.mjs

  deploy:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/public-beast-box-site-2e73')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage pinned RAWRPHOS 14K inference files
        run: python scripts/stage_public_site_weights.py --destination site/weights
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
