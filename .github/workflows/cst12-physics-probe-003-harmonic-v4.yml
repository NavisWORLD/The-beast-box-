name: CST12 Physics Probe 003 Harmonic Calibration v4

on:
  push:
    branches: [cst12-physics-probe-003-harmonic-v4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install harmonic v4 test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,quantum]'
      - name: Run harmonic v4 contracts
        run: pytest -q tests/test_cst12_physics_probe_003_harmonic_v4.py
