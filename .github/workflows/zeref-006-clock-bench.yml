name: TEMP Zeref 006 clock-fix measurement (removed before review)
# Temporary, report-only measurement for the round-clock PR. Free hosted runners (public repo),
# the same ubuntu-24.04 / 4-vCPU runner type and torch 2.6.0 CPU wheel as the 006 round.
# Never trains a pin, never writes approval, never publishes, holds no lineage lock.
on:
  push:
    branches: [fix/zeref-006-round-clock]
    paths:
      - '.github/workflows/zeref-006-clock-bench.yml'
      - 'scripts/zeref_006_clock_bench.py'
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  TOKENIZERS_PARALLELISM: 'false'
  ZEREF_COND54: '1'
  ZEREF_SPARK_TICKS: build/zeref-006/spark-ticks.jsonl
  ZEREF_HEBBIAN: '1'
  ZEREF_TRINITY: '1'
  ZEREF_006_LR: '0.00005'
  ZEREF_GEAR_LR_MULT: '10'
  ZEREF_12D_MOUTH: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: [timing, worst, full-c0, full-c1]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Runner
        run: |
          grep -m1 'model name' /proc/cpuinfo; nproc; free -m
      - name: Same CPU runtime as the round
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e . -e ./models/rawrphos
      - name: Real training parent (cycle 80, 70aa7878...) and real inputs of run 44401951155
        run: |
          set -Eeuo pipefail
          mkdir -p build/zeref-006/rel build/zeref-006/previous build/zeref-006/inputs
          gh release download zeref-006-cycle-80-70aa787823f7 --repo "${{ github.repository }}" -D build/zeref-006/rel
          (cd build/zeref-006/rel && sha256sum -c ./*.sha256)
          tar -C build/zeref-006/previous -xzf build/zeref-006/rel/*.tar.gz && rm -f build/zeref-006/rel/*.tar.gz
          P="$(find build/zeref-006/previous -type d -name accepted-checkpoint -print -quit)"
          python -c "import json;m=json.load(open('$P/metadata.json'));print('PARENT_SHA',m['checkpoint_sha256'],'cycle',m['approved_cycle_count'])"
          echo "BEAST_006_PARENT_PATH=$P" >> "$GITHUB_ENV"
          gh run download 44401951155 --repo "${{ github.repository }}" -n zeref-006-observed-training-report-44401951155 -D build/zeref-006/r
          cp build/zeref-006/r/inputs/* build/zeref-006/inputs/
          curl -fsSL --retry 3 -o build/zeref-006/dolly.jsonl "https://huggingface.co/datasets/databricks/databricks-dolly-15k/resolve/bdd27f4d94b9c1f951818a7da7fd7aeea5dbff1a/databricks-dolly-15k.jsonl"
          ZEREF_CHAT_ROTATE_SEED="zeref-gate-v2-20261023-cycle-81" python scripts/zeref_chat_corpus.py build/zeref-006/dolly.jsonl build/zeref-006/chat-mix.jsonl | cut -c1-200
          off=$(( 50000000 + (44401951155 % 900) * 2000000 ))
          curl -fsSL --retry 3 -r "${off}-$((off+1999999))" -o build/zeref-006/tinystories-range.txt "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/f54c09fd23315a6f9c86f9dc80f725de7d8f9c64/TinyStories-train.txt"
          python scripts/zeref_pretrain_slice.py build/zeref-006/tinystories-range.txt build/zeref-006/pretrain-slice.jsonl "$off"
          m=evidence/zeref-english-001/manifest.json
          commit="$(python -c "import json;print(json.load(open('$m'))['data_branch']['commit'])")"
          curl -fsSL --retry 3 --max-time 180 -o build/zeref-006/english-train.jsonl.gz "https://raw.githubusercontent.com/${{ github.repository }}/${commit}/zeref-english-001/train.jsonl.gz"
          ZEREF_ENGLISH_SHARE=0.5 python scripts/zeref_english_mix.py build/zeref-006/english-train.jsonl.gz "$m" build/zeref-006/pretrain-slice.jsonl "zeref-english-001-cycle-81" build/zeref-006/english-mix.json | cut -c1-200
          curl -fsSL --max-time 60 "https://raw.githubusercontent.com/${{ github.repository }}/zeref-spark/zeref/ticks.jsonl" -o build/zeref-006/spark-ticks.jsonl || : > build/zeref-006/spark-ticks.jsonl
          wc -l build/zeref-006/chat-mix.jsonl build/zeref-006/pretrain-slice.jsonl build/zeref-006/spark-ticks.jsonl
      - name: timing (pure s/attempt, no evals; same runner, configs in sequence)
        if: matrix.part == 'timing'
        run: |
          set -Eeuo pipefail
          run(){ echo "== $*"; env "$@" python -u scripts/zeref_006_clock_bench.py timing 2>&1 | grep -E 'ZEREF_006_BENCH=|ZEREF_006_GRAD_CKPT=|ZEREF_006_LENGTH_GROUPING=|Error|Traceback' ; }
          run ZEREF_006_UPDATES=16 ZEREF_006_GRAD_CKPT_EVERY=1 ZEREF_006_LENGTH_GROUPING=0
          run ZEREF_006_UPDATES=32 ZEREF_006_GRAD_CKPT_EVERY=2 ZEREF_006_LENGTH_GROUPING=1
          run ZEREF_006_UPDATES=32 ZEREF_006_GRAD_CKPT_EVERY=3 ZEREF_006_LENGTH_GROUPING=1
          run ZEREF_006_UPDATES=32 ZEREF_006_GRAD_CKPT_EVERY=1 ZEREF_006_LENGTH_GROUPING=1
          run ZEREF_006_UPDATES=16 ZEREF_006_GRAD_CKPT_EVERY=2 ZEREF_006_LENGTH_GROUPING=0
      - name: worst-case real shape (every row 511 tokens, batch 18) peak RSS
        if: matrix.part == 'worst'
        run: |
          set -Eeuo pipefail
          run(){ echo "== $*"; env "$@" python -u scripts/zeref_006_clock_bench.py worst 2>&1 | grep -E 'ZEREF_006_BENCH=|Error|Traceback|Killed' || true; free -m | sed -n 2p; }
          run ZEREF_006_UPDATES=3 ZEREF_006_GRAD_CKPT_EVERY=1 ZEREF_006_LENGTH_GROUPING=0
          run ZEREF_006_UPDATES=3 ZEREF_006_GRAD_CKPT_EVERY=2 ZEREF_006_LENGTH_GROUPING=1
          run ZEREF_006_UPDATES=3 ZEREF_006_GRAD_CKPT_EVERY=3 ZEREF_006_LENGTH_GROUPING=1
          run ZEREF_006_UPDATES=3 ZEREF_006_GRAD_CKPT_EVERY=1 ZEREF_006_LENGTH_GROUPING=1
          run ZEREF_006_UPDATES=3 ZEREF_006_GRAD_CKPT_EVERY=2 ZEREF_006_LENGTH_GROUPING=0
      - name: full 320-attempt variant, candidate 0 spec and seed of run 44401951155
        if: matrix.part == 'full-c0'
        env: {ZEREF_006_UPDATES: '320', ZEREF_006_GRAD_CKPT_EVERY: '2', ZEREF_006_LENGTH_GROUPING: '1'}
        run: python -u scripts/zeref_006_clock_bench.py full 1006742286215836109 1.0 0.1 2>&1 | grep -E 'ZEREF_006_BENCH=|INCYCLE|GRAD_CKPT|LENGTH_GROUPING|Error|Traceback'
      - name: full 320-attempt variant, candidate 1 spec and seed of run 44401951155
        if: matrix.part == 'full-c1'
        env: {ZEREF_006_UPDATES: '320', ZEREF_006_GRAD_CKPT_EVERY: '2', ZEREF_006_LENGTH_GROUPING: '1'}
        run: python -u scripts/zeref_006_clock_bench.py full 27800372176895 0.6 0.1 2>&1 | grep -E 'ZEREF_006_BENCH=|INCYCLE|GRAD_CKPT|LENGTH_GROUPING|Error|Traceback'
