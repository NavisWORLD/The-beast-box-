name: ZEREF-HEARTBEAT-IBM-STATUS

on:
  push:
    branches:
      - networked-cage-run-001
    paths:
      - ".github/workflows/zeref-heartbeat-ibm-status.yml"
      - "scripts/probe_zeref_heartbeat_ibm_status.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
      IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IBM Runtime client
        run: |
          python -m pip install --upgrade pip
          pip install "qiskit-ibm-runtime~=0.45.1"
      - name: Read current tagged IBM job status
        run: |
          python scripts/probe_zeref_heartbeat_ibm_status.py --out _ibm_status/status.json
      - name: Upload safe status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: zeref-heartbeat-ibm-status-${{ github.run_id }}
          path: _ibm_status/status.json
          if-no-files-found: error
          retention-days: 30
