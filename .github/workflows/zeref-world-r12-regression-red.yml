name: ZEREF WORLD R12 REGRESSION RED

on:
  push:
    branches: [zeref-world-knowledge-r12-train-001]
    paths:
      - '.github/workflows/zeref-world-r12-regression-red.yml'

permissions:
  contents: read

jobs:
  prove-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install -e '.[dev]'
      - name: Capture expected pre-fix failure
        shell: bash
        run: |
          set +e
          mkdir -p _red_evidence
          python -m pytest -q tests/test_world_r12_abstention_regression.py \
            > _red_evidence/pytest-red.log 2>&1
          STATUS=$?
          printf '%s\n' "$STATUS" > _red_evidence/pytest-exit-code.txt
          cat _red_evidence/pytest-red.log
          if [ "$STATUS" -eq 0 ]; then
            echo 'Regression unexpectedly passed before production fix' >&2
            exit 1
          fi
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('_red_evidence')
          receipt={
              'schema':'zeref-world-r12-regression-red-v1',
              'original_run_id':33125920283,
              'original_job_id':98703927258,
              'test':'tests/test_world_r12_abstention_regression.py::test_high_geometry_low_grounding_candidate_must_abstain',
              'expected_pre_fix':'FAIL',
              'observed_exit_code':int((root/'pytest-exit-code.txt').read_text().strip()),
              'production_fix_present':False,
          }
          (root/'RED.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          files=sorted(p for p in root.iterdir() if p.is_file() and p.name!='SHA256SUMS')
          (root/'SHA256SUMS').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files))
          PY
      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-world-r12-regression-red-${{ github.run_id }}
          path: _red_evidence
          if-no-files-found: error
          retention-days: 90
