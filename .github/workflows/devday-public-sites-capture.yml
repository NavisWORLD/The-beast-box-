name: DevDay public sites unauthenticated footage
on:
  pull_request:
    paths:
      - '.github/workflows/devday-public-sites-capture.yml'
      - 'tools/devday/record_public_sites.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: python tools/devday/record_public_sites.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beastbox-sites-public-unauthenticated-proof
          path: public-site-evidence/
          retention-days: 1
          if-no-files-found: warn
