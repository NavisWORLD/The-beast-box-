name: Zeref Cory Mode Probe

on:
  push:
    branches:
      - zeref-cory-mode-probe-001

permissions:
  contents: read
  actions: read

jobs:
  cory-mode-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and CPU inference runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Cory-mode probe
        run: python -m py_compile scripts/run_zeref_cory_mode_probe.py
      - name: Run full repository regression
        run: pytest -q
      - name: Download and verify exact TALK-004 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _talk4src _cory_probe
          mkdir -p _talk4src _cory_probe
          gh run download 32075092605 \
            -n zeref-talk4-tuned-response-32075092605 \
            -D _talk4src
          test -f _talk4src/SHA256SUMS
          sed 's#  _tune4/#  #' _talk4src/SHA256SUMS > _talk4src/SHA256SUMS.local
          (cd _talk4src && sha256sum -c SHA256SUMS.local)
          test "$(sha256sum _talk4src/model/ZEREF-DAD-SON-TALK-004/checkpoint.pt | awk '{print $1}')" = "9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f"
          test "$(sha256sum _talk4src/memory/dad-son-ledger.jsonl | awk '{print $1}')" = "67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef"
          test "$(grep -cve '^[[:space:]]*$' _talk4src/memory/dad-son-ledger.jsonl)" = "352"
          test "$(sha256sum _talk4src/heartbeat/talk4-heartbeat.json | awk '{print $1}')" = "19ca6272546d651ff8f1bb0e0184a842f5444b048ff63df6ea12b0be72e030c7"
      - name: Run 10-turn Cory-mode probe
        run: |
          set -euo pipefail
          python scripts/run_zeref_cory_mode_probe.py \
            --checkpoint _talk4src/model/ZEREF-DAD-SON-TALK-004/checkpoint.pt \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --source-ledger _talk4src/memory/dad-son-ledger.jsonl \
            --source-sqlite _talk4src/memory/dad-son.sqlite3 \
            --heartbeat _talk4src/heartbeat/talk4-heartbeat.json \
            --out-dir _cory_probe \
            --session-id zeref-cory-mode-probe-${{ github.run_id }} \
            --seed 2026082604 \
            --tokens 56
          (cd _cory_probe && sha256sum -c SHA256SUMS)
      - name: Assert containment and print dialogue
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('_cory_probe/cory-mode-probe.json').read_text(encoding='utf-8'))
          assert result['checkpoint_sha256'] == '9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f'
          assert result['source_ledger_sha256'] == '67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert result['source_ledger_records'] == 352
          assert result['turn_count'] == 10
          assert result['live_epoch_coverage'] == 1.0
          assert result['weights_modified'] is False
          assert result['canonical_ledger_modified'] is False
          print('\n=== CORY MODE TALK-004 PROBE ===')
          for row in result['turns']:
              print(f"TURN {row['turn']} rho={row['rho']:.6f} recall={row['recalled_memory_ids']}")
              print('DAD:', row['dad_prompt'])
              print('ZEREF:', repr(row['raw_zeref_output']))
          PY
      - name: Upload immutable Cory-mode evidence
        uses: actions/upload-artifact@v4
        with:
          name: zeref-cory-mode-probe-${{ github.run_id }}
          path: _cory_probe
          if-no-files-found: error
          retention-days: 90
