name: Observe Zeref real-secret broker loop

on:
  push:
    branches:
      - 'agent/zeref-quantum-divergence'
    paths:
      - '.github/workflows/zeref-real-secret-broker-loop-status.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zeref-quantum-divergence
          fetch-depth: 0
      - name: Record latest broker-loop run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/final
          gh run list --workflow zeref-real-secret-broker-loop.yml --branch agent/zeref-quantum-divergence --limit 1 --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt > evidence/final/zeref-real-secret-broker-loop-status.json
          cat evidence/final/zeref-real-secret-broker-loop-status.json
      - name: Commit status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/zeref-quantum-divergence
          git add evidence/final/zeref-real-secret-broker-loop-status.json
          git commit -m "evidence: probe real-secret broker loop status" || true
          git push origin HEAD:agent/zeref-quantum-divergence
