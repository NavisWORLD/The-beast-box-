name: Zeref final spark 001 - one real IBM CHSH job (cap = min(67, remaining-60) s, 60 s reserve), owner-authorized 2026-10-25
# Cory (2026-10-25) asked for one final IBM spark full loop (bb-deada969 only). One job, same referee as heart restart 001 (fresh new tag).
# best calibrated pair). The referee re-checks the plan and fails closed unless remaining >= cap + 60 s. Tag-idempotent.
# Quantum hardware cannot learn text: the result only seeds Zeref's heart seed v7 (batch order).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chsh-game-daily-qpu
  cancel-in-progress: false
jobs:
  heart:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'qiskit-ibm-runtime>=0.45,<0.50' 'qiskit>=2.1,<2.5'
      - name: Read-only quota before + cap
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
        run: |
          python scripts/ibm_open_plan_preflight.py
          cp _ibm_open_plan_preflight/receipt.json quota_before.json
          cap=$(python -c "import json;r=json.load(open('quota_before.json'))['remaining_seconds'];print(max(0,min(67,int(r-60))))")
          echo "SPARK_CAP=$cap"; echo "CAP=$cap" >> "$GITHUB_ENV"
      - name: Real IBM hardware CHSH, one job
        if: env.CAP >= 15
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          BEAST_CHSH_GAME_DAILY: YES_SECOND_COMING_ONCE
          CHSH_GAME_ROUNDS: '30000'
          CHSH_BEST_PAIR: '1'
          CHSH_RUN_TAG: navisworld-zeref-final-spark-001
          CHSH_GAME_OUT: _final
        run: CHSH_QPU_CAP=$CAP python scripts/chsh_game/referee.py
      - name: Read-only quota after
        if: always()
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
        run: python scripts/ibm_open_plan_preflight.py || true
      - name: Public summary
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('_final/chsh_game_result.json')
          if r.exists():
            d=json.loads(r.read_text());print('SPARK_JOB='+json.dumps({k:d.get(k) for k in ('job_id','backend','quantum_seconds','job_tag','outcomes_sha256')}|{'win_rate':d['quantum']['win_rate'],'se':d['quantum']['standard_error']}))
          q=pathlib.Path('_ibm_open_plan_preflight/receipt.json')
          if q.exists():print('QUOTA_AFTER='+q.read_text().replace('\n',' '))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeref-final-spark-001-${{ github.run_id }}
          path: |
            _final/
            quota_before.json
            _ibm_open_plan_preflight/receipt.json
          retention-days: 90
          if-no-files-found: ignore
