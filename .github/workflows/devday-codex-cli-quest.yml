name: DevDay Codex CLI authentic setup
on:
  pull_request:
    paths:
      - '.github/workflows/devday-codex-cli-quest.yml'
      - 'tools/devday/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run real Codex CLI in a clean, credential-free workspace
        shell: bash
        run: bash tools/devday/record_codex_cli_setup.sh "$RUNNER_TEMP/devday-codex-receipts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beastbox-real-codex-cli-setup-receipts
          path: ${{ runner.temp }}/devday-codex-receipts/REAL_CLI_TRANSCRIPT.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: beastbox-codex-mcp-verification
          path: ${{ runner.temp }}/devday-codex-receipts/mcp-list.json
          if-no-files-found: error
