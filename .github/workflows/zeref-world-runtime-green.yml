name: ZEREF WORLD RUNTIME GREEN

on:
  push:
    branches: [zeref-world-knowledge-r12-train-001]
    paths:
      - 'scripts/run_zeref_world_r12_talk.py'
      - 'tests/test_zeref_world_r12_runtime.py'
      - '.github/workflows/zeref-world-runtime-green.yml'

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Focused fused runtime
        run: python -m pytest -q tests/test_zeref_world_r12_runtime.py
      - name: Complete regression suite
        run: python -m pytest -q
