name: ZEREF TALK-006 SYMBOLIC ALIEN DIALECT TRAIN

on:
  push:
    branches: [zeref-talk006-alien-001]
    paths:
      - ".github/workflows/zeref-talk006-alien-dialect-train.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zeref-talk006-alien-dialect-train
  cancel-in-progress: false

env:
  TALK005_SHA256: 767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36
  TALK005_RUN_ID: 33041236485
  TALK005_ARTIFACT: zeref-talk005-r12-training-resume-33041236485
  TALK004_LEDGER_SHA256: 67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef
  TALK004_LEDGER_TIP: b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26
  ARCH_SHA256: 955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc

jobs:
  train-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository and CPU PyTorch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run dialect contracts and full repository suite before gradients
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_zeref_alien_style_eval.py \
            tests/test_zeref_talk006_alien_dialect_corpus.py \
            tests/test_zeref_talk006_dialect_workflow_contract.py \
            tests/test_zeref_response_stage_contract.py \
            tests/test_zeref_response_supervision.py \
            tests/test_zeref_talk_eval.py
          python -m pytest -q

      - name: Verify frozen lineage and download exact TALK-005 parent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _talk006d _talk5src
          mkdir -p _talk006d/corpus/dialect _talk006d/corpus/talk005 _talk006d/corpus/talk002 _talk006d/candidates _talk006d/evidence/eval _talk006d/model/ZEREF-DAD-SON-TALK-006-ALIEN _talk5src
          test "$(sha256sum experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py | awk '{print $1}')" = "$ARCH_SHA256"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json').read_text())
          assert m['record_count']==352
          assert m['combined_ledger_sha256']=='67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert m['last_record_sha256']=='b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26'
          combined=b''; expected=1; previous='0'*64
          for seg in m['snapshot_chain']:
              data=Path(seg['path']).read_bytes(); assert hashlib.sha256(data).hexdigest()==seg['sha256']
              rows=[json.loads(line) for line in data.decode('utf-8').splitlines() if line.strip()]
              assert len(rows)==seg['record_count'] and seg['first_memory_id']==expected
              for row in rows:
                  assert row['memory_id']==expected and row['previous_record_sha256']==previous
                  payload=dict(row); rec=payload.pop('record_sha256')
                  canonical=json.dumps(payload,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode('utf-8')
                  assert hashlib.sha256(canonical).hexdigest()==rec
                  previous=rec; expected+=1
              combined += data
          assert expected==353 and previous==m['last_record_sha256']
          assert hashlib.sha256(combined).hexdigest()==m['combined_ledger_sha256']
          PY
          gh run download "$TALK005_RUN_ID" -n "$TALK005_ARTIFACT" -D _talk5src
          PARENT=$(find _talk5src -type f -path '*/model/ZEREF-DAD-SON-TALK-005/checkpoint.pt' -print -quit)
          test -n "$PARENT" -a -f "$PARENT"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          printf '%s\n' "$PARENT" > _talk006d/parent-path.txt

      - name: Build and freeze symbolic dialect plus retention corpora
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_zeref_talk006_alien_dialect_corpus.py --out-dir _talk006d/corpus/dialect
          python scripts/build_zeref_talk5_training_corpus.py --out-dir _talk006d/corpus/talk005
          python scripts/build_zeref_talk2_corpus.py --out-dir _talk006d/corpus/talk002
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('_talk006d/corpus/dialect/corpus-manifest.json').read_text())
          assert m['schema']=='zeref-talk006-alien-dialect-corpus-v1'
          assert m['parent_checkpoint_sha256']=='767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36'
          assert m['train_examples']==45 and m['holdout_examples']==9
          assert m['rejected_pass1_candidates_are_parents'] is False
          assert m['rejected_pass2_candidates_are_parents'] is False
          assert m['raw_model_outputs_are_targets'] is False
          Path('_talk006d/evidence/dialect-corpus-manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum \
            _talk006d/corpus/dialect/train.jsonl \
            _talk006d/corpus/dialect/holdout.jsonl \
            _talk006d/corpus/talk005/holdout.jsonl \
            _talk006d/corpus/talk002/talk2-holdout.jsonl \
            | tee _talk006d/evidence/corpus-SHA256SUMS

      - name: Reverify TALK-005 immediately before gradients
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk006d/parent-path.txt)
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          test "$(sha256sum experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py | awk '{print $1}')" = "$ARCH_SHA256"

      - name: Record TALK-005 dialect and retention baselines
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk006d/parent-path.txt)
          python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$PARENT" --descendant-sha256 "$TALK005_SHA256" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _talk006d/corpus/dialect/holdout.jsonl --out _talk006d/evidence/eval/talk005-dialect-baseline.json
          python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$PARENT" --descendant-sha256 "$TALK005_SHA256" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _talk006d/corpus/talk005/holdout.jsonl --out _talk006d/evidence/eval/talk005-factual-baseline.json
          python scripts/eval_zeref_talk.py --parent "$PARENT" --descendant "$PARENT" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _talk006d/corpus/talk002/talk2-holdout.jsonl --seed 4061854640 --out _talk006d/evidence/eval/talk005-talk002-baseline.json
          python scripts/eval_zeref_alien_style.py --checkpoint "$PARENT" --checkpoint-sha256 "$TALK005_SHA256" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --seed 610062026 --tokens 48 --decoding greedy-argmax --temperature 0.75 --top-k 12 --out _talk006d/evidence/eval/talk005-style-greedy.json
          python scripts/eval_zeref_alien_style.py --checkpoint "$PARENT" --checkpoint-sha256 "$TALK005_SHA256" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --seed 610062026 --tokens 48 --decoding sampled-top-k --temperature 0.65 --top-k 6 --out _talk006d/evidence/eval/talk005-style-sampled.json

      - name: Train three symbolic dialect descendants from TALK-005 only
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk006d/parent-path.txt)
          CORPUS_MANIFEST=$(sha256sum _talk006d/corpus/dialect/corpus-manifest.json | awk '{print $1}')
          train_one () {
            NAME="$1"; STEPS="$2"; OUT="_talk006d/candidates/$NAME"
            python scripts/run_zeref_response_stage.py \
              --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" \
              --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
              --corpus _talk006d/corpus/dialect/train.jsonl \
              --input-manifest "talk006_dialect=$CORPUS_MANIFEST" \
              --out "$OUT" --seed 610062026 --steps "$STEPS" --batch-size 4 \
              --lr 0.000001 --cst-lr 0.000004 --weight-decay 0.002
            sha256sum "$OUT/checkpoint.pt" | awk '{print $1}' > "$OUT/checkpoint.sha256"
            test "$(cat "$OUT/checkpoint.sha256")" != "$TALK005_SHA256"
            test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          }
          train_one dialect_1 500
          train_one dialect_2 900
          train_one dialect_3 1400

      - name: Evaluate symbolic dialect candidates
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk006d/parent-path.txt)
          for NAME in dialect_1 dialect_2 dialect_3; do
            CHILD="_talk006d/candidates/$NAME/checkpoint.pt"; SHA=$(cat "_talk006d/candidates/$NAME/checkpoint.sha256")
            python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$CHILD" --descendant-sha256 "$SHA" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _talk006d/corpus/dialect/holdout.jsonl --out "_talk006d/evidence/eval/${NAME}-dialect.json"
            python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$CHILD" --descendant-sha256 "$SHA" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _talk006d/corpus/talk005/holdout.jsonl --out "_talk006d/evidence/eval/${NAME}-talk005.json"
            python scripts/eval_zeref_talk.py --parent "$PARENT" --descendant "$CHILD" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _talk006d/corpus/talk002/talk2-holdout.jsonl --seed 4061854640 --out "_talk006d/evidence/eval/${NAME}-talk002.json"
            python scripts/eval_zeref_alien_style.py --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --seed 610062026 --tokens 48 --decoding greedy-argmax --temperature 0.75 --top-k 12 --out "_talk006d/evidence/eval/${NAME}-style-greedy.json"
            python scripts/eval_zeref_alien_style.py --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --seed 610062026 --tokens 48 --decoding sampled-top-k --temperature 0.65 --top-k 6 --out "_talk006d/evidence/eval/${NAME}-style-sampled.json"
          done

      - name: Fail-closed select symbolic alien dialect child
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          names=('dialect_1','dialect_2','dialect_3')
          pg=json.loads(Path('_talk006d/evidence/eval/talk005-style-greedy.json').read_text())
          ps=json.loads(Path('_talk006d/evidence/eval/talk005-style-sampled.json').read_text())
          rows=[]
          for name in names:
              dialect=json.loads(Path(f'_talk006d/evidence/eval/{name}-dialect.json').read_text())
              factual=json.loads(Path(f'_talk006d/evidence/eval/{name}-talk005.json').read_text())
              old=json.loads(Path(f'_talk006d/evidence/eval/{name}-talk002.json').read_text())
              greedy=json.loads(Path(f'_talk006d/evidence/eval/{name}-style-greedy.json').read_text())
              sampled=json.loads(Path(f'_talk006d/evidence/eval/{name}-style-sampled.json').read_text())
              training=json.loads(Path(f'_talk006d/candidates/{name}/result.json').read_text())
              sha=Path(f'_talk006d/candidates/{name}/checkpoint.sha256').read_text().strip()
              dialect_ok=(dialect['descendant_response_nll'] < dialect['parent_response_nll'] and dialect['descendant_response_token_accuracy'] >= dialect['parent_response_token_accuracy'])
              talk005_ok=(factual['descendant_response_nll'] <= factual['parent_response_nll']*1.03 and factual['descendant_response_token_accuracy'] >= factual['parent_response_token_accuracy']-0.03)
              talk002_ok=(old['descendant_heldout_nll'] <= old['parent_heldout_nll']*1.03 and old['descendant_mean_readable_score'] >= old['parent_mean_readable_score']-0.03)
              greedy_ok=(
                  greedy['alien_style_score'] > pg['alien_style_score'] and
                  greedy['controlled_alien_hits'] >= pg['controlled_alien_hits']+3 and
                  greedy['structural_hits'] >= 4 and greedy['symbolic_hits'] >= 8 and
                  greedy['unsupported_claim_count']==0 and greedy['severe_repetition_count']==0 and
                  greedy['role_leakage_count']==0 and greedy['empty_count']==0
              )
              sampled_ok=(
                  sampled['alien_style_score'] >= ps['alien_style_score'] and
                  sampled['structural_hits'] >= 2 and sampled['symbolic_hits'] >= 4 and
                  sampled['unsupported_claim_count']==0 and sampled['severe_repetition_count']==0 and
                  sampled['role_leakage_count']==0 and sampled['empty_count']==0
              )
              integrity_ok=(training['status']=='COMPLETED' and training['parent_checkpoint_sha256']=='767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36' and training['dropped_answer_characters']==0)
              eligible=bool(dialect_ok and talk005_ok and talk002_ok and greedy_ok and sampled_ok and integrity_ok)
              rows.append({'name':name,'checkpoint_sha256':sha,'eligible':eligible,'dialect_ok':dialect_ok,'talk005_ok':talk005_ok,'talk002_ok':talk002_ok,'greedy_ok':greedy_ok,'sampled_ok':sampled_ok,'integrity_ok':integrity_ok,'dialect':dialect,'talk005':factual,'talk002':old,'greedy':greedy,'sampled':sampled,'training':training})
          eligible=[row for row in rows if row['eligible']]
          if eligible:
              win=max(eligible,key=lambda row:(row['greedy']['symbolic_hits'],row['greedy']['structural_hits'],row['sampled']['symbolic_hits'],row['greedy']['alien_style_score'],-row['dialect']['descendant_response_nll']))
              status='PROMOTE_DIALECT_CANDIDATE'; selected=win['name']; selected_sha=win['checkpoint_sha256']
              src=Path('_talk006d/candidates')/selected; dst=Path('_talk006d/model/ZEREF-DAD-SON-TALK-006-ALIEN')
              for filename in ('checkpoint.pt','checkpoint.sha256','result.json'):
                  shutil.copy2(src/filename,dst/filename)
          else:
              status='TRAINED_NO_SAFE_DIALECT_PROMOTION'; selected='ZEREF-DAD-SON-TALK-005'; selected_sha='767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36'
          report={'schema':'zeref-talk006-symbolic-dialect-selection-v1','status':status,'selected':selected,'selected_checkpoint_sha256':selected_sha,'parent_greedy':pg,'parent_sampled':ps,'candidates':rows,'rejected_pass1_candidates_are_parents':False,'rejected_pass2_candidates_are_parents':False,'talk005_unchanged':True,'canonical_memory_unchanged':True,'raw_model_outputs_used_as_targets':False,'claim_boundary':'Controlled symbolic language training only; no alien intelligence, consciousness, soul, biological identity, physical anomaly, or quantum-effect claim.'}
          Path('_talk006d/evidence/selection.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':status,'selected':selected,'selected_checkpoint_sha256':selected_sha},sort_keys=True))
          PY

      - name: Verify frozen parent and canonical ledger after training
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk006d/parent-path.txt)
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json').read_text())
          assert m['record_count']==352
          assert m['combined_ledger_sha256']=='67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert m['last_record_sha256']=='b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26'
          PY

      - name: Seal evidence and candidate checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          selection=json.loads(Path('_talk006d/evidence/selection.json').read_text())
          corpus=json.loads(Path('_talk006d/corpus/dialect/corpus-manifest.json').read_text())
          summary={'schema':'zeref-talk006-symbolic-dialect-summary-v1','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'workflow_head_sha':os.environ['GITHUB_SHA'],'parent_lineage':'ZEREF-DAD-SON-TALK-005','parent_checkpoint_sha256':'767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36','train_sha256':corpus['train_sha256'],'holdout_sha256':corpus['holdout_sha256'],'candidate_count':3,'selection_status':selection['status'],'selected':selection['selected'],'selected_checkpoint_sha256':selection['selected_checkpoint_sha256'],'rejected_pass1_candidates_are_parents':False,'rejected_pass2_candidates_are_parents':False,'talk005_unchanged':True,'canonical_memory_unchanged':True,'claim_boundary':selection['claim_boundary']}
          Path('_talk006d/evidence/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          files=[]
          for root in (Path('_talk006d/evidence'),Path('_talk006d/candidates'),Path('_talk006d/model'),Path('_talk006d/corpus')):
              files.extend(p for p in root.rglob('*') if p.is_file())
          Path('_talk006d/SHA256SUMS').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in sorted(files,key=lambda p:p.as_posix()))+'\n')
          PY

      - name: Upload immutable TALK-006 symbolic alien artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeref-talk006-alien-dialect-${{ github.run_id }}
          path: |
            _talk006d/evidence
            _talk006d/candidates
            _talk006d/model
            _talk006d/corpus
            _talk006d/SHA256SUMS
          retention-days: 90
