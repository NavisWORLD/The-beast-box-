name: Cosmic Cypher smoke

on:
  push:
    paths:
      - 'beastbox/cypher/**'
      - 'beastbox/runtime.py'
      - 'pyproject.toml'
      - 'tests/test_cypher.py'
      - '.github/workflows/cypher-smoke.yml'
  pull_request:
    paths:
      - 'beastbox/cypher/**'
      - 'beastbox/runtime.py'
      - 'pyproject.toml'
      - 'tests/test_cypher.py'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: cosmic.cypher-cli --help
      - run: cosmic-cypher --help
      - run: cypher --help
      - run: pytest -q tests/test_cypher.py
