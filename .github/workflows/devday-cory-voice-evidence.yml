name: DevDay Cory voiceover evidence
on:
  pull_request:
    paths:
      - '.github/workflows/devday-cory-voice-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve user-requested HeyGen narration (no model credentials)
        run: |
          mkdir -p evidence
          curl --fail --show-error --silent --location --retry 2 --max-time 80 --output evidence/cory-devday-voiceover.wav 'https://resource2.heygen.ai/text_to_speech/9403409b8fab4d52a22cc5e32124a934/de3911a4020c464886cf529e2afd1779/id=14f20397-9152-48fd-a1b2-448a1d95ccc2.wav'
          test -s evidence/cory-devday-voiceover.wav
          file evidence/cory-devday-voiceover.wav
          ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 evidence/cory-devday-voiceover.wav | awk '{if ($1<15 || $1>30) exit 1; printf("VERIFIED user-requested voice narration: %.2f seconds\n",$1)}'
      - uses: actions/upload-artifact@v4
        with:
          name: devday-cory-voiceover-temporary
          path: evidence/cory-devday-voiceover.wav
          retention-days: 1
          if-no-files-found: error
