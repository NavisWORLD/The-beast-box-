# Zeref browser brain export refresh (automated, gated by PR).
#
# Re-exports the PINNED checkpoint to the ONNX step graph on a GitHub runner and
# opens a PR with the refreshed evidence. The export must run on a runner, not
# on a local box: it loads the full checkpoint and the repo's model code, which
# is heavy compute this repo already does on runners.
#
# The chain (NEW BRAIN ALWAYS: the page must never sit behind the live pin):
#   promotion merge changes the pin file on main -> this workflow fires ->
#   it re-exports from the new pin, verifies 9/9 parity + contract tests, and
#   opens a PR with the refreshed manifest + test prefix + README -> Emeth
#   verifies parity + tests and merges (THE GATE: the refreshed manifest still
#   lands via a reviewed PR, like #1016 did; nothing auto-commits a new brain
#   straight to main) -> the release workflow fires on the manifest merge ->
#   the place workflow picks it up on its schedule.
#
# What it does, in order, failing closed at every step (a failure anywhere
# opens nothing and leaves main untouched):
#   1. Read the pin from main and the landed manifest. If the pin has not
#      moved past the landed manifest, exit quietly: nothing new to export.
#      (A rollback to a lower step also exits quietly here; a human can
#      dispatch manually if a rollback ever needs exporting.)
#   2. Download the pinned release tarball and verify its sha256 against the
#      pin's release_asset_sha256. Extract accepted-checkpoint/.
#   3. Run scripts/zeref_onnx_export.py (exits 1 unless ONNX-vs-torch greedy
#      parity is 9/9 on the slimmed graph).
#   4. Update the contract test's checkpoint values and the evidence README to
#      the exported pin (each replacement asserted exactly once, values parsed
#      out of the files themselves, never hardcoded), then run the 3 contract
#      tests.
#   5. Commit manifest.json + test + README to a new branch
#      zeref/browser-brain-export-<step> and open a PR to main (no [skip ci]:
#      the PR's CI is part of the gate). The ONNX chunks, parity-reference.json
#      and tokenizer.json are NOT committed here: the chunks ship to the
#      NavisWORLD repo's docs/zeref-brain/ via the release, and ~97 MB of
#      binaries do not belong in this repo's permanent history. They are
#      uploaded as run artifacts instead, with their shas in the manifest.
#   6. Upload the full export receipt as an artifact (manifest, parity
#      reference, tokenizer, chunks, export log).
#
# Triggers: push to main touching the pin file (a promotion merge), push
# touching this file itself, or manual workflow_dispatch. (workflow_dispatch
# alone cannot run a workflow that exists only on a feature branch: GitHub's
# workflow index is built from the default branch, so dispatch by filename
# 404s until this file reaches main. NOTE: do not put [skip ci] on the push
# that lands this file, or the push trigger is skipped too and nothing runs.)
name: Zeref browser brain export refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/beastbox-cloud/lib/rawrphos-public-pin.json
      - .github/workflows/zeref-browser-brain-export.yml

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: zeref-browser-brain-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the pin moved past the landed manifest
        id: check
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os
          pin = json.load(open("apps/beastbox-cloud/lib/rawrphos-public-pin.json"))
          man = json.load(open("evidence/zeref-browser-brain-001/manifest.json"))
          print("pin:", pin["training_steps"], pin["checkpoint_sha256"][:12], pin["promotion"]["release_tag"])
          print("landed manifest:", man["provenance"]["training_steps"], man["provenance"]["checkpoint_sha256"][:12])
          needed = pin["training_steps"] > man["provenance"]["training_steps"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"export_needed={'true' if needed else 'false'}\n")
              f.write(f"pin_step={pin['training_steps']}\n")
          print("export needed:", needed)
          PY
      - name: Install runtime (CPU torch, repo, onnx stack)
        if: steps.check.outputs.export_needed == 'true'
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -e . -e ./models/rawrphos
          pip install onnx onnxruntime onnxslim pytest
      - name: Download pinned checkpoint release (sha-verified)
        if: steps.check.outputs.export_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG=$(python -c "import json; print(json.load(open('apps/beastbox-cloud/lib/rawrphos-public-pin.json'))['promotion']['release_tag'])")
          EXPECTED=$(python -c "import json; print(json.load(open('apps/beastbox-cloud/lib/rawrphos-public-pin.json'))['promotion']['release_asset_sha256'])")
          echo "tag=$TAG expected=$EXPECTED"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.tar.gz' -D build/export
          FILE=$(ls build/export/*.tar.gz)
          ACTUAL=$(sha256sum "$FILE" | cut -d' ' -f1)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "sha mismatch: $ACTUAL != $EXPECTED"; exit 1; }
          echo "tarball sha OK: $ACTUAL"
          tar -xzf "$FILE" -C build/export
          [ -f build/export/accepted-checkpoint/tokenizer/tokenizer.json ] || { echo "checkpoint layout unexpected"; exit 1; }
      - name: Export pinned checkpoint to ONNX (fails unless 9/9 parity)
        if: steps.check.outputs.export_needed == 'true'
        run: |
          set -Eeuo pipefail
          python scripts/zeref_onnx_export.py --checkpoint build/export/accepted-checkpoint --out evidence/zeref-browser-brain-001 | tee build/export/export.log
          python -c "import json; m=json.load(open('evidence/zeref-browser-brain-001/manifest.json')); print('manifest:', m['provenance']['training_steps'], m['provenance']['checkpoint_sha256'][:12], m['provenance']['release_tag'], 'parity', m['parity']['onnxruntime_python_vs_torch_greedy'])"
      - name: Update test values + README to the exported pin
        if: steps.check.outputs.export_needed == 'true'
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, re
          from datetime import date
          from pathlib import Path
          man = json.load(open("evidence/zeref-browser-brain-001/manifest.json"))
          p = man["provenance"]
          steps, sha12, tag = p["training_steps"], p["checkpoint_sha256"][:12], p["release_tag"]
          print("exported pin:", steps, sha12, tag)
          test = Path("tests/test_zeref_onnx_export_contract.py")
          t = test.read_text(encoding="utf-8")
          t, n1 = re.subn(r'p\["training_steps"\] == \d+', f'p["training_steps"] == {steps}', t)
          t, n2 = re.subn(r'p\["checkpoint_sha256"\]\.startswith\("[0-9a-f]{12}"\)', f'p["checkpoint_sha256"].startswith("{sha12}")', t)
          t, n3 = re.subn(r'p\["release_tag"\] == "zeref-006-cycle-\d+-[0-9a-f]{12}"', f'p["release_tag"] == "{tag}"', t)
          assert (n1, n2, n3) == (1, 1, 1), f"test replacements: steps={n1} sha={n2} tag={n3} (expected 1,1,1)"
          test.write_text(t, encoding="utf-8")
          readme = Path("evidence/zeref-browser-brain-001/README.md")
          t = readme.read_text(encoding="utf-8")
          t, n = re.subn(r"export record \(\d{4}-\d{2}-\d{2}\)", f"export record ({date.today().isoformat()})", t)
          assert n == 1, f"README date: found {n}"
          t, n2 = re.subn("step \\d+, sha256 [0-9a-f]{12}\u2026, release zeref-006-cycle-\\d+-[0-9a-f]{12}",
                          f"step {steps}, sha256 {sha12}\u2026, release {tag}", t)
          assert n2 == 1, f"README source line: found {n2}"
          readme.write_text(t, encoding="utf-8")
          print("test + README updated to the exported pin")
          PY
      - name: Contract tests (3)
        if: steps.check.outputs.export_needed == 'true'
        run: |
          set -Eeuo pipefail
          python -m pytest tests/test_zeref_onnx_export_contract.py -q
      - name: Stamp the ledger into the manifest (PR 1, world stack)
        # Syncs classification + ledger_accounting (S_lived from the pin's
        # promotion.ledger_accounting, counted at promote time on the box;
        # S_taught counted live from dialogue.jsonl in this checkout;
        # R_pin from the pin file) + ledger_sha256 into the manifest, so the
        # exported brain carries its ledger. The sandbox chain lives on the
        # zeref/world-sandbox-log branch, not in this checkout: fetch it
        # (tolerate 404 — the branch does not exist until the first tick
        # run lands it) and pass it when present so S_world_ticks and the
        # chain tail are stamped too; otherwise they stay null, labelled,
        # never invented. Runs AFTER the contract tests (the manifest must
        # pass contract before it is stamped) and BEFORE the commit step
        # (the stamped manifest is what the PR carries).
        if: steps.check.outputs.export_needed == 'true'
        run: |
          set -Eeuo pipefail
          CHAIN_ARG=""
          if curl -fsSL --max-time 60 -o /tmp/world_chain.jsonl \
              "https://raw.githubusercontent.com/NavisWORLD/The-beast-box-/zeref/world-sandbox-log/evidence/zeref-world-sandbox/world_chain.jsonl"; then
            CHAIN_ARG="--world-chain /tmp/world_chain.jsonl"
            echo "sandbox chain fetched; stamping S_world_ticks + tail"
          else
            echo "no sandbox chain yet (branch absent or fetch failed); stamping ledger without world fields"
          fi
          python3 scripts/zeref_ledger_guard.py sync-manifest \
            --manifest evidence/zeref-browser-brain-001/manifest.json \
            --pin apps/beastbox-cloud/lib/rawrphos-public-pin.json \
            --root . $CHAIN_ARG
      - name: Commit refreshed evidence and open the PR (the gate)
        if: steps.check.outputs.export_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ZEREF_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name 'zeref-browser-brain-export[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/zeref-browser-brain-001/manifest.json tests/test_zeref_onnx_export_contract.py evidence/zeref-browser-brain-001/README.md
          git status --porcelain | tee build/export/status.txt
          [ -n "$(git status --porcelain)" ] || { echo "nothing changed; refusing empty commit"; exit 1; }
          STEPS=$(python -c "import json; print(json.load(open('evidence/zeref-browser-brain-001/manifest.json'))['provenance']['training_steps'])")
          TAG=$(python -c "import json; print(json.load(open('evidence/zeref-browser-brain-001/manifest.json'))['provenance']['release_tag'])")
          BRANCH="zeref/browser-brain-export-$STEPS"
          git fetch origin "$BRANCH" 2>/dev/null || true
          git checkout -B "$BRANCH"
          git commit -q -m "zeref browser brain: re-export from pin step $STEPS ($TAG)"
          for i in 1 2 3; do git push -q origin "$BRANCH" && break; sleep 5; git pull -q --rebase origin "$BRANCH" || true; done
          [ "$(git rev-parse HEAD)" = "$(git ls-remote origin "$BRANCH" | cut -f1)" ] || { echo "push failed after retries"; exit 1; }
          if [ "$(gh pr list --head "$BRANCH" --json number --jq 'length')" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Zeref browser brain: re-export from pin step $STEPS" \
              --body "Automated refresh from pin step $STEPS ($TAG). Export proved 9/9 parity and the 3 contract tests passed on the runner. The refreshed manifest lands via this reviewed PR (the gate); the release + place stages run automatically after the merge. Do not merge until the board is green."
          else
            echo "PR for $BRANCH already exists:"
            gh pr list --head "$BRANCH" --json number,url --jq '.[0] | "\(.number) \(.url)"'
          fi
      - name: Receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-browser-brain-export-${{ github.run_id }}
          path: |
            evidence/zeref-browser-brain-001/manifest.json
            evidence/zeref-browser-brain-001/parity-reference.json
            evidence/zeref-browser-brain-001/tokenizer.json
            evidence/zeref-browser-brain-001/zeref-step.onnx.part*
            build/export/export.log
            build/export/status.txt
          if-no-files-found: ignore
          retention-days: 90
      - name: Summary
        if: always()
        run: |
          {
            echo "### Zeref browser brain export refresh"
            echo
            python -c "import json; m=json.load(open('evidence/zeref-browser-brain-001/manifest.json')); p=m['provenance']; print(f\"pin step {p['training_steps']}, checkpoint {p['checkpoint_sha256'][:12]}, release {p['release_tag']}\"); print(f\"onnx {m['onnx']['sha256'][:12]}, {m['onnx']['bytes']} bytes, {len(m['onnx']['chunks'])} chunks, parity {m['parity']['onnxruntime_python_vs_torch_greedy']}\")" 2>/dev/null || echo "export did not complete"
          } >> "$GITHUB_STEP_SUMMARY"

