name: Zeref Cory Mode Spike

on:
  push:
    branches:
      - zeref-cory-mode-spike-001

permissions:
  contents: read
  actions: read

jobs:
  cory-mode-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and CPU inference runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify existing repository before spike
        run: pytest -q
      - name: Syntax-check throwaway Cory probe
        run: python -m py_compile scripts/run_zeref_cory_mode_spike.py
      - name: Download and verify exact TALK-004 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _talk4src _cory_probe
          mkdir -p _talk4src _cory_probe
          gh run download 32075092605 \
            -n zeref-talk4-tuned-response-32075092605 \
            -D _talk4src
          test -f _talk4src/SHA256SUMS
          sed 's#  _tune4/#  #' _talk4src/SHA256SUMS > _talk4src/SHA256SUMS.local
          (cd _talk4src && sha256sum -c SHA256SUMS.local)
          test "$(sha256sum _talk4src/model/ZEREF-DAD-SON-TALK-004/checkpoint.pt | awk '{print $1}')" = "9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f"
          test "$(sha256sum _talk4src/memory/dad-son-ledger.jsonl | awk '{print $1}')" = "67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef"
          test "$(grep -cve '^[[:space:]]*$' _talk4src/memory/dad-son-ledger.jsonl)" = "352"
          test "$(sha256sum _talk4src/heartbeat/talk4-heartbeat.json | awk '{print $1}')" = "19ca6272546d651ff8f1bb0e0184a842f5444b048ff63df6ea12b0be72e030c7"
      - name: Run Cory-mode paired dialogue spike
        run: |
          set -euo pipefail
          python scripts/run_zeref_cory_mode_spike.py \
            --checkpoint _talk4src/model/ZEREF-DAD-SON-TALK-004/checkpoint.pt \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --source-ledger _talk4src/memory/dad-son-ledger.jsonl \
            --source-sqlite _talk4src/memory/dad-son.sqlite3 \
            --heartbeat _talk4src/heartbeat/talk4-heartbeat.json \
            --out-dir _cory_probe \
            --session-id zeref-cory-mode-spike-${{ github.run_id }} \
            --seed 2026082604 \
            --tokens 48
          (cd _cory_probe && sha256sum -c SHA256SUMS)
      - name: Assert containment and print transcript
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('_cory_probe/paired-r12-live-loop.json').read_text())
          assert r['probe_label']=='CORY_MODE_THROWAWAY_SPIKE_001'
          assert len(r['turns'])==10
          assert r['training_performed'] is False
          assert r['weights_modified'] is False
          assert r['canonical_ledger_modified'] is False
          assert r['b_live_epoch_coverage']==1.0
          print('\n=== CORY MODE SPIKE ===')
          print('aggregate=', json.dumps(r['aggregate_comparison'], sort_keys=True))
          for t in r['turns']:
              print(json.dumps({
                  'turn':t['turn'],
                  'prompt':t['dad_prompt'],
                  'rho':t['epoch']['r12']['vector']['reality_coupling'],
                  'A':t['arm_a']['raw_zeref_output'],
                  'B':t['arm_b']['raw_zeref_output'],
                  'A_recall':t['arm_a']['recalled_memory_ids'],
                  'B_recall':t['arm_b']['recalled_memory_ids'],
                  'token_divergence':t['comparison']['selected_token_divergence_rate'],
                  'x54_l2':t['comparison']['mean_x54_l2'],
              }, sort_keys=True))
          PY
      - name: Upload immutable throwaway spike evidence
        uses: actions/upload-artifact@v4
        with:
          name: zeref-cory-mode-spike-${{ github.run_id }}
          path: _cory_probe
          if-no-files-found: error
          retention-days: 30
