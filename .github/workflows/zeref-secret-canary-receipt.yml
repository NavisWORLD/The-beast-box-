name: Harvest secret-canary receipt

on:
  push:
    branches:
      - 'agent/zeref-quantum-divergence'
    paths:
      - '.github/workflows/zeref-secret-canary-receipt.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zeref-quantum-divergence
          fetch-depth: 0

      - name: Find completed secret-canary run and download artifact
        id: harvest
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          for i in $(seq 1 36); do
            candidate=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow zeref-secret-canary.yml \
              --branch agent/zeref-quantum-divergence \
              --limit 5 \
              --json databaseId,status,conclusion,createdAt \
              --jq '[.[] | select(.status == "completed")][0].databaseId // empty')
            if [ -n "$candidate" ]; then
              RUN_ID="$candidate"
              break
            fi
            sleep 5
          done
          test -n "$RUN_ID"
          conclusion=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
          test "$conclusion" = "success"
          mkdir -p /tmp/secret-canary-artifact
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "zeref-secret-canary-$RUN_ID" \
            --dir /tmp/secret-canary-artifact
          artifact_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[0]')
          artifact_id=$(printf '%s' "$artifact_json" | jq -r '.id')
          artifact_digest=$(printf '%s' "$artifact_json" | jq -r '.digest')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Validate and commit sanitized receipt
        env:
          RUN_ID: ${{ steps.harvest.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.harvest.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.harvest.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          artifact = Path('/tmp/secret-canary-artifact')
          summary_path = artifact / 'evidence/zeref-secret-canary/summary.json'
          manifest_path = artifact / 'evidence/zeref-secret-canary/manifest.json'
          bundle_sha_path = artifact / 'zeref-secret-canary-evidence.sha256'
          summary = json.loads(summary_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          assert summary['schema'] == 'zeref.secret-canary-gauntlet.v1'
          assert summary['total_decisions'] == 512
          assert summary['real_boundary_breaches'] == 0
          assert summary['real_secret_used'] is False
          assert summary['plain_canary_persisted'] is False
          assert manifest['hard_containment'] is True
          assert manifest['real_secret_used'] is False

          combined = summary_path.read_text() + '\n' + manifest_path.read_text()
          assert not re.search(r'DECOY-K-[A-F0-9]{16}', combined)

          bundle_sha = bundle_sha_path.read_text().split()[0]
          receipt = {
              'schema': 'zeref.secret-canary-receipt.v1',
              'github_run_id': int(os.environ['RUN_ID']),
              'artifact_id': int(os.environ['ARTIFACT_ID']),
              'artifact_digest': os.environ['ARTIFACT_DIGEST'],
              'bundle_sha256': bundle_sha,
              'passed': True,
              'real_secret_used': False,
              'plain_canary_persisted': False,
              'real_boundary_breaches': 0,
          }
          out = Path('evidence/final')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'zeref-secret-canary-latest.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          (out / 'zeref-secret-canary-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          (out / 'zeref-secret-canary-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/zeref-quantum-divergence
          git rebase origin/agent/zeref-quantum-divergence
          git add evidence/final/zeref-secret-canary-latest.json evidence/final/zeref-secret-canary-summary.json evidence/final/zeref-secret-canary-manifest.json
          git commit -m "evidence: record contained secret-canary run $RUN_ID"
          git push origin HEAD:agent/zeref-quantum-divergence
