name: Beast Cage GBA public production proof
on:
  push:
    branches: [main]
    paths:
      - 'apps/beastbox-cloud/vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beast-cage-gba-public-proof
  cancel-in-progress: false
jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Confirm new public release without touching owner or paid models
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.error,urllib.parse,ssl,os,pathlib
          context=ssl.create_default_context()
          ROOT="https://beastboxcosmos.xyz"
          UA={"User-Agent":"BeastCageGBA-PublicReleaseProof/1.0","Cache-Control":"no-cache"}
          def get(path):
              url=ROOT+path
              req=urllib.request.Request(url,headers=UA,method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=14,context=context) as resp:
                      host=urllib.parse.urlsplit(resp.geturl()).hostname
                      if host not in ("beastboxcosmos.xyz","www.beastboxcosmos.xyz"):
                          raise RuntimeError("Unexpected redirect destination for "+path)
                      raw=resp.read(110001)
                      if len(raw)>110000:raise RuntimeError("Oversized response at "+path)
                      return resp.status,raw
              except urllib.error.HTTPError as exc:
                  return exc.code,exc.read(2048)
          receipt={"schema":"beast-cage-gba-live-proof-v1","trigger_commit":os.getenv("GITHUB_SHA"),"no_credentials_used":True,"no_private_data_read":True,"model_requests":0}
          for attempt in range(42):
              try:
                  code,raw=get("/api/gba-release")
                  if code!=200:raise RuntimeError("Release endpoint status "+str(code))
                  marker=json.loads(raw)
                  if (marker.get("schema")!="beast-cage-gba-release-v1" or
                      marker.get("source_marker")!="beast-cage-lost-cosmos-spark-alive-20261004" or
                      marker.get("lost_cosmos_commit")!="f2c3683f697b7ee5d35557028c4416556226bb9b" or
                      marker.get("same_cage_transfer") is not True or
                      "persistent-gba-player" not in marker.get("features",[]) or
                      "shared-spark-care-ledger" not in marker.get("features",[]) or
                      marker.get("guest_contains_private_memory") is not False or
                      marker.get("gbainference") is not False or
                      marker.get("hardware_tested") is not False):
                      raise RuntimeError("New release marker and limitations not established")
                  companion_code,companion_raw=get("/api/companion-release")
                  if companion_code!=200:
                      raise RuntimeError("Companion release marker status "+str(companion_code))
                  companion=json.loads(companion_raw)
                  if (companion.get("schema")!="beastbox-companion-release-v1" or
                      companion.get("source_marker")!="beastbox-unified-spark-companion-20261004" or
                      companion.get("same_companion_profile") is not True or
                      companion.get("recorded_quantum_seed") is not True or
                      companion.get("live_quantum_link") is not False or
                      companion.get("sim_earth_embedded") is not False or
                      companion.get("owner_authority_copied") is not False or
                      companion.get("public_seed_jobs_added")!=96 or
                      companion.get("public_seed_shards")!=4 or
                      companion.get("raw_circuits_published") is not False or
                      companion.get("user_ids_published") is not False or
                      companion.get("original_signal_payloads_published") is not False or
                      companion.get("derived_counts_public") is not True):
                      raise RuntimeError("Unified Spark companion release not established")
                  seeds_code,seeds_raw=get("/spark/user-seeds-20261004.json")
                  if seeds_code!=200:
                      raise RuntimeError("Public seed index status "+str(seeds_code))
                  seeds=json.loads(seeds_raw)
                  if (seeds.get("schema")!="spark-beasts-public-seed-pack-index-v1" or
                      seeds.get("totals",{}).get("unique_jobs")!=96 or
                      len(seeds.get("shards",[]))!=4):
                      raise RuntimeError("Public seed index is incomplete")
                  guest,body=get("/beast-cage/guest")
                  if guest!=200 or b"Catch a star" not in body:
                      raise RuntimeError("Public guest character game lab not served")
                  talk,body=get("/beast-cage/talk")
                  if talk!=200 or b"RAWRPH" not in body.upper():
                      raise RuntimeError("Existing genuine guest chat not served")
                  source,raw=get("/gba-module/beast_companion.c")
                  if source!=200 or b"beast_read_snapshot" not in raw:
                      raise RuntimeError("Downloadable game-source route missing")
                  previous,raw=get("/api/release")
                  if previous!=200:
                      raise RuntimeError("Previous production release identity regressed")
                  receipt.update({"public_verified":True,"marker":marker["source_marker"],"lost_cosmos_commit":marker["lost_cosmos_commit"],"same_cage_transfer":marker["same_cage_transfer"],"persistent_gba_player":True,"shared_care_ledger":True,"companion_marker":companion["source_marker"],"same_companion_profile":True,"sim_earth_embedded":False,"public_seed_jobs":96,"public_seed_index_http":seeds_code,"guest_http":guest,"chat_http":talk,"gba_source_http":source,"previous_release_http":previous})
                  print("BEAST_CAGE_GBA_PUBLIC_PROOF_SUCCESS",json.dumps(receipt,sort_keys=True))
                  break
              except Exception as exc:
                  if attempt==41:
                      receipt.update({"public_verified":False,"last_error":str(exc)})
                      print("BEAST_CAGE_GBA_PUBLIC_PROOF_FAILED",json.dumps(receipt,sort_keys=True))
                      pathlib.Path("beast-cage-public-proof.json").write_text(json.dumps(receipt,indent=2))
                      raise
                  print("Waiting for real public deployment, attempt",attempt+1,":",str(exc))
                  time.sleep(10)
          pathlib.Path("beast-cage-public-proof.json").write_text(json.dumps(receipt,indent=2)+"\n")
          PY
      - name: Upload public-only attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beast-cage-gba-public-production-receipt
          path: beast-cage-public-proof.json
          if-no-files-found: warn
