name: ZEREF FULL CLEAN CORPUS RED

on:
  push:
    branches: [zeref-talk006-full-clean-train-001]
    paths:
      - '.github/workflows/zeref-full-clean-red.yml'
      - 'tests/test_zeref_full_clean_corpus.py'
      - 'scripts/build_zeref_full_clean_corpus.py'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test runtime
        run: python -m pip install -e '.[dev]'
      - name: Run frozen RED contract
        run: python -m pytest -q tests/test_zeref_full_clean_corpus.py
