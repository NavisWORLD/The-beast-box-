name: Apply health contracts

on:
  push:
    branches:
      - hardening/buyer-grade-2026-09-08
    paths:
      - .github/workflows/hardening-apply-health.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact health/readiness implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("beastbox/cosmic_web.py")
          text = path.read_text(encoding="utf-8")
          method_needle = '''    def dispatch(self, method: str, path: str, body: dict[str, Any] | None = None) -> tuple[int, dict[str, Any]]:\n'''
          method_replacement = '''    def _readiness(self) -> tuple[int, dict[str, Any]]:\n        try:\n            runtime = DurableRuntime(self.root)\n            try:\n                inspection = runtime.inspect()\n            finally:\n                runtime.close()\n        except (OSError, ValueError, RuntimeError):\n            return 503, {\n                "schema": "beastbox-readiness-v1",\n                "ready": False,\n                "runtime_valid": False,\n                "provider_kind": self.profile.kind,\n                "reason": "durable_runtime_unavailable",\n            }\n        system_id = inspection.get("system_id")\n        checkpoint_sha256 = inspection.get("checkpoint_sha256")\n        runtime_valid = inspection.get("valid") is True\n        ready = (\n            runtime_valid\n            and isinstance(system_id, str)\n            and bool(system_id)\n            and isinstance(checkpoint_sha256, str)\n            and len(checkpoint_sha256) == 64\n        )\n        return (200 if ready else 503), {\n            "schema": "beastbox-readiness-v1",\n            "ready": ready,\n            "runtime_valid": runtime_valid,\n            "system_id": system_id if isinstance(system_id, str) else "",\n            "checkpoint_sha256": checkpoint_sha256 if isinstance(checkpoint_sha256, str) else "",\n            "provider_kind": self.profile.kind,\n        }\n\n    def dispatch(self, method: str, path: str, body: dict[str, Any] | None = None) -> tuple[int, dict[str, Any]]:\n'''
          dispatch_needle = '''        data = body or {}\n        try:\n            if method == "GET" and path == "/api/orbit":\n'''
          dispatch_replacement = '''        data = body or {}\n        try:\n            if method == "GET" and path == "/healthz":\n                return 200, {"schema": "beastbox-health-v1", "status": "alive"}\n            if method == "GET" and path == "/readyz":\n                return self._readiness()\n            if method == "GET" and path == "/api/orbit":\n'''
          if text.count(method_needle) != 1:
              raise SystemExit("dispatch method anchor changed; refusing to patch")
          if text.count(dispatch_needle) != 1:
              raise SystemExit("dispatch route anchor changed; refusing to patch")
          text = text.replace(method_needle, method_replacement, 1)
          text = text.replace(dispatch_needle, dispatch_replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify focused contract before commit
        run: |
          python -m pip install -r requirements-dev.txt -e .
          python -m ruff check beastbox/cosmic_web.py tests/test_cosmic_web.py
          python -m mypy beastbox/cosmic_web.py
          python -m pytest -q tests/test_cosmic_web.py
      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/hardening-apply-health.yml
          git add beastbox/cosmic_web.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(observability): add privacy-safe health and readiness endpoints"
          git push origin "HEAD:${GITHUB_REF_NAME}"
