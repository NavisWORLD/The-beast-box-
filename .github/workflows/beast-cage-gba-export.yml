name: Beast Cage guest + GBA export
on:
  pull_request:
    paths:
      - 'apps/beastbox-cloud/**'
      - '.github/workflows/beast-cage-gba-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gba-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/beastbox-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual standalone GBA module C99 source (host syntax only)
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -fsyntax-only public/gba-module/beast_companion.c
      - name: Install browser app
        run: npm install --no-audit --no-fund
      - name: Frontend security and feature tests
        run: npm test
      - name: TypeScript compile
        run: npm run typecheck
      - name: Build real production Next app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install real Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Public guest browser, actual download ZIP inspection and mobile checks
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 >/tmp/beast-gba-next.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for _ in range(90):
              try:
                  if urllib.request.urlopen('http://127.0.0.1:3100/api/gba-release',timeout=3).status==200:break
              except Exception:time.sleep(1)
          else:raise RuntimeError('Public guest build never became ready')
          PY
          python tests/beast_gba_browser.py
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload actual guest screenshots and exported game packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beast-cage-gba-actual-browser-evidence
          path: apps/beastbox-cloud/browser-evidence/gba-export/
          if-no-files-found: warn
