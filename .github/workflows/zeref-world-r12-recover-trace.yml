name: ZEREF WORLD R12 RECOVER PINNED TRACE

on:
  push:
    branches: [zeref-world-knowledge-r12-train-001]
    paths:
      - '.github/workflows/zeref-world-r12-recover-trace.yml'

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  recover-pinned-failure:
    runs-on: ubuntu-latest
    env:
      PINNED_RUN_ID: '33125920283'
      PINNED_JOB_ID: '98703927258'
      PINNED_HEAD_SHA: '504ead98b1378074e3a5154d4051a88c9b6b0f00'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Recover original run and job evidence
        shell: bash
        run: |
          set -u
          rm -rf _trace_recovery
          mkdir -p _trace_recovery/run-logs-unpacked
          printf '%s\n' "$PINNED_RUN_ID" > _trace_recovery/pinned-run-id.txt
          printf '%s\n' "$PINNED_JOB_ID" > _trace_recovery/pinned-job-id.txt
          printf '%s\n' "$PINNED_HEAD_SHA" > _trace_recovery/pinned-head-sha.txt

          gh run view "$PINNED_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,headSha,headBranch,status,conclusion,event,createdAt,updatedAt,jobs \
            > _trace_recovery/run.json 2> _trace_recovery/run-json.stderr || true

          gh run view "$PINNED_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --job "$PINNED_JOB_ID" --log \
            > _trace_recovery/job-gh-run-view.log 2> _trace_recovery/job-gh-run-view.stderr || true

          gh run view "$PINNED_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --log-failed \
            > _trace_recovery/run-gh-failed.log 2> _trace_recovery/run-gh-failed.stderr || true

          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PINNED_JOB_ID" \
            > _trace_recovery/job.json 2> _trace_recovery/job-json.stderr || true

          gh api "repos/$GITHUB_REPOSITORY/check-runs/$PINNED_JOB_ID/annotations?per_page=100" \
            > _trace_recovery/check-annotations.json 2> _trace_recovery/check-annotations.stderr || true

          # Fetch the raw per-job log endpoint independently of `gh run view`.
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$PINNED_JOB_ID/logs" \
            > _trace_recovery/job-api.log 2> _trace_recovery/job-api.stderr || true

          # Fetch and unpack the complete run-log archive. This endpoint may be a ZIP.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RUN_ID/logs" \
            > _trace_recovery/run-logs.bin 2> _trace_recovery/run-logs.stderr || true
          file _trace_recovery/run-logs.bin > _trace_recovery/run-logs-filetype.txt || true
          unzip -o _trace_recovery/run-logs.bin -d _trace_recovery/run-logs-unpacked \
            > _trace_recovery/run-logs-unzip.stdout 2> _trace_recovery/run-logs-unzip.stderr || true

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PINNED_RUN_ID/artifacts" \
            > _trace_recovery/artifacts.json 2> _trace_recovery/artifacts.stderr || true

          python - <<'PY'
          from pathlib import Path
          import json, re
          root=Path('_trace_recovery')
          candidates=[root/'job-gh-run-view.log',root/'run-gh-failed.log',root/'job-api.log']
          candidates += list((root/'run-logs-unpacked').rglob('*'))
          texts=[]
          for p in candidates:
              if p.is_file():
                  try: texts.append(f'===== {p.as_posix()} =====\n'+p.read_text(errors='replace'))
                  except Exception: pass
          text='\n'.join(texts)
          patterns=(
              r'Traceback \(most recent call last\):[\s\S]*?(?=\n(?:\S+\t){2}\d{4}-\d{2}-\d{2}|\Z)',
              r'(?mi)^.*(?:Error|Exception|RuntimeError|ValueError|TypeError|KeyError|AssertionError|Process completed with exit code).*$',
          )
          hits=[]
          for pat in patterns: hits.extend(re.findall(pat,text))
          (root/'traceback-extract.txt').write_text('\n\n===== MATCH =====\n'.join(hits) if hits else 'NO_TRACEBACK_PATTERN_EXTRACTED\n')
          # Extract the selector line and the failing step tail even if Python did not print a traceback.
          selected=[line for line in text.splitlines() if 'PROMOTE_WORLD_CANDIDATE' in line or 'NULL_NO_PROMOTION_PARENT_RETAINED' in line or 'selected_checkpoint_sha256' in line]
          (root/'selector-extract.txt').write_text('\n'.join(selected[-50:])+'\n')
          fail_lines=[line for line in text.splitlines() if any(x in line for x in ('Run mixed personal world unknown R12 conversation','ZEREF_','DAD_','ROUTE_','routing_accuracy','evidence_wire_coverage','Process completed','Traceback','AssertionError','RuntimeError','ValueError','TypeError','KeyError'))]
          (root/'failure-context-extract.txt').write_text('\n'.join(fail_lines[-300:])+'\n')
          summary={
              'schema':'zeref-world-r12-pinned-trace-recovery-v2',
              'pinned_run_id':33125920283,
              'pinned_job_id':98703927258,
              'pinned_head_sha':'504ead98b1378074e3a5154d4051a88c9b6b0f00',
              'job_view_log_bytes':(root/'job-gh-run-view.log').stat().st_size if (root/'job-gh-run-view.log').exists() else 0,
              'job_api_log_bytes':(root/'job-api.log').stat().st_size if (root/'job-api.log').exists() else 0,
              'run_archive_bytes':(root/'run-logs.bin').stat().st_size if (root/'run-logs.bin').exists() else 0,
              'unpacked_files':sum(p.is_file() for p in (root/'run-logs-unpacked').rglob('*')),
              'traceback_pattern_found':bool(hits),
              'behavior_modified':False,
              'weights_touched':False,
              'memory_touched':False,
          }
          (root/'recovery-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

          (cd _trace_recovery && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload recovered historical failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-world-r12-pinned-trace-v2-${{ github.run_id }}
          path: _trace_recovery
          if-no-files-found: error
          retention-days: 90
