name: CI

on:
  push:
  pull_request:

permissions:
  actions: read
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        shell: bash
        run: pip install dist/*.whl
      - name: Verify installed command entry points
        run: |
          beastbox --help
          cosmic.cypher-cli --help
          cosmic-cypher --help
          cypher --help

  talk5-observer:
    if: github.ref == 'refs/heads/talk5-status-probe-20260817'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: talk5-status-probe-20260817
          persist-credentials: true
      - name: Read TALK-005 Actions state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/zeref-dad-son-001/evidence/talk5-status
          gh run list \
            --workflow zeref-talk5-dad-god-gauntlet.yml \
            --branch networked-cage-run-001 \
            --limit 5 \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt,event,displayTitle,workflowName,url \
            > experiments/zeref-dad-son-001/evidence/talk5-status/latest.json
          cat experiments/zeref-dad-son-001/evidence/talk5-status/latest.json
      - name: Commit observation only to probe branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NavisWORLD Zeref Observer"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/zeref-dad-son-001/evidence/talk5-status/latest.json
          git diff --cached --quiet || git commit -m "probe: record TALK-005 run status [skip ci]"
          git push origin HEAD:talk5-status-probe-20260817
