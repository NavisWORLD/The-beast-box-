name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'rust/**'
      - 'docs/RUST.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'rust/**'
      - 'docs/RUST.md'

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,ml]'
      - run: pytest

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        shell: bash
        run: pip install dist/*.whl
      - name: Verify installed command entry points
        run: |
          beastbox --help
          cosmic.cypher-cli --help
          cosmic-cypher --help
          cypher --help
