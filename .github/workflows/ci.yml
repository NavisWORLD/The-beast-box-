name: CI

on:
  push:
    branches:
      - main
      - quantum-beast-starter-productization-001
    paths-ignore:
      - 'rust/**'
      - 'docs/RUST.md'
  pull_request:
    branches:
      - main
      - cory-davis-cosmos-reality-bridge-final-organism-001
    paths-ignore:
      - 'rust/**'
      - 'docs/RUST.md'

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - name: Lint productization surface
        run: |
          ruff check beastbox/config.py beastbox/logging_config.py scripts/productization_receipt.py tests/test_starter_kit.py tests/test_logging_config.py tests/test_productization_receipt.py
      - name: Type-check productization surface
        run: mypy
      - name: Starter and receipt tests with measured coverage
        run: |
          coverage run -m pytest tests/test_starter_kit.py tests/test_logging_config.py tests/test_productization_receipt.py
          coverage report
      - name: Verify sealed scientific evidence is unchanged
        run: git diff --exit-code c8769d0f1c9dab7a0c9adc0082d7234e7ff22f6f -- evidence/final-whole-organism-001/
      - name: Verify productization receipt guard
        run: python scripts/productization_receipt.py --check-only
      - name: Emit deterministic productization receipt preview
        run: python scripts/productization_receipt.py --head-sha "$GITHUB_SHA"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,ml]'
      - run: pytest

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        shell: bash
        run: pip install dist/*.whl
      - name: Verify installed command entry points
        run: |
          beastbox --help
          beastbox starter
          cosmic.cypher-cli --help
          cosmic-cypher --help
          cypher --help
