name: Inspect current Zeref production rail

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/native-coder-contract-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve current HF HEAD and production language artifacts
        run: |
          set -euo pipefail
          python -m pip install -q 'huggingface-hub>=0.27'
          python - <<'PY'
          from huggingface_hub import HfApi
          api = HfApi()
          info = api.model_info('phera-ra/QC67_cosmo', files_metadata=True)
          print('CURRENT_HF_SHA=', info.sha)
          print('LAST_MODIFIED=', info.last_modified)
          wanted=[]
          for s in info.siblings or []:
              name=s.rfilename
              low=name.lower()
              if any(k in low for k in ('gguf','namebind','adapter','lora','peft','safetensors','modelfile','cosmos_best','cosmos_play','cosmos_sandbox')):
                  wanted.append((name, getattr(s,'size',None), getattr(s,'lfs',None)))
          print('===== CURRENT PRODUCTION ARTIFACTS =====')
          for row in sorted(wanted): print(row)
          PY
      - name: Materialize current named GGUF and manifests if present
        run: |
          set -euo pipefail
          rm -rf _current && mkdir -p _current
          python - <<'PY'
          from huggingface_hub import HfApi, snapshot_download
          api=HfApi(); info=api.model_info('phera-ra/QC67_cosmo')
          files={s.rfilename for s in info.siblings or []}
          patterns=['MANIFEST.json','model-index.json','*Modelfile*','**/*Modelfile*']
          for candidate in ('cosmos-namebind-weights.gguf','weights/cosmos-namebind-weights.gguf','weights/cosmos-cst.gguf'):
              if candidate in files:
                  patterns.append(candidate)
          snapshot_download(repo_id='phera-ra/QC67_cosmo', revision=info.sha, local_dir='_current', allow_patterns=patterns)
          print('FROZEN_CURRENT_SHA=', info.sha)
          PY
          find _current -type f ! -path '*/.cache/*' -print | sort
          find _current -type f ! -path '*/.cache/*' -print0 | sort -z | xargs -0 sha256sum
