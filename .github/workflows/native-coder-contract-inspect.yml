name: Inspect pinned native coder contract

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/native-coder-contract-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download pinned source only
        run: |
          set -euo pipefail
          python -m pip install -q 'huggingface-hub>=0.27'
          mkdir -p _inspect
          hf download phera-ra/QC67_cosmo \
            serving/cosmos_coder.py serving/cosmos_serve.py soul/cosmos_bridge.py \
            --revision b414724c627300c41b099dcc6853766d08fd27a4 \
            --local-dir _inspect
          sha256sum _inspect/serving/cosmos_coder.py _inspect/serving/cosmos_serve.py _inspect/soul/cosmos_bridge.py
      - name: Print native coder and server contracts only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targets = [
              (Path('_inspect/serving/cosmos_coder.py'), ('/save', '/run', 'def run(', 'subprocess.run(', 'HOST =', 'SENSE =')),
              (Path('_inspect/serving/cosmos_serve.py'), ('argparse', 'sys.argv', '11501', 'HTTPServer', 'Threading', 'def main', 'weights/', '.pt', 'model', 'listen', 'host', 'port')),
              (Path('_inspect/soul/cosmos_bridge.py'), ('def ', '11501', 'state', 'dyn12', 'physics', 'request', 'url')),
          ]
          for p, needles in targets:
              print(f'===== {p} =====')
              lines = p.read_text(encoding='utf-8').splitlines()
              hits = sorted({i for i, line in enumerate(lines) if any(n in line for n in needles)})
              emitted = set()
              for i in hits:
                  for j in range(max(0, i-5), min(len(lines), i+10)):
                      if j not in emitted:
                          print(f'{j+1:04d}: {lines[j]}')
                          emitted.add(j)
                  print('---')
          PY
