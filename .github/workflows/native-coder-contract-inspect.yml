name: Inspect pinned native coder contract

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/native-coder-contract-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact pinned native server source
        run: |
          set -euo pipefail
          python -m pip install -q 'huggingface-hub>=0.27'
          rm -rf _inspect && mkdir -p _inspect
          hf download phera-ra/QC67_cosmo serving/cosmos_serve.py serving/cosmos_coder.py \
            --revision b414724c627300c41b099dcc6853766d08fd27a4 \
            --local-dir _inspect
          sha256sum _inspect/serving/cosmos_serve.py _inspect/serving/cosmos_coder.py
      - name: Print physics and upstream proxy control flow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('_inspect/serving/cosmos_serve.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=('physics','temperature','state','upstream','proxy','do_POST','/api/chat','NATIVE','urlopen','Request(','body','options')
          hits=sorted({i for i,l in enumerate(lines) if any(n.lower() in l.lower() for n in needles)})
          emitted=set()
          for i in hits:
              for j in range(max(0,i-10),min(len(lines),i+20)):
                  if j not in emitted:
                      print(f'{j+1:04d}: {lines[j]}'); emitted.add(j)
              print('---')
          PY
      - name: Print coder model/host request path
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('_inspect/serving/cosmos_coder.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=('HOST =','MODEL =','/api/chat','options','temperature','num_predict','urllib','Request(')
          hits=sorted({i for i,l in enumerate(lines) if any(n.lower() in l.lower() for n in needles)})
          emitted=set()
          for i in hits:
              for j in range(max(0,i-8),min(len(lines),i+18)):
                  if j not in emitted:
                      print(f'{j+1:04d}: {lines[j]}'); emitted.add(j)
              print('---')
          PY
