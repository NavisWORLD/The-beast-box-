name: Inspect pinned native coder contract

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/native-coder-contract-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventory exact pinned namebind and production language artifacts
        run: |
          set -euo pipefail
          python -m pip install -q 'huggingface-hub>=0.27'
          python - <<'PY'
          from huggingface_hub import list_repo_files
          files = list_repo_files('phera-ra/QC67_cosmo', revision='b414724c627300c41b099dcc6853766d08fd27a4')
          needles = ('namebind','adapter','lora','peft','merged','modelfile','qwen','llama','tokenizer','safetensors')
          for f in sorted(files):
              if any(n in f.lower() for n in needles):
                  print(f)
          PY
      - name: Download exact merge scripts and manifests only
        run: |
          set -euo pipefail
          rm -rf _inspect && mkdir -p _inspect
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='phera-ra/QC67_cosmo',
              revision='b414724c627300c41b099dcc6853766d08fd27a4',
              local_dir='_inspect',
              allow_patterns=[
                  'genesis_engine/engine/cosmos_merge_namebind.py',
                  'genesis_engine/engine/cosmos_namebind_probe.py',
                  'genesis_engine/engine/_Modelfile.cosmos_namebind',
                  'launchers/Modelfile.cosmos-rebirth',
                  '**/*adapter*','**/*lora*','**/*peft*','**/*.safetensors',
                  '**/tokenizer*.json','MANIFEST.json','model-index.json'
              ],
          )
          PY
          find _inspect -type f -maxdepth 8 -print | sort
      - name: Print base model adapter and merge contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for rel in [
              'genesis_engine/engine/cosmos_merge_namebind.py',
              'genesis_engine/engine/cosmos_namebind_probe.py',
              'genesis_engine/engine/_Modelfile.cosmos_namebind',
              'launchers/Modelfile.cosmos-rebirth',
          ]:
              p=Path('_inspect')/rel
              if not p.is_file():
                  print(f'===== MISSING {rel} ====='); continue
              print(f'===== {rel} =====')
              print(p.read_text(encoding='utf-8',errors='replace'))
          PY
      - name: Hash reconstructable lineage material
        run: |
          set -euo pipefail
          find _inspect -type f -print0 | sort -z | xargs -0 sha256sum
