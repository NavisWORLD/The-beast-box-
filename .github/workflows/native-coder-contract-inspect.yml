name: Inspect pinned native coder contract

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/native-coder-contract-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventory exact pinned production inference artifacts
        run: |
          set -euo pipefail
          python -m pip install -q 'huggingface-hub>=0.27'
          python - <<'PY'
          from huggingface_hub import list_repo_files
          files = list_repo_files('phera-ra/QC67_cosmo', revision='b414724c627300c41b099dcc6853766d08fd27a4')
          keys = ('gguf', 'modelfile', 'genesis_engine', 'genesis_engine', 'awaken.py', 'serve.py', 'coder.py', 'cosmos_best.pt', 'cosmos_play.pt', 'cosmos_sandbox.pt')
          for f in sorted(files):
              low=f.lower()
              if any(k in low for k in keys):
                  print(f)
          PY
      - name: Download text launch/runtime manifests only
        run: |
          set -euo pipefail
          rm -rf _inspect && mkdir -p _inspect
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='phera-ra/QC67_cosmo',
              revision='b414724c627300c41b099dcc6853766d08fd27a4',
              local_dir='_inspect',
              allow_patterns=[
                  '*Modelfile*','**/*Modelfile*','Genesis_Engine/**/*.py','genesis_engine/**/*.py',
                  'Genesis_Engine/**/*.json','genesis_engine/**/*.json','serving/*.py','soul/*.py',
                  'SYSTEM_AND_TOKENIZER.md','USAGE_ATOMIC.md','MANIFEST.json','model-index.json'
              ],
          )
          PY
      - name: Print language rail declarations and model targets
        run: |
          set -euo pipefail
          grep -R -n -E 'FROM |ollama|model|GGUF|gguf|cosmos-q4|namebind|rebirth|COSMOS_CST_HOST|11434|11501|generate|chat' _inspect \
            --include='*.py' --include='*Modelfile*' --include='*.md' --include='*.json' || true
