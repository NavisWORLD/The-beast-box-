name: Inspect pinned native coder contract

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/native-coder-contract-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download pinned source and SAMGO docs only
        run: |
          set -euo pipefail
          python -m pip install -q 'huggingface-hub>=0.27'
          rm -rf _inspect && mkdir -p _inspect
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='phera-ra/QC67_cosmo',
              revision='b414724c627300c41b099dcc6853766d08fd27a4',
              local_dir='_inspect',
              allow_patterns=['*.py','**/*.py','SAMGO.md','tokenizer.json','tokenizer_config.json'],
          )
          PY
      - name: Locate exact SAMGO inference references
        run: |
          set -euo pipefail
          echo '===== FILES REFERENCING SAMGO ====='
          grep -R -n -E 'samgo_weights|SAMGO|samgo' _inspect --include='*.py' --include='*.md' || true
          echo '===== TOKENIZER/GENERATION REFERENCES NEAR SAMGO ====='
          python - <<'PY'
          from pathlib import Path
          needles = ('samgo','samgo_weights.pt','tokenizer.json','GPT2','BPE','generate','stream','torch.load','state_dict')
          for p in sorted(Path('_inspect').rglob('*.py')):
              text = p.read_text(encoding='utf-8', errors='replace')
              if 'samgo' not in text.lower() and 'samgo_weights.pt' not in text.lower():
                  continue
              print(f'===== {p.relative_to("_inspect")} =====')
              lines=text.splitlines(); hits=sorted({i for i,l in enumerate(lines) if any(n.lower() in l.lower() for n in needles)})
              emitted=set()
              for i in hits:
                  for j in range(max(0,i-8), min(len(lines),i+16)):
                      if j not in emitted:
                          print(f'{j+1:04d}: {lines[j]}'); emitted.add(j)
                  print('---')
          PY
      - name: Print SAMGO documentation and source hashes
        run: |
          set -euo pipefail
          if [[ -f _inspect/SAMGO.md ]]; then cat _inspect/SAMGO.md; fi
          find _inspect -type f \( -name '*.py' -o -name 'SAMGO.md' -o -name 'tokenizer.json' -o -name 'tokenizer_config.json' \) -print0 \
            | sort -z | xargs -0 sha256sum
