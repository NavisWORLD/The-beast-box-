name: Inspect pinned native coder contract

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/native-coder-contract-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact pinned bridge and autonomy source only
        run: |
          set -euo pipefail
          python -m pip install -q 'huggingface-hub>=0.27'
          rm -rf _inspect && mkdir -p _inspect
          hf download phera-ra/QC67_cosmo \
            soul/cosmos_bridge.py \
            genesis_engine/soul/coding_base.py \
            genesis_engine/soul/loop.py \
            genesis_engine/soul/awaken.py \
            genesis_engine/config.json \
            genesis_engine/config.example.json \
            serving/cosmos_coder.py \
            serving/cosmos_serve.py \
            --revision b414724c627300c41b099dcc6853766d08fd27a4 \
            --local-dir _inspect
          sha256sum \
            _inspect/soul/cosmos_bridge.py \
            _inspect/genesis_engine/soul/coding_base.py \
            _inspect/genesis_engine/soul/loop.py \
            _inspect/genesis_engine/soul/awaken.py \
            _inspect/genesis_engine/config.json \
            _inspect/genesis_engine/config.example.json
      - name: Print bridge model physics and code-effect control flow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targets = [
              ('soul/cosmos_bridge.py', ('ollama','model','physics','state','dyn12','phos','lorenz','prompt','generate','chat','creations','subprocess','execute','run','code','tool','autonomous')),
              ('genesis_engine/soul/coding_base.py', ('ollama','model','prompt','code','write','subprocess','execute','run','build','create','autonomous')),
              ('genesis_engine/soul/loop.py', ('ollama','model','prompt','create','write','subprocess','execute','run','sleep','while','round')),
              ('genesis_engine/soul/awaken.py', ('ollama','model','prompt','code','build','creations','subprocess','execute','run')),
          ]
          root=Path('_inspect')
          for rel, needles in targets:
              p=root/rel
              print(f'===== {rel} =====')
              lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              hits=sorted({i for i,l in enumerate(lines) if any(n.lower() in l.lower() for n in needles)})
              emitted=set()
              for i in hits:
                  for j in range(max(0,i-8), min(len(lines),i+18)):
                      if j not in emitted:
                          print(f'{j+1:04d}: {lines[j]}'); emitted.add(j)
                  print('---')
          PY
      - name: Print exact Genesis model configuration
        run: |
          set -euo pipefail
          echo '===== config.json ====='
          cat _inspect/genesis_engine/config.json
          echo '===== config.example.json ====='
          cat _inspect/genesis_engine/config.example.json
