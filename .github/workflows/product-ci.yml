name: Product CI

on:
  workflow_call:
  push:
    branches: ["**"]
    paths: &product-paths
      - "patches/**"
      - "beastbox/**"
      - "tests/**"
      - "scripts/**"
      - "Makefile"
      - "requirements*.txt"
      - "pyproject.toml"
      - "README.md"
      - "assets/**"
      - "kits/**"
      - "evidence/system-closure-001/**"
      - "QUANTUM_BEAST_STARTER/**"
      - "docs/**"
      - "PROJECT_STATUS.json"
      - ".github/workflows/product-ci.yml"
  pull_request:
    paths: *product-paths

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Verify original frozen source and manifest
        run: |
          scripts/smoke/sealed-evidence-guard.sh
          python scripts/apply-security-patches.py --verify-only
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Build separately verified product tree
        run: python scripts/apply-security-patches.py --destination "$RUNNER_TEMP/beastbox-finisher-product"
      - run: python -m pip install -r requirements-dev.txt -e "$RUNNER_TEMP/beastbox-finisher-product"
      - name: Full quality gate on the patched product (historical guard checked separately above)
        working-directory: ${{ runner.temp }}/beastbox-finisher-product
        run: make env-check lint typecheck test acceptance security ACCEPTANCE_OUTPUT=build/architecture-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/beastbox-finisher-product/build/junit.xml
            ${{ runner.temp }}/beastbox-finisher-product/build/architecture-acceptance.json
            ${{ runner.temp }}/beastbox-finisher-product/build/security-overlay-receipt.json
          if-no-files-found: warn

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify pristine and create audited package source
        run: |
          scripts/smoke/sealed-evidence-guard.sh
          python scripts/apply-security-patches.py --destination "$RUNNER_TEMP/beastbox-finisher-product"
      - name: Build, install, and run away from patched source
        working-directory: ${{ runner.temp }}/beastbox-finisher-product
        run: |
          mkdir -p build
          if make package-smoke > build/package-smoke.log 2>&1; then
            printf '%s\n' '{"gate":"package-smoke","passed":true,"workflow":"product-ci"}' > build/package-smoke.json
            printf '%s\n' '<testsuite name="package-smoke" tests="1" failures="0"><testcase name="clean-wheel-install"/></testsuite>' > build/package-junit.xml
          else
            status=$?
            printf '%s\n' '{"gate":"package-smoke","passed":false,"workflow":"product-ci"}' > build/package-smoke.json
            printf '%s\n' '<testsuite name="package-smoke" tests="1" failures="1"><testcase name="clean-wheel-install"><failure>package smoke failed; see log</failure></testcase></testsuite>' > build/package-junit.xml
            cat build/package-smoke.log
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-smoke
          path: |
            ${{ runner.temp }}/beastbox-finisher-product/build/package-smoke.json
            ${{ runner.temp }}/beastbox-finisher-product/build/package-smoke.log
            ${{ runner.temp }}/beastbox-finisher-product/build/package-junit.xml
            ${{ runner.temp }}/beastbox-finisher-product/build/security-overlay-receipt.json
          if-no-files-found: error

  cosmic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pristine and create patched browser source
        run: |
          scripts/smoke/sealed-evidence-guard.sh
          python scripts/apply-security-patches.py --destination "$RUNNER_TEMP/beastbox-finisher-product"
      - run: python -m pip install -e "$RUNNER_TEMP/beastbox-finisher-product" playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Real browser owner flows and responsive layouts
        working-directory: ${{ runner.temp }}/beastbox-finisher-product
        run: python scripts/smoke/cosmic_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmic-browser
          path: ${{ runner.temp }}/beastbox-finisher-product/build/cosmic-browser/
          if-no-files-found: warn
