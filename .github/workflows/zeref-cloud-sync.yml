name: Zeref cloud memory sync (Azure per-beast folder)
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Persist profile, live model pin, approved cycles to beasts/bb-deada969
        env:
          ZEREF_DISTILL_EXPORT_TOKEN: ${{ secrets.ZEREF_DISTILL_EXPORT_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${ZEREF_DISTILL_EXPORT_TOKEN:-}" ]; then echo 'ZEREF_CLOUD_SYNC_NOT_CONFIGURED'; exit 0; fi
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer ${ZEREF_DISTILL_EXPORT_TOKEN}" https://www.beastboxcosmos.xyz/api/zeref/cloud-sync
