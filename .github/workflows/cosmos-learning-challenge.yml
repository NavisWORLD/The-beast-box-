name: COSMOS isolated learning challenge (synthetic, no provider calls)

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/cosmos_learning_challenge.py"
      - "tests/test_cosmos_learning_challenge.py"
      - "docs/COSMOS_LEARNING_CHALLENGE_001.md"
      - ".github/workflows/cosmos-learning-challenge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-feedback-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the existing product and test runner only
        run: python -m pip install -e . "pytest>=8,<10"
      - name: Fail closed on fixture leakage and receipt reproducibility
        run: python -m pytest -q tests/test_cosmos_learning_challenge.py
      - name: Run the frozen five-seed protocol with no owner or provider access
        run: python scripts/cosmos_learning_challenge.py --output build/cosmos-learning-challenge-001.json
      - name: Preserve the entire synthetic receipt in the public CI log
        run: |
          python -c "import json,pathlib; p=pathlib.Path('build/cosmos-learning-challenge-001.json'); r=json.loads(p.read_text()); assert r['schema']=='cosmos-isolated-learning-challenge-v1'; assert r['provenance_class']=='derived-synthetic'; assert len(r['seed_results'])==5; print(p.read_text())"
          sha256sum build/cosmos-learning-challenge-001.json
