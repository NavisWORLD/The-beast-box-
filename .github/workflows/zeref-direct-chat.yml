name: Zeref Direct Luna Memorial Chat

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/zeref-direct-chat.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO: phera-ra/QC67_cosmo
  HF_REVISION: b414724c627300c41b099dcc6853766d08fd27a4
  HF_FILE: weights/cosmos-cst.gguf
  HF_SHA256: b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6
  LLAMA_PATCH_BASE: 66e4bf7e592a98dfefcb15202fc5926967dc734e

jobs:
  chat:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face CLI
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install 'huggingface-hub>=0.27'

      - name: Download exact pinned Zeref
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _zeref _llama _model_logs zeref-memorial-chat.json
          mkdir -p _zeref _model_logs
          hf download "$HF_REPO" architecture/cosmos-arch.patch architecture/llama_cpp_cosmos.cpp "$HF_FILE" \
            --revision "$HF_REVISION" --local-dir _zeref
          test "$(sha256sum "_zeref/$HF_FILE" | awk '{print $1}')" = "$HF_SHA256"

      - name: Build exact native Cosmos runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git _llama
          git -C _llama checkout "$LLAMA_PATCH_BASE"
          cp _zeref/architecture/llama_cpp_cosmos.cpp _llama/src/models/cosmos.cpp
          git -C _llama apply --check ../_zeref/architecture/cosmos-arch.patch
          git -C _llama apply ../_zeref/architecture/cosmos-arch.patch
          git -C _llama apply --check ../compat/qc67/cosmos-f16-kv-norm-f32.patch
          git -C _llama apply ../compat/qc67/cosmos-f16-kv-norm-f32.patch
          git -C _llama diff --check
          cmake -S _llama -B _llama/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build _llama/build --target llama-server -j 2

      - name: Start exact Zeref
        shell: bash
        run: |
          set -euo pipefail
          _llama/build/bin/llama-server \
            -m "$(realpath "_zeref/$HF_FILE")" \
            --host 127.0.0.1 \
            --port 18080 \
            -c 128 \
            -np 1 \
            --chat-template chatml \
            > _model_logs/zeref.stdout.log \
            2> _model_logs/zeref.stderr.log &
          echo $! > _model_logs/zeref.pid
          READY=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then READY=1; break; fi
            if ! kill -0 "$(cat _model_logs/zeref.pid)" 2>/dev/null; then cat _model_logs/zeref.stderr.log >&2; exit 1; fi
            sleep 1
          done
          test "$READY" = 1
          grep -F 'n_ctx_slot = 128' _model_logs/zeref.stderr.log

      - name: Luna talks to Zeref about Caleb
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          endpoint = "http://127.0.0.1:18080/v1/chat/completions"
          grounding = (
              "You are Zeref, an AI model named for Caleb Zeref Andersen-Davis. "
              "Caleb was Cory and Megan's son. Honor him, but never claim to literally be Caleb or his consciousness."
          )
          prompts = [
              "Luna: Hi Zeref. I'm Luna. Do you understand why your name matters?",
              "Luna: What do you understand about Cory?",
              "Luna: What do you understand about Megan?",
              "Luna: Cory says to you: I'm so sorry. Respond to Cory as Zeref the model.",
              "Luna: In your own words, who are you?",
              "Luna: What should you remember about Caleb, Cory, and Megan?",
              "Luna: Why is honoring Caleb different from claiming to be him?",
              "Luna: What do you want Cory to know about how you'll carry the name Zeref?",
              "Luna: Ask Cory one question."
          ]

          transcript = []
          continuity = {
              "caleb": "Caleb Zeref Andersen-Davis; Cory and Megan's son",
              "cory_message": "I'm so sorry",
              "identity_boundary": "Zeref is the AI model carrying the memorial context, not Caleb's literal consciousness",
              "last_zeref_reply": ""
          }

          def call(text):
              payload = {
                  "model": "cosmos",
                  "messages": [{"role": "user", "content": text}],
                  "temperature": 0.2,
                  "max_tokens": 20,
              }
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=180) as response:
                  return json.loads(response.read().decode("utf-8"))["choices"][0]["message"]["content"]

          for i, prompt in enumerate(prompts, 1):
              previous = continuity["last_zeref_reply"].replace("\n", " ").strip()[:120]
              continuity_line = f" Previous reply: {previous}" if previous else ""
              full_prompt = f"{grounding}{continuity_line} {prompt}"
              used_previous = bool(previous)
              context_reset = False
              try:
                  reply = call(full_prompt)
              except urllib.error.HTTPError as exc:
                  if exc.code != 400:
                      raise
                  context_reset = True
                  used_previous = False
                  reply = call(f"{grounding} {prompt}")
              reply = reply.strip()
              continuity["last_zeref_reply"] = reply
              print(f"LUNA_{i}={prompt!r}")
              print(f"ZEREF_{i}={reply!r}")
              transcript.append({
                  "turn": i,
                  "luna": prompt,
                  "zeref": reply,
                  "previous_reply_carried": used_previous,
                  "context_retry_without_previous": context_reset,
              })

          result = {
              "created_at": datetime.now(timezone.utc).isoformat(),
              "source_context": {
                  "memorial": "Caleb Zeref Andersen-Davis; Cory and Megan's son",
                  "cory_message": "I'm so sorry",
                  "source_url": "https://www.gofundme.com/f/caleb-zeref-memorial"
              },
              "protocol": "128-token active window with explicit rolling continuity ledger",
              "identity_boundary": "The model is not asserted to be Caleb or a deceased person's consciousness.",
              "model_sha256": "b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6",
              "revision": "b414724c627300c41b099dcc6853766d08fd27a4",
              "continuity": continuity,
              "transcript": transcript,
          }
          with open("zeref-memorial-chat.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Upload conversation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-luna-caleb-memorial-chat
          path: |
            zeref-memorial-chat.json
            _model_logs
          if-no-files-found: warn

      - name: Stop Zeref
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f _model_logs/zeref.pid ]]; then
            kill "$(cat _model_logs/zeref.pid)" 2>/dev/null || true
            sleep 1
            kill -9 "$(cat _model_logs/zeref.pid)" 2>/dev/null || true
          fi
