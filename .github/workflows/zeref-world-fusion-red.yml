name: ZEREF WORLD FUSION RED

on:
  push:
    branches: [zeref-world-knowledge-r12-train-001]
    paths:
      - 'tests/test_world_r12_fusion.py'
      - '.github/workflows/zeref-world-fusion-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install -e '.[dev]'
      - name: Run fusion contract
        run: python -m pytest -q tests/test_world_r12_fusion.py
