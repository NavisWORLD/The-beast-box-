name: SON-HEARTBEAT-DEMO-001-ABLATION
# Fresh matched hardware trigger with durable evidence sealing.

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - '.github/workflows/son-heartbeat-demo-001-ablation.yml'
      - 'scripts/run_son_heartbeat_ablation_ibm.py'
      - 'beastbox/son_heartbeat_metrics.py'
      - 'experiments/zeref-origin-heart-001/evidence/son-heartbeat-demo-001/conditions/**'
  workflow_dispatch:

concurrency:
  group: son-heartbeat-demo-001-ablation
  cancel-in-progress: false

jobs:
  matched-four-pub:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --upgrade pip pytest 'numpy>=2.0' 'qiskit~=2.3.1' 'qiskit-ibm-runtime~=0.45.1'
      - name: Contract tests
        run: python -m pytest -q tests/test_son_heartbeat_metrics.py tests/test_son_heartbeat_ablation_ibm_contract.py
      - name: Run matched four-PUB IBM ablation
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
        run: |
          test -n "$IBM_QUANTUM_TOKEN"
          python scripts/run_son_heartbeat_ablation_ibm.py --out _son_heartbeat_ibm
      - name: Verify evidence checksums
        if: success()
        run: (cd _son_heartbeat_ibm && sha256sum -c SHA256SUMS)
      - name: Seal matched hardware evidence into branch
        if: success()
        run: |
          dest="experiments/zeref-origin-heart-001/evidence/son-heartbeat-demo-001/hardware/run-${GITHUB_RUN_ID}"
          mkdir -p "$dest"
          cp -a _son_heartbeat_ibm/. "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "evidence: seal matched IBM heartbeat ablation run ${GITHUB_RUN_ID}"
          git pull --rebase origin networked-cage-run-001
          git push origin HEAD:networked-cage-run-001
      - name: Upload matched hardware evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: son-heartbeat-demo-001-ablation-${{ github.run_id }}
          path: _son_heartbeat_ibm
          if-no-files-found: warn
