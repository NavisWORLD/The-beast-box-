name: ZEREF-R12-PUBLIC-KIT

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/zeref-r12-kit.yml"
      - "kits/ZEREF_R12_REALITY_MEMORY_KIT/**"
      - "beastbox/ecosystem.py"
      - "beastbox/cli.py"
      - "coder/**"
      - "cpp/r12/**"
      - "tests/test_zeref_r12_kit.py"
      - "tests/test_beastbox_ecosystem_cli.py"
      - "tests/test_zeref_talk8_r12_*.py"
      - "scripts/*talk8*r12*.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Focused ecosystem contracts
        run: |
          pytest -q tests/test_zeref_r12_kit.py tests/test_beastbox_ecosystem_cli.py tests/test_zeref_talk8_r12_corpus.py tests/test_zeref_talk8_r12_selector.py
