name: Publish QC67 kit to Hugging Face

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hugging Face CLI with OIDC support
        run: python -m pip install --upgrade 'huggingface_hub>=1.19.0'
      - name: Publish QC67 card and Zeref kit, then record result
        env:
          HF_OIDC_RESOURCE: phera-ra/QC67_cosmo
        shell: bash
        run: |
          set +e
          CARD_LOG="$(mktemp)"
          KIT_LOG="$(mktemp)"

          hf upload phera-ra/QC67_cosmo \
            huggingface/QC67_MODEL_CARD_NEXT.md \
            README.md \
            --commit-message "Update QC67 COSMOS/Zeref model card from ${GITHUB_SHA::7}" \
            >"$CARD_LOG" 2>&1
          CARD_STATUS=$?

          hf upload phera-ra/QC67_cosmo \
            huggingface/ZEREF_OLLAMA_KIT \
            ZEREF_OLLAMA_KIT \
            --commit-message "Publish Zeref Ollama kit from ${GITHUB_SHA::7}" \
            >"$KIT_LOG" 2>&1
          KIT_STATUS=$?

          {
            echo "# Hugging Face publication receipt"
            echo
            echo "Source GitHub SHA: $GITHUB_SHA"
            echo "Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Target: phera-ra/QC67_cosmo"
            echo "Model card upload exit code: $CARD_STATUS"
            echo "ZEREF_OLLAMA_KIT upload exit code: $KIT_STATUS"
            echo
            echo "## Model card upload output"
            echo '```text'
            sed -n '1,120p' "$CARD_LOG"
            echo '```'
            echo
            echo "## ZEREF_OLLAMA_KIT upload output"
            echo '```text'
            sed -n '1,120p' "$KIT_LOG"
            echo '```'
          } > huggingface/PUBLISH_RECEIPT.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add huggingface/PUBLISH_RECEIPT.md
          git commit -m "Record Hugging Face publish result [skip ci]" || true
          git push origin HEAD:main

          if [ "$CARD_STATUS" -ne 0 ] || [ "$KIT_STATUS" -ne 0 ]; then
            exit 1
          fi
