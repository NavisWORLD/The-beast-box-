name: Publish QC67 kit to Hugging Face

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hugging Face CLI with OIDC support
        id: install_hf
        run: python -m pip install --upgrade 'huggingface_hub>=1.19.0'
      - name: Publish corrected QC67 model card
        id: publish_card
        env:
          HF_OIDC_RESOURCE: phera-ra/QC67_cosmo
        run: |
          hf upload phera-ra/QC67_cosmo \
            huggingface/QC67_MODEL_CARD_NEXT.md \
            README.md \
            --commit-message "Update QC67 COSMOS/Zeref model card from ${GITHUB_SHA::7}"
      - name: Publish Zeref Ollama kit
        id: publish_kit
        env:
          HF_OIDC_RESOURCE: phera-ra/QC67_cosmo
        run: |
          hf upload phera-ra/QC67_cosmo \
            huggingface/ZEREF_OLLAMA_KIT \
            ZEREF_OLLAMA_KIT \
            --commit-message "Publish Zeref Ollama kit from ${GITHUB_SHA::7}"
      - name: Record publication outcome
        if: always()
        run: |
          {
            echo "source_sha=$GITHUB_SHA"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "install_hf=${{ steps.install_hf.outcome }}"
            echo "publish_card=${{ steps.publish_card.outcome }}"
            echo "publish_kit=${{ steps.publish_kit.outcome }}"
          } > huggingface/HF_PUBLISH_STATUS.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add huggingface/HF_PUBLISH_STATUS.txt
          git commit -m "Record QC67 Hugging Face publication outcome" || true
          git push || true
