name: Quantum Buddy frozen real 14K Phase-8 holdout

on:
  push:
    branches:
      - feature/quantum-buddy-shadow-core-001
    paths:
      - docs/quantum-buddy/phase8/real-14k-run-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: quantum-buddy-real-14k-phase8
  cancel-in-progress: false

env:
  PYTHONPATH: models
  CHECKPOINT_SHA: '4e45850bfe7b3e2be1d5b12e1956286e1f3f8cfde7b01b70212ad75fbc8610a5'
  RELEASE_SHA: '3875bc47e8b9d2024b4dae7889bf326f269c5a73955d2d3fc27936ba6794239c'
  RELEASE_TAG: rawrphos-native-conversation-step-00014000-run-35951509482

jobs:
  preflight:
    name: Verify owner request, frozen release and real native inference
    if: >-
      github.repository == 'NavisWORLD/The-beast-box-' &&
      github.ref == 'refs/heads/feature/quantum-buddy-shadow-core-001' &&
      startsWith(github.event.head_commit.message, 'experiment(phase8): authorize real 14k holdout ')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Confirm one-file authorization, checkpoint, public release and frozen settings
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD)" = 'docs/quantum-buddy/phase8/real-14k-run-request.json'
          python - <<'PY'
          import json, pathlib, os, re
          path=pathlib.Path('docs/quantum-buddy/phase8/real-14k-run-request.json')
          r=json.loads(path.read_text())
          assert set(r)=={'schema','checkpoint_sha256','release_sha256','release_tag','prereg_sha256','cpu_job_timeout_minutes','max_parallel_arms','authorization'}
          assert r['schema']=='quantum-buddy-real-14k-phase8-run-request-v1'
          assert r['checkpoint_sha256']==os.environ['CHECKPOINT_SHA']
          assert r['release_sha256']==os.environ['RELEASE_SHA']
          assert r['release_tag']==os.environ['RELEASE_TAG']
          assert r['authorization']=='Run the frozen 14K Phase-8 native CPU holdout on public GitHub Actions; no QPU, Cosmos live mutation or production deployment'
          assert r['cpu_job_timeout_minutes']==130 and r['max_parallel_arms']==2
          prereg=json.loads(pathlib.Path('docs/quantum-buddy/phase8/preregistration.json').read_text())
          from scripts.aggregate_quantum_buddy_phase8 import _hash_json
          assert r['prereg_sha256']==_hash_json(prereg)
          assert prereg['arms']==['off','matched_classical','sim_unentangled','sim_entangled','replay']
          assert prereg['native_generation_temperature']==0.8 and prereg['native_generation_top_k']==40 and prereg['native_generation_max_tokens']==24
          print('FROZEN_OWNER_CPU_ONLY_AUTHORIZATION_VERIFIED')
          PY
      - name: Verify runner CLI and aggregation interfaces before allocating native CPU
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,subprocess,sys
          workflow=pathlib.Path('.github/workflows/quantum-buddy-real14k-phase8.yml').read_text()
          accepted=['--arm','--checkpoint','--expected-sha256','--release-archive',
                    '--expected-release-archive-sha256','--confirm-cpu-intensive','--output']
          result=subprocess.run([sys.executable,'scripts/run_quantum_buddy_phase8_shadow.py','--help'],
                                capture_output=True,text=True,check=False,timeout=10)
          assert result.returncode==0 and all(flag in result.stdout for flag in accepted)
          # Split on complete YAML section delimiter, not the literal inside this check.
          holdout=workflow.split(chr(10)+'  holdout:'+chr(10),1)[1].split(
              chr(10)+'  aggregate:'+chr(10),1)[0]
          assert all(flag in holdout for flag in accepted)
          assert '--release-archive-sha256' not in holdout
          assert '--source-revision' not in holdout
          print('NATIVE_ARM_WORKFLOW_RUNNER_CLI_CONTRACT_VERIFIED')
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install bounded CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --quiet 'tokenizers>=0.20,<0.24' 'safetensors>=0.4.5,<1' 'numpy>=1.26,<3' 'pytest>=8,<10'
      - name: Restore immutable public 14K archive and reject digest mismatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .phase8-14k
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'rawrphos-native-step-00014000.tar.gz' --dir .phase8-14k
          printf '%s  %s\n' "$RELEASE_SHA" '.phase8-14k/rawrphos-native-step-00014000.tar.gz' | sha256sum --check
          python - <<'PY'
          import pathlib,tarfile
          root=pathlib.Path('.phase8-14k')
          with tarfile.open(root/'rawrphos-native-step-00014000.tar.gz') as archive:
              members=archive.getmembers()
              assert members and sum(m.size for m in members)<512_000_000
              assert all(pathlib.PurePosixPath(m.name).parts[0]=='step-00014000' and (m.isdir() or m.isfile()) for m in members)
              archive.extractall(root, filter='data')
          assert (root/'step-00014000').is_dir()
          print('SEALED_14K_ARCHIVE_RESTORED')
          PY
      - name: Verify exact trained weights and time one real full-length paired probe
        run: |
          set -euo pipefail
          python - <<'PY'
          import math,os,time
          from rawrphos.inference.engine import Engine
          e=Engine('.phase8-14k/step-00014000',threads=4,max_new_tokens=32,
                   expected_sha256=os.environ['CHECKPOINT_SHA'],device='cpu')
          assert e.metadata['checkpoint_sha256']==os.environ['CHECKPOINT_SHA']
          assert e.metadata['training_steps']==14000
          state=[0.17,-0.23]*6
          q=[0.2,-0.1]*6
          start=time.monotonic()
          result=e.shadow_condition('Describe a machine that remembers.',state,q,max_tokens=24,
                                    seed=67,sampling_temperature=0.8,sampling_top_k=40)
          elapsed=time.monotonic()-start
          assert result['model_weights_changed'] is False and result['fresh_hardware_used'] is False
          assert result['checkpoint_sha256']==os.environ['CHECKPOINT_SHA']
          assert math.isfinite(result['logit_l2'])
          print('REAL_14K_NATIVE_PREFLIGHT_PAIRED_24_TOKENS',round(elapsed,3),
                'ESTIMATED_ARM_MINUTES',round(elapsed*1024/60,1),flush=True)
          if elapsed*1024 > 110*60:
              raise RuntimeError('Estimated complete arm exceeds bounded worker budget; require resumable shards instead')
          PY

  holdout:
    name: Frozen native 14K arm - ${{ matrix.arm }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [off, matched_classical, sim_unentangled, sim_entangled, replay]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --quiet 'tokenizers>=0.20,<0.24' 'safetensors>=0.4.5,<1' 'numpy>=1.26,<3'
      - name: Restore and verify identical immutable 14K archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .phase8-14k
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'rawrphos-native-step-00014000.tar.gz' --dir .phase8-14k
          printf '%s  %s\n' "$RELEASE_SHA" '.phase8-14k/rawrphos-native-step-00014000.tar.gz' | sha256sum --check
          python - <<'PY'
          import pathlib,tarfile
          root=pathlib.Path('.phase8-14k')
          with tarfile.open(root/'rawrphos-native-step-00014000.tar.gz') as archive:
              members=archive.getmembers()
              assert members and sum(m.size for m in members)<512_000_000
              assert all(pathlib.PurePosixPath(m.name).parts[0]=='step-00014000' and (m.isdir() or m.isfile()) for m in members)
              archive.extractall(root,filter='data')
          PY
      - name: Full frozen 32-person x 8-prompt x 4-seed real model arm
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          python scripts/run_quantum_buddy_phase8_shadow.py \
            --arm "$ARM" \
            --checkpoint .phase8-14k/step-00014000 \
            --expected-sha256 "$CHECKPOINT_SHA" \
            --release-archive .phase8-14k/rawrphos-native-step-00014000.tar.gz \
            --expected-release-archive-sha256 "$RELEASE_SHA" \
            --confirm-cpu-intensive \
            --output "build/phase8-14k-$ARM"
          (cd "build/phase8-14k-$ARM" && sha256sum --check SHA256SUMS)
      - name: Preserve completed full native arm only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-14k-${{ matrix.arm }}
          path: build/phase8-14k-${{ matrix.arm }}/
          if-no-files-found: ignore
          retention-days: 30

  aggregate:
    name: Verify and archive every matched arm; do not promote
    needs: [preflight,holdout]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: phase8-14k-*
          path: build/phase8-14k-shards
          merge-multiple: false
      - name: Verify full frozen provenance, all five arms and actual native generation counts
        run: |
          set -euo pipefail
          python scripts/aggregate_quantum_buddy_phase8.py \
            --shards-root build/phase8-14k-shards \
            --preregistration docs/quantum-buddy/phase8/preregistration.json \
            --revision "$GITHUB_SHA" \
            --output build/phase8-real14k-final
          (cd build/phase8-real14k-final && sha256sum --check SHA256SUMS)
      - name: Preserve immutable full real 14K holdout report
        uses: actions/upload-artifact@v4
        with:
          name: quantum-buddy-real14k-phase8-full
          path: build/phase8-real14k-final/
          if-no-files-found: error
          retention-days: 90
