name: Zeref R12 Refractive Live Loop

on:
  push:
    branches:
      - zeref-r12-refractive-live-loop-001

permissions:
  contents: read
  actions: read

jobs:
  red-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify repository plus refractive router before new live-loop contract
        run: pytest -q --ignore=tests/test_zeref_r12_live_loop.py
      - name: Run paired R12 live-loop RED contract
        run: pytest -q tests/test_zeref_r12_live_loop.py
