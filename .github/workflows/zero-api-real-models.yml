name: COSMOS zero paid-API real models (bounded offline CPU research)
on:
  push:
    branches: [experiment/zero-api-real-models-002]
    paths:
      - scripts/zero_api_real_models.py
      - scripts/zero_api_real_host.sh
      - experiments/zero_api_real/**
      - .github/workflows/zero-api-real-models.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/zero_api_real_models.py
      - scripts/zero_api_real_host.sh
      - experiments/zero_api_real/**
      - .github/workflows/zero-api-real-models.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zero-api-real-single
  cancel-in-progress: true
jobs:
  real-offline-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source before downloading any models
        run: |
          python -m py_compile scripts/zero_api_real_models.py
          bash -n scripts/zero_api_real_host.sh
      - name: Execute real two-model workload inside isolated Docker container
        run: |
          set -Eeuo pipefail
          bash scripts/zero_api_real_host.sh
      - name: Preserve entire bounded-run evidence and failed runs (never model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-api-real-models-receipts
          path: |
            build/zero-api-real/results/*.json
            build/zero-api-real/results/*.log
            build/zero-api-real/models/manifest.json
          retention-days: 14
          if-no-files-found: warn
