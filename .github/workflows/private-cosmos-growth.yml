name: Opt-in bounded private Cosmos growth
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-cosmos-growth
  cancel-in-progress: false
jobs:
  bounded-private-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing authenticated simulator driver
        run: python -m pip install --quiet 'qdk[azure]'
      - name: Fair private queue with persistent quotas and no public transcripts
        working-directory: apps/beastbox-cloud
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER_SAS_URL: ${{ secrets.AZURE_STORAGE_CONTAINER_SAS_URL }}
          AZURE_STORAGE_CONTAINER: beastbox
          AZURE_QUANTUM_CONNECTION_STRING: ${{ secrets.AZURE_QUANTUM_CONNECTION_STRING }}
          BEASTBOX_PRIVATE_GROWTH_MAX_JOBS: ${{ vars.BEASTBOX_PRIVATE_GROWTH_MAX_JOBS || '2' }}
          BEASTBOX_PRIVATE_GROWTH_USER_DAILY: ${{ vars.BEASTBOX_PRIVATE_GROWTH_USER_DAILY || '2' }}
          BEASTBOX_PRIVATE_GROWTH_LIFETIME_ATTEMPTS: ${{ vars.BEASTBOX_PRIVATE_GROWTH_LIFETIME_ATTEMPTS || '16' }}
        run: node scripts/private-cosmos-growth.mjs
