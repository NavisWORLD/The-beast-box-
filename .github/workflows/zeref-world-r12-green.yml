name: ZEREF WORLD R12 GREEN VERIFICATION

on:
  push:
    branches: [zeref-world-knowledge-r12-train-001]
    paths:
      - '.github/workflows/zeref-world-r12-green.yml'

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic test runtime
        run: python -m pip install -e '.[dev,ml]'
      - name: Focused RED to GREEN regression
        run: |
          set -euo pipefail
          mkdir -p _green_evidence
          python -m pytest -q tests/test_world_r12_abstention_regression.py tests/test_world_r12_fusion.py tests/test_zeref_world_r12_runtime.py tests/test_world_knowledge_store.py tests/test_zeref_r12_quality_profile.py \
            | tee _green_evidence/focused-green.log
      - name: R12 and provenance families
        run: |
          set -euo pipefail
          FILES=$(find tests -maxdepth 1 -type f \( -name '*r12*.py' -o -name '*provenance*.py' -o -name '*world_knowledge*.py' \) -print | sort)
          test -n "$FILES"
          python -m pytest -q $FILES | tee _green_evidence/r12-provenance-green.log
      - name: Complete unit regression suite
        run: |
          set -euo pipefail
          python -m pytest -q | tee _green_evidence/full-green.log
      - name: Seal GREEN receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('_green_evidence')
          receipt={
              'schema':'zeref-world-r12-green-v1',
              'git_commit':os.environ['GITHUB_SHA'],
              'original_failure_run_id':33125920283,
              'red_run_id':33132651218,
              'regression':'GREEN',
              'production_threshold_changed':False,
              'model_weights_changed':False,
              'canonical_memory_changed':False,
          }
          (root/'GREEN.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          files=sorted(p for p in root.iterdir() if p.is_file() and p.name!='SHA256SUMS')
          (root/'SHA256SUMS').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files))
          PY
          (cd _green_evidence && sha256sum -c SHA256SUMS)
      - name: Upload GREEN verification
        uses: actions/upload-artifact@v4
        with:
          name: zeref-world-r12-green-${{ github.run_id }}
          path: _green_evidence
          if-no-files-found: error
          retention-days: 90
