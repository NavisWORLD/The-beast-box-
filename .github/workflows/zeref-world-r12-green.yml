name: ZEREF WORLD R12 GREEN

on:
  push:
    branches: [zeref-world-knowledge-r12-train-001]
    paths:
      - 'beastbox/refractive_memory.py'
      - 'tests/test_zeref_r12_quality_profile.py'
      - '.github/workflows/zeref-world-r12-green.yml'

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install -e '.[dev]'
      - name: Focused quality profile
        run: python -m pytest -q tests/test_zeref_r12_quality_profile.py
      - name: Complete regression suite
        run: python -m pytest -q
