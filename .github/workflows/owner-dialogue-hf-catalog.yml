name: Owner dialogue, HF catalog and RAWRPHOS diagnostic (test-only)

on:
  pull_request:
    branches: [main]
    paths:
      - beastbox/runtime.py
      - beastbox/hf_owner_catalog.py
      - apps/beastbox-cloud/bridge/owner_bridge.py
      - apps/beastbox-cloud/bridge/tests/test_hf_owner_catalog.py
      - apps/beastbox-cloud/app/api/bridge/**
      - apps/beastbox-cloud/components/model-switcher.tsx
      - apps/beastbox-cloud/tests/hf-owner-catalog.test.mjs
      - models/rawrphos/training/preflight.py
      - models/rawrphos/tests/test_preflight.py
      - tests/test_recent_conversation_context.py
      - tests/test_hf_owner_catalog.py
      - .github/workflows/owner-dialogue-hf-catalog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies for real isolated CPU tensors
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e '.[secure]' -e './models/rawrphos[serve]' pytest==8.4.2
      - name: Compile edited Python source
        run: |
          python -m compileall -q beastbox/runtime.py beastbox/hf_owner_catalog.py apps/beastbox-cloud/bridge/owner_bridge.py models/rawrphos/training/preflight.py
      - name: Verify real continuity, HF guardrails and CPU tensor diagnostics
        run: |
          mkdir -p build
          python -m pytest -o addopts= -q --junitxml=build/owner-dialogue-hf.xml \
            tests/test_recent_conversation_context.py \
            tests/test_hf_owner_catalog.py \
            models/rawrphos/tests/test_preflight.py \
            apps/beastbox-cloud/bridge/tests/test_hf_owner_catalog.py \
            tests/test_durable_runtime.py \
            apps/beastbox-cloud/bridge/tests/test_owner_bridge.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify UI authorization and consent contracts
        run: |
          node --test apps/beastbox-cloud/tests/hf-owner-catalog.test.mjs \
            apps/beastbox-cloud/tests/unified-model-routing.test.mjs
      - name: Machine-readable test receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('build/owner-dialogue-hf.xml').getroot()
          suites=[root] if root.tag=='testsuite' else list(root.findall('./testsuite'))
          totals={k:sum(int(s.attrib.get(k,0)) for s in suites)
                  for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] > 0 and totals['failures'] == totals['errors'] == 0
          receipt={'schema':'owner-dialogue-hf-catalog-acceptance-v1',
                   'python_tests':totals,
                   'real_cpu_synthetic_tensor_diagnostic':True,
                   'actual_owner_live_chat_attested':False,
                   'production_training_occurred':False,
                   'model_weights_modified':False,
                   'production_deployment':False}
          Path('build/owner-dialogue-hf-receipt.json').write_text(json.dumps(receipt,indent=2)+'\\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-dialogue-hf-test-receipt
          path: |
            build/owner-dialogue-hf.xml
            build/owner-dialogue-hf-receipt.json
          if-no-files-found: warn
