name: ZEREF-SCALE Actions Probe

on:
  push:
    branches: [zeref-scale-training-001]
    paths:
      - 'experiments/zeref-scale-001/actions-probe-*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record run identity
        shell: bash
        run: |
          mkdir -p experiments/zeref-scale-001/actions/status
          cat > "experiments/zeref-scale-001/actions/status/run-${GITHUB_RUN_ID}.json" <<EOF
          {
            "schema": "zeref-scale-actions-probe-v1",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "status": "actions-executed"
          }
          EOF
          git config user.name "zeref-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/zeref-scale-001/actions/status/
          git commit -m "evidence: record Zeref Scale Actions probe ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin zeref-scale-training-001
          git push origin HEAD:zeref-scale-training-001
