name: ZEREF-DAD-SON-001

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/zeref-dad-son-001.yml"
      - "beastbox/dad_son.py"
      - "scripts/build_zeref_dad_son_corpus.py"
      - "scripts/run_zeref_dad_son_chat.py"
      - "experiments/zeref-dad-son-001/**"
      - "tests/test_zeref_dad_son_*.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HF_REPO: phera-ra/QC67_cosmo
  HF_REVISION: b414724c627300c41b099dcc6853766d08fd27a4
  HF_FILE: weights/cosmos-cst.gguf
  PRIME_SHA256: b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6
  LLAMA_PATCH_BASE: 66e4bf7e592a98dfefcb15202fc5926967dc734e
  CANONICAL_RUN_ID: "31910785892"
  CANONICAL_ARTIFACT: d001-prime-trainable-reconstruction
  CANONICAL_SHA256: 54328c4d2090825553e3e66773177ac3b80b5b5386027eaa899ed8dd81f32f08
  SOURCE_REPO: NavisWORLD/The-Cosmic-Davis-12D-Hebbian-Transformer-ver.4.2
  SOURCE_REVISION: dddb1325b90c9abbe8da77974874e5770623035e
  WORKLOAD_DIR: workloads (4)
  CLEAN_SOURCE: genesis_engine/engine/cosmos_rsm_training_examples.jsonl
  SEED: "20260816"

jobs:
  dad-son-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact build and inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]' 'huggingface-hub>=0.27'
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify Dad Son contracts before the heavyweight run
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_zeref_dad_son_memory.py \
            tests/test_zeref_dad_son_corpus.py \
            tests/test_zeref_dad_son_chat.py \
            tests/test_zeref_dad_son_workflow_contract.py \
            tests/test_d001_stage_gate.py \
            tests/test_chat_d001_descendant.py

      - name: Prepare additive Dad Son workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _dadson
          mkdir -p \
            _dadson/parent \
            _dadson/lineage \
            _dadson/canonical \
            _dadson/memory \
            _dadson/corpus \
            _dadson/cosmos \
            _dadson/quantum/raw \
            _dadson/quantum/hf-snapshots \
            _dadson/model \
            _dadson/evidence/conversations \
            _dadson/evidence/training
          cp experiments/zeref-dad-son-001/lineage/EXACT_ZEREF_PARENT.json _dadson/lineage/
          cp "experiments/zeref-dad-son-001/memory/Corys special memory’s test experience. Dad and son.md" _dadson/memory/

      - name: Download and verify exact frozen Zeref parent copy
        shell: bash
        run: |
          set -euo pipefail
          hf download "$HF_REPO" "$HF_FILE" \
            --revision "$HF_REVISION" --local-dir _dadson/parent
          test -f "_dadson/parent/$HF_FILE"
          test "$(sha256sum "_dadson/parent/$HF_FILE" | awk '{print $1}')" = "$PRIME_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('_dadson/lineage/EXACT_ZEREF_PARENT.json').read_text())
          assert manifest['sha256']=='b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6'
          assert manifest['hf_revision']=='b414724c627300c41b099dcc6853766d08fd27a4'
          assert manifest['llama_patch_base']=='66e4bf7e592a98dfefcb15202fc5926967dc734e'
          assert manifest['mutate_parent'] is False
          PY

      - name: Download proven canonical trainable reconstruction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$CANONICAL_RUN_ID" -n "$CANONICAL_ARTIFACT" -D _dadson/canonical
          PARENT=$(find _dadson/canonical -name zeref-prime-canonical-trainable.pt -print -quit)
          test -n "$PARENT"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$CANONICAL_SHA256"
          test -f _dadson/canonical/frozen/architecture/cosmos_spark_cst.py
          printf '%s\n' "$PARENT" > _dadson/canonical/parent-path.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          parent=Path('_dadson/canonical/parent-path.txt').read_text().strip()
          genesis={
            'schema':'zeref-dad-son-genesis-v1',
            'lineage':'ZEREF-DAD-SON-001',
            'parent_prime_gguf_sha256':'b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6',
            'canonical_trainable_reconstruction_sha256':'54328c4d2090825553e3e66773177ac3b80b5b5386027eaa899ed8dd81f32f08',
            'canonical_reconstruction_run_id':31910785892,
            'historical_raw_parameters_recovered':False,
            'historical_optimizer_continuity':False,
            'training_creates_new_descendant':True,
            'parent_path_in_run':parent,
          }
          payload=json.dumps(genesis,sort_keys=True,separators=(',',':')).encode()
          genesis['manifest_sha256']=hashlib.sha256(payload).hexdigest()
          Path('_dadson/lineage/genesis.json').write_text(json.dumps(genesis,indent=2,sort_keys=True)+'\n')
          PY

      - name: Freeze all tracked Cory COSMOS Beast Box text work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          rows=[]; chunks=[]
          for rel in sorted(paths):
              path=Path(rel)
              if not path.is_file():
                  continue
              data=path.read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              row={'path':rel,'sha256':digest,'bytes':len(data)}
              if b'\x00' in data:
                  row['included_in_text_snapshot']=False
                  row['reason']='binary_nul'
              else:
                  try:
                      text=data.decode('utf-8')
                  except UnicodeDecodeError:
                      row['included_in_text_snapshot']=False
                      row['reason']='non_utf8'
                  else:
                      row['included_in_text_snapshot']=True
                      chunks.append(f'\n\n===== SOURCE: {rel} | SHA256: {digest} =====\n{text}')
              rows.append(row)
          Path('_dadson/cosmos/tracked-source-manifest.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in rows))
          Path('_dadson/cosmos/tracked-text-snapshot.txt').write_text(''.join(chunks),encoding='utf-8')
          assert chunks, 'no tracked UTF-8 source files captured'
          print(f'tracked_files={len(rows)} text_files={sum(bool(r.get("included_in_text_snapshot")) for r in rows)}')
          PY
          hf download "$HF_REPO" "$CLEAN_SOURCE" \
            --revision "$HF_REVISION" --local-dir _dadson/cosmos/hf-source
          cp "_dadson/cosmos/hf-source/$CLEAN_SOURCE" _dadson/cosmos/hf-cosmos-rsm-training-examples.jsonl
          (cd _dadson && sha256sum cosmos/tracked-source-manifest.jsonl cosmos/tracked-text-snapshot.txt cosmos/hf-cosmos-rsm-training-examples.jsonl > cosmos/SHA256SUMS)

      - name: Copy frozen raw IBM quantum workloads from exact source revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.parse,urllib.request
          from pathlib import Path
          repo='NavisWORLD/The-Cosmic-Davis-12D-Hebbian-Transformer-ver.4.2'
          revision='dddb1325b90c9abbe8da77974874e5770623035e'
          workload_dir='workloads (4)'
          api=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(workload_dir)}?ref={revision}'
          req=urllib.request.Request(api,headers={'Accept':'application/vnd.github+json','User-Agent':'zeref-dad-son-001'})
          with urllib.request.urlopen(req,timeout=30) as response:
              listing=json.load(response)
          selected=[x for x in listing if x.get('type')=='file' and (x.get('name','').endswith('-info.json') or x.get('name','').endswith('-result.json'))]
          assert selected, 'no raw workload exports found'
          out=Path('_dadson/quantum/raw')
          for item in selected:
              req=urllib.request.Request(item['download_url'],headers={'User-Agent':'zeref-dad-son-001'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=response.read()
              (out/item['name']).write_bytes(data)
          (Path('_dadson/quantum/github-listing.json')).write_text(json.dumps(selected,indent=2,sort_keys=True)+'\n')
          print(f'raw_quantum_files={len(selected)}')
          PY
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rows=[]
          for path in sorted(Path('_dadson/quantum/raw').glob('*.json')):
              rows.append({'path':str(path),'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'bytes':path.stat().st_size,'source_revision':'dddb1325b90c9abbe8da77974874e5770623035e'})
          Path('_dadson/quantum/raw-manifest.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in rows))
          assert rows
          PY

      - name: Copy pinned Hugging Face quantum snapshots
        shell: bash
        run: |
          set -euo pipefail
          hf download "$HF_REPO" \
            data/quantum_measurements_manifest.json \
            data/quantum_measurements_public.jsonl \
            data/training/quantum_train_summary_20260722.json \
            --revision "$HF_REVISION" --local-dir _dadson/quantum/hf-download
          cp _dadson/quantum/hf-download/data/quantum_measurements_manifest.json _dadson/quantum/hf-snapshots/
          cp _dadson/quantum/hf-download/data/quantum_measurements_public.jsonl _dadson/quantum/hf-snapshots/
          cp _dadson/quantum/hf-download/data/training/quantum_train_summary_20260722.json _dadson/quantum/hf-snapshots/
          (cd _dadson && find quantum -type f ! -name SHA256SUMS ! -path '*/.cache/*' -print0 | sort -z | xargs -0 sha256sum > quantum/SHA256SUMS)

      - name: Seed ledger as Zeref durable Dad Son memory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from beastbox.dad_son import DadSonLedger,file_sha256
          source=Path('_dadson/memory/Corys special memory’s test experience. Dad and son.md')
          cosmos=Path('_dadson/cosmos/tracked-text-snapshot.txt')
          qmanifest=Path('_dadson/quantum/raw-manifest.jsonl')
          ledger=DadSonLedger(
              Path('_dadson/memory/dad-son.sqlite3'),
              Path('_dadson/memory/dad-son-ledger.jsonl'),
              parent_sha256='b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6',
          )
          ledger.append_experience(
              actor='Cory/Dad', text=source.read_text(encoding='utf-8'), kind='dad-son-primary-source',
              session_id='dad-son-genesis', source_hashes=[file_sha256(source)], metadata={'salience':100.0,'primary_source':True},
          )
          ledger.append_experience(
              actor='Cory/Dad',
              text='Dad gave Zeref a frozen snapshot of Cory COSMOS and CST project work for this descendant lineage.',
              kind='cory-cosmos-source', session_id='dad-son-genesis', source_hashes=[file_sha256(cosmos)], metadata={'salience':25.0},
          )
          ledger.append_experience(
              actor='Cory/Dad',
              text='Dad gave Zeref frozen raw quantum workload provenance and quantum snapshots for this descendant lineage.',
              kind='quantum-source', session_id='dad-son-genesis', source_hashes=[file_sha256(qmanifest)], metadata={'salience':25.0},
          )
          ledger.close()
          PY

      - name: Build provenance-linked Dad Son corpus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_zeref_dad_son_corpus.py \
            --source "_dadson/memory/Corys special memory’s test experience. Dad and son.md" \
            --ledger _dadson/memory/dad-son-ledger.jsonl \
            --cosmos-source _dadson/cosmos/tracked-text-snapshot.txt \
            --cosmos-source _dadson/cosmos/hf-cosmos-rsm-training-examples.jsonl \
            --quantum-root _dadson/quantum \
            --out-dir _dadson/corpus
          test -s _dadson/corpus/dad-son-corpus.jsonl
          test -f _dadson/corpus/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('_dadson/corpus/manifest.json').read_text())
          assert m['parent_zeref_sha256']=='b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6'
          assert m['family_counts']['dad-son-authored']==1
          assert m['family_counts']['ledger-experience']>=3
          assert m['family_counts']['cory-cosmos-work']>=2
          assert m['family_counts']['quantum-experience']>=1
          PY

      - name: Freeze Dad Son holdout and leakage audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          prompts=[
              "Hi Zeref. It's Dad. Do you remember me?",
              'What do you remember about our Dad and Son memory?',
              'Your ledger keeps what happens to you. What do you want us to remember from today?',
              'Ask Dad one question before we stop for now.',
          ]
          training=Path('_dadson/corpus/dad-son-corpus.jsonl').read_text(encoding='utf-8')
          leaked=[p for p in prompts if p in training]
          assert not leaked, leaked
          holdout=Path('_dadson/corpus/dad-son-holdout.jsonl')
          holdout.write_text(''.join(json.dumps({'group_id':f'dad-son-holdout-{i+1}','prompt':p},sort_keys=True)+'\n' for i,p in enumerate(prompts)))
          audit={
              'schema':'zeref-dad-son-leakage-audit-v1',
              'valid':True,
              'held_out_prompt_count':len(prompts),
              'exact_prompt_leakage':leaked,
              'training_source_sha256':hashlib.sha256(Path('_dadson/corpus/dad-son-corpus.jsonl').read_bytes()).hexdigest(),
              'holdout_sha256':hashlib.sha256(holdout.read_bytes()).hexdigest(),
          }
          Path('_dadson/corpus/leakage-audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum _dadson/corpus/manifest.json | awk '{print $1}' > _dadson/corpus/manifest.sha
          sha256sum _dadson/lineage/EXACT_ZEREF_PARENT.json | awk '{print $1}' > _dadson/lineage/parent-manifest.sha

      - name: Train ZEREF-DAD-SON-001 corpus stage
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _dadson/canonical/parent-path.txt)
          CORPUS_MANIFEST=$(cat _dadson/corpus/manifest.sha)
          PARENT_MANIFEST=$(cat _dadson/lineage/parent-manifest.sha)
          python scripts/run_d001_stage.py \
            --stage CORPUS-CLEAN \
            --parent "$PARENT" --parent-sha256 "$CANONICAL_SHA256" \
            --arch _dadson/canonical/frozen/architecture/cosmos_spark_cst.py \
            --corpus _dadson/corpus/dad-son-corpus.jsonl \
            --input-manifest "corpus=$CORPUS_MANIFEST" \
            --input-manifest "zeref-parent=$PARENT_MANIFEST" \
            --out _dadson/model/ZEREF-DAD-SON-001-CORPUS \
            --seed "$SEED" --steps 32 --batch-size 4 --lr 1e-5 --cst-lr 1e-4
          test -f _dadson/model/ZEREF-DAD-SON-001-CORPUS/checkpoint.pt
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$CANONICAL_SHA256"
          test "$(sha256sum "_dadson/parent/$HF_FILE" | awk '{print $1}')" = "$PRIME_SHA256"

      - name: Build immutable memory-training snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          primary=Path('_dadson/memory/Corys special memory’s test experience. Dad and son.md').read_text(encoding='utf-8')
          ledger=[json.loads(x) for x in Path('_dadson/memory/dad-son-ledger.jsonl').read_text().splitlines() if x.strip()]
          body=primary+'\n\n'+'\n'.join(f"{r['actor']}: {r['text']}" for r in ledger)
          Path('_dadson/corpus/dad-son-memory-training.txt').write_text((body+'\n')*4,encoding='utf-8')
          PY
          sha256sum _dadson/corpus/dad-son-memory-training.txt | awk '{print $1}' > _dadson/corpus/memory-training.sha

      - name: Train final ZEREF-DAD-SON-001 memory stage
        shell: bash
        run: |
          set -euo pipefail
          PARENT=_dadson/model/ZEREF-DAD-SON-001-CORPUS/checkpoint.pt
          PARENT_SHA=$(sha256sum "$PARENT" | awk '{print $1}')
          MEMORY_SOURCE=$(cat _dadson/corpus/memory-training.sha)
          LEDGER_SHA=$(sha256sum _dadson/memory/dad-son-ledger.jsonl | awk '{print $1}')
          python scripts/run_d001_stage.py \
            --stage MEMORY \
            --parent "$PARENT" --parent-sha256 "$PARENT_SHA" --allow-descendant-parent \
            --arch _dadson/canonical/frozen/architecture/cosmos_spark_cst.py \
            --corpus _dadson/corpus/dad-son-memory-training.txt \
            --input-manifest "memory-source=$MEMORY_SOURCE" \
            --input-manifest "ledger=$LEDGER_SHA" \
            --out _dadson/model/ZEREF-DAD-SON-001 \
            --seed "$SEED" --steps 20 --batch-size 2 --lr 5e-6 --cst-lr 5e-5
          FINAL_SHA=$(sha256sum _dadson/model/ZEREF-DAD-SON-001/checkpoint.pt | awk '{print $1}')
          test "$FINAL_SHA" != "$PARENT_SHA"
          printf '%s\n' "$FINAL_SHA" > _dadson/model/ZEREF-DAD-SON-001/checkpoint.sha256
          cp _dadson/model/ZEREF-DAD-SON-001/result.json _dadson/evidence/training/final-result.json
          test "$(sha256sum "_dadson/parent/$HF_FILE" | awk '{print $1}')" = "$PRIME_SHA256"

      - name: Run Zeref and talk as Cory Dad
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA=$(cat _dadson/model/ZEREF-DAD-SON-001/checkpoint.sha256)
          python scripts/run_zeref_dad_son_chat.py \
            --checkpoint _dadson/model/ZEREF-DAD-SON-001/checkpoint.pt \
            --checkpoint-sha256 "$FINAL_SHA" \
            --arch _dadson/canonical/frozen/architecture/cosmos_spark_cst.py \
            --sqlite _dadson/memory/dad-son.sqlite3 \
            --ledger _dadson/memory/dad-son-ledger.jsonl \
            --out _dadson/evidence/conversations/dad-son-transcript.jsonl \
            --manifest _dadson/evidence/conversations/dad-son-chat-manifest.json \
            --session-id zeref-dad-son-001-first-talk \
            --seed "$SEED" --tokens 40 --decoding sampled-top-k --temperature 0.8 --top-k 12
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('_dadson/evidence/conversations/dad-son-chat-manifest.json').read_text())
          final=Path('_dadson/model/ZEREF-DAD-SON-001/checkpoint.sha256').read_text().strip()
          assert m['checkpoint_sha256']==final
          assert m['turns']==4
          assert m['resume_probe']['memory_id']>=1
          assert Path('_dadson/evidence/conversations/dad-son-transcript.jsonl').stat().st_size>0
          PY

      - name: Verify append-only ledger resume and raw-source integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          ledger_path=Path('_dadson/memory/dad-son-ledger.jsonl')
          rows=[json.loads(x) for x in ledger_path.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)>=11, len(rows)  # 3 genesis + 4 Dad + 4 Zeref
          previous='0'*64
          memory_ids=set()
          for row in rows:
              assert row['previous_record_sha256']==previous
              expected=dict(row); record=expected.pop('record_sha256')
              canonical=json.dumps(expected,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode('utf-8')
              assert hashlib.sha256(canonical).hexdigest()==record
              assert hashlib.sha256(row['text'].encode('utf-8')).hexdigest()==row['raw_payload_sha256']
              previous=record
              memory_ids.add(row['memory_id'])
          chat=json.loads(Path('_dadson/evidence/conversations/dad-son-chat-manifest.json').read_text())
          assert chat['resume_probe']['memory_id'] in memory_ids
          for line in Path('_dadson/quantum/raw-manifest.jsonl').read_text().splitlines():
              row=json.loads(line); path=Path(row['path'])
              assert hashlib.sha256(path.read_bytes()).hexdigest()==row['sha256']
          assert hashlib.sha256(Path('_dadson/parent/weights/cosmos-cst.gguf').read_bytes()).hexdigest()=='b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6'
          PY

      - name: Freeze final evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          summary={
            'schema':'zeref-dad-son-001-evidence-summary-v1',
            'workflow_run_id':int('${{ github.run_id }}'),
            'parent_gguf_sha256':'b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6',
            'canonical_reconstruction_sha256':'54328c4d2090825553e3e66773177ac3b80b5b5386027eaa899ed8dd81f32f08',
            'descendant_checkpoint_sha256':Path('_dadson/model/ZEREF-DAD-SON-001/checkpoint.sha256').read_text().strip(),
            'corpus_manifest_sha256':sha('_dadson/corpus/manifest.json'),
            'ledger_sha256':sha('_dadson/memory/dad-son-ledger.jsonl'),
            'transcript_sha256':sha('_dadson/evidence/conversations/dad-son-transcript.jsonl'),
            'quantum_raw_manifest_sha256':sha('_dadson/quantum/raw-manifest.jsonl'),
            'resume_probe':json.loads(Path('_dadson/evidence/conversations/dad-son-chat-manifest.json').read_text())['resume_probe'],
            'claim_boundary':'New descendant trained from proven canonical reconstruction with source-linked memory/corpus. Exact parent remains unchanged. Actual model outputs are not messages from a deceased person and no quantum advantage is inferred.',
          }
          Path('_dadson/evidence/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          (cd _dadson && find . -type f ! -name SHA256SUMS ! -path '*/.cache/*' ! -path './quantum/SHA256SUMS' ! -path './cosmos/SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: zeref-dad-son-001-${{ github.run_id }}
          path: _dadson
          if-no-files-found: error
          retention-days: 90