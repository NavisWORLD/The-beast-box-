name: ZEREF WORLD FUSION GREEN

on:
  push:
    branches: [zeref-world-knowledge-r12-train-001]
    paths:
      - 'beastbox/world_r12.py'
      - 'tests/test_world_r12_fusion.py'
      - '.github/workflows/zeref-world-fusion-green.yml'

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Focused fusion contract
        run: python -m pytest -q tests/test_world_r12_fusion.py
      - name: Complete regression suite
        run: python -m pytest -q
