name: Zeref verified production conversation and one bounded recovery IBM workload
on:
  pull_request:
    paths:
      - '.github/workflows/zeref-live-production-recovery.yml'
      - 'scripts/ibm_live_dragon_conversation_recovery.py'
permissions:
  contents: read
concurrency:
  group: zeref-production-quantum-recovery-20261010-onejob-v2
  cancel-in-progress: false
jobs:
  verified-real-recording:
    if: ${{ github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/zeref-live-production-recording-20261010-recovery' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the real production no-QPU conversation preflight to have passed
        run: |
          python - <<'PY'
          import json,urllib.request
          url='https://api.github.com/repos/NavisWORLD/The-beast-box-/actions/runs/38020706129'
          with urllib.request.urlopen(url,timeout=25) as response: run=json.load(response)
          assert run['status']=='completed' and run['conclusion']=='success'
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official IBM client and real browser
        run: |
          python -m pip install 'qiskit-ibm-runtime>=0.45,<0.50' 'qiskit>=2.1,<2.5'
          npm install --prefix "$RUNNER_TEMP/zeref-browser" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/zeref-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Actual native boot and ready composer, then ONE tagged 60-second-capped physical recovery probe
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          BEAST_REAL_QPU_ONE_JOB: YES_ONE_REAL_JOB
        run: |
          export NODE_PATH="$RUNNER_TEMP/zeref-browser/node_modules"
          PYTHONPATH=.:scripts python scripts/ibm_live_dragon_conversation_recovery.py
      - name: Preserve all actual measurements, provider intervals, replies and original browser video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-live-production-recovery-${{ github.run_id }}
          path: _zeref_live_production_recovery_20261010/
          retention-days: 30
          if-no-files-found: warn
