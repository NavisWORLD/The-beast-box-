# Read-only quota run, no hardware submission or paid inference.
name: Beast Reality Prober — Open Plan Readiness
on:
  pull_request:
    paths:
      - '.github/workflows/ibm-beast-reality-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navisworld-ibm-readiness
  cancel-in-progress: false
jobs:
  check-open-plan:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/ibm-beast-reality-probe-20261009') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test quota guard with fake usage
        run: python -m unittest discover -s tests -p test_ibm_open_plan_preflight.py -v
      - name: Install IBM Qiskit Runtime
        run: python -m pip install 'qiskit-ibm-runtime>=0.45,<0.51'
      # Re-run after the owner rotated IBM_QUANTUM_TOKEN; no hardware submission.
      - name: Verify remaining IBM quota AFTER completed physical job (READ ONLY)
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
        run: python scripts/ibm_open_plan_preflight.py
      - name: Save sanitized remaining-quota receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beast-ibm-readiness-${{ github.run_id }}
          path: _ibm_open_plan_preflight/receipt.json
          retention-days: 7
          if-no-files-found: error
