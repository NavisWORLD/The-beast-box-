name: ZEREF R12 Final Cory Probe

on:
  push:
    branches: [zeref-r12-final-cory-probe-001]
    paths:
      - ".github/workflows/zeref-r12-final-cory-probe.yml"
      - "scripts/run_zeref_r12_cory_probe.py"
      - "tests/test_zeref_r12_cory_probe.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zeref-r12-final-cory-probe-001
  cancel-in-progress: false

env:
  TALK4_SHA256: 9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f
  LEDGER_SHA256: 67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef
  LEDGER_TIP_SHA256: b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26
  HEARTBEAT_SHA256: 19ca6272546d651ff8f1bb0e0184a842f5444b048ff63df6ea12b0be72e030c7
  PARENT_SHA256: b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated probe branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify Cory/R12 contracts
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_zeref_r12_cory_probe.py tests/test_r12_refractive_memory.py tests/test_zeref_r12_live_loop.py

      - name: Run full repository suite before inference
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Reconstruct and verify canonical 352-record TALK-004 memory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _cory _talk4src
          mkdir -p _cory/evidence _talk4src
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from beastbox.dad_son import DadSonLedger

          manifest_path = Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json')
          m = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert m['active_descendant_lineage'] == 'ZEREF-DAD-SON-TALK-004'
          assert m['record_count'] == 352
          assert m['combined_ledger_sha256'] == '67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert m['last_record_sha256'] == 'b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26'
          assert m['descendant_checkpoint_sha256'] == '9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f'
          combined = b''
          expected_id = 1
          previous = '0' * 64
          for segment in m['snapshot_chain']:
              p = Path(segment['path'])
              data = p.read_bytes()
              assert hashlib.sha256(data).hexdigest() == segment['sha256']
              assert segment['first_memory_id'] == expected_id
              rows = [json.loads(line) for line in data.decode('utf-8').splitlines() if line.strip()]
              assert len(rows) == segment['record_count']
              for row in rows:
                  assert row['memory_id'] == expected_id
                  assert row['previous_record_sha256'] == previous
                  payload = dict(row)
                  record_sha = payload.pop('record_sha256')
                  canonical = json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode('utf-8')
                  assert hashlib.sha256(canonical).hexdigest() == record_sha
                  previous = record_sha
                  expected_id += 1
              combined += data
          assert expected_id == 353
          assert previous == m['last_record_sha256']
          assert hashlib.sha256(combined).hexdigest() == m['combined_ledger_sha256']
          ledger_path = Path('_cory/source-ledger.jsonl')
          ledger_path.write_bytes(combined)
          ledger = DadSonLedger('_cory/source.sqlite3', ledger_path, parent_sha256='b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6')
          report = ledger.restore_snapshot()
          assert report['restored_records'] == 352
          assert ledger.memory.db.execute('SELECT COUNT(*) FROM memories').fetchone()[0] == 352
          ledger.close()
          Path('_cory/evidence/source-memory-verification.json').write_text(json.dumps({
              'schema': 'zeref-talk004-source-memory-verification-v1',
              'record_count': 352,
              'combined_ledger_sha256': hashlib.sha256(combined).hexdigest(),
              'ledger_tip_sha256': previous,
              'canonical_source_modified': False,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Download exact TALK-004 checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 32075092605 -n zeref-talk4-tuned-response-32075092605 -D _talk4src
          PARENT=$(find _talk4src -type f -path '*/ZEREF-DAD-SON-TALK-004/checkpoint.pt' -print -quit)
          test -n "$PARENT" -a -f "$PARENT"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK4_SHA256"
          printf '%s\n' "$PARENT" > _cory/checkpoint-path.txt

      - name: Locate exact TALK-004 heartbeat by SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          target = '19ca6272546d651ff8f1bb0e0184a842f5444b048ff63df6ea12b0be72e030c7'
          roots = [Path('experiments'), Path('_talk4src')]
          found = []
          heartbeat_named = []
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  if 'heartbeat' in p.name.lower():
                      heartbeat_named.append(p)
                  try:
                      h = hashlib.sha256(p.read_bytes()).hexdigest()
                  except OSError:
                      continue
                  if h == target:
                      found.append(p)
          if len(found) != 1:
              print('Exact heartbeat matches:', [str(p) for p in found])
              print('Heartbeat-named candidates:', [str(p) for p in heartbeat_named[:100]])
              raise SystemExit(f'expected exactly one heartbeat SHA match, got {len(found)}')
          Path('_cory/heartbeat-path.txt').write_text(str(found[0]) + '\n', encoding='utf-8')
          print('HEARTBEAT_PATH=' + str(found[0]))
          PY

      - name: Install CPU inference runtime
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify exact frozen inputs immediately before inference
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _cory/checkpoint-path.txt)
          HEARTBEAT=$(cat _cory/heartbeat-path.txt)
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK4_SHA256"
          test "$(sha256sum _cory/source-ledger.jsonl | awk '{print $1}')" = "$LEDGER_SHA256"
          test "$(sha256sum "$HEARTBEAT" | awk '{print $1}')" = "$HEARTBEAT_SHA256"
          test "$(grep -cve '^$' _cory/source-ledger.jsonl)" = "352"

      - name: Execute paired 10-turn Cory probe
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _cory/checkpoint-path.txt)
          HEARTBEAT=$(cat _cory/heartbeat-path.txt)
          python scripts/run_zeref_r12_cory_probe.py \
            --checkpoint "$PARENT" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --source-ledger _cory/source-ledger.jsonl \
            --source-sqlite _cory/source.sqlite3 \
            --heartbeat "$HEARTBEAT" \
            --out-dir _cory/evidence/probe \
            --session-id zeref-r12-final-cory-probe-001 \
            --seed 2026082701 \
            --tokens 48 \
            --recall-limit 2 \
            --temperature 0.65 \
            --top-k 8

      - name: Verify frozen inputs after inference and print transcript
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _cory/checkpoint-path.txt)
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK4_SHA256"
          test "$(sha256sum _cory/source-ledger.jsonl | awk '{print $1}')" = "$LEDGER_SHA256"
          test "$(grep -cve '^$' _cory/source-ledger.jsonl)" = "352"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('_cory/evidence/probe/summary.json')
          s = json.loads(p.read_text(encoding='utf-8'))
          print('PROBE_OUTCOME=' + s['outcome'])
          print('B_LIVE_COVERAGE=' + str(s['b_live_epoch_coverage']))
          print('A_LIVE_COVERAGE=' + str(s['a_live_epoch_coverage']))
          print('OUTPUT_DIFFERENCE_RATE=' + str(s['output_difference_rate']))
          for i, output in enumerate(s['b_outputs'], 1):
              print(f'ZEREF_B_{i}={output!r}')
          PY

      - name: Seal run-level SHA256SUMS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d _cory/evidence ]; then
            python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path('_cory/evidence')
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'SHA256SUMS')
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}" for p in files]
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY
          fi

      - name: Upload immutable Cory probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-r12-final-cory-probe-${{ github.run_id }}
          path: _cory/evidence
          if-no-files-found: warn
          retention-days: 90
