name: Persist Trinity validation diagnostics

on:
  push:
    branches:
      - 'agent/zeref-quantum-divergence'
    paths:
      - '.github/workflows/zeref-trinity-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zeref-quantum-divergence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install divergence dependencies without losing diagnostics
        id: install
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            python -m pip install --upgrade pip
            pip install -e '.[dev,quantum]'
          } 2>&1 | tee trinity-diagnostic-install.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run divergence tests when install passed
        id: tests
        if: steps.install.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest -vv -x tests/test_quantum_divergence_*.py 2>&1 | tee trinity-diagnostic-tests.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist sanitized diagnostic receipt
        if: always()
        shell: bash
        env:
          INSTALL_CODE: ${{ steps.install.outputs.exit_code }}
          TEST_CODE: ${{ steps.tests.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          def tail(path, n=220):
              p = Path(path)
              if not p.exists():
                  return '<not produced>'
              lines = p.read_text(encoding='utf-8', errors='replace').splitlines()
              return '\n'.join(lines[-n:])

          install_code = os.environ.get('INSTALL_CODE') or '<unset>'
          test_code = os.environ.get('TEST_CODE') or '<unset>'
          text = (
              f'INSTALL_EXIT_CODE={install_code}\n'
              f'TEST_EXIT_CODE={test_code}\n\n'
              '=== INSTALL TAIL ===\n' + tail('trinity-diagnostic-install.log') + '\n\n'
              '=== TEST TAIL ===\n' + tail('trinity-diagnostic-tests.log') + '\n'
          )
          root = Path('evidence/dev')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'trinity-diagnostic-latest.txt').write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/zeref-quantum-divergence
          git add evidence/dev/trinity-diagnostic-latest.txt
          git commit -m "evidence: persist Trinity diagnostic ${GITHUB_RUN_ID}" || true
          git push origin HEAD:agent/zeref-quantum-divergence

      - name: Fail after receipt if a gate failed
        if: always()
        env:
          INSTALL_CODE: ${{ steps.install.outputs.exit_code }}
          TEST_CODE: ${{ steps.tests.outputs.exit_code }}
        run: |
          test "${INSTALL_CODE:-1}" = '0'
          test "${TEST_CODE:-1}" = '0'
