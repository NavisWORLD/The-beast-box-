name: Published 14K null-output preserved diagnostic (post-hoc; no promotion)
on:
  push:
    branches: [feature/cosmos-rawrphos-unified-runtime-001]
    paths:
      - .github/workflows/unified-real-14k-null-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-pinned-checkpoint-no-private-data:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pinned public offline CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e . -e ./models/rawrphos
      - name: Fetch and independently verify the exact previously observed published 14K
        run: |
          mkdir -p build
          python models/rawrphos/scripts/install_pinned_14k.py --destination build/pinned-14k > build/pinned-14k-install.json
      - name: Preserve original failure and explain EOS/tokenizer behavior without modifying original weights
        run: |
          python - <<'PY'
          import hashlib
          import json
          import time
          from pathlib import Path
          import torch
          from rawrphos.inference.engine import Engine
          from rawrphos.scripts.install_pinned_14k import WEIGHT_SHA, verify
          from beastbox.durable import DurableRuntime
          from rawrphos.adapters.beastbox_provider import NativeProvider
          from tempfile import TemporaryDirectory

          folder=Path("build/pinned-14k")
          assert verify(folder)==WEIGHT_SHA
          engine=Engine(folder,max_new_tokens=64,threads=2,expected_sha256=WEIGHT_SHA)
          prompts=[
              ("raw-first", "Hello, Beast. This is a PUBLIC SYNTHETIC TEST."),
              ("chat-prefill", "user: Hello, Beast.\\nassistant:".replace("\\n","\n")),
              ("training-sounding", "user: I'm so confused phos.\\nassistant:".replace("\\n","\n")),
              ("short-neutral", "The cat"),
          ]
          records=[]
          for label,prompt in prompts:
              ids=engine.tokenizer.encode(prompt,add_bos=True)
              with torch.inference_mode():
                  logits=engine.model(torch.tensor([ids]))["logits"][:,-1,:].float()
                  predicted=logits.argmax(-1).item()
                  eos_rank=int((logits[0]>logits[0,engine.tokenizer.eos_id]).sum().item())+1
                  first_is_eos=predicted==engine.tokenizer.eos_id
              start=time.perf_counter()
              text=engine.complete(prompt,max_tokens=32,temperature=0,seed=67)
              seconds=time.perf_counter()-start
              data=engine.last_metrics.copy()
              records.append({
                  "label":label,
                  "prompt_sha256":hashlib.sha256(prompt.encode()).hexdigest(),
                  "tokens_in_prompt":len(ids),
                  "greedy_next_is_eos":first_is_eos,
                  "eos_logit_rank":eos_rank,
                  "output_nonempty":bool(text.strip()),
                  "output_sha256":hashlib.sha256(text.encode()).hexdigest(),
                  "generated_tokens":data.get("generated_tokens"),
                  "full_response_ms":round(seconds*1000,2),
              })
          # Post-hoc probe distinguishes the EOS stop mechanism, never replaces
          # a successful production conversation evaluation.
          forced=[]
          prompt=prompts[1][1]
          from rawrphos.architecture.generation import generate
          ids=engine.tokenizer.encode(prompt,add_bos=True)
          g=torch.Generator().manual_seed(67)
          with torch.inference_mode():
              for token,_ in generate(engine.model,torch.tensor([ids]),max_new_tokens=8,temperature=0,
                                     eos_token_id=None,generator=g,use_cache=True):
                  forced.append(token)
          forced_text=engine.tokenizer.decode(forced)
          report={
             "schema":"real-published-14k-posthoc-null-diagnostic-v1",
             "checkpoint_sha256":WEIGHT_SHA,
             "source_commit":"${{ github.sha }}",
             "prior_failing_run_id":36445533195,
             "prior_first_user_turn_output_blank":True,
             "model_weights_mutated":False,
             "no_private_owner_memory":True,
             "no_paid_inference":True,
             "posthoc_prompts_not_pre_registered":True,
             "actual_greedy_outputs":records,
             "forced_ignore_eos_research_only":{
                 "first_tokens_eos_count":sum(t==engine.tokenizer.eos_id for t in forced),
                 "nonempty_utf8_text":bool(forced_text.strip()),
                 "generated_tokens":len(forced),
                 "not_accepted_as_conversation":True,
             },
             "pass_criteria":"descriptive only; original blank user turn remains a failure",
          }
          Path("build/14k-posthoc-null-diagnostic.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("PUBLISHED_14K_NULL_DIAGNOSTIC="+json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-published-14k-null-diagnostic
          path: |
            build/pinned-14k-install.json
            build/14k-posthoc-null-diagnostic.json
          if-no-files-found: warn
