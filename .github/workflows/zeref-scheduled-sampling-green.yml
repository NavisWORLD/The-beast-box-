name: ZEREF SCHEDULED SAMPLING GREEN + REGRESSION

on:
  push:
    branches: [zeref-talk006-dialogue-tune-001]
    paths:
      - '.github/workflows/zeref-scheduled-sampling-green.yml'

permissions:
  contents: read

jobs:
  green-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test runtime
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run exact scheduled-sampling contract
        run: python -m pytest -q tests/test_zeref_scheduled_sampling.py
      - name: Run complete repository regression suite
        run: python -m pytest -q
