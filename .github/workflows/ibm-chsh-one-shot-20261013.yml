name: IBM CHSH 2026-10-13 - one real hardware job

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ibm-chsh-one-shot-20261013.yml'
      - 'scripts/ibm_chsh_one_shot_20261013.py'

permissions:
  contents: read

concurrency:
  group: navisworld-ibm-chsh-20261013-one-physical-job
  cancel-in-progress: false

jobs:
  one-real-ibm-chsh-witness:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/ibm-chsh-20261013' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source and run local non-hardware preflight tests
        run: |
          python -m py_compile scripts/ibm_chsh_one_shot_20261013.py
          python -m unittest discover -s tests -p test_ibm_open_plan_preflight.py -v
      - name: Install IBM Quantum SDK
        run: python -m pip install 'qiskit-ibm-runtime>=0.45,<0.50' 'qiskit>=2.1,<2.5'
      - name: Verify math, check free Open Plan quota, submit at most one actual QPU job, retrieve counts and CHSH witness
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          BEAST_CHSH_EXPLICIT_AUTHORIZATION: RUN_ONE_IBM_BELL_JOB_20261013
        run: PYTHONPATH=scripts:. python scripts/ibm_chsh_one_shot_20261013.py
      - name: Preserve real IBM receipts or exact failure details, never a fake pass
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibm-chsh-one-shot-${{ github.run_id }}
          path: _ibm_chsh_one_shot_20261013/
          retention-days: 30
          if-no-files-found: warn
