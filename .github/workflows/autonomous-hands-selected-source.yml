name: Zeref Native Hands Selected Source

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/autonomous-hands-selected-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hugging Face client
        run: python -m pip install --upgrade 'huggingface-hub>=0.27'
      - name: Materialize selected pinned source only
        env:
          HF_REPO: phera-ra/QC67_cosmo
          HF_REVISION: b414724c627300c41b099dcc6853766d08fd27a4
        run: |
          set -euo pipefail
          rm -rf /tmp/zeref-selected
          mkdir -p /tmp/zeref-selected
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          import hashlib, json, os, shutil

          repo = os.environ['HF_REPO']
          revision = os.environ['HF_REVISION']
          files = [
              'START_CODER.bat',
              'launchers/START_CODER.bat',
              'serving/cosmos_coder.py',
              'serving/cosmos_serve.py',
              'scripts/creature_system.py',
              'scripts/creature_api.py',
              'genesis_engine/soul/coding_base.py',
              'genesis_engine/soul/loop.py',
              'soul/awaken.py',
              'soul/cosmos_bridge.py',
              'soul/math_hand.py',
              'architecture/cosmos-arch.patch',
              'architecture/llama_cpp_cosmos.cpp',
          ]
          out = Path('/tmp/zeref-selected')
          manifest = {}
          for rel in files:
              src = Path(hf_hub_download(repo_id=repo, filename=rel, revision=revision, repo_type='model'))
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              manifest[rel] = hashlib.sha256(dst.read_bytes()).hexdigest()
          (out / 'SELECTED_SHA256.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          for rel, sha in manifest.items():
              print(f'{sha}  {rel}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zeref-native-selected-source
          path: /tmp/zeref-selected
          if-no-files-found: error
