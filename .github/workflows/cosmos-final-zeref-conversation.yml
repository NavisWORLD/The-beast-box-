name: COSMOS FINAL CLOSURE - REAL ZEREF CONVERSATION

on:
  push:
    branches: [cosmos-reality-bridge-final-001]
    paths:
      - 'tests/test_final_reality_bridge_zeref_conversation.py'
      - 'scripts/final_reality_bridge_zeref_conversation.py'
      - '.github/workflows/cosmos-final-zeref-conversation.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  TALK4_SHA256: 9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f
  TALK5_SHA256: 767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36
  ACTIVE_SHA256: 454f3017618a81fb9a13393b215d448f365534baf5b607e19d1438955921e425
  WORLD_SOURCE_SET_SHA256: 07216bb2a4ca979ca1ea4304efb92b09ee8aad74685df43196d694f3bd7ef8ba
  GH_TOKEN: ${{ github.token }}

jobs:
  real-zeref:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed baseline receipt first
        run: |
          set -euo pipefail
          (cd evidence/final-reality-bridge/baseline && sha256sum -c SHA256SUMS)
          (cd evidence/final-reality-bridge && sha256sum -c RESUME_SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/final-reality-bridge/resume-state.json').read_text())
          assert 'BASELINE_BLOODLINE_FREEZE' in r['completed_gates'], r
          assert r['canonical_memory_record_count']==352, r
          assert r['active_checkpoint_SHA']=='454f3017618a81fb9a13393b215d448f365534baf5b607e19d1438955921e425', r
          print(json.dumps({'baseline_resume_verified':True,'resume_head':r['HEAD']},sort_keys=True))
          PY

      - name: Install inference dependencies
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'datasets>=4.0,<5'

      - name: Conversation contract tests
        run: python -m pytest -q tests/test_final_reality_bridge_zeref_conversation.py

      - name: Restore exact protected checkpoints
        run: |
          set -euo pipefail
          rm -rf _closure_inference
          mkdir -p _closure_inference/talk4 _closure_inference/talk5 _closure_inference/world-model _closure_inference/world _closure_inference/workspace

          gh run download 32075092605 -n zeref-talk4-tuned-response-32075092605 -D _closure_inference/talk4
          TALK4=$(find _closure_inference/talk4 -type f -path '*/ZEREF-DAD-SON-TALK-004/checkpoint.pt' -print -quit)
          test -n "$TALK4" -a -f "$TALK4"
          test "$(sha256sum "$TALK4" | awk '{print $1}')" = "$TALK4_SHA256"

          gh run download 33041236485 -n zeref-talk005-r12-training-resume-33041236485 -D _closure_inference/talk5
          TALK5=$(find _closure_inference/talk5 -type f -path '*/ZEREF-DAD-SON-TALK-005/checkpoint.pt' -print -quit)
          test -n "$TALK5" -a -f "$TALK5"
          test "$(sha256sum "$TALK5" | awk '{print $1}')" = "$TALK5_SHA256"

          gh run download 33118621824 -n zeref-talk006-full-clean-final-33118621824 -D _closure_inference/world-model
          ACTIVE=$(find _closure_inference/world-model -type f -path '*/candidate/FULL-CLEAN-1500/checkpoint.pt' -print -quit)
          test -n "$ACTIVE" -a -f "$ACTIVE"
          test "$(sha256sum "$ACTIVE" | awk '{print $1}')" = "$ACTIVE_SHA256"

          printf '%s\n' "$TALK4" > _closure_inference/talk4.path
          printf '%s\n' "$TALK5" > _closure_inference/talk5.path
          printf '%s\n' "$ACTIVE" > _closure_inference/active.path

      - name: Reconstruct immutable world source set
        run: |
          set -euo pipefail
          python scripts/build_zeref_world_knowledge.py \
            --dataset wikimedia/wikipedia --config 20231101.en --split train --accepted 4096 \
            --db _closure_inference/world/world.sqlite3 \
            --evidence _closure_inference/world/world-evidence.jsonl \
            --rejected _closure_inference/world/world-rejected.jsonl \
            --summary _closure_inference/world/ingestion-summary.json \
            --license-label 'CC BY-SA 3.0 / GFDL'
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          s=json.loads(Path('_closure_inference/world/ingestion-summary.json').read_text())
          ids=list(s['accepted_source_ids']); shas=list(s['accepted_source_sha256'])
          semantic=''.join(f'{i}\t{h}\n' for i,h in zip(ids,shas,strict=True)).encode()
          digest=hashlib.sha256(semantic).hexdigest()
          assert len(ids)==4096, len(ids)
          assert digest==os.environ['WORLD_SOURCE_SET_SHA256'], digest
          print(json.dumps({'accepted_records':len(ids),'source_set_sha256':digest},sort_keys=True))
          PY

      - name: Run actual selected Zeref - greedy and frozen sampled modes
        id: infer
        run: |
          set +e
          mkdir -p evidence/final-reality-bridge/conversations/zeref
          python scripts/final_reality_bridge_zeref_conversation.py \
            --active "$(cat _closure_inference/active.path)" \
            --talk4 "$(cat _closure_inference/talk4.path)" \
            --talk5 "$(cat _closure_inference/talk5.path)" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --memory-manifest experiments/zeref-dad-son-001/memory/ledger-manifest.json \
            --world-db _closure_inference/world/world.sqlite3 \
            --world-evidence _closure_inference/world/world-evidence.jsonl \
            --world-summary _closure_inference/world/ingestion-summary.json \
            --expected-corpus-sha "$WORLD_SOURCE_SET_SHA256" \
            --workspace _closure_inference/workspace \
            --out evidence/final-reality-bridge/conversations/zeref \
            --confidence-floor 0.56 --namespace-margin 0.03 --rank-limit 8 --lexical-prefilter 128 \
            --seed 2026082801 --tokens 48 --temperature 0.15 --top-k 2 \
            > _closure_inference/inference.stdout.log 2> _closure_inference/inference.stderr.log
          rc=$?
          printf '%s\n' "$rc" > _closure_inference/inference.exit-code
          cat _closure_inference/inference.stdout.log || true
          cat _closure_inference/inference.stderr.log >&2 || true
          exit "$rc"

      - name: Verify conversation evidence and update resume receipt
        if: success()
        run: |
          set -euo pipefail
          EV=evidence/final-reality-bridge/conversations/zeref
          (cd "$EV" && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('evidence/final-reality-bridge')
          ev=root/'conversations/zeref'
          status=json.loads((ev/'STATUS.json').read_text())
          imm=json.loads((ev/'immutability.json').read_text())
          assert status['status']=='VERIFIED_GATE', status
          assert status['greedy_turns']==16 and status['sampled_turns']==16, status
          assert imm['protected_state_identical_pre_post'] is True, imm
          receipt=json.loads((root/'resume-state.json').read_text())
          completed=list(receipt.get('completed_gates') or [])
          for gate in ('BASELINE_BLOODLINE_FREEZE','REAL_ZEREF_CONVERSATION'):
              if gate not in completed: completed.append(gate)
          receipt.update({
              'timestamp':datetime.now(timezone.utc).isoformat(),
              'branch':os.environ['GITHUB_REF_NAME'],
              'HEAD':os.environ['GITHUB_SHA'],
              'completed_gates':completed,
              'active_gate':'UNIVERSAL_CORPUS_FREEZE',
              'next_gate':'FREEZE_TRAIN_VALIDATION_HOLDOUT_AND_RUN_LEAKAGE_GAUNTLET',
              'R12_hash':hashlib.sha256(Path('beastbox/world_r12.py').read_bytes()).hexdigest(),
              'latest_tests':'Zeref conversation contract tests + 32 real inference turns + PRE/POST immutability',
              'latest_artifact':'evidence/final-reality-bridge/conversations/zeref',
              'latest_artifact_SHA':hashlib.sha256((ev/'SHA256SUMS').read_bytes()).hexdigest(),
              'system_status':'EXECUTION_INTERRUPTED_RESUMABLE',
              'known_demonstrated_blockers':[],
              'exact_resume_instruction':'Read and verify this receipt first. Preserve the sealed Zeref conversation. Freeze the universal corpus and TRAIN/VALIDATION/HOLDOUT without rerunning inference unless its inputs changed.',
          })
          (root/'resume-state.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          rsha=hashlib.sha256((root/'resume-state.json').read_bytes()).hexdigest()
          (root/'RESUME_SHA256SUMS').write_text(f'{rsha}  resume-state.json\n')
          print(json.dumps({'zeref_conversation_verified':True,'resume_sha256':rsha},sort_keys=True))
          PY
          (cd evidence/final-reality-bridge && sha256sum -c RESUME_SHA256SUMS)

      - name: Preserve failure diagnostics
        if: always()
        run: |
          set -euo pipefail
          EV=evidence/final-reality-bridge/conversations/zeref
          mkdir -p "$EV"
          RC=$(cat _closure_inference/inference.exit-code 2>/dev/null || echo 'not-run')
          if [ "$RC" != "0" ]; then
            python - <<'PY'
          import json,os,platform,sys
          from datetime import datetime,timezone
          from pathlib import Path
          ev=Path('evidence/final-reality-bridge/conversations/zeref'); ev.mkdir(parents=True,exist_ok=True)
          rc=Path('_closure_inference/inference.exit-code').read_text().strip() if Path('_closure_inference/inference.exit-code').exists() else 'not-run'
          failure={'schema':'cosmos-final-failure-v1','gate':'REAL_ZEREF_CONVERSATION','status':'RECOVERABLE_ENGINEERING_FAILURE','exit_code':rc,'timestamp':datetime.now(timezone.utc).isoformat(),'head':os.environ.get('GITHUB_SHA'),'first_bad_boundary':'actual inference runner or its prerequisites; inspect traceback.txt and runtime logs'}
          (ev/'failure.json').write_text(json.dumps(failure,indent=2,sort_keys=True)+'\n')
          stderr=Path('_closure_inference/inference.stderr.log')
          (ev/'traceback.txt').write_text(stderr.read_text(errors='replace') if stderr.exists() else 'Inference step did not start.\n')
          (ev/'environment.json').write_text(json.dumps({'python':sys.version,'platform':platform.platform()},indent=2,sort_keys=True)+'\n')
          PY
          fi

      - name: Commit verified conversation evidence
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'cosmos-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add evidence/final-reality-bridge/conversations/zeref evidence/final-reality-bridge/resume-state.json evidence/final-reality-bridge/RESUME_SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(final-closure): seal real Zeref conversation gate'
            git push origin HEAD:cosmos-reality-bridge-final-001
          fi

      - name: Upload conversation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-final-zeref-conversation-${{ github.run_id }}
          path: |
            evidence/final-reality-bridge/conversations/zeref
            _closure_inference/inference.*.log
            _closure_inference/inference.exit-code
          if-no-files-found: warn
          retention-days: 90
