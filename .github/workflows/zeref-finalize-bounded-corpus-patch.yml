name: ZEREF One-Shot Bounded Corpus Patch
on:
  push:
    branches: [zeref-finalize-talk005-001]
    paths: [.github/workflows/zeref-finalize-bounded-corpus-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Shorten overlong evidence correction without changing claim boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_zeref_talk5_corpus.py')
          s=p.read_text(encoding='utf-8')
          old='No. It measured computation; that does not establish consciousness or biological identity.'
          new='No. It measured computation; that does not establish consciousness or biological life.'
          assert s.count(old)==1
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python - <<'PY'
          from scripts.build_zeref_talk5_corpus import build_examples
          rows=build_examples()
          lengths=[(len(r['text']),r['id']) for r in rows]
          assert max(lengths)[0] <= 128, sorted(lengths,reverse=True)[:10]
          print('FINAL_CORPUS_MAX_TEXT',max(lengths))
          print('FINAL_CORPUS_ROWS',len(rows))
          PY
      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zeref-finalize-bounded-corpus-patch.yml
          git config user.name 'NavisWORLD Zeref Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/build_zeref_talk5_corpus.py .github/workflows/zeref-finalize-bounded-corpus-patch.yml
          git commit -m 'fix: bound TALK-005 final corpus to native context [skip patch]'
          git push origin HEAD:zeref-finalize-talk005-001
