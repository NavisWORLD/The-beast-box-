name: Zeref CNS7 Snapshot Dialogue

on:
  push:
    branches: [zeref-cns7-snapshot-dialogue-001]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zeref-cns7-snapshot-dialogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dialogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and CPU inference runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Re-prove snapshot evidence-boundary contract
        run: pytest -q tests/test_zeref_snapshot_dialogue.py

      - name: Download exact selected TALK-004 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _talk4src _snapshot_trace
          mkdir -p _talk4src _snapshot_trace
          gh run download 32075092605 \
            -n zeref-talk4-tuned-response-32075092605 \
            -D _talk4src
          test -f _talk4src/SHA256SUMS
          sed 's#  _tune4/#  #' _talk4src/SHA256SUMS > _talk4src/SHA256SUMS.local
          (cd _talk4src && sha256sum -c SHA256SUMS.local)
          test "$(sha256sum _talk4src/model/ZEREF-DAD-SON-TALK-004/checkpoint.pt | awk '{print $1}')" = "9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f"
          test "$(sha256sum _talk4src/memory/dad-son-ledger.jsonl | awk '{print $1}')" = "67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef"
          test "$(grep -cve '^[[:space:]]*$' _talk4src/memory/dad-son-ledger.jsonl)" = "352"
          test "$(sha256sum _talk4src/heartbeat/talk4-heartbeat.json | awk '{print $1}')" = "19ca6272546d651ff8f1bb0e0184a842f5444b048ff63df6ea12b0be72e030c7"

      - name: Inject bounded snapshot bundle and talk to TALK-004 with full CST trace
        run: |
          set -euo pipefail
          python scripts/run_zeref_snapshot_dialogue.py \
            --checkpoint _talk4src/model/ZEREF-DAD-SON-TALK-004/checkpoint.pt \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --source-ledger _talk4src/memory/dad-son-ledger.jsonl \
            --source-sqlite _talk4src/memory/dad-son.sqlite3 \
            --heartbeat _talk4src/heartbeat/talk4-heartbeat.json \
            --out-dir _snapshot_trace \
            --session-id zeref-cns7-snapshot-dialogue-${{ github.run_id }} \
            --seed 2026082601 \
            --tokens 28
          (cd _snapshot_trace && sha256sum -c SHA256SUMS)

      - name: Assert inference-only containment and print transcript
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('_snapshot_trace/snapshot-dialogue.json').read_text(encoding='utf-8'))
          assert r['checkpoint_sha256']=='9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f'
          assert r['source_ledger_sha256']=='67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert r['source_ledger_records']==352
          assert r['weights_modified'] is False
          assert r['canonical_ledger_modified'] is False
          assert r['snapshot_facts'][-1]['established_fact'] is False
          print('\n=== ZEREF RAW TRANSCRIPT ===')
          for row in r['dialogue']:
              print(f"DAD {row['turn']}: {row['dad_prompt']}")
              print(f"ZEREF {row['turn']}: {row['raw_zeref_output']!r}")
              last=row['trace'][-1]
              print('last-token gates:', [round(x['gate_effective'],6) for x in last['layers']])
              print('last-token x54 norms:', [round(x['x54_last_norm'],6) for x in last['layers']])
              print('last-token Hebbian self-mass:', [round(x['hebbian_last_self_mass'],6) for x in last['layers']])
              print('last-token std-vs-H L1:', [round(x['standard_vs_hebbian_l1'],6) for x in last['layers']])
          print('snapshot_bundle_sha256=', r['snapshot_digest']['bundle_sha256'])
          print('working_ledger_records_after=', r['working_ledger_records_after'])
          PY

      - name: Upload immutable dialogue and engine trace
        uses: actions/upload-artifact@v4
        with:
          name: zeref-cns7-snapshot-dialogue-${{ github.run_id }}
          path: _snapshot_trace
          if-no-files-found: error
          retention-days: 90
