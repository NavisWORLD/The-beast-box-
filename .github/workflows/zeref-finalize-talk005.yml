name: ZEREF Finalize TALK-005 Integration

on:
  push:
    branches: [zeref-finalize-talk005-001]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Zeref/R12/training/lineage tests
        run: >-
          python -m pytest -q
          tests/test_r12_refractive_memory.py
          tests/test_zeref_r12_live_loop.py
          tests/test_zeref_talk5_protocol.py
          tests/test_zeref_lineage_manifest.py
      - name: Full repository suite
        run: python -m pytest -q
