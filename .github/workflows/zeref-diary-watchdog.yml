name: Zeref diary loop watchdog (Rigetti QVM SIMULATED)
# GitHub delays/drops the 30-min cron. Every ~20 min this checks the diary loop's last run and dispatches
# one tick if none has started in 50 minutes. Concurrency on the loop itself prevents overlap. $0, simulator only.
on:
  schedule:
    - cron: '2,22,42 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: zeref-diary-watchdog
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          last=$(gh run list -R "$R" -w zeref-diary-loop.yml -L 1 --json createdAt -q '.[0].createdAt // "1970-01-01T00:00:00Z"')
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          echo "last diary run $last (${age}s ago)"
          if [ "$age" -gt 3000 ]; then gh workflow run zeref-diary-loop.yml -R "$R" --ref main && echo "dispatched one tick"; fi
