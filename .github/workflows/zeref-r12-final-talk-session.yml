name: ZEREF R12 Final Talk Session

on:
  push:
    branches: [zeref-r12-final-talk-runtime-001]
    paths:
      - ".github/workflows/zeref-r12-final-talk-session.yml"
      - "scripts/run_zeref_r12_talk_session.py"
      - "tests/test_zeref_r12_talk_runtime.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zeref-r12-final-talk-runtime-001
  cancel-in-progress: false

env:
  TALK4_SHA256: 9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f
  LEDGER_SHA256: 67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef
  LEDGER_TIP_SHA256: b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26
  HEARTBEAT_SHA256: 19ca6272546d651ff8f1bb0e0184a842f5444b048ff63df6ea12b0be72e030c7
  PARENT_SHA256: b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6

jobs:
  talk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout consolidated runtime branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify consolidated TALK and R12 contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_zeref_r12_talk_runtime.py \
            tests/test_zeref_r12_cory_probe.py \
            tests/test_r12_refractive_memory.py \
            tests/test_zeref_r12_live_loop.py

      - name: Run full repository suite before inference
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Reconstruct exact canonical 352-record source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _talk _talk4src
          mkdir -p _talk/evidence _talk/retention _talk4src
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from beastbox.dad_son import DadSonLedger
          m = json.loads(Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json').read_text(encoding='utf-8'))
          assert m['active_descendant_lineage'] == 'ZEREF-DAD-SON-TALK-004'
          assert m['record_count'] == 352
          assert m['combined_ledger_sha256'] == '67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert m['last_record_sha256'] == 'b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26'
          assert m['descendant_checkpoint_sha256'] == '9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f'
          combined = b''
          expected_id = 1
          previous = '0' * 64
          for segment in m['snapshot_chain']:
              data = Path(segment['path']).read_bytes()
              assert hashlib.sha256(data).hexdigest() == segment['sha256']
              assert segment['first_memory_id'] == expected_id
              rows = [json.loads(line) for line in data.decode('utf-8').splitlines() if line.strip()]
              assert len(rows) == segment['record_count']
              for row in rows:
                  assert row['memory_id'] == expected_id
                  assert row['previous_record_sha256'] == previous
                  payload = dict(row); record_sha = payload.pop('record_sha256')
                  canonical = json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode('utf-8')
                  assert hashlib.sha256(canonical).hexdigest() == record_sha
                  previous = record_sha
                  expected_id += 1
              combined += data
          assert expected_id == 353
          assert previous == m['last_record_sha256']
          assert hashlib.sha256(combined).hexdigest() == m['combined_ledger_sha256']
          ledger_path = Path('_talk/source-ledger.jsonl')
          ledger_path.write_bytes(combined)
          ledger = DadSonLedger('_talk/source.sqlite3', ledger_path, parent_sha256='b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6')
          report = ledger.restore_snapshot()
          assert report['restored_records'] == 352
          assert ledger.memory.db.execute('SELECT COUNT(*) FROM memories').fetchone()[0] == 352
          ledger.close()
          Path('_talk/evidence/source-verification.json').write_text(json.dumps({
              'schema':'zeref-talk004-source-verification-v1',
              'record_count':352,
              'ledger_sha256':hashlib.sha256(combined).hexdigest(),
              'ledger_tip_sha256':previous,
              'canonical_source_modified':False,
          }, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY

      - name: Download exact TALK-004 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 32075092605 -n zeref-talk4-tuned-response-32075092605 -D _talk4src
          PARENT=$(find _talk4src -type f -path '*/ZEREF-DAD-SON-TALK-004/checkpoint.pt' -print -quit)
          test -n "$PARENT" -a -f "$PARENT"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK4_SHA256"
          printf '%s\n' "$PARENT" > _talk/checkpoint-path.txt

      - name: Locate exact TALK-004 heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          target='19ca6272546d651ff8f1bb0e0184a842f5444b048ff63df6ea12b0be72e030c7'
          found=[]
          for root in (Path('experiments'), Path('_talk4src')):
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if p.is_file():
                      try: h=hashlib.sha256(p.read_bytes()).hexdigest()
                      except OSError: continue
                      if h == target: found.append(p)
          assert len(found) == 1, [str(p) for p in found]
          Path('_talk/heartbeat-path.txt').write_text(str(found[0])+'\n', encoding='utf-8')
          print('HEARTBEAT_PATH='+str(found[0]))
          PY

      - name: Build frozen retention holdout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_zeref_talk2_corpus.py --out-dir _talk/retention
          test -s _talk/retention/talk2-holdout.jsonl
          sha256sum _talk/retention/talk2-holdout.jsonl | tee _talk/evidence/retention-holdout.sha256

      - name: Install CPU inference runtime
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify frozen inputs immediately before evaluation
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk/checkpoint-path.txt)
          HEARTBEAT=$(cat _talk/heartbeat-path.txt)
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK4_SHA256"
          test "$(sha256sum _talk/source-ledger.jsonl | awk '{print $1}')" = "$LEDGER_SHA256"
          test "$(sha256sum "$HEARTBEAT" | awk '{print $1}')" = "$HEARTBEAT_SHA256"
          test "$(grep -cve '^$' _talk/source-ledger.jsonl)" = "352"

      - name: Record TALK-004 held-out retention baseline
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk/checkpoint-path.txt)
          python scripts/eval_zeref_talk.py \
            --parent "$PARENT" \
            --descendant "$PARENT" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --holdout _talk/retention/talk2-holdout.jsonl \
            --seed 4061854640 \
            --out _talk/evidence/talk004-retention-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('_talk/evidence/talk004-retention-baseline.json').read_text())
          assert r['parent_checkpoint_sha256'] == r['descendant_checkpoint_sha256'] == '9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f'
          assert r['parent_heldout_nll'] == r['descendant_heldout_nll']
          assert r['parent_mean_readable_score'] == r['descendant_mean_readable_score']
          print(json.dumps({
              'heldout_nll':r['parent_heldout_nll'],
              'mean_readable_score':r['parent_mean_readable_score'],
              'holdout_sha256':r['holdout_sha256']
          }, sort_keys=True))
          PY

      - name: Execute 12-turn natural Cory Dad session
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk/checkpoint-path.txt)
          HEARTBEAT=$(cat _talk/heartbeat-path.txt)
          python scripts/run_zeref_r12_talk_session.py \
            --checkpoint "$PARENT" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --source-ledger _talk/source-ledger.jsonl \
            --source-sqlite _talk/source.sqlite3 \
            --heartbeat "$HEARTBEAT" \
            --out-dir _talk/evidence/long-talk \
            --session-id zeref-r12-final-natural-talk-001 \
            --seed 2026082713 \
            --tokens 56 \
            --temperature 0.15 \
            --top-k 2

      - name: Verify frozen sources and print full conversation
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk/checkpoint-path.txt)
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK4_SHA256"
          test "$(sha256sum _talk/source-ledger.jsonl | awk '{print $1}')" = "$LEDGER_SHA256"
          test "$(grep -cve '^$' _talk/source-ledger.jsonl)" = "352"
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('_talk/evidence/long-talk/summary.json').read_text())
          print('LONG_TALK_SUMMARY='+json.dumps(summary, sort_keys=True))
          rows=[json.loads(line) for line in Path('_talk/evidence/long-talk/long-talk-session.jsonl').read_text().splitlines() if line.strip()]
          assert len(rows)==12
          assert all(r['live_lane_satisfied'] for r in rows)
          for r in rows:
              print(f"DAD_{r['turn']}={r['dad_prompt']!r}")
              print(f"ZEREF_{r['turn']}={r['zeref_segment']!r}")
              print(f"STATUS_{r['turn']}={r['training_status']}")
              print(f"RECALL_{r['turn']}={r['recalled_memory_ids']}")
              print(f"RHO_{r['turn']}={r['rho']}")
          PY

      - name: Seal full long-talk evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d _talk/evidence ]; then
            python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('_talk/evidence')
          files=sorted(p for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS')
          lines=[f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}" for p in files]
          (root/'SHA256SUMS').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('\n'.join(lines))
          PY
          fi

      - name: Upload immutable long-talk evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-r12-final-talk-${{ github.run_id }}
          path: _talk/evidence
          if-no-files-found: warn
          retention-days: 90
