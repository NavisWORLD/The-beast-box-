name: Stage 013 posthoc numeric diagnostic and Stage 014 independent metric preflight

on:
  push:
    branches: [experiment/rigetti-qvm-12d-feedback-012]
    paths:
      - '.github/workflows/qvm-rescore-013-and-preflight-014.yml'
      - 'beastbox/qvm_numeric_diagnostic_014.py'
      - 'tests/test_qvm_numeric_diagnostic_014.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preserve-original-and-analyze-captured-answers:
    if: github.repository == 'NavisWORLD/The-beast-box-'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project only and verify sealed independent score
        run: |
          python -m pip install -e . 'pytest>=8,<10'
          python -m pytest -q tests/test_qvm_cpu_comparison_013.py tests/test_qvm_numeric_diagnostic_014.py
      - name: Retrieve original completed 0.5B corrected-prompt response artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 36214021583
          repository: NavisWORLD/The-beast-box-
          github-token: ${{ github.token }}
          name: cosmos-stage013-public-cloud-cpu-model-qvm-control-results
          path: build/prior
      - name: Derive clearly posthoc numerical diagnostic without generating new model answers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from beastbox.qvm_cpu_comparison_013 import create_plan
          from beastbox.qvm_numeric_diagnostic_014 import analyze_prior_model_receipt
          source=json.loads(Path('evidence/stage012/live_azure_qvm_3job_public_receipt.json').read_text())
          plan=create_plan(source)
          prior=json.loads(Path('build/prior/stage013-public-open-weight-cpu-model-qvm-context-results.json').read_text())
          result=analyze_prior_model_receipt(plan,prior)
          assert result['analysis_status']=='POST_HOC_STAGE013_DIAGNOSTIC'
          assert result['cases']==15 and result['new_qvm_provider_jobs']==0
          Path('build/stage013-posthoc-numeric-diagnostic.json').write_text(
             json.dumps(result,indent=2,sort_keys=True)+'\n'
          )
          print('STAGE013_POSTHOC_NUMERIC_DIAGNOSTIC_PASS',flush=True)
          print('UNRANKED_POSTHOC_METRICS',json.dumps(result['per_arm_unranked'],sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-stage013-exploratory-posthoc-numeric-readout
          path: build/stage013-posthoc-numeric-diagnostic.json
          if-no-files-found: error
          retention-days: 21
