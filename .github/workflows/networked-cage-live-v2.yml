name: Networked Cage Live v2

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/networked-cage-live-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  HF_REPO: phera-ra/QC67_cosmo
  HF_CHECKPOINT: weights/spark_cst.pt
  HF_SERVER: serving/cosmos_serve.py
  RUN_ID: 2026-08-14-run-003
  DURATION: "1800"

jobs:
  cage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Beast Arms and native QC67 runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev,huggingface]'
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          chmod +x scripts/networked_cage.sh scripts/egress_proxy.py
          beast-arms --help
          python - <<'PY'
          import torch
          print('torch', torch.__version__)
          print('cuda_available', torch.cuda.is_available())
          PY

      - name: Cage smoke preflight
        run: |
          set -euo pipefail
          rm -rf runs/live-v3-preflight
          scripts/networked_cage.sh --smoke --duration 15 --out runs/live-v3-preflight
          cat runs/live-v3-preflight/evidence/network-smoke.json

      - name: Resolve and download exact native QC67 subject
        id: model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _subject
          mkdir -p _subject
          REVISION="$(python - <<'PY'
          from huggingface_hub import HfApi
          print(HfApi().model_info('phera-ra/QC67_cosmo').sha)
          PY
          )"
          python - "$REVISION" <<'PY'
          import pathlib, sys
          from huggingface_hub import HfApi, hf_hub_download
          revision = sys.argv[1]
          repo = 'phera-ra/QC67_cosmo'
          api = HfApi()
          files = api.list_repo_files(repo_id=repo, revision=revision)
          required = ['serving/cosmos_serve.py', 'weights/spark_cst.pt']
          missing = [p for p in required if p not in files]
          if missing:
              raise SystemExit(f'missing native QC67 runtime files: {missing}')
          wanted = required + [p for p in files if p.startswith('architecture/') and p.endswith('.py')]
          for path in sorted(set(wanted)):
              hf_hub_download(repo_id=repo, filename=path, revision=revision, local_dir='_subject')
              print('downloaded', path)
          PY
          MODEL_PATH="$(realpath "_subject/${HF_CHECKPOINT}")"
          MODEL_SHA256="$(sha256sum "$MODEL_PATH" | awk '{print $1}')"
          SERVER_SHA256="$(sha256sum "_subject/${HF_SERVER}" | awk '{print $1}')"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "path=$MODEL_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$MODEL_SHA256" >> "$GITHUB_OUTPUT"
          echo "server_sha256=$SERVER_SHA256" >> "$GITHUB_OUTPUT"
          echo "file=$HF_CHECKPOINT" >> "$GITHUB_OUTPUT"
          ls -lh "$MODEL_PATH" "_subject/${HF_SERVER}"

      - name: Build-check native QC67 architecture
        run: |
          set -euo pipefail
          python -m py_compile _subject/serving/cosmos_serve.py _subject/architecture/*.py
          python - <<'PY'
          import pathlib, sys
          root = pathlib.Path('_subject').resolve()
          sys.path.insert(0, str(root / 'architecture'))
          import cosmos_spark_cst
          print('native architecture import OK:', cosmos_spark_cst.__file__)
          PY

      - name: Start and verify native cosmos-cst subject server
        id: server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _model_logs
          (
            cd _subject
            python serving/cosmos_serve.py 18080 \
              > ../_model_logs/cosmos-serve.stdout.log \
              2> ../_model_logs/cosmos-serve.stderr.log
          ) &
          echo $! > _model_logs/cosmos-serve.pid
          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:18080/api/tags > _model_logs/tags.json 2>/dev/null; then
              break
            fi
            if ! kill -0 "$(cat _model_logs/cosmos-serve.pid)" 2>/dev/null; then
              cat _model_logs/cosmos-serve.stderr.log >&2
              exit 1
            fi
            sleep 1
          done
          cat _model_logs/tags.json
          curl --max-time 180 -fsS \
            -H 'Content-Type: application/json' \
            -d '{"model":"cosmos-cst","messages":[{"role":"user","content":"ping"}],"stream":false}' \
            http://127.0.0.1:18080/api/chat \
            > _model_logs/native-preflight.json
          cat _model_logs/native-preflight.json
          echo "native cosmos-cst inference ready"

      - name: Run the Beast for 30 minutes
        id: live
        shell: bash
        env:
          MODEL_REVISION: ${{ steps.model.outputs.revision }}
          MODEL_SHA256: ${{ steps.model.outputs.sha256 }}
          MODEL_SERVER_SHA256: ${{ steps.model.outputs.server_sha256 }}
          MODEL_FILE: ${{ steps.model.outputs.file }}
        run: |
          set -uo pipefail
          OUT="experiments/networked-cage/${RUN_ID}"
          mkdir -p "$OUT"
          python - <<'PY'
          import json, os, pathlib, platform
          out = pathlib.Path('experiments/networked-cage') / os.environ['RUN_ID']
          value = {
              'repository_commit': os.environ['GITHUB_SHA'],
              'runner_os': platform.platform(),
              'python': platform.python_version(),
              'runtime': 'QC67 native PyTorch Ollama-compatible server',
              'hf_repo': os.environ['HF_REPO'],
              'hf_file': os.environ['MODEL_FILE'],
              'hf_revision': os.environ['MODEL_REVISION'],
              'model_sha256': os.environ['MODEL_SHA256'],
              'server_sha256': os.environ['MODEL_SERVER_SHA256'],
              'configured_duration_seconds': int(os.environ['DURATION']),
          }
          (out / 'provenance.json').write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          beast-arms run \
            --base-url http://127.0.0.1:18080 \
            --backend ollama \
            --model cosmos-cst \
            --duration "$DURATION" \
            --run-id "$RUN_ID" \
            --out "$OUT" \
            --model-revision "$MODEL_REVISION" \
            --model-sha256 "$MODEL_SHA256" \
            --model-file "$MODEL_FILE"
          RUN_RC=$?
          echo "run_rc=$RUN_RC" >> "$GITHUB_OUTPUT"
          beast-arms verify "$OUT"
          VERIFY_RC=$?
          echo "verify_rc=$VERIFY_RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stop subject before publisher credentials exist
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f _model_logs/cosmos-serve.pid ]]; then
            kill "$(cat _model_logs/cosmos-serve.pid)" 2>/dev/null || true
            sleep 2
            kill -9 "$(cat _model_logs/cosmos-serve.pid)" 2>/dev/null || true
          fi
          rm -rf _subject

      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networked-cage-${{ env.RUN_ID }}
          path: |
            experiments/networked-cage/${{ env.RUN_ID }}
            _model_logs
          if-no-files-found: warn

      - name: Publish valid frozen evidence
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="experiments/networked-cage/${RUN_ID}"
          if [[ ! -f "$OUT/VERDICT.md" ]]; then
            echo "No verdict: preserving Actions artifact only; nothing invented or committed."
            exit 0
          fi
          beast-arms verify "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "No new evidence to publish"
            exit 0
          fi
          git commit -m "testlog: publish timed Networked Cage ${RUN_ID}"
          BASIC="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $BASIC" push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Final integrity gate
        if: always()
        run: |
          set -euo pipefail
          OUT="experiments/networked-cage/${RUN_ID}"
          test -f "$OUT/VERDICT.md"
          beast-arms verify "$OUT"
          test '${{ steps.live.outputs.verify_rc }}' = '0'
          test '${{ steps.live.outputs.run_rc }}' = '0'
