name: RAWRPHOS free-only private ZeroGPU activation
on:
  push:
    branches: [feature/rawrphos-native-model-001]
    paths:
      - ".github/workflows/rawrphos-free-zerogpu.yml"
      - "models/rawrphos/scripts/publish_free_zerogpu.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rawrphos-free-zerogpu-activation
  cancel-in-progress: false
jobs:
  free-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HFtoken }}
    steps:
      - uses: actions/checkout@v4
      - name: Require existing HF token (never print value)
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HFtoken secret unavailable; no Space created"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only checkpoint verifier and Hub client
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -e models/rawrphos 'huggingface_hub>=1.3,<2'
      - name: Static serving-code syntax gate
        run: |
          python -m py_compile models/rawrphos/scripts/publish_free_zerogpu.py \
            models/rawrphos/inference/snapshot.py models/rawrphos/inference/engine.py
      - name: Attempt ONLY free private ZeroGPU with exact 12K Hub snapshot
        run: |
          set -euo pipefail
          python models/rawrphos/scripts/publish_free_zerogpu.py --confirm
      - name: State limits plainly
        run: |
          echo "A created Space is still not an attested working API until its build and a real call pass."
          echo "No paid hardware, endpoint, plan upgrade, Railway edit or Vercel promotion authorized."
