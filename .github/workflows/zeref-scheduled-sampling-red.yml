name: ZEREF SCHEDULED SAMPLING RED CONTRACT

on:
  push:
    branches: [zeref-talk006-dialogue-tune-001]
    paths:
      - '.github/workflows/zeref-scheduled-sampling-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pytest -q tests/test_zeref_scheduled_sampling.py
