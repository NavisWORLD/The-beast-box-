name: Private Cosmos isolated Azure and QVM acceptance
on:
  workflow_dispatch:
    inputs:
      run_qvm:
        description: 'Attempt one authorized free 256-shot Rigetti cloud QVM smoke'
        type: boolean
        default: false
  push:
    branches: [feature/issue-323-private-cosmos-20261013]
    paths:
      - apps/beastbox-cloud/lib/cosmos/private-*
      - apps/beastbox-cloud/scripts/private-cosmos-cloud-probe.mjs
      - apps/beastbox-cloud/scripts/private-cosmos-http-probe.mjs
      - apps/beastbox-cloud/tests/private-cosmos.test.mjs
      - .github/workflows/private-cosmos-staging.yml
permissions:
  contents: read
concurrency:
  group: private-cosmos-isolated-323
  cancel-in-progress: false
jobs:
  isolated-private-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: apps/beastbox-cloud
        run: node --test tests/private-*.test.mjs
      - name: Verify the existing driver rejects paid targets and missing quotas
        run: python -m unittest discover -s tests -p test_private_qvm_bounds.py
      - name: Install the existing authenticated QVM driver dependencies
        run: python -m pip install --quiet 'qdk[azure]'
      - name: Isolated synthetic worlds, conditional cleanup and one bounded free QVM job
        working-directory: apps/beastbox-cloud
        env:
          BEASTBOX_PRIVATE_PROBE_APPROVAL: YES_ISOLATED_PRIVATE_TEST
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER_SAS_URL: ${{ secrets.AZURE_STORAGE_CONTAINER_SAS_URL }}
          AZURE_STORAGE_CONTAINER: beastbox
          AZURE_QUANTUM_CONNECTION_STRING: ${{ secrets.AZURE_QUANTUM_CONNECTION_STRING }}
          BEASTBOX_PRIVATE_QVM_SMOKE: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_qvm || github.event_name == 'push' && contains(github.event.head_commit.message, '[private-qvm-smoke]')) && 'true' || 'false' }}
        run: node scripts/private-cosmos-cloud-probe.mjs build/private-cosmos
      - name: Build the existing production application
        working-directory: apps/beastbox-cloud
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Actual signed ownership, pairing, cross-user denial and restart over HTTP
        working-directory: apps/beastbox-cloud
        env:
          BEASTBOX_PRIVATE_PROBE_APPROVAL: YES_ISOLATED_PRIVATE_TEST
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER_SAS_URL: ${{ secrets.AZURE_STORAGE_CONTAINER_SAS_URL }}
          AZURE_STORAGE_CONTAINER: beastbox
        run: node scripts/private-cosmos-http-probe.mjs build/private-cosmos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-cosmos-323-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/beastbox-cloud/build/private-cosmos/report.json
            apps/beastbox-cloud/build/private-cosmos/plan.json
            apps/beastbox-cloud/build/private-cosmos/qvm-raw.json
            apps/beastbox-cloud/build/private-cosmos/http-report.json
          if-no-files-found: error
          retention-days: 14
