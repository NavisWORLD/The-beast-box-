name: Private Cosmos isolated Azure and QVM acceptance
on:
  workflow_dispatch:
  push:
    branches: [feature/issue-323-private-cosmos-20261013]
    paths:
      - apps/beastbox-cloud/lib/cosmos/private-*
      - apps/beastbox-cloud/scripts/private-cosmos-cloud-probe.mjs
      - apps/beastbox-cloud/tests/private-cosmos.test.mjs
      - .github/workflows/private-cosmos-staging.yml
permissions:
  contents: read
concurrency:
  group: private-cosmos-isolated-323
  cancel-in-progress: false
jobs:
  isolated-private-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test apps/beastbox-cloud/tests/private-cosmos.test.mjs
      - name: Install the existing authenticated QVM driver dependencies
        run: python -m pip install --quiet 'qdk[azure]'
      - name: Isolated synthetic worlds, conditional cleanup and one bounded free QVM job
        working-directory: apps/beastbox-cloud
        env:
          BEASTBOX_PRIVATE_PROBE_APPROVAL: YES_ISOLATED_PRIVATE_TEST
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER_SAS_URL: ${{ secrets.AZURE_STORAGE_CONTAINER_SAS_URL }}
          AZURE_STORAGE_CONTAINER: beastbox
          AZURE_QUANTUM_CONNECTION_STRING: ${{ secrets.AZURE_QUANTUM_CONNECTION_STRING }}
        run: node scripts/private-cosmos-cloud-probe.mjs build/private-cosmos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-cosmos-323-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/beastbox-cloud/build/private-cosmos/report.json
            apps/beastbox-cloud/build/private-cosmos/plan.json
            apps/beastbox-cloud/build/private-cosmos/qvm-raw.json
          if-no-files-found: error
          retention-days: 14
