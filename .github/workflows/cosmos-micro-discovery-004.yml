name: COSMOS 004 pinned original micro-model preflight (public source only)

on:
  pull_request:
    branches: [experiment/cosmos-native-correction-002]
    paths:
      - "scripts/discover_cosmos_micro_004.py"
      - ".github/workflows/cosmos-micro-discovery-004.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface_hub==0.30.2
      - run: python -m scripts.discover_cosmos_micro_004
