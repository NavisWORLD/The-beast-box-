name: RAWRPHOS experimental 18K deployment preflight
on:
  push:
    branches: [feature/rawrphos-18k-experimental-deployment-001]
    paths:
      - '.github/workflows/rawrphos-18k-deployment-preflight.yml'
      - 'apps/beastbox-cloud/bridge/deploy/**'
      - 'beastbox/rawrphos_local.py'
      - 'beastbox/rawrphos_experimental_local.py'
      - 'apps/beastbox-cloud/components/model-switcher.tsx'
      - 'apps/beastbox-cloud/bridge/owner_bridge.py'
      - 'tests/test_rawrphos_18k_experimental.py'
      - 'beastbox/providers.py'
      - 'tests/test_compatible_provider.py'
      - 'tests/test_rawrphos_owner_selection.py'
      - 'models/rawrphos/scripts/install_pinned_18k.py'
      - 'models/rawrphos/scripts/install_pinned_14k.py'
permissions:
  contents: read
concurrency:
  group: rawrphos-18k-deployment-preflight
  cancel-in-progress: true
jobs:
  native-and-owner-smoke:
    if: github.repository == 'NavisWORLD/The-beast-box-'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: models
      EXPECTED_SHA: 20932937afb3e0e1b62a4e5f38f92170046ae2928b437dc31b8a37d6538e701e
      STABLE_SHA: 4e45850bfe7b3e2be1d5b12e1956286e1f3f8cfde7b01b70212ad75fbc8610a5
      RAWRPHOS_API_KEY: synthetic-ci-owner-native-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      RAWRPHOS_LOCAL_ENABLED: 'yes'
      BEASTBOX_TINY_LOCAL_ENABLED: 'no'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU and existing bridge dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'tokenizers>=0.20,<0.24' 'safetensors>=0.4.5,<1' 'pyarrow>=15,<24' 'pytest>=8,<10' 'numpy>=1.26,<3' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'uvicorn>=0.30,<1'
          python -m pip install --quiet '.[secure]' 'azure-storage-blob>=12.20,<13' 'gradio-client>=1.14,<2'
      - name: Regression tests for model and owner selection
        run: python -m pytest -q models/rawrphos/tests tests/test_rawrphos_owner_selection.py tests/test_rawrphos_18k_experimental.py tests/test_compatible_provider.py
      - name: Recover exact public 18K checkpoint and verify full state
        run: |
          set -euo pipefail
          python models/rawrphos/scripts/install_pinned_14k.py --destination "$RUNNER_TEMP/step-00014000"
          python models/rawrphos/scripts/install_pinned_18k.py --destination "$RUNNER_TEMP/step-00018000"
          python - <<'PY'
          import os,pathlib
          from rawrphos.training.checkpoint import load_checkpoint
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'step-00018000'
          m=load_checkpoint(p,expected_checkpoint_sha256=os.environ['EXPECTED_SHA'])
          assert m['metadata']['training_steps']==18000
          stable=load_checkpoint(pathlib.Path(os.environ['RUNNER_TEMP'])/'step-00014000',expected_checkpoint_sha256=os.environ['STABLE_SHA'])
          assert stable['metadata']['training_steps']==14000
          assert stable['model'].parameter_count()==3909956
          assert m['metadata']['conversation_steps']==6000
          assert m['model'].parameter_count()==3909956
          assert {'optimizer','rng','data_rng','scheduler'}<=m['state'].keys()
          print('EXACT_18K_BUNDLE_AND_RESUME_STATE_VERIFIED',flush=True)
          PY
      - name: Verify 18K is unpromoted experimental research, never silently default
        run: |
          set -euo pipefail
          python - <<'PY'
          from beastbox.rawrphos_experimental_local import status
          from pathlib import Path
          from rawrphos.training.checkpoint import load_checkpoint
          import os
          ckpt=Path(os.environ['RUNNER_TEMP'])/'step-00018000'
          loaded=load_checkpoint(ckpt,expected_checkpoint_sha256=os.environ['EXPECTED_SHA'],load_training_state=False)
          assert loaded['metadata']['training_steps']==18000
          assert 'experimental' in status()['label'].casefold() and 'quality gate failed' in status()['label'].casefold()
          print('18K_UNPROMOTED_EXPERIMENTAL_LABEL_VERIFIED; NOT_A_QUALITY_PROMOTION',flush=True)
          PY
      - name: Authenticated dual-model HTTP inference and explicit owner switching
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,tempfile,threading,time
          from fastapi.testclient import TestClient
          from rawrphos.inference.server import create_app
          from beastbox.rawrphos_local import status as stable_status
          from beastbox.rawrphos_experimental_local import status as experimental_status
          from importlib import util
          from uvicorn import Config,Server
          stable=pathlib.Path(os.environ['RUNNER_TEMP'])/'step-00014000'
          exp=pathlib.Path(os.environ['RUNNER_TEMP'])/'step-00018000'
          key=os.environ['RAWRPHOS_API_KEY'];headers={'Authorization':'Bearer '+key}
          servers=[]
          for path,sha,step,port in [(stable,os.environ['STABLE_SHA'],14000,8767),
                                     (exp,os.environ['EXPECTED_SHA'],18000,8768)]:
              app=create_app(path,key,max_new_tokens=64,threads=2,expected_sha256=sha)
              test=TestClient(app)
              assert test.get('/model/info').status_code==401
              info=test.get('/model/info',headers=headers).json()
              assert info['training_steps']==step and info['checkpoint_sha256']==sha
              reply=test.post('/v1/chat/completions',headers=headers,json={
                  'model':'rawrphos-native','messages':[{'role':'user','content':"I'm so confused phos."}],
                  'temperature':0,'max_tokens':64,'seed':67})
              assert reply.status_code==200,reply.text
              assert reply.json()['checkpoint_sha256']==sha
              print('REAL_NATIVE_HTTP_RESPONSE',step,reply.json()['choices'][0]['message']['content'],flush=True)
              server=Server(Config(app,host='127.0.0.1',port=port,log_level='error',access_log=False))
              runner=threading.Thread(target=server.run,daemon=True);runner.start()
              for _ in range(100):
                  if server.started:break
                  time.sleep(.2)
              assert server.started, f'Private native port {port} failed'
              servers.append((server,runner))
          os.environ['RAWRPHOS_CHECKPOINT_PATH']=str(stable)
          os.environ['RAWRPHOS_18K_CHECKPOINT_PATH']=str(exp)
          assert stable_status()['readiness']=='INSTALLED_AND_READY'
          assert experimental_status()['readiness']=='INSTALLED_AND_READY'
          spec=util.spec_from_file_location('owner_bridge_18k','apps/beastbox-cloud/bridge/owner_bridge.py')
          bridge=util.module_from_spec(spec);spec.loader.exec_module(bridge)
          token='synthetic-ci-bridge-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
          with tempfile.TemporaryDirectory() as location:
              app=bridge.OwnerBridge(pathlib.Path(location),token)
              before=app.app.dispatch('GET','/api/orbit')[1]['runtime']
              code,catalog=app.dispatch('GET','/api/models','Bearer '+token)
              assert code==200
              opts={row['choice']:row for row in catalog['choices']}
              assert opts['rawrphos_native']['loaded_step']==14000
              assert opts['rawrphos_native_18k_experimental']['loaded_step']==18000
              assert opts['rawrphos_native_18k_experimental']['promotion_checks_pass'] is False
              for choice,step,sha in [('rawrphos_native',14000,os.environ['STABLE_SHA']),
                                      ('rawrphos_native_18k_experimental',18000,os.environ['EXPECTED_SHA']),
                                      ('rawrphos_native',14000,os.environ['STABLE_SHA'])]:
                  code,selection=app.dispatch('POST','/api/models','Bearer '+token,json.dumps({'choice':choice}).encode())
                  assert code==200 and selection['loaded_step']==step and selection['checkpoint_sha256']==sha
                  code,answer=app.dispatch('POST','/api/chat','Bearer '+token,json.dumps({'text':'Hello'}).encode())
                  assert code==200,(code,answer)
                  observed=app.dispatch('GET','/api/models','Bearer '+token)[1]['active']
                  assert observed['loaded_step']==step
              after=app.app.dispatch('GET','/api/orbit')[1]['runtime']
              assert before['system_id']==after['system_id']
              print('REAL_OWNER_BRIDGE_14K_TO_18K_TO_14K_CHAT_PASS; 18K_QUALITY_GATE_STILL_FAILED',flush=True)
          for server,runner in servers:
              server.should_exit=True;runner.join(timeout=15)
          PY
      - name: Read-only Docker image build (no Railway or Vercel mutation)
        run: |
          set -euo pipefail
          docker build --progress=plain -f apps/beastbox-cloud/bridge/deploy/Dockerfile.rawrphos -t rawrphos-dual-14k-18k-preflight .
          docker image inspect rawrphos-dual-14k-18k-preflight --format 'IMAGE_SIZE_BYTES={{.Size}}'
