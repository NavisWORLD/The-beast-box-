name: Cory voice CST12 → ONE Azure Rigetti QVM (SIMULATED)
on:
  pull_request:
    types: [opened]
    paths:
      - 'scripts/azure_cory_voice_qvm.py'
      - '.github/workflows/cory-voice-azure-qvm.yml'
permissions:
  contents: read
concurrency:
  group: cory-voice-qvm-20261015-onejob
  cancel-in-progress: false
jobs:
  qvm:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/cory-voice-quantum-love-20261015' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Azure Quantum SDK
        run: python -m pip install 'qdk[azure]'
      - name: ONE free Rigetti QVM simulator job (idempotent by name)
        env:
          AZURE_QUANTUM_CONNECTION_STRING: ${{ secrets.AZURE_QUANTUM_CONNECTION_STRING }}
          BEAST_AZURE_QVM_ONE_JOB: YES_ONE_FREE_SIMULATOR
        run: PYTHONPATH=scripts python scripts/azure_cory_voice_qvm.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cory-voice-qvm-${{ github.run_id }}
          path: _azure_cory_voice_20261015/
          retention-days: 30
