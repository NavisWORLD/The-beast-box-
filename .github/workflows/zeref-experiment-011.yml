name: Zeref 011 - learns from his own world (bounded CPU trial)
# One bounded, reproducible CPU trial. Parent = approved 006 cycle 3
# (d0df90ea..., pinned run 38179059173) with its AdamW moments. Fresh native
# Lost COSMOS frames from the ORIGINAL ROM + bb-deada969's own seeded pocket.
# Accepted candidates publish ONLY under "zeref-011-accepted-d0df90ea"; this
# workflow never writes the 006 canonical artifact, never promotes a model to
# production, never changes the cartridge and submits no quantum jobs.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'scripts/zeref_experiment_011.py'
      - 'scripts/zeref_experience_bridge.py'
      - 'apps/beastbox-cloud/lib/zeref/experience-record.mjs'
      - 'apps/beastbox-cloud/lib/zeref/pocket-grid-env.mjs'
      - 'apps/beastbox-cloud/scripts/zeref-pocket-grid-cli.mjs'
      - '.github/workflows/zeref-experiment-011.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: zeref-011-trial
  cancel-in-progress: false
jobs:
  trial:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/zeref-learns-own-world-011')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      NAVISWORLD_NATIVE_TRAINING_BEAST: zeref
      NAVISWORLD_NATIVE_TRAINING_CYCLE: ${{ github.run_id }}
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Bridge contract tests
        run: |
          set -Eeuo pipefail
          (cd apps/beastbox-cloud && node --test tests/zeref-experience-bridge.test.mjs)
          python -m py_compile scripts/zeref_experiment_011.py scripts/zeref_experience_bridge.py
      - name: Download the pinned approved parent (006 cycle 3) with AdamW state
        run: |
          set -Eeuo pipefail
          gh run download 38179059173 --repo "${{ github.repository }}" -n zeref-006-canonical-37ca3f8f -D build/zeref-011/parent
          P="$(find build/zeref-011/parent -type d -name accepted-checkpoint -print -quit)"
          echo "$(sha256sum "$P/model.safetensors")"
          test "$(sha256sum "$P/model.safetensors" | cut -d' ' -f1)" = d0df90ea090b410aa5da5051b20e21ae5728236f7371450807f1af662fb02445
          echo "ZEREF_011_PARENT=$P" >> "$GITHUB_ENV"
      - name: Build EXISTING Beast Box (unchanged ROM pin)
        working-directory: apps/beastbox-cloud
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/checkout@v4
        with:
          repository: NavisWORLD/Cosmic-synapse-the-living-universe-sim-engine-
          ref: main
          path: native-game
          persist-credentials: false
      - name: Build the original GBA ROM and an isolated browser
        run: |
          set -Eeuo pipefail
          echo "NATIVE_GAME_HEAD=$(cd native-game && git rev-parse HEAD)"
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          (cd native-game && bash scripts/build-lost-cosmos-arcade.sh)
          sha256sum native-game/arcade/sol-spark-gate/*.gba 2>/dev/null || true
          npm install --prefix /tmp/zeref-011-browser --no-save --ignore-scripts playwright@1.62.1
          /tmp/zeref-011-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture 56 FRESH native frames + acknowledged keypresses (read-only display observation)
        run: |
          set -Eeuo pipefail
          mkdir -p build/zeref-011/native
          (cd apps/beastbox-cloud && npm run start -- --hostname 127.0.0.1 --port 3000) > build/zeref-011/app.log 2>&1 &
          web_pid=$!
          python3 -m http.server 8765 --bind 127.0.0.1 --directory native-game > build/zeref-011/native-game.log 2>&1 &
          game_pid=$!
          trap 'kill "$web_pid" "$game_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/spark/index.html >/dev/null && curl -fsS http://127.0.0.1:8765/arcade/sol-spark-gate/handheld.html >/dev/null; then break; fi
            sleep 2
          done
          for attempt in 1 2; do
            if NODE_PATH=/tmp/zeref-011-browser/node_modules node apps/beastbox-cloud/tests/rawrphos-native-observed-play.cjs http://127.0.0.1:3000 http://127.0.0.1:8765 build/zeref-011/native; then
              sha256sum build/zeref-011/native/native-observation-actions.jsonl; exit 0
            fi
            sleep 10
          done
          exit 1
      - name: CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e ./models/rawrphos
      - name: Run Experiment 011 (fixed protocol)
        run: |
          set -Eeuo pipefail
          python -u scripts/zeref_experiment_011.py --parent "$ZEREF_011_PARENT" --native build/zeref-011/native \
            --out build/zeref-011/out --seeds 3 --updates 384 --lr 1e-5 --train-layouts 48 --eval-layouts 24 \
            --eval-split eval --steps 40 --threads 4 --batch-pocket 5 --batch-native 3 --arms candidate,no-memory,shuffled
      - name: Upload evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-011-evidence-${{ github.run_id }}
          path: |
            build/zeref-011/native/
            build/zeref-011/out/report.json
            build/zeref-011/out/dataset.json
            build/zeref-011/out/rejected.json
            build/zeref-011/out/pocket-records.jsonl
            build/zeref-011/out/native-records.jsonl
          retention-days: 90
          if-no-files-found: warn
      - name: Upload accepted descendant only
        if: success() && hashFiles('build/zeref-011/out/approval.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zeref-011-accepted-d0df90ea
          path: |
            build/zeref-011/out/accepted-checkpoint/
            build/zeref-011/out/approval.json
          retention-days: 90
