name: ZEREF FULL CLEAN R12 MEMORY RED

on:
  push:
    branches: [zeref-full-clean-r12-memory-integration-001]
    paths:
      - 'tests/test_zeref_full_clean_r12_memory_integration.py'
      - '.github/workflows/zeref-full-clean-r12-memory-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test runtime
        run: python -m pip install -e '.[dev]'
      - name: Run frozen integration contract
        run: python -m pytest -q tests/test_zeref_full_clean_r12_memory_integration.py
