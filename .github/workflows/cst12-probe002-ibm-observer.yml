name: CST12 Probe 002 IBM Live Observer

on:
  push:
    branches: [cst12-physics-probe-002]
    paths:
      - '.github/workflows/cst12-probe002-ibm-observer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  observe-ibm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cst12-physics-probe-002
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install IBM Quantum client
        run: |
          python -m pip install --upgrade pip
          pip install 'qiskit-ibm-runtime>=0.49.0,<0.50'

      - name: Pull tagged Probe 002 IBM workloads
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IBM_QUANTUM_TOKEN"
          mkdir -p experiments/cst12-physics-probe-002/observer
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from qiskit_ibm_runtime import QiskitRuntimeService

          kwargs = {
              'channel': 'ibm_quantum_platform',
              'token': os.environ['IBM_QUANTUM_TOKEN'].strip(),
          }
          instance = os.environ.get('IBM_QUANTUM_INSTANCE', '').strip()
          if instance:
              kwargs['instance'] = instance
          service = QiskitRuntimeService(**kwargs)
          jobs = service.jobs(limit=50, job_tags=['cst12-physics-probe-002'], descending=True)
          rows = []
          for job in jobs:
              try:
                  status_obj = job.status()
                  status = getattr(status_obj, 'name', None) or str(status_obj)
              except Exception as exc:
                  status = f'UNKNOWN:{type(exc).__name__}'
              try:
                  backend = job.backend()
                  name = getattr(backend, 'name', '')
                  backend_name = name() if callable(name) else str(name)
              except Exception:
                  backend_name = ''
              try:
                  tags = sorted(set(job.tags or []))
              except Exception:
                  tags = []
              try:
                  created = job.creation_date
                  if callable(created):
                      created = created()
                  created = created.isoformat() if hasattr(created, 'isoformat') else str(created)
              except Exception:
                  created = ''
              row = {
                  'job_id': str(job.job_id()),
                  'status': status,
                  'backend': backend_name,
                  'tags': tags,
                  'created_at': created,
              }
              try:
                  metrics = job.metrics()
                  if isinstance(metrics, dict):
                      row['metrics'] = metrics
              except Exception:
                  pass
              rows.append(row)

          receipt = {
              'schema': 'cst12-probe002-ibm-live-observer-v1',
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'tag': 'cst12-physics-probe-002',
              'job_count': len(rows),
              'jobs': rows,
              'read_only': True,
              'submitted_new_jobs': False,
              'credential_material_recorded': False,
          }
          out = Path('experiments/cst12-physics-probe-002/observer/ibm-live.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Commit IBM observer receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/cst12-physics-probe-002/observer/ibm-live.json
          if git diff --cached --quiet; then
            echo 'No observer change.'
            exit 0
          fi
          git commit -m 'evidence: pull live Probe 002 IBM workload status [skip ci]'
          git pull --rebase origin cst12-physics-probe-002
          git push origin HEAD:cst12-physics-probe-002

