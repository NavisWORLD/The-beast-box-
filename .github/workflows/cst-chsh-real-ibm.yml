name: CST CHSH - ONE real IBM Quantum job (owner-authorized 2026-10-15)
on:
  pull_request:
    paths:
      - '.github/workflows/cst-chsh-real-ibm.yml'
      - 'scripts/ibm_chsh_onejob.py'
permissions:
  contents: read
concurrency:
  group: cst-chsh-one-authentic-qpu
  cancel-in-progress: false
jobs:
  real-ibm-chsh:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/chsh-real-ibm-20261015' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests/test_ibm_chsh_onejob.py -v && python -m unittest discover -s tests -p test_ibm_open_plan_preflight.py -v
      - run: python -m pip install 'qiskit-ibm-runtime>=0.45,<0.50' 'qiskit>=2.1,<2.5'
      - name: ONE guarded IBM hardware job (exact-tag recovery on rerun, no simulator)
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          BEAST_REAL_QPU_ONE_JOB: YES_ONE_REAL_JOB
        run: PYTHONPATH=scripts python scripts/ibm_chsh_onejob.py
      - name: Read-only quota after
        if: always()
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
        run: python scripts/ibm_open_plan_preflight.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cst-chsh-real-ibm-${{ github.run_id }}
          path: |
            _ibm_chsh_20261015/
            _ibm_open_plan_preflight/receipt.json
          retention-days: 30
          if-no-files-found: warn
