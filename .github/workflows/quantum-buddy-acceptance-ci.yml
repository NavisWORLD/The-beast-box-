# Current-HEAD verification after one-time import normalization
name: Quantum Buddy final offline acceptance
on:
  push:
    branches: [feature/quantum-buddy-shadow-core-001]
    paths:
      - '.github/workflows/quantum-buddy-acceptance-ci.yml'
      - 'scripts/run_quantum_buddy_acceptance.py'
      - 'tests/test_quantum_buddy_acceptance.py'
      - 'beastbox/quantum_buddy/**'
      - 'beastbox/cns.py'
      - 'beastbox/bridge.py'
      - 'beastbox/synaptic.py'
      - 'beastbox/runtime.py'
      - 'models/rawrphos/architecture/**'
      - 'models/rawrphos/inference/**'
      - 'apps/beastbox-cloud/bridge/owner_bridge.py'
      - 'apps/beastbox-cloud/bridge/tests/test_quantum_buddy_shadow.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    if: github.repository == 'NavisWORLD/The-beast-box-'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: models
      # No Azure or quantum credentials; never enable production flags.
      BEASTBOX_QUANTUM_BUDDY_ENABLED: 'no'
      BEASTBOX_QUANTUM_BUDDY_COSMOS_WRITES_ENABLED: 'no'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only offline test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet -e '.[dev,secure]'
          python -m pip install --quiet 'azure-cosmos>=4.9,<5' 'azure-core>=1.30' 'azure-identity>=1.17' 'azure-storage-blob>=12.20,<13' 'gradio-client>=1.14,<2' 'tokenizers>=0.20,<0.24' 'safetensors>=0.4.5,<1' 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Full scoped tests (core bridge native) and honest acceptance manifest
        run: |
          set -euo pipefail
          python scripts/run_quantum_buddy_acceptance.py --native --output build/quantum-buddy-acceptance
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('build/quantum-buddy-acceptance/acceptance.json').read_text())
          assert report['local_acceptance_verified'] is True, report
          assert report['git_revision_verified'] is True
          assert report['source_commit'] == __import__('subprocess').check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert report['fresh_hardware_used'] is False
          assert report['cosmos_live_write_tested'] is False
          assert report['production_deployed'] is False
          assert report['full_phase8_native_holdout_completed'] is False
          assert report['quantum_advantage_proven'] is False
          print('LOCAL_SCOPED_ACCEPTANCE_VERIFIED', report['source_commit'], flush=True)
          for run in report['test_runs']:
              print('GATE',run['label'],run['passed'],run['reported_pass_count'],flush=True)
          PY
      - name: Run all dedicated Buddy acceptance tests and changed-code lint
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_quantum_buddy_acceptance.py
          # All new Buddy modules and integration core use the complete Ruff ruleset.
          ruff check beastbox/quantum_buddy beastbox/bridge.py beastbox/cns.py beastbox/runtime.py beastbox/synaptic.py scripts/run_quantum_buddy_phase8_shadow.py scripts/run_quantum_buddy_acceptance.py
          # Legacy owner/native model files predate this feature and use
          # one-line statements; enforce every other rule without a broad
          # inference-engine reformat during the frozen-model experiment.
          ruff check --ignore E701,E702 apps/beastbox-cloud/bridge/owner_bridge.py models/rawrphos/architecture/model.py models/rawrphos/architecture/generation.py models/rawrphos/inference/engine.py models/rawrphos/inference/server.py
      - name: Independently verify evidence hashes
        run: |
          cd build/quantum-buddy-acceptance
          sha256sum --check SHA256SUMS
      - name: Diagnose optional-unit lint gate on failure
        if: failure()
        run: |
          ruff check beastbox/quantum_buddy beastbox/cns.py beastbox/bridge.py beastbox/synaptic.py beastbox/runtime.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-buddy-offline-acceptance-${{ github.sha }}
          path: build/quantum-buddy-acceptance/
          if-no-files-found: warn
      - name: No external mutation
        run: echo 'NO_QPU NO_COSMOS_LIVE_WRITE NO_DEPLOY'
