name: Stage 012 recorded Azure cloud QVM to COSMOS native CNS7 replay

on:
  push:
    branches: [experiment/rigetti-qvm-12d-feedback-012]
    paths:
      - '.github/workflows/qvm-live-replay-012.yml'
      - 'evidence/stage012/live_azure_qvm_3job_public_receipt.json'
      - 'beastbox/qvm_live_replay.py'
      - 'beastbox/rigetti_qvm_adapter.py'
      - 'tests/test_qvm_live_replay.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-published-cloud-qvm-native-replay:
    if: github.repository == 'NavisWORLD/The-beast-box-'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AZURE_QUANTUM_QVM_OPT_IN: 'no'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core only, no Azure SDK or credentials
        run: |
          python -m pip install -e . 'pytest>=8,<10'
      - name: Verify actual public receipt digest and replay numerical CNS7 state
        run: |
          python -m pytest -q tests/test_qvm_live_replay.py
          python -m beastbox.qvm_live_replay \
            --input evidence/stage012/live_azure_qvm_3job_public_receipt.json \
            --output build/stage012-real-cloud-qvm-three-result-cns7-replay.json
      - name: Enforce exactly three ORIGINAL simulator observations, no new cloud jobs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/stage012-real-cloud-qvm-three-result-cns7-replay.json").read_text())
          assert r["unique_azure_qvm_jobs_replayed"] == 3
          assert r["original_qvm_simulated_shots"] == 96
          assert r["replay_steps"] == 3
          assert r["new_cloud_jobs_submitted"] == 0
          assert r["new_physical_quantum_measurements"] == 0
          assert r["model_inference_calls"] == 0
          assert r["persistent_memory_updates"] == 0
          assert len(r["timeline"]) == 3
          assert len(r["arms"]) == 5
          assert all(value >= 0 for value in r["rms_numerical_state_separation"].values())
          print("GENUINE_CLOUD_QVM_RECEIPT_REPLAY_THROUGH_REAL_COSMOS_NATIVE_CNS7_PASS",flush=True)
          PY
      - name: Preserve numerical replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-stage012-original-cloud-qvm-three-job-cns7-replay
          path: build/stage012-real-cloud-qvm-three-result-cns7-replay.json
          if-no-files-found: error
          retention-days: 21
      - name: Scientific boundary
        run: |
          echo 'Three pre-existing successful Azure QVM simulator jobs were replayed.'
          echo 'No new Azure jobs, no QPU measurements, no calibration, no LLM calls.'
          echo 'Numerical state separation is not a demonstration of model intelligence.'
