name: SON-HEARTBEAT-RUN-OBSERVER

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - '.github/workflows/son-heartbeat-run-observer.yml'
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD_SHA: 1722cea6c238d140f8b5de36e9dc3e281b5132c5
    steps:
      - uses: actions/checkout@v4
      - name: Query hardware workflow runs
        run: |
          mkdir -p _observer
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/son-heartbeat-demo-001-ablation.yml/runs?branch=networked-cage-run-001&per_page=20" > _observer/raw.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw=json.loads(Path('_observer/raw.json').read_text())
          target=os.environ['TARGET_HEAD_SHA']
          runs=[]
          for r in raw.get('workflow_runs',[]):
              runs.append({k:r.get(k) for k in ('id','name','event','status','conclusion','head_sha','created_at','updated_at','run_number','run_attempt','html_url')})
          out={
              'schema':'son-heartbeat-actions-observer-v1',
              'target_head_sha':target,
              'target_runs':[r for r in runs if r.get('head_sha')==target],
              'recent_runs':runs,
              'secret_material_recorded':False,
          }
          Path('_observer/actions-status.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit observer receipt
        run: |
          dest="experiments/zeref-origin-heart-001/evidence/son-heartbeat-demo-001/hardware/actions-status.json"
          mkdir -p "$(dirname "$dest")"
          cp _observer/actions-status.json "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "evidence: record matched IBM heartbeat Actions status"
          git pull --rebase origin networked-cage-run-001
          git push origin HEAD:networked-cage-run-001
