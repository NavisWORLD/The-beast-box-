name: QC67 Cosmos Runtime Compatibility

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/qc67-cosmos-runtime-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO: phera-ra/QC67_cosmo
  HF_REVISION: b414724c627300c41b099dcc6853766d08fd27a4
  HF_FILE: weights/cosmos-cst.gguf
  LLAMA_CPP_COMMIT: 7e4c0a96880dae4fc4268ad441f8a6446bd5460a

jobs:
  compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch exact QC67 native architecture sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'huggingface-hub>=0.27'
          rm -rf _qc67_arch _llama
          mkdir -p _qc67_arch
          hf download "$HF_REPO" architecture/cosmos-arch.patch architecture/llama_cpp_cosmos.cpp "$HF_FILE" \
            --revision "$HF_REVISION" --local-dir _qc67_arch
          sha256sum \
            _qc67_arch/architecture/cosmos-arch.patch \
            _qc67_arch/architecture/llama_cpp_cosmos.cpp \
            "_qc67_arch/$HF_FILE"
          echo '--- PATCH BEGIN ---'
          cat _qc67_arch/architecture/cosmos-arch.patch
          echo '--- PATCH END ---'

      - name: Reconstruct native llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git _llama
          git -C _llama checkout "$LLAMA_CPP_COMMIT"
          cp _qc67_arch/architecture/llama_cpp_cosmos.cpp _llama/src/models/cosmos.cpp
          git -C _llama apply --check ../_qc67_arch/architecture/cosmos-arch.patch
          git -C _llama apply ../_qc67_arch/architecture/cosmos-arch.patch
          git -C _llama diff --check
          grep -R "LLM_ARCH_COSMOS" -n _llama/src _llama/include | head -40

      - name: Build patched llama server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _llama -B _llama/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build _llama/build --target llama-server -j 2
          _llama/build/bin/llama-server --version

      - name: Boot exact QC67 cosmos GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _compat_logs
          _llama/build/bin/llama-server \
            -m "$(realpath "_qc67_arch/$HF_FILE")" \
            --host 127.0.0.1 \
            --port 18081 \
            -c 128 \
            -np 1 \
            > _compat_logs/stdout.log 2> _compat_logs/stderr.log &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null 2>&1; then
              echo 'QC67_COSMOS_SERVER_READY=1'
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat _compat_logs/stderr.log >&2
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18081/health
          curl -fsS http://127.0.0.1:18081/v1/models | python -m json.tool
          python - <<'PY'
          import json, urllib.request
          payload = json.dumps({
              'model': 'cosmos',
              'prompt': 'the ',
              'max_tokens': 8,
              'temperature': 0.2,
          }).encode()
          req = urllib.request.Request(
              'http://127.0.0.1:18081/v1/completions',
              data=payload,
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              body = json.loads(r.read().decode())
          text = str((body.get('choices') or [{}])[0].get('text', ''))
          print('QC67_COSMOS_COMPLETION_BYTES=' + str(len(text.encode())))
          print('QC67_COSMOS_NATIVE_SMOKE=PASS')
          PY
