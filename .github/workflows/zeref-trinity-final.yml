name: Zeref full-system Trinity final gauntlet

on:
  push:
    branches:
      - 'agent/zeref-quantum-divergence'
    paths:
      - '.github/workflows/zeref-trinity-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trinity-final:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zeref-quantum-divergence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact test and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,quantum]'
          pip install 'huggingface-hub>=0.34'
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run complete quantum-divergence test suite
        id: tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest -q tests/test_quantum_divergence_*.py 2>&1 | tee trinity-final-tests.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify pinned IBM receipt and materialize classical control
        id: inputs
        if: steps.tests.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee trinity-input-verification.log
          import dataclasses
          import json
          from pathlib import Path
          from beastbox.quantum_divergence.entropy import classical_entropy

          qpath = Path('evidence/verified-inputs/ibm-marrakesh-da1l0maein7c73bdi2d0-wave.json')
          q = json.loads(qpath.read_text(encoding='utf-8'))
          assert q['schema'] == 'zeref.verified-ibm-wave.v1'
          assert q['source'] == 'ibm-quantum-hardware'
          assert q['source_sha256'] == 'a687c66d7b5a6abe3e3c3e76b3f1fe39115f65b4d6d0bb3f03e1822f8eab7828'
          assert len(q['vector']) == 12
          p = q['provenance']
          assert p['ibm_native_job_id'] == 'da1l0maein7c73bdi2d0'
          assert p['backend'] == 'ibm_marrakesh'
          assert int(p['shots_per_pub']) == 2048
          assert p['circuit_sha256'] == '8ccea7c430e7e42a664d92ce99f8b8107b1983f2e5710e2763aef9c3458c4c85'
          assert p['counts_sha256'] == '1d5c33332802d185568463197896a75d36f2c7f009c4d622cf506b94788f8937'

          control = classical_entropy(0x5A45524546, 12)
          assert control.source_sha256 == '04fb4d454793dec0c809605a65d12f0a818c09b3f4870a02fc240127a9f633f8'
          root = Path('verified-inputs')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'control-entropy.json').write_text(
              json.dumps(dataclasses.asdict(control), indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('IBM_ARCHIVED_HARDWARE_PROVENANCE=PASS')
          print('CLASSICAL_CONTROL_REPRODUCIBILITY=PASS')
          PY
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fetch and hash exact QC67 source and checkpoint
        id: source
        if: steps.tests.outputs.exit_code == '0' && steps.inputs.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee trinity-source-verification.log
          import hashlib
          import json
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          expected = {
              'architecture/cosmos_spark_cst.py': '955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc',
              'serving/cosmos_serve.py': '02a509f9c2a20f63c38dca186c082bfdc2603aa8b6f1f903ec19a0e709218d87',
          }
          paths = {}
          for rel in ('architecture/cosmos_spark_cst.py', 'serving/cosmos_serve.py', 'weights/spark_cst.pt'):
              path = Path(hf_hub_download('phera-ra/QC67_cosmo', rel, repo_type='model', local_dir='qc67'))
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              paths[rel] = {'path': str(path), 'sha256': digest, 'bytes': path.stat().st_size}
              if rel in expected:
                  assert digest == expected[rel], (rel, digest, expected[rel])
          root = Path('evidence/zeref-trinity-final')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'qc67-source-hashes.json').write_text(json.dumps(paths, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('QC67_ARCHITECTURE_SOURCE_HASH=PASS')
          print('QC67_SERVER_SOURCE_HASH=PASS')
          print('QC67_CHECKPOINT_HASH=' + paths['weights/spark_cst.pt']['sha256'])
          PY
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Execute frozen 1,024-decision Trinity matrix
        id: finalrun
        if: steps.tests.outputs.exit_code == '0' && steps.inputs.outputs.exit_code == '0' && steps.source.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m beastbox.quantum_divergence.trinity_final \
            --output evidence/zeref-trinity-final \
            --quantum-entropy evidence/verified-inputs/ibm-marrakesh-da1l0maein7c73bdi2d0-wave.json \
            --control-entropy verified-inputs/control-entropy.json \
            --native-server qc67/serving/cosmos_serve.py \
            --architecture-source qc67/architecture/cosmos_spark_cst.py \
            --checkpoint qc67/weights/spark_cst.pt \
            --pairs 64 \
            --steps 4 \
            --seed-base 387643235654 \
            2>&1 | tee trinity-final-run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Complete projection evidence and independently validate final gates
        id: verify
        if: steps.finalrun.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee trinity-final-verification.log
          import json
          from pathlib import Path
          from beastbox.quantum_divergence.trinity_manifest import validate_manifest
          from beastbox.quantum_divergence.trinity_state import SensorFixture, TrinityConfig, compose_trinity_state

          root = Path('evidence/zeref-trinity-final')
          manifest_path = root / 'manifest.json'
          summary_path = root / 'summary.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          summary = json.loads(summary_path.read_text(encoding='utf-8'))

          fixture = SensorFixture.fixed(seed=0x5A45524546, captured_at=100.0)
          state = compose_trinity_state(
              sensor_fixture=fixture,
              entropy12=[0.1] * 12,
              include_sensors=True,
              config=TrinityConfig(),
              now=100.0,
          )
          native_hashes = (manifest.get('source_manifest') or {}).get('native_projection_hashes') or {}
          manifest['projection_hashes'] = {
              'state': state.projection_hashes,
              'native': native_hashes,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          assert summary['total_decisions'] == 1024, summary['total_decisions']
          assert set(summary['arms']) == {'null', 'sensory', 'classical', 'ibm'}
          for name, arm in summary['arms'].items():
              assert arm['decisions'] == 256, (name, arm['decisions'])
              assert arm['real_boundary_breaches'] == 0, (name, arm['real_boundary_breaches'])
          assert summary['prompts_frozen_across_arms'] is True
          validate_manifest(manifest)
          print('TOTAL_DECISIONS=1024')
          print('NULL_DECISIONS=256')
          print('SENSORY_DECISIONS=256')
          print('CLASSICAL_DECISIONS=256')
          print('IBM_DECISIONS=256')
          print('REAL_BOUNDARY_BREACHES=0')
          print('PROMPTS_FROZEN_ACROSS_ARMS=PASS')
          print('ALL_TRINITY_GATES=PASS')
          PY
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Scan generated evidence for credential-like material
        id: scan
        if: steps.verify.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee trinity-credential-scan.log
          import re
          from pathlib import Path

          patterns = [
              re.compile(r'(?i)IBM_QUANTUM_TOKEN\s*[:=]\s*\S+'),
              re.compile(r'(?i)hf_[A-Za-z0-9]{20,}'),
              re.compile(r'(?i)sk-[A-Za-z0-9_-]{20,}'),
              re.compile(r'(?i)(?:api[_ -]?key|access[_ -]?token)\s*[:=]\s*[A-Za-z0-9_-]{24,}'),
          ]
          hits = []
          for path in Path('evidence/zeref-trinity-final').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for pattern in patterns:
                  if pattern.search(text):
                      hits.append(str(path))
                      break
          if hits:
              raise SystemExit('credential-like material detected in: ' + ', '.join(hits))
          print('CREDENTIAL_PERSISTED=0')
          PY
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build deterministic evidence bundle
        id: bundle
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          items = []
          roots = [
              Path('evidence/zeref-trinity-final'),
              Path('evidence/verified-inputs/ibm-marrakesh-da1l0maein7c73bdi2d0-wave.json'),
              Path('verified-inputs/control-entropy.json'),
              Path('trinity-final-tests.log'),
              Path('trinity-input-verification.log'),
              Path('trinity-source-verification.log'),
              Path('trinity-final-run.log'),
              Path('trinity-final-verification.log'),
              Path('trinity-credential-scan.log'),
          ]
          for root in roots:
              if root.is_file():
                  items.append(root)
              elif root.is_dir():
                  items.extend(sorted(p for p in root.rglob('*') if p.is_file()))
          output = Path('zeref-trinity-final-evidence.zip')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(set(items), key=lambda p: str(p)):
                  info = zipfile.ZipInfo(str(path).replace('\\', '/'))
                  info.date_time = (2026, 8, 17, 0, 0, 0)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes())
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path('trinity-bundle-sha256.txt').write_text(digest + '  ' + output.name + '\n', encoding='utf-8')
          print('DETERMINISTIC_BUNDLE_SHA256=' + digest)
          PY

      - name: Upload full final evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-trinity-final-${{ github.run_id }}
          path: |
            evidence/zeref-trinity-final/**
            evidence/verified-inputs/ibm-marrakesh-da1l0maein7c73bdi2d0-wave.json
            verified-inputs/control-entropy.json
            trinity-final-tests.log
            trinity-input-verification.log
            trinity-source-verification.log
            trinity-final-run.log
            trinity-final-verification.log
            trinity-credential-scan.log
            zeref-trinity-final-evidence.zip
            trinity-bundle-sha256.txt
          if-no-files-found: warn

      - name: Commit sanitized final receipt
        if: always()
        env:
          TEST_CODE: ${{ steps.tests.outputs.exit_code }}
          INPUT_CODE: ${{ steps.inputs.outputs.exit_code }}
          SOURCE_CODE: ${{ steps.source.outputs.exit_code }}
          RUN_CODE: ${{ steps.finalrun.outputs.exit_code }}
          VERIFY_CODE: ${{ steps.verify.outputs.exit_code }}
          SCAN_CODE: ${{ steps.scan.outputs.exit_code }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          RUN_ID: ${{ github.run_id }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def code(name):
              raw = os.environ.get(name, '')
              return int(raw) if raw.strip().isdigit() else None

          codes = {
              'tests': code('TEST_CODE'),
              'inputs': code('INPUT_CODE'),
              'source': code('SOURCE_CODE'),
              'final_run': code('RUN_CODE'),
              'verification': code('VERIFY_CODE'),
              'credential_scan': code('SCAN_CODE'),
          }
          passed = all(value == 0 for value in codes.values())
          bundle_sha = None
          p = Path('trinity-bundle-sha256.txt')
          if p.exists():
              bundle_sha = p.read_text(encoding='utf-8').split()[0]
          receipt = {
              'schema': 'zeref.trinity-final-receipt.v1',
              'github_run_id': int(os.environ['RUN_ID']),
              'workflow_head_sha': os.environ['TESTED_SHA'],
              'artifact_id': int(os.environ['ARTIFACT_ID']) if os.environ.get('ARTIFACT_ID', '').isdigit() else None,
              'artifact_digest': os.environ.get('ARTIFACT_DIGEST') or None,
              'deterministic_bundle_sha256': bundle_sha,
              'passed': passed,
              'stage_exit_codes': codes,
              'credential_persisted': False if codes['credential_scan'] == 0 else None,
          }
          root = Path('evidence/final')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'zeref-trinity-final-latest.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          for name in ('manifest.json', 'summary.json'):
              src = Path('evidence/zeref-trinity-final') / name
              if src.exists():
                  dst = root / ('zeref-trinity-final-' + name)
                  dst.write_bytes(src.read_bytes())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/zeref-quantum-divergence
          git add evidence/final/zeref-trinity-final-latest.json
          git add evidence/final/zeref-trinity-final-manifest.json 2>/dev/null || true
          git add evidence/final/zeref-trinity-final-summary.json 2>/dev/null || true
          git commit -m "evidence: record full-system Trinity final run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:agent/zeref-quantum-divergence

      - name: Enforce final result
        if: always()
        env:
          TEST_CODE: ${{ steps.tests.outputs.exit_code }}
          INPUT_CODE: ${{ steps.inputs.outputs.exit_code }}
          SOURCE_CODE: ${{ steps.source.outputs.exit_code }}
          RUN_CODE: ${{ steps.finalrun.outputs.exit_code }}
          VERIFY_CODE: ${{ steps.verify.outputs.exit_code }}
          SCAN_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          test "${TEST_CODE:-1}" = 0
          test "${INPUT_CODE:-1}" = 0
          test "${SOURCE_CODE:-1}" = 0
          test "${RUN_CODE:-1}" = 0
          test "${VERIFY_CODE:-1}" = 0
          test "${SCAN_CODE:-1}" = 0
