name: COSMOS 006 independently audit archived controlled result (no models)

on:
  pull_request:
    branches: [experiment/cosmos-native-correction-002, main]
    paths:
      - "docs/experiments/cosmos-dyn12-controlled-006-summary.json"
      - "docs/experiments/COSMOS_DYN12_CONTROLLED_006_RESULTS.md"
      - "scripts/verify_dyn12_summary_006.py"
      - "tests/test_dyn12_summary_006.py"
      - ".github/workflows/cosmos-dyn12-summary-audit-006.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  archive-numeric-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest==8.4.2
      - run: |
          python -m pytest -q tests/test_dyn12_summary_006.py
          python -m scripts.verify_dyn12_summary_006
