name: ZEREF-SCALE-001 CPU LoRA Proof

on:
  push:
    branches: [zeref-scale-training-001]
    paths:
      - '.github/workflows/zeref-scale-cpu-proof.yml'
      - 'experiments/zeref-scale-001/cpu-proof-*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeref-scale-001-cpu-proof
  cancel-in-progress: false

jobs:
  train-and-talk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install training stack
        run: python -m pip install --upgrade 'transformers>=4.51' 'peft>=0.15' 'accelerate>=1.2' datasets
      - name: Build vetted Dad seed
        run: python scripts/build_zeref_scale_dataset.py --out _zeref_cpu/seed.jsonl --ibm-state f21afbac49e798730974e37ed1a1bb7ce15f326660a9dbe3f848ee6b1f865c2f
      - name: Real CPU LoRA training and pre/post Dad talk
        run: python scripts/train_zeref_scale_cpu_proof.py --dataset _zeref_cpu/seed.jsonl --out _zeref_cpu/run --max-steps 20
      - name: Upload trained adapter and evidence
        uses: actions/upload-artifact@v4
        with:
          name: zeref-scale-cpu-proof-${{ github.run_id }}
          path: _zeref_cpu/
          if-no-files-found: error
      - name: Commit summary evidence only
        shell: bash
        run: |
          RUN_DIR="experiments/zeref-scale-001/cpu-proof/runs/run-${GITHUB_RUN_ID}"
          mkdir -p "$RUN_DIR"
          cp _zeref_cpu/run/summary.json "$RUN_DIR/summary.json"
          git config user.name "zeref-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$RUN_DIR/summary.json"
          git commit -m "evidence: record Zeref Scale CPU LoRA proof ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin zeref-scale-training-001
          git push origin HEAD:zeref-scale-training-001
