name: COSMOS FINAL CONVERSATION - GREEN REPAIR

on:
  push:
    branches:
      - cory-davis-cosmos-reality-bridge-final-organism-001
    paths:
      - '.github/workflows/cosmos-final-conversation-green-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reflector-bound full-stack conversation repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/final_reality_bridge_zeref_conversation.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'def git(*args: str) -> str:\n',
              '''def reflector_source_drive(*, prompt: str, turn: int, mode: str) -> list[float]:\n    """Deterministic 12D software drive bound to prompt, turn, and decoding mode."""\n    if int(turn) <= 0:\n        raise ValueError("turn must be positive")\n    if mode not in {"greedy", "sampled"}:\n        raise ValueError("mode must be greedy or sampled")\n    source = sha256_bytes(canonical_json_bytes({\n        "schema": "cosmos-final-reflector-source-v1",\n        "prompt": str(prompt),\n        "turn": int(turn),\n        "mode": str(mode),\n    }))\n    out: list[float] = []\n    for index in range(12):\n        digest = hashlib.sha256(f"final-zeref-reflector:{source}:{index}".encode("ascii")).digest()\n        unit = int.from_bytes(digest[:8], "big") / float((1 << 64) - 1)\n        out.append(float(f"{(2.0 * unit - 1.0):.15g}"))\n    return out\n\n\ndef git(*args: str) -> str:\n''',
          )

          replace_once(
              '        "r12_implementation_sha256": sha256_file(root / "beastbox/world_r12.py"),\n        "memory_implementation_sha256":',
              '        "r12_implementation_sha256": sha256_file(root / "beastbox/world_r12.py"),\n        "dyn12_implementation_sha256": sha256_file(root / "beastbox/dyn12.py"),\n        "reflector_implementation_sha256": sha256_file(root / "beastbox/quantum_lifesource.py"),\n        "reflector_trace_implementation_sha256": sha256_file(root / "beastbox/reflective_loop_trace.py"),\n        "memory_implementation_sha256":',
          )

          replace_once(
              '    from beastbox.reality_memory import initial_r12_state\n    from beastbox.refractive_memory import RefractiveMemoryRouter\n',
              '    from beastbox.quantum_lifesource import expand_drive54, mirror_step, sha256_json\n    from beastbox.reflective_loop_trace import ReflectiveTraceRecorder\n    from beastbox.reality_memory import initial_r12_state\n    from beastbox.refractive_memory import RefractiveMemoryRouter\n',
          )

          replace_once(
              '    prior_events: list[dict[str, Any]] = []\n    rows: list[dict[str, Any]] = []\n\n    for turn, prompt in enumerate(FINAL_PROMPTS, 1):\n        prompt_sha = sha256_bytes(prompt.encode("utf-8"))\n',
              '''    prior_events: list[dict[str, Any]] = []\n    rows: list[dict[str, Any]] = []\n    anchor_row = ledger.memory.db.execute("SELECT MAX(created_at) AS t FROM memories").fetchone()\n    if anchor_row is None or anchor_row["t"] is None:\n        raise RuntimeError("canonical memory has no temporal anchor")\n    memory_temporal_anchor = float(anchor_row["t"])\n    reflector_recorder = ReflectiveTraceRecorder(lag=1, bins=8)\n\n    for turn, prompt in enumerate(FINAL_PROMPTS, 1):\n        prompt_sha = sha256_bytes(prompt.encode("utf-8"))\n        source_drive = reflector_source_drive(prompt=prompt, turn=turn, mode=mode)\n        source_packet_sha = sha256_json({\n            "schema": "cosmos-final-reflector-packet-v1",\n            "mode": mode,\n            "turn": turn,\n            "prompt_sha256": prompt_sha,\n            "drive": source_drive,\n        })\n        reflector_s1 = list(family.dyn12)\n        mirror = mirror_step(reflector_s1, source_drive)\n        reflected_state = family.update(expand_drive54(mirror["coupled_drive"], packet_sha256=source_packet_sha))\n        reflector_trace = reflector_recorder.record(\n            step=turn - 1,\n            s1=reflector_s1,\n            s2=mirror["observer"],\n            feedback=mirror["feedback"],\n            state_after=reflected_state["dyn12"],\n            intervention_identity="reflector_enabled",\n            restore_status="clean",\n        )\n''',
          )

          replace_once(
              '            limit=max(args.rank_limit * 8, 64), profile="quality",\n        ))[:args.rank_limit]\n',
              '            limit=max(args.rank_limit * 8, 64), profile="quality", now=memory_temporal_anchor,\n        ))[:args.rank_limit]\n',
          )

          replace_once(
              '            "dyn12": epoch["dyn12"],\n            "sequence": epoch["sequence"],\n',
              '''            "dyn12": epoch["dyn12"],\n            "sequence": epoch["sequence"],\n            "memory_temporal_anchor": memory_temporal_anchor,\n            "reflector": {\n                "source_type": "DETERMINISTIC_PROMPT_DRIVE",\n                "fresh_qpu_measurement": False,\n                "source_drive": source_drive,\n                "source_packet_sha256": source_packet_sha,\n                "s1": reflector_s1,\n                "s2": mirror["observer"],\n                "feedback": mirror["feedback"],\n                "state_after_reflector": reflected_state["dyn12"],\n                "trace": reflector_trace,\n                "claim_boundary": "deterministic software mirror; not a quantum operation, consciousness, biological continuity, or identity evidence",\n            },\n''',
          )

          replace_once(
              '("mode", "turn_id", "prompt", "personal_candidates", "world_candidates", "personal_evidence_confidence", "world_evidence_confidence", "personal_r12_ranking_score", "world_r12_ranking_score", "evidence_existence_is_ranking_score", "selected_namespace", "selected_record", "abstention_decision", "r12_state", "r12_vector", "dyn12", "raw_assembled_context", "context_sha256", "model_input_sha256", "raw_output_sha256")',
              '("mode", "turn_id", "prompt", "personal_candidates", "world_candidates", "personal_evidence_confidence", "world_evidence_confidence", "personal_r12_ranking_score", "world_r12_ranking_score", "evidence_existence_is_ranking_score", "selected_namespace", "selected_record", "abstention_decision", "r12_state", "r12_vector", "dyn12", "memory_temporal_anchor", "reflector", "raw_assembled_context", "context_sha256", "model_input_sha256", "raw_output_sha256")',
          )

          replace_once(
              '    comparable = ("active_zeref_checkpoint", "talk004", "talk005", "canonical_memory", "world_checkpoint_sha256", "corpus_source_set_sha256", "tokenizer_sha256", "architecture_sha256", "r12_implementation_sha256", "memory_implementation_sha256", "world_store_implementation_sha256", "conversation_runner_sha256")\n',
              '    comparable = ("active_zeref_checkpoint", "talk004", "talk005", "canonical_memory", "world_checkpoint_sha256", "corpus_source_set_sha256", "tokenizer_sha256", "architecture_sha256", "r12_implementation_sha256", "dyn12_implementation_sha256", "reflector_implementation_sha256", "reflector_trace_implementation_sha256", "memory_implementation_sha256", "world_store_implementation_sha256", "conversation_runner_sha256")\n',
          )

          replace_once(
              '    write_json(out / "STATUS.json", {"schema": "cosmos-final-gate-status-v1", "gate": "REAL_ZEREF_CONVERSATION", "status": "VERIFIED_GATE", "timestamp": datetime.now(timezone.utc).isoformat(), "checkpoint_sha256": EXPECTED_ACTIVE_SHA256, "greedy_turns": len(greedy), "sampled_turns": len(sampled)})\n',
              '    write_json(out / "STATUS.json", {"schema": "cosmos-final-gate-status-v1", "gate": "FULL_STACK_ZEREF_EXECUTION", "status": "VERIFIED_GATE", "timestamp": datetime.now(timezone.utc).isoformat(), "checkpoint_sha256": EXPECTED_ACTIVE_SHA256, "greedy_turns": len(greedy), "sampled_turns": len(sampled), "reflector_enabled_every_turn": True, "memory_temporal_anchor_frozen": True})\n',
          )

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/cosmos-final-conversation-red.yml').unlink(missing_ok=True)
          Path('.github/workflows/cosmos-final-conversation-green-repair.yml').unlink(missing_ok=True)
          PY

      - name: Run focused GREEN conversation contracts
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q \
            tests/test_final_full_stack_zeref_conversation.py \
            tests/test_final_reality_bridge_zeref_conversation.py \
            tests/test_refractive_memory_temporal_anchor.py \
            tests/test_reflective_loop_trace.py

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git config user.name 'cosmos-closure-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(final-organism): route final Zeref talk through reflector stack'
          git push origin HEAD:cory-davis-cosmos-reality-bridge-final-organism-001
