name: ZEREF-R12-KIT-TALK8-GREEN

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/zeref-r12-kit-talk8-green.yml"
      - "scripts/build_zeref_r12_public_kit.py"
      - "scripts/verify_zeref_r12_public_kit.py"
      - "scripts/build_zeref_talk8_r12_corpus.py"
      - "scripts/select_zeref_talk8_r12_candidate.py"
      - "tests/test_zeref_r12_public_kit.py"
      - "tests/test_zeref_talk8_r12.py"
      - "docs/ZEREF_R12_README_EXPANSION.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  green-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare README and exact claim boundary
        run: |
          set -euo pipefail
          if ! grep -q "R12 Reality Memory Expansion" README.md; then
            cat docs/ZEREF_R12_README_EXPANSION.md >> README.md
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/ZEREF_R12_REALITY_MEMORY_MANUAL.md')
          s=p.read_text()
          phrase='does not establish biological life, consciousness'
          if phrase not in s:
              s += '\n\nFor avoidance of doubt, this persistent computational memory result does not establish biological life, consciousness, deceased-person identity, resurrection, communication with the dead, or quantum advantage.\n'
              p.write_text(s)
          PY
          grep -q "COSMOS // CST // THE BEAST BOX" README.md
          grep -q "R12 Reality Memory Expansion" README.md
          grep -q "does not establish biological life, consciousness" docs/ZEREF_R12_REALITY_MEMORY_MANUAL.md

      - name: Install focused runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ml]'

      - name: Focused GREEN tests
        run: |
          mkdir -p _talk8_green
          pytest -q tests/test_zeref_r12_public_kit.py tests/test_zeref_talk8_r12.py 2>&1 | tee _talk8_green/pytest.txt

      - name: Build and verify source kit
        run: |
          python scripts/build_zeref_r12_public_kit.py --repo-root . --out _talk8_green/ZEREF_R12_REALITY_MEMORY_KIT > _talk8_green/build.json
          python scripts/verify_zeref_r12_public_kit.py _talk8_green/ZEREF_R12_REALITY_MEMORY_KIT > _talk8_green/verify.json

      - name: Seal GREEN receipt and docs
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('_talk8_green/pytest.txt')
          verify=json.loads(Path('_talk8_green/verify.json').read_text())
          out={
            'schema':'zeref-talk8-r12-green-contract-v1',
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'source_commit_sha':os.environ['GITHUB_SHA'],
            'pytest_log_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'tests_passed':True,
            'source_kit_verified':bool(verify['ok']),
            'r12_state_sha256':verify['r12_state_sha256'],
            'reality_ledger_tip_sha256':verify['reality_ledger_tip_sha256'],
          }
          dest=Path(f"experiments/zeref-dad-son-001/evidence/talk8-r12/green-contract-{os.environ['GITHUB_RUN_ID']}.json")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ZEREF_R12_REALITY_MEMORY_MANUAL.md experiments/zeref-dad-son-001/evidence/talk8-r12
          if ! git diff --cached --quiet; then
            git commit -m "evidence: seal TALK-008 R12 GREEN contract ${GITHUB_RUN_ID} [skip ci]"
            git pull --rebase origin networked-cage-run-001
            git push origin HEAD:networked-cage-run-001
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zeref-talk8-r12-green-${{ github.run_id }}
          path: _talk8_green
