name: Configuration contract

on:
  workflow_call:
  push:
    branches:
      - main
      - hardening/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: config-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify environment contract
        run: python -m beastbox.env_inventory --check .env.example beastbox --json
      - name: Verify Apache-2.0 metadata and negative-regression controls
        run: |
          python scripts/license_metadata_contract.py
          python -m unittest discover -s tests -p test_license_metadata_contract.py -v
      - name: Preserve complete tracked-text license term audit with file and line
        run: |
          mkdir -p build
          python scripts/license_metadata_contract.py --audit > build/license-audit.tsv
      - name: Upload licensing audit inventory for human review
        uses: actions/upload-artifact@v4
        with:
          name: license-audit-${{ github.sha }}
          path: build/license-audit.tsv
          retention-days: 7
