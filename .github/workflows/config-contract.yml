name: Configuration contract

on:
  push:
    branches:
      - main
      - hardening/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: config-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify environment contract
        run: python -m beastbox.env_inventory --check .env.example beastbox --json
