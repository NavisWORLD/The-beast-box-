name: Cosmic Genesis real 3D and safe roaming
on:
  pull_request:
    paths:
      - 'apps/beastbox-cloud/**'
      - '.github/workflows/cosmic-genesis-3d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/beastbox-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency-locked application
        run: npm install --no-audit --no-fund
      - name: Existing and new regression checks
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production Next build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Real Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Actual 3D render, valid animated GLB, matching GBA and responsive browser
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 >/tmp/genesis-3d-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for _ in range(120):
              try:
                  if urllib.request.urlopen("http://127.0.0.1:3100/api/genesis-release",timeout=2).status==200:break
              except Exception:time.sleep(1)
          else:raise RuntimeError("Actual built app not ready")
          PY
          python tests/genesis_3d_browser.py
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          BEASTBOX_OWNER_PASSWORD: public-genesis-ci-synthetic-only-not-owner
          BEASTBOX_CLOUD_AUTH_SECRET: public-genesis-ci-synthetic-long-secret-32
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmic-genesis-real-3d-evidence
          path: apps/beastbox-cloud/browser-evidence/genesis-3d/
          if-no-files-found: warn
