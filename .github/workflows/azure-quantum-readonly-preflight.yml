name: Azure Quantum — Read-only Connection + Rigetti QVM Target
on:
  pull_request:
    paths:
      - 'scripts/azure_quantum_readonly_preflight.py'
      - '.github/workflows/azure-quantum-readonly-preflight.yml'
permissions:
  contents: read
jobs:
  quantum-workspace-readonly:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Azure Quantum workspace SDK only
        run: python -m pip install "qdk[azure]"
      - name: Verify connection secret and enumerate actual Rigetti QVM availability — no jobs
        env:
          AZURE_QUANTUM_CONNECTION_STRING: ${{ secrets.AZURE_QUANTUM_CONNECTION_STRING }}
        run: python scripts/azure_quantum_readonly_preflight.py
