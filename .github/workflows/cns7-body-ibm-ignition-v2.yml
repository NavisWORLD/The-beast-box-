name: CNS7 Body IBM Ignition V2

on:
  push:
    branches: [cns7-body-ibm-ignition-v2-coupled-resilient]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cns7-body-ibm-ignition-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,quantum]'
      - run: pytest -q tests/test_cns7_ibm_ignition_v2.py tests/test_cns7_ibm_ignition_v2_preflight.py
