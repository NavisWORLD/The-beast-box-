name: Finisher V2 frozen source and security overlay

on:
  pull_request:
    paths:
      - 'patches/**'
      - 'scripts/apply-security-patches.py'
      - 'beastbox/persistent_substrate/**'
      - 'beastbox/dad_son.py'
      - 'tests/**'
      - '.github/workflows/finisher-security-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-pristine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original immutable source and original pinned evidence
        run: scripts/smoke/sealed-evidence-guard.sh
      - name: Freeze source pin receipt
        run: |
          mkdir -p "$RUNNER_TEMP/finisher-historical"
          git rev-parse HEAD > "$RUNNER_TEMP/finisher-historical/checkout-commit.txt"
          sha256sum beastbox/dad_son.py beastbox/persistent_substrate/ledger.py beastbox/persistent_substrate/substrate.py > "$RUNNER_TEMP/finisher-historical/frozen-source-SHA256SUMS.txt"
      - name: Reproduce historical offline experiment (not real model A-B-A)
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_persistent_substrate_offline.py tests/test_persistent_substrate_runner.py
          python scripts/run_persistent_substrate_offline_swap.py run \
            --repo-root . \
            --workspace "$RUNNER_TEMP/finisher-offline-workspace" \
            --out "$RUNNER_TEMP/finisher-historical/offline-evidence"
          python scripts/run_persistent_substrate_offline_swap.py verify \
            --repo-root . \
            --out "$RUNNER_TEMP/finisher-historical/offline-evidence"
          (cd "$RUNNER_TEMP/finisher-historical/offline-evidence" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finisher-historical-pristine-reproduction
          path: ${{ runner.temp }}/finisher-historical/
          if-no-files-found: warn

  patched-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify immutable pristine source and patch manifest
        run: |
          scripts/smoke/sealed-evidence-guard.sh
          python scripts/apply-security-patches.py --verify-only
      - name: Build verified isolated product worktree
        run: python scripts/apply-security-patches.py --destination "$RUNNER_TEMP/beastbox-finisher-product"
      - name: Install and run focused patched regressions
        working-directory: ${{ runner.temp }}/beastbox-finisher-product
        run: |
          python -m pip install -e . pytest
          python -m pytest -q \
            tests/test_persistent_substrate_ledger.py \
            tests/test_persistent_substrate_substrate.py \
            tests/test_zeref_dad_son_memory.py \
            tests/test_full_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finisher-patched-contract-${{ matrix.python-version }}
          path: ${{ runner.temp }}/beastbox-finisher-product/build/security-overlay-receipt.json
          if-no-files-found: warn
