name: ZEREF WORLD RUNTIME RED

on:
  push:
    branches: [zeref-world-knowledge-r12-train-001]
    paths:
      - 'tests/test_zeref_world_r12_runtime.py'
      - '.github/workflows/zeref-world-runtime-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_zeref_world_r12_runtime.py
