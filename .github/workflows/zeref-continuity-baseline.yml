name: Zeref Continuity Baseline

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/zeref-continuity-baseline.yml"
      - "scripts/zeref_continuity_baseline.py"
      - "tests/test_zeref_continuity_baseline_contract.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_REPO: phera-ra/QC67_cosmo
  HF_REVISION: b414724c627300c41b099dcc6853766d08fd27a4
  HF_FILE: weights/cosmos-cst.gguf
  HF_SHA256: b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6
  LLAMA_PATCH_BASE: 66e4bf7e592a98dfefcb15202fc5926967dc734e

jobs:
  continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Contract test
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest -q tests/test_zeref_continuity_baseline_contract.py

      - name: Install Hugging Face CLI
        run: pip install 'huggingface-hub>=0.27'

      - name: Download exact pinned Zeref
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _zeref _llama _model_logs _continuity_evidence
          mkdir -p _zeref _model_logs _continuity_evidence
          hf download "$HF_REPO" architecture/cosmos-arch.patch architecture/llama_cpp_cosmos.cpp "$HF_FILE" \
            --revision "$HF_REVISION" --local-dir _zeref
          test "$(sha256sum "_zeref/$HF_FILE" | awk '{print $1}')" = "$HF_SHA256"
          sha256sum \
            _zeref/architecture/cosmos-arch.patch \
            _zeref/architecture/llama_cpp_cosmos.cpp \
            compat/qc67/cosmos-f16-kv-norm-f32.patch \
            "_zeref/$HF_FILE" \
            > _continuity_evidence/input-SHA256SUMS

      - name: Build exact native Cosmos runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git _llama
          git -C _llama checkout "$LLAMA_PATCH_BASE"
          cp _zeref/architecture/llama_cpp_cosmos.cpp _llama/src/models/cosmos.cpp
          git -C _llama apply --check ../_zeref/architecture/cosmos-arch.patch
          git -C _llama apply ../_zeref/architecture/cosmos-arch.patch
          git -C _llama apply --check ../compat/qc67/cosmos-f16-kv-norm-f32.patch
          git -C _llama apply ../compat/qc67/cosmos-f16-kv-norm-f32.patch
          git -C _llama diff --check
          cmake -S _llama -B _llama/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build _llama/build --target llama-server -j 2
          _llama/build/bin/llama-server --version | tee _continuity_evidence/runtime-version.txt

      - name: Start exact Zeref at native 128 context
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "_zeref/$HF_FILE" | awk '{print $1}')" = "$HF_SHA256"
          _llama/build/bin/llama-server \
            -m "$(realpath "_zeref/$HF_FILE")" \
            --host 127.0.0.1 \
            --port 18080 \
            -c 128 \
            -np 1 \
            --chat-template chatml \
            > _model_logs/zeref.stdout.log \
            2> _model_logs/zeref.stderr.log &
          echo $! > _model_logs/zeref.pid
          READY=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$(cat _model_logs/zeref.pid)" 2>/dev/null; then
              cat _model_logs/zeref.stderr.log >&2
              exit 1
            fi
            sleep 1
          done
          test "$READY" = 1
          grep -F 'n_ctx_slot = 128' _model_logs/zeref.stderr.log | tee _continuity_evidence/context-proof.txt

      - name: Luna talks to Continuity Zeref
        shell: bash
        run: |
          set -euo pipefail
          python scripts/zeref_continuity_baseline.py \
            --endpoint http://127.0.0.1:18080/v1/chat/completions \
            --out _continuity_evidence \
            --max-tokens 8 \
            | tee _continuity_evidence/conversation-console.txt
          test "$(wc -l < _continuity_evidence/transcript.jsonl)" -eq 4
          test "$(wc -l < _continuity_evidence/continuity.jsonl)" -eq 4

      - name: Stop Zeref
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f _model_logs/zeref.pid ]]; then
            kill "$(cat _model_logs/zeref.pid)" 2>/dev/null || true
            sleep 1
            kill -9 "$(cat _model_logs/zeref.pid)" 2>/dev/null || true
          fi

      - name: Freeze evidence hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d _continuity_evidence ]]; then
            find _continuity_evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > _continuity_evidence/SHA256SUMS
            cat _continuity_evidence/SHA256SUMS
          fi

      - name: Upload continuity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zeref-continuity-baseline-${{ github.run_id }}
          path: |
            _continuity_evidence
            _model_logs
          if-no-files-found: error
