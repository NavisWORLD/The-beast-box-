name: CST12 Physics Probe 005

on:
  push:
    branches: [cst12-physics-probe-005-trinity-bracket]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cst12-probe005-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prehardware:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
      prereg_ready: ${{ steps.gate.outputs.prereg_ready }}
      freeze_sha: ${{ steps.gate.outputs.freeze_sha }}
    steps:
      - name: Checkout exact Probe 005 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Probe 005 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,quantum]'
      - name: Run every Probe 005 contract
        run: pytest -q tests/test_cst12_physics_probe_005_*.py
      - name: Resolve immutable Probe 005 freeze and approval gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          PREREG='experiments/cst12-physics-probe-005/preregistered-v1/preregistration.json'
          APPROVAL='experiments/cst12-physics-probe-005/RUN_APPROVED_V5.json'
          if [[ -f "$PREREG" ]]; then
            prereg_ready=true
            freeze_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('experiments/cst12-physics-probe-005/preregistered-v1/preregistration.json').read_text())
          print(p['implementation_freeze_commit'])
          PY
          )"
          else
            prereg_ready=false
            freeze_sha="$(git rev-parse HEAD)"
          fi
          approved=false
          if [[ -f "$APPROVAL" ]]; then
            if [[ "$prereg_ready" != true ]]; then
              echo 'RUN_APPROVED_V5.json exists without a frozen preregistration' >&2
              exit 1
            fi
            approved=true
          fi
          echo "prereg_ready=$prereg_ready" >> "$GITHUB_OUTPUT"
          echo "freeze_sha=$freeze_sha" >> "$GITHUB_OUTPUT"
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
      - name: Prove Probe 005 scientific implementation unchanged after freeze
        if: steps.gate.outputs.prereg_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FREEZE='${{ steps.gate.outputs.freeze_sha }}'
          git merge-base --is-ancestor "$FREEZE" HEAD
          git diff --exit-code "$FREEZE"..HEAD -- \
            beastbox/cst12_physics_probe_005.py \
            scripts/preflight_cst12_physics_probe_005.py \
            scripts/make_cst12_physics_probe_005_preregistration.py \
            scripts/run_cst12_physics_probe_005_ibm.py \
            scripts/analyze_cst12_physics_probe_005.py \
            tests/test_cst12_physics_probe_005_*.py \
            .github/workflows/cst12-physics-probe-005.yml \
            docs/superpowers/specs/2026-08-24-cst12-physics-probe-005-design.md \
            docs/superpowers/plans/2026-08-24-cst12-physics-probe-005.md
      - name: Build full deterministic Probe 005 prehardware bundle
        shell: bash
        run: |
          set -euo pipefail
          FREEZE='${{ steps.gate.outputs.freeze_sha }}'
          rm -rf _probe005_generated _probe005_rebuild
          mkdir -p _probe005_generated _probe005_rebuild
          cp experiments/cst12-physics-probe-003/preregistered-v2/state-packet.json _probe005_generated/state-packet.json
          python scripts/preflight_cst12_physics_probe_005.py \
            --state _probe005_generated/state-packet.json \
            --implementation-freeze "$FREEZE" \
            --datasets 10000 \
            --randomizations 100000 \
            --output _probe005_generated/preflight-receipt.json
          python scripts/make_cst12_physics_probe_005_preregistration.py \
            --state _probe005_generated/state-packet.json \
            --preflight _probe005_generated/preflight-receipt.json \
            --implementation-freeze "$FREEZE" \
            --output _probe005_generated/preregistration.json \
            --sha-output _probe005_generated/PREREGISTRATION_SHA256
          cp _probe005_generated/state-packet.json _probe005_rebuild/state-packet.json
          python scripts/preflight_cst12_physics_probe_005.py \
            --state _probe005_rebuild/state-packet.json \
            --implementation-freeze "$FREEZE" \
            --datasets 10000 \
            --randomizations 100000 \
            --output _probe005_rebuild/preflight-receipt.json
          python scripts/make_cst12_physics_probe_005_preregistration.py \
            --state _probe005_rebuild/state-packet.json \
            --preflight _probe005_rebuild/preflight-receipt.json \
            --implementation-freeze "$FREEZE" \
            --output _probe005_rebuild/preregistration.json \
            --sha-output _probe005_rebuild/PREREGISTRATION_SHA256
          cmp _probe005_generated/state-packet.json _probe005_rebuild/state-packet.json
          cmp _probe005_generated/preflight-receipt.json _probe005_rebuild/preflight-receipt.json
          cmp _probe005_generated/preregistration.json _probe005_rebuild/preregistration.json
          cmp _probe005_generated/PREREGISTRATION_SHA256 _probe005_rebuild/PREREGISTRATION_SHA256
          sha256sum _probe005_generated/preflight-receipt.json _probe005_generated/preregistration.json
          cat _probe005_generated/PREREGISTRATION_SHA256
      - name: Verify committed Probe 005 preregistration bytes
        if: steps.gate.outputs.prereg_ready == 'true'
        run: |
          cmp _probe005_generated/state-packet.json experiments/cst12-physics-probe-005/preregistered-v1/state-packet.json
          cmp _probe005_generated/preflight-receipt.json experiments/cst12-physics-probe-005/preregistered-v1/preflight-receipt.json
          cmp _probe005_generated/preregistration.json experiments/cst12-physics-probe-005/preregistered-v1/preregistration.json
          cmp _probe005_generated/PREREGISTRATION_SHA256 experiments/cst12-physics-probe-005/preregistered-v1/PREREGISTRATION_SHA256
      - name: Upload Probe 005 prehardware freeze bundle
        uses: actions/upload-artifact@v4
        with:
          name: cst12-probe005-prehardware-${{ steps.gate.outputs.freeze_sha }}
          path: _probe005_generated/
          if-no-files-found: error

  freeze-preregistration:
    needs: prehardware
    if: github.event_name == 'push' && needs.prehardware.outputs.prereg_ready == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cst12-physics-probe-005-trinity-bracket
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cst12-probe005-prehardware-${{ needs.prehardware.outputs.freeze_sha }}
          path: _probe005_generated
      - name: Verify branch has not moved since Probe 005 freeze
        run: test "$(git rev-parse HEAD)" = '${{ needs.prehardware.outputs.freeze_sha }}'
      - name: Commit exact Probe 005 preregistration bundle
        run: |
          mkdir -p experiments/cst12-physics-probe-005/preregistered-v1
          cp _probe005_generated/state-packet.json experiments/cst12-physics-probe-005/preregistered-v1/state-packet.json
          cp _probe005_generated/preflight-receipt.json experiments/cst12-physics-probe-005/preregistered-v1/preflight-receipt.json
          cp _probe005_generated/preregistration.json experiments/cst12-physics-probe-005/preregistered-v1/preregistration.json
          cp _probe005_generated/PREREGISTRATION_SHA256 experiments/cst12-physics-probe-005/preregistered-v1/PREREGISTRATION_SHA256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/cst12-physics-probe-005/preregistered-v1
          git commit -m 'experiment: freeze CST12 Physics Probe 005 preregistration'
          git push origin HEAD:cst12-physics-probe-005-trinity-bracket

  submit-hardware:
    needs: prehardware
    if: github.event_name == 'push' && needs.prehardware.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real-hardware dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,quantum]'
      - name: Reverify hash-bound RUN_APPROVED_V5.json and implementation_freeze_commit
        run: |
          test -s experiments/cst12-physics-probe-005/RUN_APPROVED_V5.json
          test -s experiments/cst12-physics-probe-005/preregistered-v1/PREREGISTRATION_SHA256
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.run_cst12_physics_probe_005_ibm import validate_hardware_approval
          root=Path('experiments/cst12-physics-probe-005')
          prereg=json.loads((root/'preregistered-v1/preregistration.json').read_text())
          approval=json.loads((root/'RUN_APPROVED_V5.json').read_text())
          prereg_sha=(root/'preregistered-v1/PREREGISTRATION_SHA256').read_text().strip()
          validate_hardware_approval(approval, prereg_sha=prereg_sha, freeze_sha=prereg['implementation_freeze_commit'])
          PY
      - name: Submit all 16 IBM Probe 005 jobs without retrieving results
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
        run: |
          python scripts/run_cst12_physics_probe_005_ibm.py \
            --mode submit \
            --prereg experiments/cst12-physics-probe-005/preregistered-v1/preregistration.json \
            --prereg-sha-file experiments/cst12-physics-probe-005/preregistered-v1/PREREGISTRATION_SHA256 \
            --state experiments/cst12-physics-probe-005/preregistered-v1/state-packet.json \
            --approval experiments/cst12-physics-probe-005/RUN_APPROVED_V5.json \
            --out experiments/cst12-physics-probe-005
          test -s experiments/cst12-physics-probe-005/submission-manifest.json
      - name: Upload immutable Probe 005 submission manifest and job IDs
        uses: actions/upload-artifact@v4
        with:
          name: cst12-probe005-submissions-${{ github.run_id }}
          path: experiments/cst12-physics-probe-005/
          if-no-files-found: error

  retrieve-and-analyze:
    needs: [prehardware, submit-hardware]
    if: github.event_name == 'push' && needs.submit-hardware.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real-hardware dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,quantum]'
      - name: Download sealed submission-manifest.json and all submission receipts
        uses: actions/download-artifact@v4
        with:
          name: cst12-probe005-submissions-${{ github.run_id }}
          path: experiments/cst12-physics-probe-005
      - name: Retrieve every submitted IBM job by immutable job ID
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
        run: |
          python scripts/run_cst12_physics_probe_005_ibm.py \
            --mode retrieve \
            --prereg experiments/cst12-physics-probe-005/preregistered-v1/preregistration.json \
            --prereg-sha-file experiments/cst12-physics-probe-005/preregistered-v1/PREREGISTRATION_SHA256 \
            --manifest experiments/cst12-physics-probe-005/submission-manifest.json \
            --out experiments/cst12-physics-probe-005
      - name: Analyze only after all 16 IBM jobs are complete
        run: |
          python scripts/analyze_cst12_physics_probe_005.py \
            --experiment-root experiments/cst12-physics-probe-005 \
            --prereg experiments/cst12-physics-probe-005/preregistered-v1/preregistration.json \
            --prereg-sha-file experiments/cst12-physics-probe-005/preregistered-v1/PREREGISTRATION_SHA256 \
            --state experiments/cst12-physics-probe-005/preregistered-v1/state-packet.json
          python - <<'PY'
          from pathlib import Path
          from scripts.run_cst12_physics_probe_004_ibm import _write_sha256s
          _write_sha256s(Path('experiments/cst12-physics-probe-005'))
          PY
      - name: Verify sealed Probe 005 evidence checksums
        working-directory: experiments/cst12-physics-probe-005
        run: sha256sum -c SHA256SUMS
      - name: Upload complete sealed Probe 005 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cst12-physics-probe-005-v1-${{ github.run_id }}
          path: experiments/cst12-physics-probe-005/
          if-no-files-found: error
      - name: Seal Probe 005 evidence back to branch without recursion
        run: |
          REMOTE_HEAD="$(git ls-remote origin refs/heads/cst12-physics-probe-005-trinity-bracket | cut -f1)"
          test "$REMOTE_HEAD" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/cst12-physics-probe-005
          git commit -m "evidence: seal CST12 Physics Probe 005 v1 run ${{ github.run_id }} [skip ci]"
          git push origin HEAD:cst12-physics-probe-005-trinity-bracket
