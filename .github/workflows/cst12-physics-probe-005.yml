name: CST12 Physics Probe 005

on:
  push:
    branches: [cst12-physics-probe-005-trinity-bracket]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cst12-probe005-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prehardware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Probe 005 test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,quantum]'
      - name: Run Probe 005 contracts
        run: pytest -q tests/test_cst12_physics_probe_005_*.py
      - name: Run first full 10,000-dataset Probe 005 preflight
        run: |
          mkdir -p _probe005_preflight
          python scripts/preflight_cst12_physics_probe_005.py \
            --state experiments/cst12-physics-probe-003/preregistered-v2/state-packet.json \
            --implementation-freeze "$GITHUB_SHA" \
            --datasets 10000 \
            --randomizations 100000 \
            --output _probe005_preflight/preflight-a.json
      - name: Independently rebuild full Probe 005 preflight
        run: |
          python scripts/preflight_cst12_physics_probe_005.py \
            --state experiments/cst12-physics-probe-003/preregistered-v2/state-packet.json \
            --implementation-freeze "$GITHUB_SHA" \
            --datasets 10000 \
            --randomizations 100000 \
            --output _probe005_preflight/preflight-b.json
          cmp _probe005_preflight/preflight-a.json _probe005_preflight/preflight-b.json
          sha256sum _probe005_preflight/preflight-a.json _probe005_preflight/preflight-b.json
      - name: Upload Probe 005 preflight receipts
        uses: actions/upload-artifact@v4
        with:
          name: cst12-probe005-preflight-${{ github.sha }}
          path: _probe005_preflight/
          if-no-files-found: error
