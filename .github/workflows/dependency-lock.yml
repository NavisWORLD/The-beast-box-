name: Dependency lock

on:
  push:
    branches: ["**"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-lock.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-lock.yml"

permissions:
  contents: write

concurrency:
  group: dependency-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.11"
      - name: Verify committed lock is current
        id: verify
        shell: bash
        run: |
          mkdir -p build
          set +e
          uv lock --check
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            printf '%s\n' '{"schema":"dependency-lock-v1","passed":true,"uv":"0.12.11"}' > build/dependency-lock.json
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv lock
          cp uv.lock build/generated-uv.lock
          printf '%s\n' '{"schema":"dependency-lock-v1","passed":false,"uv":"0.12.11","reason":"committed lock missing or stale; generated lock attached for review"}' > build/dependency-lock.json
          echo "generated=true" >> "$GITHUB_OUTPUT"
      - name: Commit resolver-generated lock on hardening branch
        if: steps.verify.outputs.generated == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/hardening/buyer-grade-2026-09-08'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build(deps): add resolver-generated uv lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Reject missing or stale committed lock
        if: steps.verify.outputs.generated == 'true'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: |
            build/dependency-lock.json
            build/generated-uv.lock
          if-no-files-found: warn
