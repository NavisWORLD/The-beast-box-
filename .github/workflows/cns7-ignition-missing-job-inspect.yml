name: CNS7 Ignition Missing Job Inspect

on:
  push:
    branches: [cns7-ignition-missing-job-inspect]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'qiskit-ibm-runtime>=0.49.0'
      - name: Inspect sealed IBM jobs without result retrieval
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
        run: |
          python - <<'PY'
          import json, os
          from qiskit_ibm_runtime import QiskitRuntimeService

          token = os.environ['IBM_QUANTUM_TOKEN'].strip()
          kwargs = {'channel': 'ibm_quantum_platform', 'token': token}
          instance = os.environ.get('IBM_QUANTUM_INSTANCE', '').strip()
          if instance:
              kwargs['instance'] = instance
          service = QiskitRuntimeService(**kwargs)
          ids = ['da721vu0ukec7382n6f0', 'da7220c6l22c73dn08e0']
          rows = []
          for job_id in ids:
              job = service.job(job_id)
              row = {'job_id': job_id}
              probes = [
                  ('status', lambda job=job: str(job.status())),
                  ('backend', lambda job=job: str(getattr(job.backend(), 'name', ''))),
                  ('tags', lambda job=job: list(job.tags or [])),
                  ('creation_date', lambda job=job: str(job.creation_date)),
                  ('usage_estimation', lambda job=job: str(job.usage_estimation)),
                  ('error_message', lambda job=job: str(job.error_message())),
                  ('metrics', lambda job=job: job.metrics()),
              ]
              for label, getter in probes:
                  try:
                      row[label] = getter()
                  except Exception as exc:
                      row[label] = f'ERROR:{type(exc).__name__}:{exc}'
              rows.append(row)
          print(json.dumps(rows, indent=2, sort_keys=True, default=str))
          PY
