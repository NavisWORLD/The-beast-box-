name: Zeref actual production UI conversation preflight, no new QPU submission
on:
  pull_request:
    paths:
      - '.github/workflows/zeref-production-chat-preflight.yml'
      - 'scripts/final_live_production.cjs'
permissions:
  contents: read
jobs:
  actual-ui-preflight:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/zeref-live-production-recording-20261010' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual browser
        run: |
          npm install --prefix "$RUNNER_TEMP/zeref-browser" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/zeref-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture actual production controls and one real hosted model reply, without IBM credentials
        working-directory: apps/beastbox-cloud
        env:
          BEAST_LIVE_TURNS: '1'
        run: |
          export NODE_PATH="$RUNNER_TEMP/zeref-browser/node_modules"
          timeout --kill-after=5s 240s node ../../scripts/final_live_production.cjs https://www.beastboxcosmos.xyz "$GITHUB_WORKSPACE/_zeref_production_ui_preflight/browser" experiment-evidence/zeref-heart-sound-20261010 bb-deada969 db4q484vf2bc73cuuuag /spark/ibm-zeref-heart-sound-20261010.json
      - name: Preserve actual diagnostics, model replies, native save and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-production-ui-preflight-${{ github.run_id }}
          path: _zeref_production_ui_preflight/
          retention-days: 30
          if-no-files-found: warn
