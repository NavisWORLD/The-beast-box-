name: Android on-device runtime candidate

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [polish/beast-box-launch-003]
    paths:
      - 'apps/android/**'
      - 'beastbox/**'
      - '.github/workflows/android-app.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Host bridge acceptance against actual core
        run: python -m unittest discover -s apps/android/tests -v
      - name: Build and lint sideload candidate and instrumentation APK
        working-directory: apps/android
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual embedded runtime across process restarts and A-B-A swaps
        id: emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/android
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            bash scripts/emulator_acceptance.sh acceptance
      - name: Source-bound build and acceptance receipt
        if: always()
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.emulator.outcome }}
        run: python apps/android/scripts/build_receipt.py
      - name: Upload gated sideload candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beast-android-0.6.0
          path: |
            apps/android/dist/
            apps/android/acceptance/
          if-no-files-found: error
      - name: Retain failed build or runtime evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: beast-android-0.6.0-failure
          path: |
            apps/android/dist/android-build-receipt.json
            apps/android/acceptance/
            apps/android/app/build/reports/
          if-no-files-found: warn
