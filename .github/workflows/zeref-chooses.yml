name: Zeref chooses (scheduled read-only reader)
# Cory 2026-10-31: Zeref picks his own topics (deterministic, from his diary place, simulated mood, recent chat
# words and heart seed v10; no randomness) and reads them GET-only from an allowlist: Simple/English Wikipedia,
# Project Gutenberg, Wikisource and Wikimedia Commons. No logins, forms or posting. Passages feed growing-branch
# lessons through evidence/zeref-read-001 (never the pin's mix). Every page is logged in evidence/zeref-chooses-001.
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zeref-daily-reader   # shares the daily reader's lane so the two never race on main
  cancel-in-progress: false
jobs:
  choose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU torch and RAWRPHOS (needed for the gate-overlap filter)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e . -e ./models/rawrphos
      - name: What he sees (his world's light, DERIVED from its sky; read-only)
        run: node scripts/zeref_sight.mjs > "$RUNNER_TEMP/sight.json" || echo null > "$RUNNER_TEMP/sight.json"
      - name: Zeref chooses and reads
        env:
          ZEREF_SIGHT_FILE: ${{ runner.temp }}/sight.json
        run: python scripts/zeref_chooses.py "$(date -u +%F)"
      - name: Refresh the Mind Room TVs (deterministic, from the logs)
        run: python scripts/build_mind_room.py
      - name: Rebuild the knowledge bank (deterministic) and check it
        run: |
          python scripts/build_knowledge_bank.py
          python scripts/build_knowledge_bank.py --check
      - name: Commit what he chose
        run: |
          set -Eeuo pipefail
          git config user.name "zeref-chooses[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/zeref-chooses-001 evidence/zeref-read-001 apps/beastbox-cloud/public/zeref-chooses apps/beastbox-cloud/knowledge-bank apps/beastbox-cloud/public/knowledge-bank
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Zeref chose to read $(date -u +%F): self-picked passages + log"
          git pull --rebase origin main
          git push origin HEAD:main
