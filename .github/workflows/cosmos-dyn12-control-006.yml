name: COSMOS 006 trained dyn12 vs standard and shuffled controls

on:
  pull_request:
    branches: [experiment/cosmos-native-correction-002, main]
    paths:
      - "scripts/cosmos_dyn12_controlled_006.py"
      - "tests/test_cosmos_dyn12_controlled_006.py"
      - "docs/experiments/COSMOS_DYN12_CONTROLLED_006_PROTOCOL.md"
      - ".github/workflows/cosmos-dyn12-control-006.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmos-dyn12-controlled-006-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-trained-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [11, 29, 47]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original native implementation; CPU only, no existing checkpoint changes
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install numpy==1.26.4 pytest==8.4.2 -e ./models/rawrphos
      - name: No-leakage and mechanism source-contract checks
        run: python -m pytest -q tests/test_cosmos_dyn12_controlled_006.py
      - name: Exactly three INDEPENDENTLY trained matched-initialization arms
        run: |
          mkdir -p build/results
          python -m scripts.cosmos_dyn12_controlled_006 \
            --seed ${{ matrix.seed }} \
            --output build/results/dyn12-seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: dyn12-independent-seed-${{ matrix.seed }}
          path: build/results/dyn12-seed-${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 30

  preregistered-combined-report:
    needs: [cpu-trained-pairs]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: dyn12-independent-seed-*
          path: build/results
          merge-multiple: true
      - name: Validate all three seed receipts and report unfavorable deltas
        run: |
          python -m scripts.cosmos_dyn12_controlled_006 \
            --summarize-dir build/results \
            --output build/dyn12-controlled-summary.json
          cat build/dyn12-controlled-summary.json
          sha256sum build/results/*.json build/dyn12-controlled-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-dyn12-006-full-receipts
          path: |
            build/results/*.json
            build/dyn12-controlled-summary.json
          if-no-files-found: error
          retention-days: 30
