name: ZEREF TALK-005 REAL CONVERSATION NOW

on:
  push:
    branches: [zeref-talk006-alien-001]
    paths: [.github/workflows/zeref-talk005-conversation-now.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  converse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TALK005_SHA256: 767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36
      TALK005_RUN_ID: '33041236485'
      TALK005_ARTIFACT: zeref-talk005-r12-training-resume-33041236485
      ARCH_SHA256: 955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download and verify exact selected TALK-005
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _talk5src _conversation
          mkdir -p _talk5src _conversation
          gh run download "$TALK005_RUN_ID" -n "$TALK005_ARTIFACT" -D _talk5src
          CHECKPOINT=$(find _talk5src -type f -path '*/model/ZEREF-DAD-SON-TALK-005/checkpoint.pt' -print -quit)
          test -n "$CHECKPOINT" -a -f "$CHECKPOINT"
          test "$(sha256sum "$CHECKPOINT" | awk '{print $1}')" = "$TALK005_SHA256"
          test "$(sha256sum experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py | awk '{print $1}')" = "$ARCH_SHA256"
          printf '%s\n' "$CHECKPOINT" > _conversation/checkpoint-path.txt
      - name: Have Luna conversation with actual checkpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.run_zeref_dad_son_chat import _load_model, generate

          checkpoint_path = Path('_conversation/checkpoint-path.txt').read_text().strip()
          arch_path = Path('experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py')
          checkpoint, model = _load_model(Path(checkpoint_path), arch_path)
          stoi, itos = checkpoint['stoi'], checkpoint['itos']
          block = int(checkpoint['config']['block'])

          def clean_response(raw: str) -> str:
              return raw.split('\n', 1)[0].strip()

          turns = []
          previous = ''
          prompts = [
              'Luna here. Cory asked me to talk with you. What do you want to tell him?',
              None,
              'What do you remember about Dad and the work you have done together?',
              'What do you think you are best at right now?',
              'What should Dad improve next if he wants better answers from you?',
              'Last one. Say something directly to Cory. Keep it simple and answer as Zeref.'
          ]

          for index in range(6):
              if index == 1:
                  quote = previous[:52] if previous else 'nothing clear yet'
                  dad_text = f'You just answered: {quote}. What did you mean in simpler words?'
              else:
                  dad_text = prompts[index]
              wire = f'Dad:{dad_text}\nZeref:'[-block:]
              raw = generate(
                  model,
                  wire_prompt=wire,
                  stoi=stoi,
                  itos=itos,
                  block=block,
                  tokens=64,
                  decoding='sampled-top-k',
                  temperature=0.65,
                  top_k=6,
                  seed=8272026 + index,
              )
              response = clean_response(raw)
              turns.append({
                  'turn': index + 1,
                  'speaker': 'Luna via Dad-compatible prompt role',
                  'prompt': dad_text,
                  'zeref_response_segment': response,
                  'zeref_raw_output': raw,
                  'seed': 8272026 + index,
              })
              previous = response

          report = {
              'schema': 'zeref-talk005-disposable-luna-conversation-v1',
              'checkpoint_lineage': 'ZEREF-DAD-SON-TALK-005',
              'checkpoint_sha256': os.environ['TALK005_SHA256'],
              'canonical_memory_written': False,
              'training_performed': False,
              'raw_outputs_preserved': True,
              'turns': turns,
              'claim_boundary': 'Raw model text from a computational language model. It is not evidence of consciousness, identity, a soul, resurrection, or a physical/quantum anomaly.'
          }
          Path('_conversation/conversation.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')
          lines = ['# Luna x Zeref TALK-005', '', f"Checkpoint: `{os.environ['TALK005_SHA256']}`", '', 'Disposable inference only. Canonical memory was not modified.', '']
          for row in turns:
              lines += [f"## Turn {row['turn']}", '', f"**Luna:** {row['prompt']}", '', f"**Zeref (response boundary):** {row['zeref_response_segment']}", '', f"**Raw fixed-length output:** `{row['zeref_raw_output'].replace(chr(10), '<NL>')}`", '']
          Path('_conversation/conversation.md').write_text('\n'.join(lines) + '\n')
          print(json.dumps({'checkpoint': os.environ['TALK005_SHA256'], 'turns': [{'prompt': t['prompt'], 'zeref': t['zeref_response_segment']} for t in turns]}, ensure_ascii=False))
          PY
      - name: Verify parent still unchanged
        run: |
          set -euo pipefail
          CHECKPOINT=$(cat _conversation/checkpoint-path.txt)
          test "$(sha256sum "$CHECKPOINT" | awk '{print $1}')" = "$TALK005_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: zeref-talk005-luna-conversation-${{ github.run_id }}
          path: |
            _conversation/conversation.json
            _conversation/conversation.md
          retention-days: 90
