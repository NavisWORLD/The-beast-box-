name: Beast Cage interactive UI
on:
  pull_request:
    paths:
      - 'apps/beastbox-cloud/**'
      - '.github/workflows/beast-cage-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/beastbox-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Existing plus Beast Cage contract tests
        run: npm test
      - name: TypeScript integrity
        run: npm run typecheck
      - name: Production app build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install real Chromium (isolated public preview only)
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run actual built app in Chromium at desktop and mobile sizes
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/beast-cage-next.log 2>&1 &
          NEXT_PID=$!
          trap 'kill $NEXT_PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for _ in range(90):
              try:
                  if urllib.request.urlopen('http://127.0.0.1:3100/beast-cage',timeout=2).status==200:
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('Built Beast Cage app failed to start')
          PY
          python tests/beast_cage_browser.py
        env:
          BEASTBOX_OWNER_PASSWORD: public-ci-visual-fixture-not-a-real-password
          BEASTBOX_CLOUD_AUTH_SECRET: public-ci-cosmic-preview-fixture-32-chars-long
          BEASTBOX_CLOUD_BRIDGE_URL: ''
          BEASTBOX_CLOUD_BRIDGE_TOKEN: ''
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beast-cage-actual-browser-captures
          path: apps/beastbox-cloud/browser-evidence/beast-cage/
          if-no-files-found: warn
