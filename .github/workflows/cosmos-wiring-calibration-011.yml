name: COSMOS 011 actual CNS/R12 closed-loop wiring canary and real oracle calibration

on:
  pull_request:
    branches: [experiment/cosmos-end-to-end-reasoning-009]
    paths:
      - "scripts/cosmos_wiring_calibration_011.py"
      - "tests/test_cosmos_wiring_calibration_011.py"
      - "docs/experiments/COSMOS_WIRING_CALIBRATION_011_PROTOCOL.md"
      - ".github/workflows/cosmos-wiring-calibration-011.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmos-wiring-011-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-real-production-loop-with-synthetic-record-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Existing production runtime, original R12 and known experimental code
        run: python -m pip install -e . pytest==8.4.2
      - name: Run source tests and real product CNS/R12 turn/reopen canary
        run: |
          python -m pytest -q tests/test_cosmos_wiring_calibration_011.py
          mkdir -p build/audit
          python -m scripts.cosmos_wiring_calibration_011 \
            --audit-only \
            --output build/audit/original-runtime-closed-loop-wiring.json
          sha256sum build/audit/original-runtime-closed-loop-wiring.json
      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-011-actual-runtime-wiring-diagnostic
          path: build/audit/original-runtime-closed-loop-wiring.json
          retention-days: 30
          if-no-files-found: error

  actual-pinned-model-oracle-calibration:
    needs: [inspect-real-production-loop-with-synthetic-record-only]
    runs-on: ubuntu-latest
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        model: [qwen2.5-0.5b, smollm2-135m]
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pinned original pretrained model SHA/architecture; public CPU runner
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e . transformers==4.49.0 huggingface_hub==0.30.2 safetensors==0.5.3 numpy==1.26.4 pytest==8.4.2
      - name: Independent real model oracle copy, arithmetic, original-vs-structured prompts
        run: |
          mkdir -p build/real
          env -u HF_TOKEN -u HUGGING_FACE_HUB_TOKEN \
            python -m scripts.cosmos_wiring_calibration_011 \
              --model ${{ matrix.model }} \
              --directory build/verified-${{ matrix.model }} \
              --output build/real/oracle-${{ matrix.model }}.json
      - name: Preserve ALL synthetic-only literal failures with immutable original subject identity
        run: |
          SUBJECT=${{ matrix.model }} python - <<'PY'
          import hashlib,json,os,pathlib
          name=os.environ["SUBJECT"]
          path=pathlib.Path("build/real/oracle-"+name+".json")
          raw=path.read_bytes();r=json.loads(raw)
          assert r["schema"]=="cosmos-wiring-real-oracle-calibration-011-v1"
          assert r["subject"]==name and len(r["observations"])==32
          assert r["conditions"]==[
             "copy_seed","arithmetic_only","original_009_oracle","structured_011_oracle"]
          assert r["budgets"]==[18,80]
          assert len(r["original_parameter_digest_unchanged"])==64
          assert all(len(set(row["case_id"] for row in r["observations"] if row["budget"]==budget and row["condition"]==cond))==4
                     for budget in (18,80) for cond in r["conditions"])
          print("ACTUAL_PINNED_ORIGINAL_ORACLE_FULL_SHA256="+hashlib.sha256(raw).hexdigest())
          print("ALL_CALIBRATION_COUNTS="+json.dumps(r["aggregate"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-011-real-oracle-${{ matrix.model }}
          path: build/real/oracle-${{ matrix.model }}.json
          retention-days: 30
          if-no-files-found: error
