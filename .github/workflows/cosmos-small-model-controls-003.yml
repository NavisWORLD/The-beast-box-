name: COSMOS 003 verified small public instruct controls (CPU only)

on:
  pull_request:
    branches: [main, experiment/cosmos-native-correction-002]
    paths:
      - "scripts/cosmos_public_small_controls_003.py"
      - "tests/test_cosmos_public_small_controls_003.py"
      - "docs/experiments/COSMOS_SMALL_MODEL_CONTROLS_003_PROTOCOL.md"
      - ".github/workflows/cosmos-small-model-controls-003.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmos-small-controls-003-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-public-cpu-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        model: ["smollm2-135m", "qwen2.5-0.5b"]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local CPU public-model inference and frozen-source tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e . transformers==4.49.0 huggingface_hub==0.30.2 safetensors==0.5.3 "pytest>=8,<10"
      - name: Ensure tasks/arms and upstream SHA pins exactly match frozen protocol
        run: python -m pytest -q tests/test_cosmos_native_correction_002.py tests/test_cosmos_public_small_controls_003.py
      - name: Public-only release fetch, full SHA verification, and real CPU inference
        run: |
          mkdir -p build
          env -u HF_TOKEN -u HUGGING_FACE_HUB_TOKEN python scripts/cosmos_public_small_controls_003.py \
            --model ${{ matrix.model }} \
            --directory build/verified-${{ matrix.model }} \
            --output build/controls-${{ matrix.model }}.json
      - name: Preserve every actual output and signed baseline contrast in CI logs
        run: |
          MODEL_LABEL=${{ matrix.model }} python - <<'PY'
          import hashlib,json,os,pathlib
          label=os.environ["MODEL_LABEL"]
          path=pathlib.Path("build/controls-"+label+".json")
          raw=path.read_bytes()
          obj=json.loads(raw)
          assert obj["schema"]=="cosmos-public-small-instruct-controls-003-v1"
          assert obj["model"]==label and obj["no_model_training_memory_or_tool_authority"] is True
          assert len(obj["observations"])==8
          assert len(obj["shared_arms"])==5
          assert all(set(row["outcomes"])==set(obj["shared_arms"]) for row in obj["observations"])
          print("ORIGINAL_PUBLIC_SMALL_RESULT_SHA256="+hashlib.sha256(raw).hexdigest())
          print(path.read_text())
          PY
