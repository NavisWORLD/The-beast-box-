name: Beast Box Web Runtime
on:
  push:
    paths:
      - 'html/**'
      - 'scripts/smoke/html_browser.py'
      - 'tests/test_html_server.py'
      - '.github/workflows/web-runtime.yml'
  pull_request:
    paths:
      - 'html/**'
      - 'scripts/smoke/html_browser.py'
      - 'tests/test_html_server.py'
      - '.github/workflows/web-runtime.yml'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP and browser test dependencies
        run: python -m pip install -e . pytest==8.4.2 playwright==1.55.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Syntax check
        run: npm --prefix html run check
      - name: Contract and security tests
        run: npm --prefix html test
      - name: Production static build
        run: npm --prefix html run build
      - name: Real HTTP security and session checks
        run: python -m pytest tests/test_html_server.py
      - name: Real browser continuity, freshness and recovery
        run: python scripts/smoke/html_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-browser
          path: build/html-browser/
          if-no-files-found: warn
      - name: Static artifact checks
        run: |
          test -f html/dist/index.html
          test -f html/dist/standalone.html
          test -f html/dist/manifest.webmanifest
          test -f html/dist/sw.js
          grep -q 'Content-Security-Policy' html/serve.py
          ! grep -R -E 'sk-[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' html --exclude-dir=dist
