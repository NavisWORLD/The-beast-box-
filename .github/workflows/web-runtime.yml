name: Beast Box Web Runtime
on:
  push:
    paths:
      - 'html/**'
      - '.github/workflows/web-runtime.yml'
  pull_request:
    paths:
      - 'html/**'
      - '.github/workflows/web-runtime.yml'
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm --prefix html run check
      - name: Contract and security tests
        run: npm --prefix html test
      - name: Production static build
        run: npm --prefix html run build
      - name: Static artifact checks
        run: |
          test -f html/dist/index.html
          test -f html/dist/standalone.html
          test -f html/dist/manifest.webmanifest
          test -f html/dist/sw.js
          grep -q 'Content-Security-Policy' html/serve.py
          ! grep -R -E 'sk-[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' html --exclude-dir=dist
