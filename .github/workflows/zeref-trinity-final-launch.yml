name: Gate and launch Zeref Trinity final

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  gate-and-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zeref-quantum-divergence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install complete divergence test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,quantum]'
      - name: Run complete divergence suite
        shell: bash
        run: |
          set -o pipefail
          pytest -vv -x tests/test_quantum_divergence_*.py 2>&1 | tee trinity-launch-pytest.log
      - name: Dispatch and watch frozen final workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run zeref-trinity-final.yml --ref agent/zeref-quantum-divergence
          final_run_id=''
          for _ in $(seq 1 30); do
            final_run_id="$(gh run list \
              --workflow zeref-trinity-final.yml \
              --branch agent/zeref-quantum-divergence \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${GITHUB_SHA}\") | .databaseId" \
              | head -n 1)"
            if [ -n "$final_run_id" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$final_run_id" ]; then
            echo 'Could not discover dispatched Trinity final run id' >&2
            exit 1
          fi
          echo "TRINITY_FINAL_RUN_ID=$final_run_id"
          gh run watch "$final_run_id" --exit-status
      - name: Upload launch-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-trinity-launch-gate-${{ github.run_id }}
          path: trinity-launch-pytest.log
          if-no-files-found: warn
