name: Gate and launch Zeref Trinity final

on:
  push:
    branches:
      - 'agent/zeref-quantum-divergence'
    paths:
      - '.github/workflows/zeref-trinity-final-launch.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  gate-and-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zeref-quantum-divergence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install complete divergence test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,quantum]'
      - name: Run complete divergence suite
        shell: bash
        run: |
          set -o pipefail
          pytest -vv -x tests/test_quantum_divergence_*.py 2>&1 | tee trinity-launch-pytest.log
      - name: Dispatch frozen final workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run zeref-trinity-final.yml --ref agent/zeref-quantum-divergence
          echo 'TRINITY_FINAL_DISPATCHED=1'
      - name: Upload launch-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeref-trinity-launch-gate-${{ github.run_id }}
          path: trinity-launch-pytest.log
          if-no-files-found: warn
