name: Persistent substrate real-model swap

on:
  push:
    branches:
      - experiment/persistent-substrate-real-model-swap-001
    paths:
      - 'beastbox/persistent_substrate/**'
      - 'experiments/persistent-substrate-real-model-swap-001/**'
      - 'tests/test_persistent_substrate_real_*.py'
      - '.github/workflows/persistent-substrate-real-model-swap.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: persistent-substrate-real-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - name: Frozen real-model protocol contract
        run: python -m pytest tests/test_persistent_substrate_real_prompts.py -q
      - name: Sealed scientific evidence guard
        run: git diff --exit-code c8769d0f1c9dab7a0c9adc0082d7234e7ff22f6f -- evidence/final-whole-organism-001/
