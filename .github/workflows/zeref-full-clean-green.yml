name: ZEREF FULL CLEAN GREEN + REGRESSION

on:
  push:
    branches: [zeref-talk006-full-clean-train-001]
    paths:
      - '.github/workflows/zeref-full-clean-green.yml'

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test runtime
        run: python -m pip install -e '.[dev]'
      - name: Focused full-clean contract
        run: python -m pytest -q tests/test_zeref_full_clean_corpus.py
      - name: Complete repository regression suite
        run: python -m pytest -q
