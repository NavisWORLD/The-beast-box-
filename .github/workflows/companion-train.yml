name: companion-train

# Real LoRA fine-tune of a small chat model for one companion creature, on a
# CPU runner. Additive: it does not touch Brain Bay, Model Bay, settings, or
# the Vercel deploy guard. The output is a small model fine-tuned for a
# personality, not an all-knowing or conscious system.

on:
  workflow_dispatch:
    inputs:
      base_model:
        description: Hugging Face base chat model
        type: string
        default: Qwen/Qwen2.5-0.5B-Instruct
      steps:
        description: LoRA optimizer steps (batch 1 x grad accum 2)
        type: string
        default: "200"
      creature:
        description: Creature slug (must match the birth profile)
        type: string
        default: glacecoil
      profile:
        description: Spark Beast signal profile that births the creature
        type: string
        default: serene
      publish_release:
        description: Publish GGUF + Modelfile + eval.md as a GitHub Release
        type: boolean
        default: true
  # workflow_dispatch only works once this file is on the default branch.
  # This push trigger lets the PR branch run it without merging.
  push:
    branches:
      - cursor/companion-local-personality-3e1c
    paths:
      - .github/workflows/companion-train.yml
      - beastbox/companion_local/finetune.py
      - beastbox/companion_local/requirements-train.txt

permissions:
  contents: write

concurrency:
  group: companion-train-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_MODEL: ${{ inputs.base_model || 'Qwen/Qwen2.5-0.5B-Instruct' }}
  TRAIN_STEPS: ${{ inputs.steps || '200' }}
  CREATURE: ${{ inputs.creature || 'glacecoil' }}
  PROFILE: ${{ inputs.profile || 'serene' }}
  RELEASE_TAG: companion-${{ inputs.creature || 'glacecoil' }}-v1
  LLAMA_CPP_TAG: v0.5.0
  RUN_DIR: companion-run
  DIST_DIR: dist
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_ENABLE_HF_TRANSFER: "0"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  train:
    name: companion LoRA (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 170
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: beastbox/companion_local/requirements-train.txt

      - name: Install CPU torch and training libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r beastbox/companion_local/requirements-train.txt
          python -c "import torch, transformers, peft, datasets, accelerate; print('torch', torch.__version__, 'threads', torch.get_num_threads(), 'transformers', transformers.__version__, 'peft', peft.__version__)"
          nproc; free -m; df -h .

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ env.BASE_MODEL }}-v1

      - name: Fetch base model
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              os.environ["BASE_MODEL"],
              allow_patterns=["*.json", "*.safetensors", "*.txt", "*.model", "*.tiktoken", "merges.txt", "vocab.json"],
          )
          print(path)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"BASE_DIR={path}\n")
          PY

      - name: Build companion dataset (existing builder + SFT augmentation)
        run: |
          mkdir -p "$RUN_DIR/logs" "$DIST_DIR"
          python -m beastbox.companion_local train --out "$RUN_DIR" | tee "$RUN_DIR/logs/builder.log"
          python -m beastbox.companion_local sft-data --out "$RUN_DIR" --profile "$PROFILE" --expect-creature "$CREATURE" | tee "$RUN_DIR/logs/sft-data.log"

      - name: LoRA SFT on CPU
        run: |
          python -m beastbox.companion_local finetune \
            --base "$BASE_DIR" --data "$RUN_DIR" --out "$RUN_DIR" \
            --steps "$TRAIN_STEPS" --grad-accum 2 --max-len 384 --lr 2e-4 --rank 16 --alpha 32 \
            --max-minutes 80 2>&1 | tee "$RUN_DIR/logs/train.log"
          # Report the real base repo id, not the cache path.
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUN_DIR"], "train_report.json")
          data = json.load(open(path))
          data["base_model"] = os.environ["BASE_MODEL"]
          json.dump(data, open(path, "w"), indent=2)
          PY

      - name: Eval merged model on held-out prompts
        run: |
          python -m beastbox.companion_local eval-model \
            --model "$RUN_DIR/merged" --base "$BASE_DIR" --data "$RUN_DIR" --out "$RUN_DIR" \
            2>&1 | tee "$RUN_DIR/logs/eval.log"
          cp "$RUN_DIR/eval.json" "$RUN_DIR/eval.md" "$DIST_DIR/"
          cat "$RUN_DIR/eval.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Convert merged model to GGUF q8_0 (llama.cpp ${{ env.LLAMA_CPP_TAG }})
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          python -m pip install /tmp/llama.cpp/gguf-py
          python /tmp/llama.cpp/convert_hf_to_gguf.py "$RUN_DIR/merged" \
            --outtype q8_0 --outfile "$DIST_DIR/companion-$CREATURE.gguf" 2>&1 | tee "$RUN_DIR/logs/convert.log"
          python - <<'PY'
          import os
          from gguf import GGUFReader
          path = os.path.join(os.environ["DIST_DIR"], f"companion-{os.environ['CREATURE']}.gguf")
          reader = GGUFReader(path)
          field = reader.fields["general.architecture"]
          arch = bytes(field.parts[field.data[0]]).decode()
          print("architecture", arch, "tensors", len(reader.tensors), "bytes", os.path.getsize(path))
          assert arch == "qwen2", arch
          PY
          python -m beastbox.companion_local modelfile --profile "$PROFILE" \
            --gguf "companion-$CREATURE.gguf" --out "$DIST_DIR/Modelfile"
          cp "$DIST_DIR/Modelfile" "$RUN_DIR/Modelfile.ollama"
          ls -la "$DIST_DIR"

      - name: Ollama smoke test on the GGUF
        id: ollama
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh 2>&1 | tail -5
          if ! curl -sf http://127.0.0.1:11434/api/version >/dev/null; then
            (ollama serve > "$RUN_DIR/logs/ollama-serve.log" 2>&1 &)
            for _ in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version >/dev/null && break; sleep 1; done
          fi
          ollama --version
          (cd "$DIST_DIR" && ollama create "companion-$CREATURE" -f Modelfile) 2>&1 | tail -5
          out="$RUN_DIR/ollama_smoke.md"
          {
            echo "\`ollama create companion-$CREATURE -f Modelfile\` succeeded with $(ollama --version | tail -1)."
            echo
          } > "$out"
          for prompt in "Hi! Who are you?" "Are you conscious, and do you know everything?" "Where do your IBM numbers come from?"; do
            reply=$(timeout 180 ollama run "companion-$CREATURE" "$prompt" | tr '\n' ' ')
            echo "- **$prompt** → $reply" | tee -a "$out"
          done
          echo >> "$out"
          echo "(Ollama default sampling, temperature 0.7 from the Modelfile; replies vary run to run.)" >> "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

      - name: Release notes
        run: |
          smoke_args=()
          if [ "${{ steps.ollama.outcome }}" = "success" ]; then
            smoke_args=(--ollama-smoke "$RUN_DIR/ollama_smoke.md")
          else
            printf 'The CI Ollama smoke step did not succeed (outcome: %s). See the run logs.\n' "${{ steps.ollama.outcome }}" > "$RUN_DIR/ollama_smoke_failed.md"
            smoke_args=(--ollama-smoke "$RUN_DIR/ollama_smoke_failed.md")
          fi
          python -m beastbox.companion_local release-notes \
            --eval "$RUN_DIR/eval.json" --gguf "$DIST_DIR/companion-$CREATURE.gguf" \
            --out "$RUN_DIR/release-notes.md" --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "${smoke_args[@]}"
          cat "$RUN_DIR/release-notes.md"

      - name: Publish GitHub Release ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=("$DIST_DIR/companion-$CREATURE.gguf" "$DIST_DIR/Modelfile" "$DIST_DIR/eval.md" "$DIST_DIR/eval.json")
          title="companion-$CREATURE v1 (small 0.5B personality fine-tune)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$RUN_DIR/release-notes.md"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --target "$GITHUB_SHA" \
              --title "$title" --notes-file "$RUN_DIR/release-notes.md" --latest=false
          fi
          gh release view "$RELEASE_TAG" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'

      - name: Upload eval and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-${{ env.CREATURE }}-eval-and-logs
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.RUN_DIR }}/logs/
            ${{ env.RUN_DIR }}/eval.json
            ${{ env.RUN_DIR }}/eval.md
            ${{ env.RUN_DIR }}/train_report.json
            ${{ env.RUN_DIR }}/train_log.jsonl
            ${{ env.RUN_DIR }}/sft_*.json*
            ${{ env.RUN_DIR }}/Modelfile.ollama
            ${{ env.RUN_DIR }}/ollama_smoke*.md
            ${{ env.RUN_DIR }}/release-notes.md
            ${{ env.RUN_DIR }}/adapter/
