name: Beast Box Android device (experimental)

# Builds apps/beastbox-android: JVM unit tests (command/state encoding), lint, debug APK.
# Pushing a tag named beastbox-android-experimental-v* also publishes a NOT-latest pre-release
# with the debug APK attached.

on:
  pull_request:
    paths:
      - 'apps/beastbox-android/**'
      - '.github/workflows/beastbox-android.yml'
  push:
    tags:
      - 'beastbox-android-experimental-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beastbox-android-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: beastbox-android-experimental-v0.2-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/beastbox-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK (ANDROID_HOME, licenses accepted); AGP fetches anything missing.
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -n 12
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Name APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          cat "dist/$APK_NAME.sha256"
          ls -l dist
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: beastbox-android-experimental-v0.2-debug
          path: apps/beastbox-android/dist/
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beastbox-android-reports
          path: |
            apps/beastbox-android/app/build/reports/
            apps/beastbox-android/app/build/test-results/
          if-no-files-found: warn

  prerelease:
    needs: build
    if: startsWith(github.ref, 'refs/tags/beastbox-android-experimental-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: beastbox-android-experimental-v0.2-debug
          path: dist
      - name: Publish pre-release (not latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(dist/*.apk dist/*.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --prerelease --latest=false
          else
            gh release create "$TAG" "${files[@]}" \
              --verify-tag \
              --title "Beast Box Android device — experimental v0.2 (debug APK)" \
              --notes-file apps/beastbox-android/docs/prerelease-notes.md \
              --prerelease --latest=false
          fi
          gh release view "$TAG" --json url,isPrerelease,assets --jq '{url, isPrerelease, assets: [.assets[].name]}'
