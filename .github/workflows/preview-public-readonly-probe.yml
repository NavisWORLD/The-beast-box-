name: Hosted preview public read-only reachability (no credentials)

on:
  push:
    branches:
      - deploy/beastbox-vercel-preview-001
    paths:
      - .github/workflows/preview-public-readonly-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe public preview without owner login or protection bypass
        env:
          HOSTED_PREVIEW_ORIGIN: https://the-beast-box-git-deploy-beastbox-vercel-preview-001-zerefs-end.vercel.app
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          BASE = os.environ["HOSTED_PREVIEW_ORIGIN"].rstrip("/")
          PROTECTED = {301, 302, 303, 307, 308, 401, 403}
          class NeverRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NeverRedirect())

          def get(path):
              req = urllib.request.Request(
                  BASE + path,
                  headers={"User-Agent": "BeastBoxPublicReadOnlyCI/1.0",
                           "Accept": "application/json" if path else "text/html"},
                  method="GET",
              )
              try:
                  with opener.open(req, timeout=12) as reply:
                      status = reply.status
                      data = reply.read(65537)
                      content_type = reply.headers.get("Content-Type", "")
              except urllib.error.HTTPError as error:
                  status, content_type = error.code, error.headers.get("Content-Type", "")
                  data = b""
              if len(data) > 65536:
                  raise RuntimeError("public probe response exceeded bounded maximum")
              return status, content_type, data

          landing, landing_type, landing_body = get("")
          session, session_type, session_body = get("/api/session")
          status, status_type, status_body = get("/api/status")
          if landing in PROTECTED or session in PROTECTED or status in PROTECTED:
              verdict = "ACCESS_PROTECTED_OR_REDIRECTED_NOT_AUTHENTICATED"
              verified = False
          elif landing == session == status == 200:
              if "html" not in landing_type.lower() or b"BEAST BOX" not in landing_body:
                  verdict, verified = "HTTP_200_WRONG_OR_UNVERIFIED_LANDING", False
              else:
                  try:
                      account = json.loads(session_body)
                      backend = json.loads(status_body)
                  except (UnicodeDecodeError, ValueError):
                      verdict, verified = "HTTP_200_UNEXPECTED_API_PAYLOAD", False
                  else:
                      verified = (account.get("owner") is False and
                                  backend.get("owner") is False and
                                  backend.get("backendStatus") == "OWNER_LOGIN_REQUIRED")
                      verdict = ("PUBLIC_LANDING_AND_ANONYMOUS_FAIL_CLOSED_ROUTES_VERIFIED"
                                 if verified else "HTTP_200_OWNER_GATE_UNEXPECTED")
          else:
              verdict, verified = "UNEXPECTED_HTTP_STATUS", False
          # Do not print any body, cookie, redirect location, query string or secret.
          receipt = {
              "schema": "beastbox-public-preview-readonly-hosted-probe-v1",
              "landing_http_status": landing,
              "session_http_status": session,
              "status_http_status": status,
              "observation": verdict,
              "hosted_anonymous_routes_verified": verified,
              "real_owner_login_tested": False,
              "backend_inference_tested": False,
              "public_multi_user_security_tested": False,
              "authenticated_vercel_connector_access": False,
              "source_commit_expected_before_probe": "a68fda6e3e0f05cf4b51406547879fd7fb152811",
          }
          print("BEASTBOX_PREVIEW_PUBLIC_PROBE=" + json.dumps(receipt, sort_keys=True))
          if verdict == "UNEXPECTED_HTTP_STATUS":
              raise SystemExit(1)
          PY

  verify-production-public-anonymous:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify real published domain without owner secrets or redirected login
        run: |
          python - <<'PY'
          import json
          import ssl
          import urllib.error
          import urllib.request

          origin = "https://www.beastboxcosmos.xyz"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          client = urllib.request.build_opener(NoRedirect())
          results = {}
          for path in ("/", "/api/session", "/api/status"):
              url = origin + path
              request = urllib.request.Request(url, method="GET",
                  headers={"Accept": "application/json" if path != "/" else "text/html",
                           "User-Agent": "BeastBoxAnonymousProductionHealth/1.0"})
              try:
                  with client.open(request, timeout=12) as resp:
                      code = resp.status
                      ctype = resp.headers.get("content-type", "")
                      body = resp.read(32769)
              except urllib.error.HTTPError as e:
                  code, ctype, body = e.code, e.headers.get("content-type", ""), b""
              if len(body) > 32768:
                  raise ValueError("response too large to verify without credential")
              row = {"http_status": code, "content_type_is_json": "json" in ctype.lower()}
              if code == 200 and "json" in ctype.lower() and path in ("/api/session", "/api/status"):
                  try:
                      response = json.loads(body)
                      row["anon_owner_false"] = response.get("owner") is False
                      if path == "/api/session":
                          row["owner_secrets_configured"] = response.get("configured") is True
                      else:
                          row["backend_status_for_anonymous"] = response.get("backendStatus", "NOT_EXPOSED")
                  except (ValueError, UnicodeDecodeError, AttributeError):
                      row["invalid_public_json"] = True
              results[path] = row
          safe = results["/api/session"].get("anon_owner_false") is True and (
              results["/api/status"].get("anon_owner_false") is True or
              results["/api/status"]["http_status"] in (401,403)
          )
          receipt = {
              "schema": "beastbox-production-domain-anonymous-readonly-v1",
              "public_domain": origin,
              "paths": results,
              "anonymous_owner_gate_verified": safe,
              "owner_login_tested": False,
              "backend_inference_tested": False,
              "latest_semantic_runtime_live_verified": False,
              "preview_promoted": False,
              "secrets_logged": False,
          }
          print("BEASTBOX_PRODUCTION_PUBLIC_PROBE=" + json.dumps(receipt, sort_keys=True))
          if any(v["http_status"] >= 500 for v in results.values()):
              raise SystemExit("One or more public production routes returned HTTP 5xx")
          PY

# POST_DEPLOY_18a4d6e2: re-run public, read-only production domain smoke after the owner-authorized one-time Vercel deploy.
