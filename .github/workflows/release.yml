name: Build verified downloadable releases

on:
  workflow_dispatch:
  push:
    # Owner-authorized closure: the final job creates the tag only after gates.
    branches: [main]
    paths: [.github/workflows/release.yml]
    tags:
      - 'v*'

# Default every job to read-only. Only the final release job receives write access.
permissions:
  contents: read

concurrency:
  group: verified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified-product:
    uses: ./.github/workflows/product-ci.yml

  portable-desktop:
    uses: ./.github/workflows/portable-products.yml

  portable-android:
    uses: ./.github/workflows/android-app.yml

  portable-ios:
    uses: ./.github/workflows/ios-app.yml

  portable-state:
    uses: ./.github/workflows/portable-state.yml

  story-demo:
    uses: ./.github/workflows/story-demo.yml

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository security and IP consistency
        run: python scripts/security_audit.py

  python-package:
    needs: [security-audit, verified-product]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0 -e .
      - name: Build source-bound Python artifacts and EnD kit
        run: |
          python scripts/build_release_kit.py
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-synapse-python
          path: dist/*

  rust-binaries:
    needs: [security-audit, verified-product]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cosmic-cypher-rust-linux
            binary: rust/target/release/cosmic-cypher-rs
          - os: windows-latest
            artifact: cosmic-cypher-rust-windows
            binary: rust/target/release/cosmic-cypher-rs.exe
          - os: macos-latest
            artifact: cosmic-cypher-rust-macos
            binary: rust/target/release/cosmic-cypher-rs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Test native workspace
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Build native binary
        working-directory: rust
        run: cargo build --release --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/integration/beast-box-system-closure-001' || github.ref == 'refs/heads/main'
    needs: [python-package, rust-binaries, portable-desktop, portable-android, portable-ios, portable-state, story-demo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Stage uniquely named release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-publish
          mkdir -p release-publish

          cp release-assets/cosmic-synapse-python/* release-publish/
          (cd release-publish && sha256sum -c SHA256SUMS.txt)
          cp release-assets/cosmic-cypher-rust-linux/cosmic-cypher-rs \
            release-publish/cosmic-cypher-rs-linux
          cp release-assets/cosmic-cypher-rust-macos/cosmic-cypher-rs \
            release-publish/cosmic-cypher-rs-macos
          cp release-assets/cosmic-cypher-rust-windows/cosmic-cypher-rs.exe \
            release-publish/cosmic-cypher-rs-windows.exe

          python scripts/seal_release_verification.py \
            --assets release-assets --output release-publish \
            --source-sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          python scripts/stage_portable_release.py --assets release-assets --output release-publish --source-sha "$GITHUB_SHA"

          cp release-assets/portable-handoff-result/handoff-result.json release-publish/PORTABLE_HANDOFF.json
          cp release-assets/real-model-story/story-receipt.json release-publish/STORY_RECEIPT.json
          python -c 'import json; assert json.load(open("release-publish/PORTABLE_HANDOFF.json"))["passed"]; assert json.load(open("release-publish/STORY_RECEIPT.json"))["passed"]'

          (
            cd release-publish
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Publish a new verified prerelease without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'from beastbox import __version__; print(__version__)')
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/$tag" ]]; then
            echo "Tag/package version mismatch" >&2
            exit 1
          fi
          # On the authorized branch, require a new tag. Tag-triggered builds
          # must match this exact commit; gh release create refuses replacement.
          existing=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ "$GITHUB_REF" == refs/heads/* && -n "$existing" ]]; then
            echo "Refusing to replace an existing release tag" >&2
            exit 1
          fi
          gh release create "$tag" release-publish/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "Beast Box $version — Portable runtime preview" \
            --notes-file docs/closure/RELEASE_NOTES_0.6.0.md
