name: Build downloadable releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Default every job to read-only. Only the final release job receives write access.
permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository security and IP consistency
        run: python scripts/security_audit.py

  python-package:
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-synapse-python
          path: dist/*

  rust-binaries:
    needs: security-audit
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cosmic-cypher-rust-linux
            binary: rust/target/release/cosmic-cypher-rs
          - os: windows-latest
            artifact: cosmic-cypher-rust-windows
            binary: rust/target/release/cosmic-cypher-rs.exe
          - os: macos-latest
            artifact: cosmic-cypher-rust-macos
            binary: rust/target/release/cosmic-cypher-rs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Test native workspace
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Build native binary
        working-directory: rust
        run: cargo build --release --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [python-package, rust-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Stage uniquely named release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-publish
          mkdir -p release-publish

          cp release-assets/cosmic-synapse-python/* release-publish/
          cp release-assets/cosmic-cypher-rust-linux/cosmic-cypher-rs \
            release-publish/cosmic-cypher-rs-linux
          cp release-assets/cosmic-cypher-rust-macos/cosmic-cypher-rs \
            release-publish/cosmic-cypher-rs-macos
          cp release-assets/cosmic-cypher-rust-windows/cosmic-cypher-rs.exe \
            release-publish/cosmic-cypher-rs-windows.exe

          (
            cd release-publish
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' \
              > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-publish/*
          generate_release_notes: true
