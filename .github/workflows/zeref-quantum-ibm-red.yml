name: ZEREF QUANTUM IBM RED

on:
  push:
    branches: [zeref-quantum-lifesource-final-001]
    paths:
      - '.github/workflows/zeref-quantum-ibm-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,quantum]'
      - name: Prove IBM collection contract is RED
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p _red_ibm
          set +e
          python -m pytest -q tests/test_quantum_lifesource_ibm.py > _red_ibm/pytest-red.log 2>&1
          code=$?
          set -e
          cat _red_ibm/pytest-red.log
          test "$code" -ne 0
          grep -Eq 'collect_zeref_quantum_lifesource_ibm|ModuleNotFoundError|ImportError' _red_ibm/pytest-red.log
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('_red_ibm')
          (r/'RED.json').write_text(json.dumps({'schema':'zeref-quantum-ibm-red-v1','git_commit':os.environ['GITHUB_SHA'],'expected_state':'RED','hardware_collected':False},indent=2,sort_keys=True)+'\n')
          files=sorted(p for p in r.iterdir() if p.is_file() and p.name!='SHA256SUMS')
          (r/'SHA256SUMS').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files))
          PY
          (cd _red_ibm && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: zeref-quantum-ibm-red-${{ github.run_id }}
          path: _red_ibm
          if-no-files-found: error
          retention-days: 90
