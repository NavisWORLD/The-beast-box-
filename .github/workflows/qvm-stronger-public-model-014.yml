name: Stage 014 stronger open-weight cloud CPU model with predeclared metrics

on:
  push:
    branches: [experiment/rigetti-qvm-12d-feedback-012]
    paths:
      - '.github/workflows/qvm-stronger-public-model-014.yml'
      - 'scripts/run_qvm_cpu_model_014.py'
      - 'beastbox/qvm_numeric_diagnostic_014.py'
      - 'tests/test_qvm_numeric_diagnostic_014.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage014-one-public-cpu-model-no-paid-api
  cancel-in-progress: false

jobs:
  independently-pinned-1p5b-open-model:
    if: github.repository == 'NavisWORLD/The-beast-box-'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
      HF_HUB_ETAG_TIMEOUT: '30'
      AZURE_QUANTUM_QVM_OPT_IN: 'no'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce source provenance and predeclared Stage 014 metric BEFORE downloading model
        run: |
          python -m pip install -e . 'pytest>=8,<10'
          python -m pytest -q tests/test_qvm_live_replay.py \
            tests/test_qvm_cpu_comparison_013.py tests/test_qvm_numeric_diagnostic_014.py
      - name: Install pinned CPU-only model libraries, no paid inference SDK
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.48.3' 'huggingface-hub>=0.27,<1'
          python - <<'PY'
          import torch
          assert not torch.cuda.is_available()
          print('STAGE014_PUBLIC_CPU_ONLY_NO_CLOUD_MODEL_API',flush=True)
          PY
      - name: Execute all 15 actual inference calls using independently pinned public 1.5B model
        run: |
          python scripts/run_qvm_cpu_model_014.py \
            --source evidence/stage012/live_azure_qvm_3job_public_receipt.json \
            --output build/stage014-1p5b-public-cloud-cpu-qvm-heldout-results.json
      - name: Verify exact execution budget, source and predeclared metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/stage014-1p5b-public-cloud-cpu-qvm-heldout-results.json').read_text())
          assert r['model']=='Qwen/Qwen2.5-1.5B-Instruct'
          assert len(r['model_revision_sha'])==40
          assert r['inference_calls']==15
          assert r['model_provider_api_calls']==0 and r['new_azure_qvm_jobs']==0
          assert r['physical_quantum_measurements']==0 and r['weights_changed'] is False
          assert r['preregistered_independent_score']['analysis_status']=='PREREGISTERED_STAGE014_METRIC'
          assert set(r['preregistered_independent_score']['per_arm_unranked'])=={
             'baseline','memory_only','conditioned','order_control','classical_matched'
          }
          print('STAGE014_ACTUAL_PUBLIC_MODEL_CONTROL_COMPARISON_PASS',flush=True)
          PY
      - name: Preserve entire real generation transcript and comparisons
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-stage014-qwen1p5b-public-cpu-qvm-15-trial-receipt
          path: build/stage014-1p5b-public-cloud-cpu-qvm-heldout-results.json
          if-no-files-found: error
          retention-days: 21
      - name: No cognitive or physical claims
        run: |
          echo 'No new QVM or QPU jobs and no paid model API used.'
          echo 'Only three historical cloud simulator tasks: exploratory outputs, not causal intelligence evidence.'
