name: COSMOS 004 verified actual original PHOS and Cosmic Spark correction test

on:
  pull_request:
    branches: [experiment/cosmos-native-correction-002]
    paths:
      - "scripts/cosmos_micro_originals_004.py"
      - "tests/test_cosmos_micro_originals_004.py"
      - "docs/experiments/COSMOS_MICRO_ORIGINALS_004_PROTOCOL.md"
      - ".github/workflows/cosmos-micro-originals-004.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmos-micro-originals-004-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-original-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        original: [phos, cosmos_born]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      COSMOS_DEVICE: "cpu"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      COSMOS_CAUSAL_OMEGA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing source test runner and exact public CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface_hub==0.30.2 numpy==1.26.4 pytest==8.4.2
      - name: Reuse exact historical questions and prove source-only anti-leakage contract
        run: python -m pytest -q tests/test_cosmos_native_correction_002.py tests/test_cosmos_micro_originals_004.py
      - name: Download, independently verify and evaluate the actual original fixed public checkpoint on CPU
        run: |
          mkdir -p build
          env -u HF_TOKEN -u HUGGING_FACE_HUB_TOKEN python -m scripts.cosmos_micro_originals_004 \
            --model ${{ matrix.original }} \
            --directory build/verified-micro-${{ matrix.original }} \
            --output build/micro-public-measurements-${{ matrix.original }}.json
      - name: Fail on missing controls, unsanitized personal training fragments or fake quality claims
        run: |
          MODEL_LABEL=${{ matrix.original }} python - <<'PY'
          import hashlib,json,os,pathlib
          label=os.environ["MODEL_LABEL"]
          path=pathlib.Path("build/micro-public-measurements-"+label+".json")
          raw=path.read_bytes()
          result=json.loads(raw)
          assert result["schema"]=="cosmos-original-sub4m-prompt-feedback-004-v1"
          assert result["model"]==label and result["no_model_training_memory_or_authority"] is True
          assert result["parameter_count_measured"]<3909956
          assert len(result["observations"])==8 and result["shared_arms"]==["baseline","neutral_example","correct_example","incorrect_example","direct_correction"]
          assert all(len(row["outcomes"])==5 for row in result["observations"])
          assert all(not set(obs).intersection({"generation","generation_sha256","consumed_prompt","consumed_prompt_sha256"})
                 for row in result["observations"] for obs in row["outcomes"].values())
          assert all("full_prompt_sha256" not in row["outcomes"]["direct_correction"]
                 for row in result["observations"])
          print("SANITIZED_VERIFIED_REAL_ORIGINAL_RECEIPT_SHA256="+hashlib.sha256(raw).hexdigest())
          print(path.read_text())
          PY
