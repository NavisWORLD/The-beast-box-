name: ZEREF TALK-006 DIALOGUE RERUN TRIGGER

on:
  push:
    branches: [zeref-talk006-dialogue-tune-001]
    paths:
      - '.github/workflows/zeref-talk006-dialogue-rerun-trigger.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected dialogue V2 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run zeref-talk006-dialogue-tune-v2.yml \
            --repo NavisWORLD/The-beast-box- \
            --ref zeref-talk006-dialogue-tune-001
