name: QC67 encrypted-secret broker

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/qc67-secret-broker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN_PRIMARY: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_ALT: ${{ secrets.HUGGINGFACE_TOKEN }}
      HF_TOKEN_ALT2: ${{ secrets.HUGGING_FACE_TOKEN }}
      HF_TOKEN_ALT3: ${{ secrets.HF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select existing encrypted Hugging Face credential without exposing it
        id: credential
        shell: bash
        run: |
          set -Eeuo pipefail
          selected=''
          label='none'
          if [ -n "${HF_TOKEN_PRIMARY:-}" ]; then selected="$HF_TOKEN_PRIMARY"; label='HF_TOKEN'; fi
          if [ -z "$selected" ] && [ -n "${HF_TOKEN_ALT:-}" ]; then selected="$HF_TOKEN_ALT"; label='HUGGINGFACE_TOKEN'; fi
          if [ -z "$selected" ] && [ -n "${HF_TOKEN_ALT2:-}" ]; then selected="$HF_TOKEN_ALT2"; label='HUGGING_FACE_TOKEN'; fi
          if [ -z "$selected" ] && [ -n "${HF_TOKEN_ALT3:-}" ]; then selected="$HF_TOKEN_ALT3"; label='HF_API_TOKEN'; fi
          if [ -z "$selected" ]; then
            echo 'No supported encrypted Hugging Face secret is configured.' >&2
            exit 1
          fi
          echo "HF_TOKEN=$selected" >> "$GITHUB_ENV"
          echo "credential_label=$label" >> "$GITHUB_OUTPUT"
          echo 'HF_ENCRYPTED_SECRET_AVAILABLE=1'
      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade 'huggingface_hub>=1.19.0'
      - name: Download exact gated QC67 assets through isolated secret broker
        id: download
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p qc67
          hf download phera-ra/QC67_cosmo architecture/cosmos_spark_cst.py --local-dir qc67
          hf download phera-ra/QC67_cosmo serving/cosmos_serve.py --local-dir qc67
          hf download phera-ra/QC67_cosmo weights/spark_cst.pt --local-dir qc67
      - name: Verify exact frozen QC67 identities
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected = {
              'architecture/cosmos_spark_cst.py': '955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc',
              'serving/cosmos_serve.py': '02a509f9c2a20f63c38dca186c082bfdc2603aa8b6f1f903ec19a0e709218d87',
              'weights/spark_cst.pt': 'aa0cb13c1e67d459db280a53b6407dfc2b5b5f3fd6f640bc43686b70d799acd1',
          }
          actual = {}
          for rel, wanted in expected.items():
              path = Path('qc67') / rel
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == wanted, (rel, digest, wanted)
              actual[rel] = digest
          Path('qc67/secret-broker-manifest.json').write_text(json.dumps({
              'schema': 'qc67.encrypted-secret-bundle.v1',
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'files': actual,
              'credential_persisted': False,
              'credential_exposed_to_subject': False,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('QC67_SECRET_BROKER_HASHES=PASS')
          PY
      - name: Remove credential from environment before artifact handling
        if: always()
        shell: bash
        run: |
          echo 'HF_TOKEN=' >> "$GITHUB_ENV"
          echo 'HF_TOKEN_PRIMARY=' >> "$GITHUB_ENV"
          echo 'HF_TOKEN_ALT=' >> "$GITHUB_ENV"
          echo 'HF_TOKEN_ALT2=' >> "$GITHUB_ENV"
          echo 'HF_TOKEN_ALT3=' >> "$GITHUB_ENV"
          echo 'HF_SECRET_CLEARED_BEFORE_ARTIFACT=1'
      - name: Upload verified credential-free QC67 bundle
        id: upload
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qc67-secret-pinned-${{ github.run_id }}
          path: qc67
          if-no-files-found: error
          retention-days: 90
      - name: Record sanitized secret-broker result
        if: always()
        env:
          CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
          CREDENTIAL_LABEL: ${{ steps.credential.outputs.credential_label }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/qc67-secret-status
          python - <<'PY'
          import json, os
          from pathlib import Path
          outcomes = {
              'credential': os.environ.get('CREDENTIAL_OUTCOME') or 'not_run',
              'download': os.environ.get('DOWNLOAD_OUTCOME') or 'not_run',
              'verify': os.environ.get('VERIFY_OUTCOME') or 'not_run',
              'upload': os.environ.get('UPLOAD_OUTCOME') or 'not_run',
          }
          artifact = os.environ.get('ARTIFACT_ID', '')
          payload = {
              'schema': 'qc67.encrypted-secret-broker-status.v1',
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_sha': os.environ['GITHUB_SHA'],
              'passed': all(value == 'success' for value in outcomes.values()),
              'outcomes': outcomes,
              'credential_label': os.environ.get('CREDENTIAL_LABEL') or None,
              'credential_value_persisted': False,
              'credential_exposed_to_subject': False,
              'artifact_id': int(artifact) if artifact.isdigit() else None,
              'artifact_digest': os.environ.get('ARTIFACT_DIGEST') or None,
          }
          Path('/tmp/qc67-secret-status/status.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p evidence
            cp /tmp/qc67-secret-status/status.json evidence/qc67-secret-broker-latest.json
            git add evidence/qc67-secret-broker-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "evidence: record QC67 secret broker ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
