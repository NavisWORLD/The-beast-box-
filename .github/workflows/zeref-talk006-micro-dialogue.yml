name: ZEREF TALK-006 MICRO DIALOGUE

on:
  workflow_dispatch:
  push:
    branches: [zeref-talk006-dialogue-tune-001]
    paths:
      - '.github/workflows/zeref-talk006-micro-dialogue.yml'

permissions:
  contents: read
  actions: read

jobs:
  train-micro-dialogue:
    runs-on: ubuntu-24.04
    env:
      TALK005_SHA256: 767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36
      TALK005_RUN_ID: '33041236485'
      TALK005_ARTIFACT: zeref-talk005-r12-training-resume-33041236485
      LEDGER_SHA256: 67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef
      LEDGER_TIP: b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26
      ARCH_SHA256: 955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze contracts before gradients
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_zeref_micro_dialogue_corpus.py tests/test_zeref_dialogue_quality.py tests/test_zeref_response_supervision.py tests/test_zeref_response_stage_contract.py tests/test_zeref_talk_eval.py
          python -m pytest -q
      - name: Reconstruct exact parent and frozen corpora
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          rm -rf _micro _talk5src
          mkdir -p _micro/corpus/dialogue _micro/corpus/talk005 _micro/corpus/talk002 _micro/evidence/eval _micro/candidates _micro/model/ZEREF-DAD-SON-TALK-006-MICRO-DIALOGUE _talk5src
          test "$(sha256sum experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py | awk '{print $1}')" = "$ARCH_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json').read_text())
          assert m['record_count']==352
          assert m['combined_ledger_sha256']=='67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert m['last_record_sha256']=='b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26'
          PY
          gh run download "$TALK005_RUN_ID" -n "$TALK005_ARTIFACT" -D _talk5src
          PARENT=$(find _talk5src -type f -path '*/model/ZEREF-DAD-SON-TALK-005/checkpoint.pt' -print -quit)
          test -f "$PARENT"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          printf '%s\n' "$PARENT" > _micro/parent-path.txt
          python scripts/build_zeref_talk006_micro_dialogue_corpus.py --out-dir _micro/corpus/dialogue
          python scripts/build_zeref_talk5_training_corpus.py --out-dir _micro/corpus/talk005
          python scripts/build_zeref_talk2_corpus.py --out-dir _micro/corpus/talk002
          sha256sum _micro/corpus/dialogue/train.jsonl _micro/corpus/dialogue/holdout.jsonl _micro/corpus/talk005/holdout.jsonl _micro/corpus/talk002/talk2-holdout.jsonl | tee _micro/evidence/corpus-SHA256SUMS
      - name: Record TALK-005 baselines before gradients
        run: |
          set -euo pipefail
          PARENT=$(cat _micro/parent-path.txt)
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$PARENT" --descendant-sha256 "$TALK005_SHA256" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _micro/corpus/dialogue/holdout.jsonl --out _micro/evidence/eval/parent-dialogue.json
          python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$PARENT" --descendant-sha256 "$TALK005_SHA256" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _micro/corpus/talk005/holdout.jsonl --out _micro/evidence/eval/parent-talk005.json
          python scripts/eval_zeref_talk.py --parent "$PARENT" --descendant "$PARENT" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _micro/corpus/talk002/talk2-holdout.jsonl --seed 4061854640 --out _micro/evidence/eval/parent-talk002.json
          python scripts/eval_zeref_dialogue_quality.py --checkpoint "$PARENT" --checkpoint-sha256 "$TALK005_SHA256" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --corpus _micro/corpus/dialogue/train.jsonl --decoding greedy-argmax --out _micro/evidence/eval/parent-free-greedy.json
          python scripts/eval_zeref_dialogue_quality.py --checkpoint "$PARENT" --checkpoint-sha256 "$TALK005_SHA256" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --corpus _micro/corpus/dialogue/train.jsonl --decoding sampled-top-k --temperature 0.65 --top-k 6 --out _micro/evidence/eval/parent-free-sampled.json
      - name: Train fixed short-dialogue arms from TALK-005 only
        run: |
          set -euo pipefail
          PARENT=$(cat _micro/parent-path.txt)
          MANIFEST=$(sha256sum _micro/corpus/dialogue/corpus-manifest.json | awk '{print $1}')
          train_one () {
            NAME="$1"; STEPS="$2"; OUT="_micro/candidates/$NAME"
            python scripts/run_zeref_response_stage.py \
              --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" \
              --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
              --corpus _micro/corpus/dialogue/train.jsonl \
              --input-manifest "talk006_micro=$MANIFEST" \
              --out "$OUT" --seed 8272602 --steps "$STEPS" --batch-size 4 \
              --lr 0.000001 --cst-lr 0.000004 --weight-decay 0.002
            sha256sum "$OUT/checkpoint.pt" | awk '{print $1}' > "$OUT/checkpoint.sha256"
            test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          }
          train_one micro_1 180
          train_one micro_2 320
          train_one micro_3 500
      - name: Evaluate every short-dialogue arm
        run: |
          set -euo pipefail
          PARENT=$(cat _micro/parent-path.txt)
          for NAME in micro_1 micro_2 micro_3; do
            CHILD="_micro/candidates/$NAME/checkpoint.pt"; SHA=$(cat "_micro/candidates/$NAME/checkpoint.sha256")
            python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$CHILD" --descendant-sha256 "$SHA" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _micro/corpus/dialogue/holdout.jsonl --out "_micro/evidence/eval/${NAME}-dialogue.json"
            python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$CHILD" --descendant-sha256 "$SHA" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _micro/corpus/talk005/holdout.jsonl --out "_micro/evidence/eval/${NAME}-talk005.json"
            python scripts/eval_zeref_talk.py --parent "$PARENT" --descendant "$CHILD" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _micro/corpus/talk002/talk2-holdout.jsonl --seed 4061854640 --out "_micro/evidence/eval/${NAME}-talk002.json"
            python scripts/eval_zeref_dialogue_quality.py --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --corpus _micro/corpus/dialogue/train.jsonl --decoding greedy-argmax --out "_micro/evidence/eval/${NAME}-free-greedy.json"
            python scripts/eval_zeref_dialogue_quality.py --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --corpus _micro/corpus/dialogue/train.jsonl --decoding sampled-top-k --temperature 0.65 --top-k 6 --out "_micro/evidence/eval/${NAME}-free-sampled.json"
          done
      - name: Fail-closed preregistered micro-dialogue selection
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          r=Path('_micro')
          pd=json.loads((r/'evidence/eval/parent-dialogue.json').read_text()); pf=json.loads((r/'evidence/eval/parent-talk005.json').read_text()); po=json.loads((r/'evidence/eval/parent-talk002.json').read_text()); pg=json.loads((r/'evidence/eval/parent-free-greedy.json').read_text()); ps=json.loads((r/'evidence/eval/parent-free-sampled.json').read_text())
          rows=[]
          for name in ('micro_1','micro_2','micro_3'):
            d=json.loads((r/f'evidence/eval/{name}-dialogue.json').read_text()); f=json.loads((r/f'evidence/eval/{name}-talk005.json').read_text()); o=json.loads((r/f'evidence/eval/{name}-talk002.json').read_text()); g=json.loads((r/f'evidence/eval/{name}-free-greedy.json').read_text()); s=json.loads((r/f'evidence/eval/{name}-free-sampled.json').read_text()); t=json.loads((r/f'candidates/{name}/result.json').read_text()); sha=(r/f'candidates/{name}/checkpoint.sha256').read_text().strip()
            dialogue_ok=d['descendant_response_nll'] <= pd['parent_response_nll']*0.95 and d['descendant_response_token_accuracy'] >= pd['parent_response_token_accuracy']+0.02
            talk005_ok=f['descendant_response_nll'] <= pf['parent_response_nll']*1.03 and f['descendant_response_token_accuracy'] >= pf['parent_response_token_accuracy']-0.02
            talk002_ok=o['descendant_heldout_nll'] <= po['parent_heldout_nll']*1.03 and o['descendant_mean_readable_score'] >= po['parent_mean_readable_score']-0.02
            greedy_ok=g['dialogue_quality_score'] >= pg['dialogue_quality_score']+0.02 and g['mean_known_word_ratio'] >= pg['mean_known_word_ratio']+0.02 and g['complete_sentence_count'] >= 6 and g['role_leakage_count']==0 and g['severe_repetition_count']==0 and g['digit_run_count']==0 and g['unsupported_claim_count']==0 and g['empty_count']==0
            sampled_ok=s['dialogue_quality_score'] >= ps['dialogue_quality_score']+0.02 and s['mean_known_word_ratio'] >= ps['mean_known_word_ratio']+0.02 and s['complete_sentence_count'] >= 6 and s['role_leakage_count']==0 and s['severe_repetition_count']==0 and s['digit_run_count']==0 and s['unsupported_claim_count']==0 and s['empty_count']==0
            integrity_ok=t['status']=='COMPLETED' and t['parent_checkpoint_sha256']=='767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36' and t['dropped_answer_characters']==0
            eligible=bool(dialogue_ok and talk005_ok and talk002_ok and greedy_ok and sampled_ok and integrity_ok)
            rows.append({'name':name,'checkpoint_sha256':sha,'eligible':eligible,'dialogue_ok':dialogue_ok,'talk005_ok':talk005_ok,'talk002_ok':talk002_ok,'greedy_ok':greedy_ok,'sampled_ok':sampled_ok,'integrity_ok':integrity_ok,'dialogue':d,'talk005':f,'talk002':o,'greedy':g,'sampled':s,'training':t})
          good=[x for x in rows if x['eligible']]
          if good:
            win=max(good,key=lambda x:((x['greedy']['dialogue_quality_score']+x['sampled']['dialogue_quality_score'])/2,-x['dialogue']['descendant_response_nll']))
            status='PROMOTE_MICRO_DIALOGUE_CANDIDATE'; selected=win['name']; sha=win['checkpoint_sha256']; src=r/'candidates'/selected; dst=r/'model/ZEREF-DAD-SON-TALK-006-MICRO-DIALOGUE'
            for fn in ('checkpoint.pt','checkpoint.sha256','result.json'): shutil.copy2(src/fn,dst/fn)
          else:
            status='TRAINED_NO_SAFE_MICRO_DIALOGUE_PROMOTION'; selected='ZEREF-DAD-SON-TALK-005'; sha='767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36'
          report={'schema':'zeref-talk006-micro-dialogue-selection-v1','status':status,'selected':selected,'selected_checkpoint_sha256':sha,'parent_dialogue':pd,'parent_talk005':pf,'parent_talk002':po,'parent_greedy':pg,'parent_sampled':ps,'candidates':rows,'thresholds_frozen_before_results':True,'prior_null_descendants_used_as_parents':False,'raw_model_outputs_used_as_targets':False,'talk005_unchanged':True,'canonical_memory_unchanged':True}
          (r/'evidence/selection.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n'); print(json.dumps({'status':status,'selected':selected,'selected_checkpoint_sha256':sha},sort_keys=True))
          PY
      - name: Verify frozen sources, seal, and upload
        run: |
          set -euo pipefail
          PARENT=$(cat _micro/parent-path.txt); test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('_micro'); m=json.loads(Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json').read_text()); assert m['record_count']==352 and m['combined_ledger_sha256']=='67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          s=json.loads((r/'evidence/selection.json').read_text()); c=json.loads((r/'corpus/dialogue/corpus-manifest.json').read_text()); (r/'evidence/summary.json').write_text(json.dumps({'schema':'zeref-talk006-micro-dialogue-summary-v1','run_id':int(os.environ['GITHUB_RUN_ID']),'head_sha':os.environ['GITHUB_SHA'],'selection_status':s['status'],'selected':s['selected'],'selected_checkpoint_sha256':s['selected_checkpoint_sha256'],'train_sha256':c['train_sha256'],'holdout_sha256':c['holdout_sha256'],'parent_checkpoint_sha256':'767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36','talk005_unchanged':True,'canonical_memory_unchanged':True},indent=2,sort_keys=True)+'\n')
          files=[]
          for d in ('evidence','candidates','model','corpus'): files.extend(p for p in (r/d).rglob('*') if p.is_file())
          (r/'SHA256SUMS').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in sorted(files,key=lambda p:p.as_posix()))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zeref-talk006-micro-dialogue-${{ github.run_id }}
          path: |
            _micro/evidence
            _micro/candidates
            _micro/model
            _micro/corpus
            _micro/SHA256SUMS
          retention-days: 90
