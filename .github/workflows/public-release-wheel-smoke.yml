name: Public release stranger smoke

on:
  workflow_call:
    inputs:
      tag:
        description: Published Beast Box release tag to verify
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Beast Box release tag to verify
        required: true
        default: v0.7.1
        type: string

permissions:
  contents: read

jobs:
  public-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || 'v0.7.1' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download public checksums, wheel and combined kit anonymously
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/public-release-smoke"
          mkdir -p "$root"
          version="${TAG#v}"
          wheel="cosmos_beast_box-${version}-py3-none-any.whl"
          kit="beast-box-combined-${version}.zip"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          for asset in SHA256SUMS.txt "$wheel" "$kit"; do
            status=$(curl --fail --location --retry 3 --retry-all-errors \
              --output "$root/$asset" \
              --write-out '%{http_code}' \
              "$base/$asset")
            test "$status" = "200"
            printf '%s  %s\n' "$status" "$asset" >> "$root/http-status.txt"
          done

          grep -E "  ${wheel}$" "$root/SHA256SUMS.txt" > "$root/public-checks.txt"
          grep -E "  ${kit}$" "$root/SHA256SUMS.txt" >> "$root/public-checks.txt"
          test "$(wc -l < "$root/public-checks.txt")" -eq 2
          (cd "$root" && sha256sum -c public-checks.txt)

          wheel_sha=$(sha256sum "$root/$wheel" | awk '{print $1}')
          kit_sha=$(sha256sum "$root/$kit" | awk '{print $1}')
          printf '%s\n' "$base/$wheel" > "$root/public-wheel-url.txt"
          printf '%s\n' "$base/$kit" > "$root/public-kit-url.txt"
          printf '%s\n' "$wheel_sha" > "$root/wheel-sha256.txt"
          printf '%s\n' "$kit_sha" > "$root/kit-sha256.txt"

          {
            echo "VERSION=$version"
            echo "WHEEL=$wheel"
            echo "KIT=$kit"
            echo "WHEEL_SHA256=$wheel_sha"
            echo "KIT_SHA256=$kit_sha"
          } >> "$GITHUB_ENV"

      - name: Install public wheel in a blank environment
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/public-release-smoke"
          venv="$RUNNER_TEMP/public-wheel-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check "$root/$WHEEL"
          mkdir -p "$root/run"
          cd "$root/run"
          "$venv/bin/python" - <<'PY'
          import os
          import pathlib
          import beastbox

          module = pathlib.Path(beastbox.__file__).resolve()
          assert beastbox.__version__ == os.environ["VERSION"], beastbox.__version__
          assert "public-wheel-venv" in str(module), module
          print(beastbox.__version__, module)
          PY
          "$venv/bin/python" -m beastbox --help >/dev/null
          "$venv/bin/beastbox-cosmic" --help >/dev/null

      - name: Exercise restart, portable continuity, tamper rejection and authority denial
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/public-release-smoke"
          run="$root/run"
          py="$RUNNER_TEMP/public-wheel-venv/bin/python"
          cd "$run"

          "$py" -m beastbox runtime init --data-dir state > init.json
          "$py" -m beastbox runtime chat --data-dir state --model A \
            "Remember the public release wheel code SUNFLOWER." > chat.json
          "$py" -m beastbox runtime inspect --data-dir state > inspect-after-restart.json
          "$py" -m beastbox runtime tool-demo --data-dir state > tool-denied.json

          "$py" -m beastbox runtime export --data-dir state portable > export.json
          manifest_sha=$("$py" -c 'import json; print(json.load(open("export.json"))["manifest_sha256"])')
          "$py" -m beastbox runtime verify-portable portable --sha256 "$manifest_sha" > verify-portable.json
          "$py" -m beastbox runtime import --data-dir restored portable --sha256 "$manifest_sha" > import.json
          "$py" -m beastbox runtime inspect --data-dir restored > restored-inspect.json
          "$py" -m beastbox runtime tool-demo --data-dir restored > restored-tool-denied.json

          cp -a portable portable-tampered
          printf 'CORRUPTION' >> portable-tampered/runtime.sqlite3
          if "$py" -m beastbox runtime verify-portable portable-tampered --sha256 "$manifest_sha" \
            > tamper-stdout.txt 2> tamper-stderr.txt; then
            echo "tampered portable state was incorrectly accepted" >&2
            exit 1
          fi

          "$py" - <<'PY'
          import json
          from pathlib import Path

          run = Path.cwd()
          load = lambda name: json.loads((run / name).read_text())
          init = load("init.json")
          chat = load("chat.json")
          restarted = load("inspect-after-restart.json")
          denied = load("tool-denied.json")
          exported = load("export.json")
          verified = load("verify-portable.json")
          imported = load("import.json")
          restored = load("restored-inspect.json")
          restored_denied = load("restored-tool-denied.json")

          system_id = init["system_id"]
          assert chat["model"]["model"] == "A"
          assert restarted["system_id"] == system_id
          assert restarted["turn"] >= 1
          assert denied["tool_result"]["status"] == "AUTHORITY_DENIED"
          assert denied["tool_result"]["authorized"] is False
          assert exported["authority"] == "NOT_TRANSFERRED"
          assert verified["verified"] is True
          assert verified["authority"] == "NOT_TRANSFERRED"
          assert imported["restored"] is True
          assert imported["authority"] == "NOT_TRANSFERRED"
          assert restored["system_id"] == system_id
          assert restored_denied["tool_result"]["status"] == "AUTHORITY_DENIED"
          assert restored_denied["tool_result"]["authorized"] is False
          PY

      - name: Exercise both browser surfaces from public artifacts
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/public-release-smoke"
          py="$RUNNER_TEMP/public-wheel-venv/bin/python"
          kit_root="$root/public-kit"
          mkdir -p "$kit_root"
          "$py" -m zipfile -e "$root/$KIT" "$kit_root"
          (cd "$kit_root" && sha256sum -c SHA256SUMS)
          test -f "$kit_root/html/standalone.html"
          test -f "$kit_root/html/serve.py"

          "$py" - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = json.loads((Path(os.environ["RUNNER_TEMP"]) / "public-release-smoke/public-kit/RELEASE_PROVENANCE.json").read_text())
          assert provenance["version"] == os.environ["VERSION"]
          assert provenance["source_dirty"] is False
          assert provenance["historical_evidence_changed"] is False
          PY

          cosmic_pid=""
          html_pid=""
          cleanup() {
            if [[ -n "$cosmic_pid" ]]; then kill "$cosmic_pid" 2>/dev/null || true; fi
            if [[ -n "$html_pid" ]]; then kill "$html_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          "$RUNNER_TEMP/public-wheel-venv/bin/beastbox-cosmic" \
            --data-dir "$root/cosmic-state" --host 127.0.0.1 --port 18081 \
            > "$root/cosmic.stdout" 2> "$root/cosmic.stderr" &
          cosmic_pid=$!
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/ \
              --output "$root/cosmic-index.html"; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18081/healthz \
            --output "$root/cosmic-health.json"
          grep -q 'BEAST' "$root/cosmic-index.html"
          PUBLIC_SMOKE_ROOT="$root" "$py" - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["PUBLIC_SMOKE_ROOT"]) / "cosmic-health.json").read_text())
          assert payload["status"] == "alive"
          PY
          kill "$cosmic_pid"
          wait "$cosmic_pid" 2>/dev/null || true
          cosmic_pid=""

          "$py" "$kit_root/html/serve.py" \
            --data-dir "$root/html-state" --host 127.0.0.1 --port 18082 \
            > "$root/html.stdout" 2> "$root/html.stderr" &
          html_pid=$!
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error -c "$root/html-cookies.txt" \
              http://127.0.0.1:18082/html/ --output "$root/html-index.html"; then break; fi
            sleep 1
          done
          grep -q 'BEAST' "$root/html-index.html"
          curl --fail --silent --show-error \
            -b "$root/html-cookies.txt" \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:18082' \
            --data '{"text":"public standalone html smoke"}' \
            http://127.0.0.1:18082/api/chat \
            --output "$root/html-chat.json"
          curl --fail --silent --show-error http://127.0.0.1:18082/api/conversation \
            --output "$root/html-conversation.json"
          "$py" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "public-release-smoke"
          chat = json.loads((root / "html-chat.json").read_text())
          conversation = json.loads((root / "html-conversation.json").read_text())
          assert isinstance(chat, dict) and "error" not in chat
          assert len(conversation.get("turns", [])) >= 1
          PY
          kill "$html_pid"
          wait "$html_pid" 2>/dev/null || true
          html_pid=""

      - name: Seal public stranger receipt
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/public-release-smoke"
          run="$root/run"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "public-release-smoke"
          run = root / "run"
          load = lambda name: json.loads((run / name).read_text())
          provenance = json.loads((root / "public-kit/RELEASE_PROVENANCE.json").read_text())
          receipt = {
              "schema": "beastbox-public-release-stranger-smoke-v2",
              "passed": True,
              "tag": os.environ["TAG"],
              "version": os.environ["VERSION"],
              "source_commit": provenance["source_commit"],
              "wheel_asset": os.environ["WHEEL"],
              "combined_kit_asset": os.environ["KIT"],
              "public_wheel_url": (root / "public-wheel-url.txt").read_text().strip(),
              "public_kit_url": (root / "public-kit-url.txt").read_text().strip(),
              "public_http_statuses": (root / "http-status.txt").read_text().splitlines(),
              "published_checksums_verified": True,
              "wheel_sha256": os.environ["WHEEL_SHA256"],
              "combined_kit_sha256": os.environ["KIT_SHA256"],
              "clean_venv_install": True,
              "source_checkout_used": False,
              "separate_process_restart_verified": True,
              "system_id_preserved": load("init.json")["system_id"] == load("restored-inspect.json")["system_id"],
              "portable_export_verified": True,
              "portable_import_verified": True,
              "tampered_state_rejected": True,
              "authority_transferred": False,
              "default_tool_authority_denied_before_import": True,
              "default_tool_authority_denied_after_import": True,
              "cosmic_browser_surface_verified": True,
              "standalone_html_surface_verified": True,
              "classification": "public release transport/install/continuity smoke; not model-quality or model-weight attestation",
          }
          target = root / "PUBLIC_RELEASE_WHEEL_SMOKE.json"
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          (root / "PUBLIC_RELEASE_WHEEL_SMOKE.sha256").write_text(f"{digest}  {target.name}\n")
          print(json.dumps({**receipt, "receipt_sha256": digest}, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: public-release-stranger-smoke-${{ env.TAG }}
          path: |
            ${{ runner.temp }}/public-release-smoke/PUBLIC_RELEASE_WHEEL_SMOKE.json
            ${{ runner.temp }}/public-release-smoke/PUBLIC_RELEASE_WHEEL_SMOKE.sha256
            ${{ runner.temp }}/public-release-smoke/SHA256SUMS.txt
            ${{ runner.temp }}/public-release-smoke/public-checks.txt
            ${{ runner.temp }}/public-release-smoke/wheel-sha256.txt
            ${{ runner.temp }}/public-release-smoke/kit-sha256.txt
            ${{ runner.temp }}/public-release-smoke/http-status.txt
            ${{ runner.temp }}/public-release-smoke/run/tamper-stderr.txt
            ${{ runner.temp }}/public-release-smoke/cosmic-health.json
            ${{ runner.temp }}/public-release-smoke/html-chat.json
            ${{ runner.temp }}/public-release-smoke/html-conversation.json
