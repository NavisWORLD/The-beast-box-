name: COSMOS 005 genuine model-owned critique vs falsifiable feedback controls

on:
  pull_request:
    branches: [experiment/cosmos-small-model-controls-003, main]
    paths:
      - "scripts/cosmos_self_critique_005.py"
      - "tests/test_cosmos_self_critique_005.py"
      - "docs/experiments/COSMOS_SELF_CORRECTION_005_PROTOCOL.md"
      - ".github/workflows/cosmos-self-correction-005.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmos-self-critique-005-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-frozen-generator-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        subject: [native18k, qwen0.5b]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact CPU-only published native/public-model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e ./models/rawrphos numpy==1.26.4 \
            transformers==4.49.0 huggingface_hub==0.30.2 \
            safetensors==0.5.3 pytest==8.4.2
      - name: Freeze eight problems, prevent any leaked gold in self-critique condition
        run: python -m pytest -q tests/test_cosmos_self_critique_005.py
      - name: Load actual checksum-bound originals and independently test all correction arms
        run: |
          mkdir -p build
          env -u HF_TOKEN -u HUGGING_FACE_HUB_TOKEN \
            python -m scripts.cosmos_self_critique_005 \
              --model ${{ matrix.subject }} \
              --directory build/verified-${{ matrix.subject }} \
              --output build/observations-${{ matrix.subject }}.json
      - name: Fail on omitted false feedback, missing new-task comparison, or exposed generated text
        run: |
          SUBJECT=${{ matrix.subject }} python - <<'PY'
          import hashlib,json,os,pathlib
          subject=os.environ["SUBJECT"]
          path=pathlib.Path("build/observations-"+subject+".json")
          data=path.read_bytes(); r=json.loads(data)
          assert r["schema"]=="cosmos-genuine-prompt-self-critique-005-v1"
          assert r["model"]==subject and r["weights_unchanged"] is True
          assert r["no_owner_memory_training_or_cloud_inference"] is True
          assert len(r["cases"])==8 and len(r["arms"])==8
          assert all(set(x["conditions"])==set(r["arms"]) for x in r["cases"])
          assert all(set(x["semantic_conditions"])==set(r["arms"]) for x in r["cases"])
          assert all("generation" not in x and "prompt" not in x for x in r["cases"])
          print("ACTUAL_ORIGINAL_PRIVACY_SAFE_RECEIPT_SHA256="+hashlib.sha256(data).hexdigest())
          print(path.read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-self-correction-005-${{ matrix.subject }}-sanitized
          path: build/observations-${{ matrix.subject }}.json
          if-no-files-found: error
          retention-days: 30
