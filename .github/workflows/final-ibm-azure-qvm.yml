name: Final IBM measured source to one live Azure QVM job
on:
  pull_request:
    paths:
      - 'scripts/azure_final_ibm_qvm.py'
      - 'tests/test_azure_final_ibm_qvm.py'
      - '.github/workflows/final-ibm-azure-qvm.yml'
permissions:
  contents: read
concurrency:
  group: final-ibm-azure-qvm-20261009
  cancel-in-progress: false
jobs:
  one-simulator:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/azure-final-ibm-live-20261009' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify IBM receipt and bounded classical transfer
        run: python -m unittest discover -s tests -p test_azure_final_ibm_qvm.py
      - name: Install Azure QDK
        run: python -m pip install 'qdk[azure]'
      - name: Execute or recover the single simulator job
        env:
          AZURE_QUANTUM_CONNECTION_STRING: ${{ secrets.AZURE_QUANTUM_CONNECTION_STRING }}
          BEAST_AZURE_QVM_ONE_JOB: YES_ONE_FREE_SIMULATOR
        run: python scripts/azure_final_ibm_qvm.py
      - name: Preserve exact source, submitted job and observed simulator output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ibm-azure-qvm-${{ github.run_id }}
          path: _azure_final_ibm_qvm/
          retention-days: 30
          if-no-files-found: warn
