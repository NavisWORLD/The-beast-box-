name: COSMOS 009 real frozen models x actual COSMOS vs lexical substrate (CPU)

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/cosmos_end_to_end_substrate_009.py"
      - "tests/test_cosmos_end_to_end_substrate_009.py"
      - "docs/experiments/COSMOS_END_TO_END_009_010_PROTOCOL.md"
      - ".github/workflows/cosmos-end-to-end-substrate-009.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmos-real-generative-009-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-and-real-product-router-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . "pytest==8.4.2"
      - name: Recheck source disjointness, original product R12, SQL memory reopen and null control
        run: python -m pytest -q tests/test_cosmos_end_to_end_substrate_009.py

  pinned-real-model-generations:
    needs: [protocol-and-real-product-router-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        seed: [17, 41]
        model: [smollm2-135m, qwen2.5-0.5b]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original verified public pretrained weights, standard free CPU runner
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e . transformers==4.49.0 huggingface_hub==0.30.2 safetensors==0.5.3 numpy==1.26.4 pytest==8.4.2
      - name: Original frozen model under ALL five counterfactual evidence arms
        run: |
          mkdir -p build/original
          env -u HF_TOKEN -u HUGGING_FACE_HUB_TOKEN \
            python -m scripts.cosmos_end_to_end_substrate_009 \
              --seed ${{ matrix.seed }} \
              --model ${{ matrix.model }} \
              --directory build/verified-${{ matrix.model }} \
              --output build/original/gen-${{ matrix.seed }}-${{ matrix.model }}.json
      - name: Assert FULL exact source 24x5 observations and all original negative controls
        run: |
          SEED=${{ matrix.seed }} SUBJECT=${{ matrix.model }} python - <<'PY'
          import hashlib,json,os,pathlib
          source=pathlib.Path(f"build/original/gen-{os.environ['SEED']}-{os.environ['SUBJECT']}.json")
          raw=source.read_bytes()
          result=json.loads(raw)
          assert result["schema"]=="cosmos-original-generative-external-substrate-009-seed-model-v1"
          assert len(result["cases"])==24
          assert result["same_model_all_conditions"] and result["no_model_weight_training"]
          assert set(result["arm_order"])=={"no_evidence","lexical","frozen_r12","adaptive_r12","oracle"}
          assert all(set(row["arms"])==set(result["arm_order"]) for row in result["cases"])
          assert all(row["arms"]["oracle"]["retrieval_correct"] for row in result["cases"])
          assert all(row["arms"]["no_evidence"]["retrieval_correct"] is None for row in result["cases"])
          print("VERIFIED_REAL_SEED_MODEL_FULL_RECEIPT_SHA256="+hashlib.sha256(raw).hexdigest())
          print("ALL_ORIGINAL_MODEL_MEASUREMENTS="+json.dumps(result["summary"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-009-${{ matrix.model }}-seed-${{ matrix.seed }}
          path: build/original/gen-${{ matrix.seed }}-${{ matrix.model }}.json
          retention-days: 30
          if-no-files-found: error

  combine-all-public-original-models:
    needs: [pinned-real-model-generations]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: cosmos-009-*
          path: build/original
          merge-multiple: true
      - name: Require BOTH model families, BOTH seeds, BOTH corpus sizes, favorable AND unfavorable cases
        run: |
          python -m scripts.cosmos_end_to_end_substrate_009 \
            --summarize-dir build/original \
            --output build/cosmos-009-complete.json
          cat build/cosmos-009-complete.json
          sha256sum build/original/*.json build/cosmos-009-complete.json
      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-009-all-real-model-results
          path: |
            build/original/*.json
            build/cosmos-009-complete.json
          if-no-files-found: error
          retention-days: 30
