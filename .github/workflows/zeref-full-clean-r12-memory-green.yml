name: ZEREF FULL CLEAN R12 MEMORY GREEN

on:
  push:
    branches: [zeref-full-clean-r12-memory-integration-001]
    paths:
      - 'scripts/run_zeref_full_clean_r12_memory_talk.py'
      - 'tests/test_zeref_full_clean_r12_memory_integration.py'
      - '.github/workflows/zeref-full-clean-r12-memory-green.yml'

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install deterministic test runtime
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Focused integration contract
        run: python -m pytest -q tests/test_zeref_full_clean_r12_memory_integration.py
      - name: Complete repository regression suite
        run: python -m pytest -q
