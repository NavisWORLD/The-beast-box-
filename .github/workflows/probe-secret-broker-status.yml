name: Probe secret-brokered run status

on:
  push:
    branches:
      - 'agent/zeref-quantum-divergence'
    paths:
      - '.github/workflows/probe-secret-broker-status.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zeref-quantum-divergence
          fetch-depth: 0
      - name: Query latest brokered run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/final
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow zeref-repo-secret-broker.yml \
            --branch agent/zeref-quantum-divergence \
            --limit 3 \
            --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt \
            > evidence/final/zeref-secret-brokered-status-probe.json
          cat evidence/final/zeref-secret-brokered-status-probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/zeref-quantum-divergence
          git add evidence/final/zeref-secret-brokered-status-probe.json
          git commit -m "evidence: probe secret-brokered run status" || true
          git push origin HEAD:agent/zeref-quantum-divergence

# Probe corrected 54D full rerun, 2026-08-18.
