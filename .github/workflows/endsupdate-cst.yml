name: Endsupdate CST math (isolated)
on:
  push:
    branches: [experiment/endsupdate-cst-math-001]
  pull_request:
    paths:
      - 'Endsupdate/**'
      - '.github/workflows/endsupdate-cst.yml'
permissions:
  contents: read
jobs:
  isolated-math:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: Endsupdate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run source-lineage and candidate unit tests
        run: python -m unittest discover -s tests -p 'test_cst*.py' -v
      - name: Verify constrained local launcher contracts
        run: python -m unittest discover -s tests -p test_isolated_runtime.py -v
      - name: Execute frozen synthetic numerical comparison
        run: python run_experiment.py
      - name: Execute follow-up numerical observability
        run: python run_diagnostics.py
      - name: Print deterministic raw evidence hashes
        run: sha256sum evidence/cst_math_experiment_001.json evidence/cst_math_observability_002.json
      - name: Preserve generated raw results
        uses: actions/upload-artifact@v4
        with:
          name: endsupdate-cst-math-python-${{ matrix.python-version }}
          path: |
            Endsupdate/evidence/cst_math_experiment_001.json
            Endsupdate/evidence/cst_math_observability_002.json
          if-no-files-found: error

  copied-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: Endsupdate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install copied Beast Box package with test and ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ml]'
      - name: Run complete copied Python test suite in isolated working directory
        run: python -m pytest -o addopts='' tests -q
      - name: Fresh-process dedicated-state reference continuity
        run: python verify_reference_continuity.py
      - name: Preserve local reference-continuity evidence
        uses: actions/upload-artifact@v4
        with:
          name: endsupdate-reference-continuity-python-${{ matrix.python-version }}
          path: Endsupdate/evidence/endsupdate_reference_continuity_003.json
          if-no-files-found: error
      - name: Check copied historical evidence receipt
        run: python scripts/productization_receipt.py --check-only
      - name: Verify copied package CLI entry points
        run: |
          beastbox --help
          beastbox starter
          cosmic.cypher-cli --help
