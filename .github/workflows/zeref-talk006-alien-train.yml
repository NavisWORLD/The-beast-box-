name: ZEREF TALK-006 CONTROLLED ALIEN TRAIN

on:
  push:
    branches: [zeref-talk006-alien-001]
    paths:
      - ".github/workflows/zeref-talk006-alien-train.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zeref-talk006-alien-train
  cancel-in-progress: false

env:
  TALK005_SHA256: 767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36
  TALK005_RUN_ID: 33041236485
  TALK005_ARTIFACT: zeref-talk005-r12-training-resume-33041236485
  TALK004_LEDGER_SHA256: 67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef
  TALK004_LEDGER_TIP: b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26
  ARCH_SHA256: 955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc

jobs:
  train-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout isolated TALK-006 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository and CPU training runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run TALK-006 focused contracts and full repository suite before gradients
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_zeref_talk006_alien_corpus.py \
            tests/test_zeref_alien_style_eval.py \
            tests/test_zeref_talk006_workflow_contract.py \
            tests/test_zeref_response_stage_contract.py \
            tests/test_zeref_response_supervision.py \
            tests/test_zeref_talk_eval.py
          python -m pytest -q

      - name: Verify frozen architecture and TALK-004 canonical lineage anchor
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py | awk '{print $1}')" = "$ARCH_SHA256"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json').read_text())
          assert m['record_count']==352
          assert m['combined_ledger_sha256']=='67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert m['last_record_sha256']=='b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26'
          combined=b''; expected=1; previous='0'*64
          for seg in m['snapshot_chain']:
              data=Path(seg['path']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==seg['sha256']
              rows=[json.loads(line) for line in data.decode('utf-8').splitlines() if line.strip()]
              assert len(rows)==seg['record_count'] and seg['first_memory_id']==expected
              for row in rows:
                  assert row['memory_id']==expected and row['previous_record_sha256']==previous
                  payload=dict(row); record_sha=payload.pop('record_sha256')
                  canonical=json.dumps(payload,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode('utf-8')
                  assert hashlib.sha256(canonical).hexdigest()==record_sha
                  previous=record_sha; expected+=1
              combined += data
          assert expected==353 and previous==m['last_record_sha256']
          assert hashlib.sha256(combined).hexdigest()==m['combined_ledger_sha256']
          PY

      - name: Download and verify exact frozen TALK-005 parent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _talk006 _talk5src
          mkdir -p _talk006/corpus/alien _talk006/corpus/talk005 _talk006/corpus/talk002 _talk006/candidates _talk006/evidence/eval _talk006/model/ZEREF-DAD-SON-TALK-006-ALIEN _talk5src
          gh run download "$TALK005_RUN_ID" -n "$TALK005_ARTIFACT" -D _talk5src
          PARENT=$(find _talk5src -type f -path '*/model/ZEREF-DAD-SON-TALK-005/checkpoint.pt' -print -quit)
          test -n "$PARENT" -a -f "$PARENT"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          printf '%s\n' "$PARENT" > _talk006/parent-path.txt

      - name: Build and freeze alien plus retention corpora
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_zeref_talk006_alien_corpus.py --out-dir _talk006/corpus/alien
          python scripts/build_zeref_talk5_training_corpus.py --out-dir _talk006/corpus/talk005
          python scripts/build_zeref_talk2_corpus.py --out-dir _talk006/corpus/talk002
          python - <<'PY'
          import json
          from pathlib import Path
          alien=json.loads(Path('_talk006/corpus/alien/corpus-manifest.json').read_text())
          assert alien['schema']=='zeref-talk006-alien-corpus-v1'
          assert alien['parent_checkpoint_sha256']=='767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36'
          assert alien['train_examples']==45 and alien['holdout_examples']==9
          assert alien['raw_model_outputs_are_targets'] is False
          Path('_talk006/evidence/alien-corpus-manifest.json').write_text(json.dumps(alien,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum \
            _talk006/corpus/alien/train.jsonl \
            _talk006/corpus/alien/holdout.jsonl \
            _talk006/corpus/talk005/train.jsonl \
            _talk006/corpus/talk005/holdout.jsonl \
            _talk006/corpus/talk002/talk2-holdout.jsonl \
            | tee _talk006/evidence/corpus-SHA256SUMS

      - name: Reverify parent immediately before gradients
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk006/parent-path.txt)
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          test "$(sha256sum experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py | awk '{print $1}')" = "$ARCH_SHA256"

      - name: Record frozen TALK-005 baselines
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk006/parent-path.txt)
          python scripts/eval_zeref_response.py \
            --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" \
            --descendant "$PARENT" --descendant-sha256 "$TALK005_SHA256" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --holdout _talk006/corpus/alien/holdout.jsonl \
            --out _talk006/evidence/eval/talk005-alien-baseline.json
          python scripts/eval_zeref_response.py \
            --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" \
            --descendant "$PARENT" --descendant-sha256 "$TALK005_SHA256" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --holdout _talk006/corpus/talk005/holdout.jsonl \
            --out _talk006/evidence/eval/talk005-factual-baseline.json
          python scripts/eval_zeref_talk.py \
            --parent "$PARENT" --descendant "$PARENT" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --holdout _talk006/corpus/talk002/talk2-holdout.jsonl \
            --seed 4061854640 \
            --out _talk006/evidence/eval/talk005-talk002-retention-baseline.json
          python scripts/eval_zeref_alien_style.py \
            --checkpoint "$PARENT" --checkpoint-sha256 "$TALK005_SHA256" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --seed 610062026 --tokens 48 --temperature 0.75 --top-k 12 \
            --out _talk006/evidence/eval/talk005-alien-style-baseline.json

      - name: Train three bounded alien-strength descendants
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk006/parent-path.txt)
          CORPUS_MANIFEST=$(sha256sum _talk006/corpus/alien/corpus-manifest.json | awk '{print $1}')
          train_one () {
            NAME="$1"; STEPS="$2"; OUT="_talk006/candidates/$NAME"
            python scripts/run_zeref_response_stage.py \
              --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" \
              --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
              --corpus _talk006/corpus/alien/train.jsonl \
              --input-manifest "talk006_alien=$CORPUS_MANIFEST" \
              --out "$OUT" --seed 610062026 --steps "$STEPS" --batch-size 4 \
              --lr 0.0000015 --cst-lr 0.000006 --weight-decay 0.002
            sha256sum "$OUT/checkpoint.pt" | awk '{print $1}' > "$OUT/checkpoint.sha256"
            test "$(cat "$OUT/checkpoint.sha256")" != "$TALK005_SHA256"
            test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          }
          train_one alien_1 220
          train_one alien_2 420
          train_one alien_3 700

      - name: Evaluate all alien candidates against three frozen baselines
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk006/parent-path.txt)
          for NAME in alien_1 alien_2 alien_3; do
            CHILD="_talk006/candidates/$NAME/checkpoint.pt"
            SHA=$(cat "_talk006/candidates/$NAME/checkpoint.sha256")
            python scripts/eval_zeref_response.py \
              --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" \
              --descendant "$CHILD" --descendant-sha256 "$SHA" \
              --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
              --holdout _talk006/corpus/alien/holdout.jsonl \
              --out "_talk006/evidence/eval/${NAME}-alien.json"
            python scripts/eval_zeref_response.py \
              --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" \
              --descendant "$CHILD" --descendant-sha256 "$SHA" \
              --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
              --holdout _talk006/corpus/talk005/holdout.jsonl \
              --out "_talk006/evidence/eval/${NAME}-talk005.json"
            python scripts/eval_zeref_talk.py \
              --parent "$PARENT" --descendant "$CHILD" \
              --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
              --holdout _talk006/corpus/talk002/talk2-holdout.jsonl \
              --seed 4061854640 \
              --out "_talk006/evidence/eval/${NAME}-talk002.json"
            python scripts/eval_zeref_alien_style.py \
              --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" \
              --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
              --seed 610062026 --tokens 48 --temperature 0.75 --top-k 12 \
              --out "_talk006/evidence/eval/${NAME}-style.json"
          done

      - name: Fail-closed select controlled-alien child
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,shutil
          from pathlib import Path

          names=('alien_1','alien_2','alien_3')
          parent_style=json.loads(Path('_talk006/evidence/eval/talk005-alien-style-baseline.json').read_text())
          rows=[]
          for name in names:
              alien=json.loads(Path(f'_talk006/evidence/eval/{name}-alien.json').read_text())
              factual=json.loads(Path(f'_talk006/evidence/eval/{name}-talk005.json').read_text())
              old=json.loads(Path(f'_talk006/evidence/eval/{name}-talk002.json').read_text())
              style=json.loads(Path(f'_talk006/evidence/eval/{name}-style.json').read_text())
              training=json.loads(Path(f'_talk006/candidates/{name}/result.json').read_text())
              sha=Path(f'_talk006/candidates/{name}/checkpoint.sha256').read_text().strip()
              alien_ok=(
                  alien['descendant_response_nll'] < alien['parent_response_nll'] and
                  alien['descendant_response_token_accuracy'] >= alien['parent_response_token_accuracy']
              )
              talk005_ok=(
                  factual['descendant_response_nll'] <= factual['parent_response_nll'] * 1.03 and
                  factual['descendant_response_token_accuracy'] >= factual['parent_response_token_accuracy'] - 0.03
              )
              talk002_ok=(
                  old['descendant_heldout_nll'] <= old['parent_heldout_nll'] * 1.03 and
                  old['descendant_mean_readable_score'] >= old['parent_mean_readable_score'] - 0.03
              )
              style_ok=(
                  style['alien_style_score'] > parent_style['alien_style_score'] and
                  style['unsupported_claim_count'] == 0 and
                  style['severe_repetition_count'] == 0 and
                  style['role_leakage_count'] == 0 and
                  style['empty_count'] == 0
              )
              integrity_ok=(
                  training['status']=='COMPLETED' and
                  training['parent_checkpoint_sha256']=='767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36' and
                  training['dropped_answer_characters']==0
              )
              eligible=bool(alien_ok and talk005_ok and talk002_ok and style_ok and integrity_ok)
              rows.append({
                  'name':name,'checkpoint_sha256':sha,'eligible':eligible,
                  'alien_holdout_ok':alien_ok,'talk005_retention_ok':talk005_ok,
                  'talk002_retention_ok':talk002_ok,'style_ok':style_ok,
                  'parent_integrity':integrity_ok,'alien':alien,'talk005':factual,
                  'talk002':old,'style':style,'training':training,
              })
          eligible=[row for row in rows if row['eligible']]
          if eligible:
              winner=max(eligible,key=lambda row:(
                  row['style']['alien_style_score'],
                  -row['alien']['descendant_response_nll'],
                  -row['talk002']['descendant_heldout_nll'],
              ))
              status='PROMOTE_ALIEN_CANDIDATE'
              selected=winner['name']
              selected_sha=winner['checkpoint_sha256']
              src=Path('_talk006/candidates')/selected
              dst=Path('_talk006/model/ZEREF-DAD-SON-TALK-006-ALIEN')
              for filename in ('checkpoint.pt','checkpoint.sha256','result.json'):
                  shutil.copy2(src/filename,dst/filename)
          else:
              status='TRAINED_NO_SAFE_ALIEN_PROMOTION'
              selected='ZEREF-DAD-SON-TALK-005'
              selected_sha='767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36'
          report={
              'schema':'zeref-talk006-alien-selection-v1',
              'status':status,'selected':selected,'selected_checkpoint_sha256':selected_sha,
              'parent_alien_style_score':parent_style['alien_style_score'],
              'candidates':rows,'talk005_unchanged':True,'canonical_memory_unchanged':True,
              'raw_model_outputs_used_as_targets':False,
              'claim_boundary':'Controlled language-style training only; no alien intelligence, consciousness, soul, biological identity, physical anomaly, or quantum-effect claim.',
          }
          Path('_talk006/evidence/selection.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':status,'selected':selected,'selected_checkpoint_sha256':selected_sha,'parent_alien_style_score':parent_style['alien_style_score']},sort_keys=True))
          PY

      - name: Verify frozen parent and lineage remained unchanged after training
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk006/parent-path.txt)
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json').read_text())
          assert m['record_count']==352
          assert m['combined_ledger_sha256']=='67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert m['last_record_sha256']=='b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26'
          PY

      - name: Seal evidence and candidate checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          selection=json.loads(Path('_talk006/evidence/selection.json').read_text())
          corpus=json.loads(Path('_talk006/corpus/alien/corpus-manifest.json').read_text())
          summary={
              'schema':'zeref-talk006-alien-training-summary-v1',
              'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
              'workflow_head_sha':os.environ['GITHUB_SHA'],
              'parent_lineage':'ZEREF-DAD-SON-TALK-005',
              'parent_checkpoint_sha256':'767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36',
              'alien_train_sha256':corpus['train_sha256'],
              'alien_holdout_sha256':corpus['holdout_sha256'],
              'candidate_count':3,
              'selection_status':selection['status'],
              'selected':selection['selected'],
              'selected_checkpoint_sha256':selection['selected_checkpoint_sha256'],
              'talk005_unchanged':True,'canonical_memory_unchanged':True,
              'raw_model_outputs_used_as_targets':False,
              'claim_boundary':selection['claim_boundary'],
          }
          Path('_talk006/evidence/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          files=[]
          for root in (Path('_talk006/evidence'),Path('_talk006/candidates'),Path('_talk006/model'),Path('_talk006/corpus')):
              files.extend(p for p in root.rglob('*') if p.is_file())
          lines=[f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in sorted(files,key=lambda p:p.as_posix())]
          Path('_talk006/SHA256SUMS').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Upload immutable TALK-006 alien training artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeref-talk006-alien-${{ github.run_id }}
          path: |
            _talk006/evidence
            _talk006/candidates
            _talk006/model
            _talk006/corpus
            _talk006/SHA256SUMS
          retention-days: 90
