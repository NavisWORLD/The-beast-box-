name: R12 Physics Probe 001

on:
  push:
    branches: [r12-physics-probe-001]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r12-physics-probe-001-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Probe 001 contracts
        run: pytest -q tests/test_r12_physics_probe.py
