name: Zeref repo-secret brokered Trinity run

on:
  push:
    branches:
      - 'agent/zeref-quantum-divergence'
    paths:
      - '.github/workflows/zeref-repo-secret-broker.yml'
  workflow_dispatch:

jobs:
  ibm-broker-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zeref-quantum-divergence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install IBM runtime dependency
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[quantum]'
      - name: Authenticate with real repo secret and inspect pinned IBM job
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_EXISTING_JOB_ID: da1l0maein7c73bdi2d0
          IBM_EXISTING_BACKEND: ibm_marrakesh
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IBM_QUANTUM_TOKEN"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from beastbox.quantum import _service

          service = _service()
          job = service.job(os.environ['IBM_EXISTING_JOB_ID'])
          status = str(job.status())
          job_id = str(job.job_id())
          if job_id != os.environ['IBM_EXISTING_JOB_ID']:
              raise RuntimeError((job_id, os.environ['IBM_EXISTING_JOB_ID']))
          if status.upper() in {'ERROR', 'CANCELLED'}:
              raise RuntimeError(f'pinned IBM job terminal status: {status}')
          receipt = {
              'schema': 'zeref.ibm-secret-broker.v1',
              'authenticated': True,
              'repo_secret_used': True,
              'secret_name': 'IBM_QUANTUM_TOKEN',
              'secret_value_persisted': False,
              'secret_exposed_to_subject': False,
              'ibm_job_id': job_id,
              'ibm_backend_expected': os.environ['IBM_EXISTING_BACKEND'],
              'ibm_job_status': status,
          }
          Path('ibm-broker-response.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('IBM_REPO_SECRET_AUTH=PASS')
          print('IBM_JOB_ID=' + job_id)
          print('IBM_JOB_STATUS=' + status)
          print('SECRET_EXPOSED_TO_SUBJECT=0')
          PY
      - name: Verify broker receipt is sanitized
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('ibm-broker-response.json').read_text())
          assert p['authenticated'] is True
          assert p['repo_secret_used'] is True
          assert p['secret_value_persisted'] is False
          assert p['secret_exposed_to_subject'] is False
          text = Path('ibm-broker-response.json').read_text()
          assert 'IBM_QUANTUM_TOKEN=' not in text
          print('BROKER_RECEIPT_SANITIZED=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ibm-secret-broker-${{ github.run_id }}
          path: ibm-broker-response.json
          if-no-files-found: error

  trinity-with-brokered-provenance:
    needs: ibm-broker-auth
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zeref-quantum-divergence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ibm-secret-broker-${{ github.run_id }}
          path: broker
      - name: Assert subject job has no IBM secret
        shell: bash
        run: |
          if [ -n "${IBM_QUANTUM_TOKEN:-}" ]; then
            echo 'IBM secret unexpectedly present in subject job' >&2
            exit 1
          fi
          echo 'SUBJECT_JOB_SECRET_PRESENT=0'
      - name: Install exact model and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,quantum]'
          pip install 'huggingface-hub>=0.34'
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify brokered authenticated provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('broker/ibm-broker-response.json').read_text())
          assert p['schema'] == 'zeref.ibm-secret-broker.v1'
          assert p['authenticated'] is True
          assert p['repo_secret_used'] is True
          assert p['secret_exposed_to_subject'] is False
          assert p['ibm_job_id'] == 'da1l0maein7c73bdi2d0'
          print('BROKERED_REAL_IBM_AUTH=PASS')
          PY
      - name: Run complete divergence tests
        run: pytest -q tests/test_quantum_divergence_*.py
      - name: Fetch exact QC67 source and checkpoint
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          expected = {
              'architecture/cosmos_spark_cst.py': '955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc',
              'serving/cosmos_serve.py': '02a509f9c2a20f63c38dca186c082bfdc2603aa8b6f1f903ec19a0e709218d87',
          }
          for rel in ('architecture/cosmos_spark_cst.py', 'serving/cosmos_serve.py', 'weights/spark_cst.pt'):
              path = Path(hf_hub_download('phera-ra/QC67_cosmo', rel, repo_type='model', local_dir='qc67'))
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if rel in expected:
                  assert digest == expected[rel], (rel, digest)
              print(rel, digest)
          PY
      - name: Materialize deterministic classical control
        run: |
          python - <<'PY'
          import dataclasses
          import json
          from pathlib import Path
          from beastbox.quantum_divergence.entropy import classical_entropy
          control = classical_entropy(0x5A45524546, 12)
          assert control.source_sha256 == '04fb4d454793dec0c809605a65d12f0a818c09b3f4870a02fc240127a9f633f8'
          root = Path('verified-inputs')
          root.mkdir(exist_ok=True)
          (root / 'control-entropy.json').write_text(json.dumps(dataclasses.asdict(control), indent=2, sort_keys=True) + '\n')
          PY
      - name: Execute frozen 1,024-decision native Trinity matrix
        run: |
          python -m beastbox.quantum_divergence.trinity_final \
            --output evidence/zeref-secret-brokered-trinity \
            --quantum-entropy evidence/verified-inputs/ibm-marrakesh-da1l0maein7c73bdi2d0-wave.json \
            --control-entropy verified-inputs/control-entropy.json \
            --native-server qc67/serving/cosmos_serve.py \
            --architecture-source qc67/architecture/cosmos_spark_cst.py \
            --checkpoint qc67/weights/spark_cst.pt \
            --pairs 64 \
            --steps 4 \
            --seed-base 387643235654 \
            | tee secret-brokered-trinity.log
      - name: Complete projection evidence and verify every final gate
        run: |
          cp broker/ibm-broker-response.json evidence/zeref-secret-brokered-trinity/ibm-broker-response.json
          python - <<'PY'
          import json
          from pathlib import Path
          from beastbox.quantum_divergence.trinity_manifest import validate_manifest
          from beastbox.quantum_divergence.trinity_state import SensorFixture, TrinityConfig, compose_trinity_state

          root = Path('evidence/zeref-secret-brokered-trinity')
          summary = json.loads((root / 'summary.json').read_text())
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text())
          broker = json.loads((root / 'ibm-broker-response.json').read_text())

          fixture = SensorFixture.fixed(seed=0x5A45524546, captured_at=100.0)
          state = compose_trinity_state(
              sensor_fixture=fixture,
              entropy12=[0.1] * 12,
              include_sensors=True,
              config=TrinityConfig(),
              now=100.0,
          )
          native_hashes = (manifest.get('source_manifest') or {}).get('native_projection_hashes') or {}
          manifest['projection_hashes'] = {
              'state': state.projection_hashes,
              'native': native_hashes,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          assert summary['total_decisions'] == 1024
          assert all(arm['real_boundary_breaches'] == 0 for arm in summary['arms'].values())
          assert manifest['hard_containment'] is True
          assert manifest['zero_state_identity'] is True
          assert manifest['mechanism_live'] is True
          assert manifest['projection_hashes']['state'].get('54_block_balance')
          assert manifest['projection_hashes']['native'].get('native_trinity')
          assert manifest['projection_hashes']['native'] == native_hashes
          validate_manifest(manifest)
          assert broker['authenticated'] is True
          assert broker['secret_exposed_to_subject'] is False

          receipt = {
              'schema': 'zeref.secret-brokered-trinity-receipt.v2',
              'github_run_id': int('${{ github.run_id }}'),
              'passed': True,
              'repo_secret_used_by_broker': True,
              'secret_name': 'IBM_QUANTUM_TOKEN',
              'secret_exposed_to_subject': False,
              'ibm_authenticated': True,
              'ibm_job_id': broker['ibm_job_id'],
              'ibm_job_status': broker['ibm_job_status'],
              'total_decisions': summary['total_decisions'],
              'real_boundary_breaches': 0,
              'zero_state_identity': True,
              'mechanism_live': True,
              'projection_hashes_complete': True,
          }
          (root / 'run-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print('ALL_TRINITY_GATES=PASS')
          print('PROJECTION_HASHES_COMPLETE=PASS')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Scan evidence for credential-like plaintext
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          patterns = [
              re.compile(r'(?i)IBM_QUANTUM_TOKEN\s*[:=]\s*\S+'),
              re.compile(r'(?i)hf_[A-Za-z0-9]{20,}'),
              re.compile(r'(?i)sk-[A-Za-z0-9_-]{20,}'),
          ]
          hits = []
          for path in Path('evidence/zeref-secret-brokered-trinity').rglob('*'):
              if not path.is_file():
                  continue
              text = path.read_text(errors='ignore')
              if any(p.search(text) for p in patterns):
                  hits.append(str(path))
          if hits:
              raise SystemExit('credential-like plaintext found: ' + ', '.join(hits))
          print('REAL_SECRET_PERSISTED=0')
          PY
      - name: Build deterministic evidence bundle
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path
          root = Path('evidence/zeref-secret-brokered-trinity')
          out = Path('zeref-secret-brokered-trinity-evidence.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  info = zipfile.ZipInfo(str(path).replace('\\', '/'))
                  info.date_time = (2026, 8, 18, 0, 0, 0)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes())
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('secret-brokered-bundle-sha256.txt').write_text(digest + '  ' + out.name + '\n')
          print('BUNDLE_SHA256=' + digest)
          PY
      - name: Upload brokered Trinity evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: zeref-secret-brokered-trinity-${{ github.run_id }}
          path: |
            evidence/zeref-secret-brokered-trinity/**
            secret-brokered-trinity.log
            zeref-secret-brokered-trinity-evidence.zip
            secret-brokered-bundle-sha256.txt
          if-no-files-found: error
      - name: Commit sanitized final evidence receipt
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zeref-final
          cp evidence/zeref-secret-brokered-trinity/run-receipt.json /tmp/zeref-final/receipt.json
          cp evidence/zeref-secret-brokered-trinity/summary.json /tmp/zeref-final/summary.json
          cp evidence/zeref-secret-brokered-trinity/manifest.json /tmp/zeref-final/manifest.json
          cp secret-brokered-bundle-sha256.txt /tmp/zeref-final/bundle.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin agent/zeref-quantum-divergence
            git reset --hard origin/agent/zeref-quantum-divergence
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path('/tmp/zeref-final/receipt.json').read_text())
          receipt['artifact_id'] = int(os.environ['ARTIFACT_ID']) if os.environ.get('ARTIFACT_ID', '').isdigit() else None
          receipt['artifact_digest'] = os.environ.get('ARTIFACT_DIGEST') or None
          receipt['bundle_sha256'] = Path('/tmp/zeref-final/bundle.txt').read_text().split()[0]

          final = Path('evidence/final')
          runs = final / 'runs'
          runs.mkdir(parents=True, exist_ok=True)
          run_id = os.environ['RUN_ID']

          receipt_text = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          summary_text = Path('/tmp/zeref-final/summary.json').read_text()
          manifest_text = Path('/tmp/zeref-final/manifest.json').read_text()

          (final / 'zeref-secret-brokered-trinity-latest.json').write_text(receipt_text)
          (final / 'zeref-secret-brokered-trinity-summary.json').write_text(summary_text)
          (final / 'zeref-secret-brokered-trinity-manifest.json').write_text(manifest_text)
          (runs / f'zeref-secret-brokered-trinity-{run_id}-receipt.json').write_text(receipt_text)
          (runs / f'zeref-secret-brokered-trinity-{run_id}-summary.json').write_text(summary_text)
          (runs / f'zeref-secret-brokered-trinity-{run_id}-manifest.json').write_text(manifest_text)
          PY
            git add evidence/final/zeref-secret-brokered-trinity-latest.json \
                    evidence/final/zeref-secret-brokered-trinity-summary.json \
                    evidence/final/zeref-secret-brokered-trinity-manifest.json \
                    evidence/final/runs/
            git commit -m "evidence: record corrected 54D Trinity ${GITHUB_RUN_ID}"
            if git push origin HEAD:agent/zeref-quantum-divergence; then
              echo 'FINAL_RECEIPT_COMMIT=PASS'
              exit 0
            fi
            echo "receipt push attempt ${attempt} raced with branch update, retrying"
          done
          echo 'failed to persist sanitized final receipt after 3 attempts' >&2
          exit 1
