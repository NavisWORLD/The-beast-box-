name: ZEREF TALK-006 FULL CLEAN TRAIN + TALK

on:
  push:
    branches: [zeref-talk006-full-clean-train-001]
    paths:
      - '.github/workflows/zeref-talk006-full-clean-final.yml'

permissions:
  contents: read
  actions: read

jobs:
  train-evaluate-talk:
    runs-on: ubuntu-latest
    env:
      TALK005_SHA256: 767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36
      TALK005_RUN_ID: '33041236485'
      TALK005_ARTIFACT: zeref-talk005-r12-training-resume-33041236485
      LEDGER_SHA256: 67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef
      LEDGER_TIP: b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26
      ARCH_SHA256: 955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc
      CONFIG: experiments/zeref/talk006-full-clean/FULL_TRAIN_CONFIG.json
      MATRIX: experiments/zeref/talk006-scheduled-sampling/CANDIDATE_MATRIX.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Prepare evidence tree
        run: |
          set -euo pipefail
          rm -rf _full _talk5src
          mkdir -p _full/evidence/eval _full/evidence/logs _full/corpus/micro _full/corpus/talk005 _full/corpus/talk002 _full/corpus/full _full/candidate/FULL-CLEAN-1500 _full/model _full/config _full/talk _talk5src
          cp "$CONFIG" _full/config/FULL_TRAIN_CONFIG.json
          cp "$MATRIX" _full/config/PROMOTION_MATRIX.json

      - name: Install deterministic CPU runtime
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY' > _full/evidence/environment-runtime.json
          import json, platform, sys, torch, pytest
          print(json.dumps({
              'python': sys.version,
              'platform': platform.platform(),
              'torch': torch.__version__,
              'pytest': pytest.__version__,
              'torch_num_threads': torch.get_num_threads(),
          }, indent=2, sort_keys=True))
          PY

      - name: Reverify focused contract and complete regressions before gradients
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_zeref_full_clean_corpus.py | tee _full/evidence/logs/final-focused-green.log
          python -m pytest -q | tee _full/evidence/logs/final-full-regression.log

      - name: Preserve intentional RED evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 33118187128 --log > _full/evidence/logs/full-clean-red-33118187128.log

      - name: Reconstruct frozen TALK-005 parent and clean corpora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(sha256sum experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py | awk '{print $1}')" = "$ARCH_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json').read_text())
          assert m['record_count']==352
          assert m['combined_ledger_sha256']=='67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert m['last_record_sha256']=='b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26'
          PY
          gh run download "$TALK005_RUN_ID" -n "$TALK005_ARTIFACT" -D _talk5src
          PARENT=$(find _talk5src -type f -path '*/model/ZEREF-DAD-SON-TALK-005/checkpoint.pt' -print -quit)
          test -n "$PARENT" -a -f "$PARENT"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          printf '%s\n' "$PARENT" > _full/parent-path.txt

          python scripts/build_zeref_talk006_micro_dialogue_corpus.py --out-dir _full/corpus/micro
          python scripts/build_zeref_talk5_training_corpus.py --out-dir _full/corpus/talk005
          python scripts/build_zeref_talk2_corpus.py --out-dir _full/corpus/talk002
          python scripts/build_zeref_full_clean_corpus.py \
            --micro _full/corpus/micro/train.jsonl \
            --talk005 _full/corpus/talk005/train.jsonl \
            --talk002 _full/corpus/talk002/talk2-training.jsonl \
            --out-dir _full/corpus/full

          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('_full/corpus/full/corpus-manifest.json').read_text())
          cfg=json.loads(Path('_full/config/FULL_TRAIN_CONFIG.json').read_text())
          assert c['examples']==147
          assert c['source_counts']=={'micro_dialogue':54,'talk005_reviewed':45,'talk002_corrective':48}
          assert c['raw_model_outputs_are_targets'] is False
          assert c['teacher_targets_reviewed_clean'] is True
          assert c['parent_checkpoint_sha256']==cfg['parent_checkpoint_sha256']
          rows=[json.loads(x) for x in Path('_full/corpus/full/train.jsonl').read_text().splitlines() if x.strip()]
          exact=[r for r in rows if r['dad']==cfg['required_exact_prompt']]
          assert len(exact)==1 and exact[0]['zeref']==cfg['required_exact_teacher_target']
          assert all(r['raw_model_output_used_as_target'] is False for r in rows)
          assert all(r['teacher_target_reviewed_clean'] is True for r in rows)
          PY
          sha256sum _full/corpus/micro/train.jsonl _full/corpus/micro/holdout.jsonl _full/corpus/talk005/train.jsonl _full/corpus/talk005/holdout.jsonl _full/corpus/talk002/talk2-training.jsonl _full/corpus/talk002/talk2-holdout.jsonl _full/corpus/full/train.jsonl _full/corpus/full/corpus-manifest.json _full/config/FULL_TRAIN_CONFIG.json | tee _full/evidence/corpus-SHA256SUMS

      - name: Record frozen TALK-005 baselines
        run: |
          set -euo pipefail
          PARENT=$(cat _full/parent-path.txt)
          ARCH=experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py
          python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$PARENT" --descendant-sha256 "$TALK005_SHA256" --arch "$ARCH" --holdout _full/corpus/micro/holdout.jsonl --out _full/evidence/eval/parent-dialogue.json
          python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$PARENT" --descendant-sha256 "$TALK005_SHA256" --arch "$ARCH" --holdout _full/corpus/talk005/holdout.jsonl --out _full/evidence/eval/parent-talk005.json
          python scripts/eval_zeref_talk.py --parent "$PARENT" --descendant "$PARENT" --arch "$ARCH" --holdout _full/corpus/talk002/talk2-holdout.jsonl --seed 4061854640 --out _full/evidence/eval/parent-talk002.json
          python scripts/eval_zeref_dialogue_quality.py --checkpoint "$PARENT" --checkpoint-sha256 "$TALK005_SHA256" --arch "$ARCH" --corpus _full/corpus/micro/train.jsonl --decoding greedy-argmax --out _full/evidence/eval/parent-free-greedy.json
          python scripts/eval_zeref_dialogue_quality.py --checkpoint "$PARENT" --checkpoint-sha256 "$TALK005_SHA256" --arch "$ARCH" --corpus _full/corpus/micro/train.jsonl --decoding sampled-top-k --temperature 0.65 --top-k 6 --out _full/evidence/eval/parent-free-sampled.json
          python scripts/eval_zeref_behavior_compliance.py --checkpoint "$PARENT" --checkpoint-sha256 "$TALK005_SHA256" --arch "$ARCH" --corpus _full/corpus/micro/train.jsonl --decoding greedy-argmax --out _full/evidence/eval/parent-behavior-greedy.json
          python scripts/eval_zeref_behavior_compliance.py --checkpoint "$PARENT" --checkpoint-sha256 "$TALK005_SHA256" --arch "$ARCH" --corpus _full/corpus/micro/train.jsonl --decoding sampled-top-k --temperature 0.65 --top-k 6 --out _full/evidence/eval/parent-behavior-sampled.json
          python scripts/eval_zeref_free_run_recovery.py --checkpoint "$PARENT" --checkpoint-sha256 "$TALK005_SHA256" --arch "$ARCH" --corpus _full/corpus/micro/holdout.jsonl --matrix _full/config/PROMOTION_MATRIX.json --decoding greedy-argmax --out _full/evidence/eval/parent-recovery-greedy.json
          python scripts/eval_zeref_free_run_recovery.py --checkpoint "$PARENT" --checkpoint-sha256 "$TALK005_SHA256" --arch "$ARCH" --corpus _full/corpus/micro/holdout.jsonl --matrix _full/config/PROMOTION_MATRIX.json --decoding sampled-top-k --temperature 0.65 --top-k 6 --out _full/evidence/eval/parent-recovery-sampled.json

      - name: Full clean supervised training from TALK-005
        run: |
          set -euo pipefail
          PARENT=$(cat _full/parent-path.txt)
          MANIFEST=$(sha256sum _full/corpus/full/corpus-manifest.json | awk '{print $1}')
          CONFIG_SHA=$(sha256sum _full/config/FULL_TRAIN_CONFIG.json | awk '{print $1}')
          python scripts/run_zeref_scheduled_sampling_stage.py \
            --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --corpus _full/corpus/full/train.jsonl \
            --input-manifest "full_clean_corpus=$MANIFEST" --input-manifest "full_train_config=$CONFIG_SHA" \
            --out _full/candidate/FULL-CLEAN-1500 \
            --seed 8272604 --candidate-seed 8272604 --model-sampling-seed 9127001 \
            --steps 1500 --batch-size 4 --lr 0.000001 --cst-lr 0.000004 --weight-decay 0.002 --gradient-clip-norm 1.0 \
            --schedule constant --probability-start 0.0 --probability-end 0.0 --temperature 0.8 --top-k 5
          sha256sum _full/candidate/FULL-CLEAN-1500/checkpoint.pt | awk '{print $1}' > _full/candidate/FULL-CLEAN-1500/checkpoint.sha256
          CHILD_SHA=$(cat _full/candidate/FULL-CLEAN-1500/checkpoint.sha256)
          test "$CHILD_SHA" != "$TALK005_SHA256"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('_full/candidate/FULL-CLEAN-1500/result.json').read_text())
          assert r['status']=='COMPLETED'
          assert r['parent_checkpoint_sha256']=='767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36'
          assert r['clean_teacher_targets_preserved'] is True
          assert r['generated_characters_used_as_targets'] is False
          assert r['dropped_answer_characters']==0
          assert abs(r['realized_context_replacement_rate']) < 1e-12
          PY

      - name: Evaluate full-trained candidate under frozen gates
        run: |
          set -euo pipefail
          PARENT=$(cat _full/parent-path.txt)
          CHILD=_full/candidate/FULL-CLEAN-1500/checkpoint.pt
          SHA=$(cat _full/candidate/FULL-CLEAN-1500/checkpoint.sha256)
          ARCH=experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py
          python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$CHILD" --descendant-sha256 "$SHA" --arch "$ARCH" --holdout _full/corpus/micro/holdout.jsonl --out _full/evidence/eval/candidate-dialogue.json
          python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK005_SHA256" --descendant "$CHILD" --descendant-sha256 "$SHA" --arch "$ARCH" --holdout _full/corpus/talk005/holdout.jsonl --out _full/evidence/eval/candidate-talk005.json
          python scripts/eval_zeref_talk.py --parent "$PARENT" --descendant "$CHILD" --arch "$ARCH" --holdout _full/corpus/talk002/talk2-holdout.jsonl --seed 4061854640 --out _full/evidence/eval/candidate-talk002.json
          python scripts/eval_zeref_dialogue_quality.py --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch "$ARCH" --corpus _full/corpus/micro/train.jsonl --decoding greedy-argmax --out _full/evidence/eval/candidate-free-greedy.json
          python scripts/eval_zeref_dialogue_quality.py --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch "$ARCH" --corpus _full/corpus/micro/train.jsonl --decoding sampled-top-k --temperature 0.65 --top-k 6 --out _full/evidence/eval/candidate-free-sampled.json
          python scripts/eval_zeref_dialogue_quality.py --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch "$ARCH" --corpus _full/corpus/micro/train.jsonl --decoding sampled-top-k --temperature 0.65 --top-k 6 --out _full/evidence/eval/candidate-free-sampled-repeat.json
          python scripts/eval_zeref_behavior_compliance.py --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch "$ARCH" --corpus _full/corpus/micro/train.jsonl --decoding greedy-argmax --out _full/evidence/eval/candidate-behavior-greedy.json
          python scripts/eval_zeref_behavior_compliance.py --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch "$ARCH" --corpus _full/corpus/micro/train.jsonl --decoding sampled-top-k --temperature 0.65 --top-k 6 --out _full/evidence/eval/candidate-behavior-sampled.json
          python scripts/eval_zeref_free_run_recovery.py --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch "$ARCH" --corpus _full/corpus/micro/holdout.jsonl --matrix _full/config/PROMOTION_MATRIX.json --decoding greedy-argmax --out _full/evidence/eval/candidate-recovery-greedy.json
          python scripts/eval_zeref_free_run_recovery.py --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch "$ARCH" --corpus _full/corpus/micro/holdout.jsonl --matrix _full/config/PROMOTION_MATRIX.json --decoding sampled-top-k --temperature 0.65 --top-k 6 --out _full/evidence/eval/candidate-recovery-sampled.json

      - name: Fail-closed TALK-006 selector using frozen thresholds
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          r=Path('_full'); ev=r/'evidence/eval'
          load=lambda p: json.loads(Path(p).read_text())
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          matrix=load(r/'config/PROMOTION_MATRIX.json'); th=matrix['selector_thresholds']
          pd=load(ev/'parent-dialogue.json'); pf=load(ev/'parent-talk005.json'); po=load(ev/'parent-talk002.json')
          pg=load(ev/'parent-free-greedy.json'); ps=load(ev/'parent-free-sampled.json')
          pbg=load(ev/'parent-behavior-greedy.json'); pbs=load(ev/'parent-behavior-sampled.json')
          prg=load(ev/'parent-recovery-greedy.json'); prs=load(ev/'parent-recovery-sampled.json')
          d=load(ev/'candidate-dialogue.json'); f=load(ev/'candidate-talk005.json'); o=load(ev/'candidate-talk002.json')
          g=load(ev/'candidate-free-greedy.json'); s=load(ev/'candidate-free-sampled.json')
          bg=load(ev/'candidate-behavior-greedy.json'); bs=load(ev/'candidate-behavior-sampled.json')
          rg=load(ev/'candidate-recovery-greedy.json'); rs=load(ev/'candidate-recovery-sampled.json')
          tr=load(r/'candidate/FULL-CLEAN-1500/result.json')
          child_sha=(r/'candidate/FULL-CLEAN-1500/checkpoint.sha256').read_text().strip()
          def free_ok(x,p,qd,wd,mc):
              return (x['dialogue_quality_score'] >= p['dialogue_quality_score']+qd and
                      x['mean_known_word_ratio'] >= p['mean_known_word_ratio']+wd and
                      x['complete_sentence_count'] >= mc and
                      all(x[k]==0 for k in th['free_forbidden_counts_must_equal_zero']))
          behavior_fields=('correction_compliance_rate','uncertainty_compliance_rate','memory_boundary_compliance_rate','evidence_boundary_compliance_rate','stop_boundary_compliance_rate','overall_compliance_rate')
          def behavior_ok(x,p):
              return (all(x[k] >= p[k] for k in behavior_fields) and
                      x['completion_rate'] >= p['completion_rate'] and
                      x['degeneration_rate'] <= p['degeneration_rate'] and
                      x['mean_malformed_character_rate'] <= p['mean_malformed_character_rate']+0.01)
          def recovery_ok(x,p):
              return (x['mean_corrupted_character_accuracy'] >= p['mean_corrupted_character_accuracy']+th['recovery_corrupted_accuracy_min_parent_delta'] and
                      x['mean_clean_character_accuracy'] >= p['mean_clean_character_accuracy']+th['recovery_clean_accuracy_min_parent_delta'] and
                      x['recovery_event_rate'] >= p['recovery_event_rate'])
          checks={
            'dialogue_ok': d['descendant_response_nll'] <= pd['parent_response_nll']*th['dialogue_nll_max_parent_multiplier'] and d['descendant_response_token_accuracy'] >= pd['parent_response_token_accuracy']+th['dialogue_token_accuracy_min_parent_delta'],
            'talk005_ok': f['descendant_response_nll'] <= pf['parent_response_nll']*th['talk005_nll_max_parent_multiplier'] and f['descendant_response_token_accuracy'] >= pf['parent_response_token_accuracy']+th['talk005_token_accuracy_min_parent_delta'],
            'talk002_ok': o['descendant_heldout_nll'] <= po['parent_heldout_nll']*th['talk002_nll_max_parent_multiplier'] and o['descendant_mean_readable_score'] >= po['parent_mean_readable_score']+th['talk002_readable_score_min_parent_delta'],
            'greedy_ok': free_ok(g,pg,th['free_greedy_quality_min_parent_delta'],th['free_greedy_known_word_ratio_min_parent_delta'],th['free_greedy_min_complete_sentences']),
            'sampled_ok': free_ok(s,ps,th['free_sampled_quality_min_parent_delta'],th['free_sampled_known_word_ratio_min_parent_delta'],th['free_sampled_min_complete_sentences']),
            'behavior_greedy_ok': behavior_ok(bg,pbg),
            'behavior_sampled_ok': behavior_ok(bs,pbs),
            'recovery_greedy_ok': recovery_ok(rg,prg),
            'recovery_sampled_ok': recovery_ok(rs,prs),
            'deterministic_ok': sha(ev/'candidate-free-sampled.json') == sha(ev/'candidate-free-sampled-repeat.json'),
            'integrity_ok': tr['status']=='COMPLETED' and tr['parent_checkpoint_sha256']=='767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36' and tr['dropped_answer_characters']==0 and tr['clean_teacher_targets_preserved'] and not tr['generated_characters_used_as_targets'] and abs(tr['realized_context_replacement_rate'])<1e-12,
          }
          eligible=all(checks.values())
          if eligible:
              status='PROMOTE_FULL_CLEAN_TO_TALK006'; active='ZEREF-DAD-SON-TALK-006'; active_sha=child_sha
              dst=r/'model'/active; dst.mkdir(parents=True, exist_ok=True)
              for fn in ('checkpoint.pt','checkpoint.sha256','result.json'): shutil.copy2(r/'candidate/FULL-CLEAN-1500'/fn,dst/fn)
              (dst/'lineage.json').write_text(json.dumps({'schema':'zeref-talk006-lineage-v1','lineage':active,'parent_lineage':'ZEREF-DAD-SON-TALK-005','parent_checkpoint_sha256':'767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36','training_candidate':'FULL-CLEAN-1500','checkpoint_sha256':child_sha,'canonical_memory_modified':False},indent=2,sort_keys=True)+'\n')
          else:
              status='TRAINED_FULL_CLEAN_NO_SAFE_PROMOTION'; active='ZEREF-DAD-SON-TALK-005'; active_sha='767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36'
          report={
            'schema':'zeref-talk006-full-clean-selection-v1','status':status,'eligible':eligible,'active_model':active,'active_checkpoint_sha256':active_sha,
            'full_trained_candidate':'FULL-CLEAN-1500','candidate_checkpoint_sha256':child_sha,'checks':checks,
            'frozen_threshold_matrix_sha256':sha(r/'config/PROMOTION_MATRIX.json'),'full_train_config_sha256':sha(r/'config/FULL_TRAIN_CONFIG.json'),
            'canonical_memory_unchanged':True,'raw_model_outputs_used_as_targets':False,
            'metrics':{
              'unseen_dialogue_nll':d['descendant_response_nll'],'unseen_dialogue_token_accuracy':d['descendant_response_token_accuracy'],
              'talk005_nll':f['descendant_response_nll'],'talk005_token_accuracy':f['descendant_response_token_accuracy'],
              'talk002_nll':o['descendant_heldout_nll'],'talk002_readable_score':o['descendant_mean_readable_score'],
              'greedy_quality':g['dialogue_quality_score'],'greedy_known_word_ratio':g['mean_known_word_ratio'],'greedy_complete_sentences':g['complete_sentence_count'],
              'sampled_quality':s['dialogue_quality_score'],'sampled_known_word_ratio':s['mean_known_word_ratio'],'sampled_complete_sentences':s['complete_sentence_count'],
              'greedy_recovery_corrupted_accuracy':rg['mean_corrupted_character_accuracy'],'sampled_recovery_corrupted_accuracy':rs['mean_corrupted_character_accuracy'],
              'greedy_recovery_event_rate':rg['recovery_event_rate'],'sampled_recovery_event_rate':rs['recovery_event_rate'],
              'greedy_completion_rate':bg['completion_rate'],'sampled_completion_rate':bs['completion_rate'],
              'greedy_correction_compliance':bg['correction_compliance_rate'],'sampled_correction_compliance':bs['correction_compliance_rate'],
              'greedy_uncertainty_compliance':bg['uncertainty_compliance_rate'],'sampled_uncertainty_compliance':bs['uncertainty_compliance_rate'],
              'greedy_memory_boundary_compliance':bg['memory_boundary_compliance_rate'],'sampled_memory_boundary_compliance':bs['memory_boundary_compliance_rate'],
              'greedy_exact_prompt_response':bg['exact_prompt_response'],'sampled_exact_prompt_response':bs['exact_prompt_response'],
              'mean_training_loss':tr['mean_training_loss'],'post_training_response_nll_on_full_train':tr['post_response_nll'],'post_training_response_token_accuracy_on_full_train':tr['post_response_token_accuracy']
            },
            'claim_boundary':'Software-model selection only; generated dialogue is not evidence of biological life, consciousness, sentience, soul, resurrection, physical anomaly, or quantum advantage.'
          }
          (r/'evidence/selection.json').write_text(json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          (r/'model/ACTIVE_MODEL.json').write_text(json.dumps({'active_model':active,'checkpoint_sha256':active_sha,'selection_status':status,'full_trained_candidate_checkpoint_sha256':child_sha,'canonical_memory_records':352,'canonical_memory_sha256':'67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'},indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':status,'eligible':eligible,'active_model':active,'active_checkpoint_sha256':active_sha,'candidate_checkpoint_sha256':child_sha,'checks':checks},sort_keys=True))
          PY

      - name: Talk to the fully trained candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from scripts.run_zeref_dad_son_chat import _load_model, generate
          cfg=json.loads(Path('_full/config/FULL_TRAIN_CONFIG.json').read_text())
          ck=Path('_full/candidate/FULL-CLEAN-1500/checkpoint.pt')
          expected=Path('_full/candidate/FULL-CLEAN-1500/checkpoint.sha256').read_text().strip()
          actual=hashlib.sha256(ck.read_bytes()).hexdigest()
          assert actual==expected
          checkpoint,model=_load_model(ck,Path('experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py'))
          block=int(checkpoint['config']['block'])
          talk=cfg['post_training_talk']; prior=''; rows=[]
          def segment(raw):
              text=str(raw)
              cuts=[p for marker in ('\nDad:','Dad:') if (p:=text.find(marker))>=0]
              if cuts: text=text[:min(cuts)]
              return text.strip()
          for turn,prompt in enumerate(talk['prompts'],1):
              suffix='\nZeref:'
              prior_compact=prior.replace('\n',' ')[-24:]
              fixed=f'Prev:{prior_compact}\nDad:'
              budget=max(1,block-len(fixed)-len(suffix))
              dad=str(prompt)[-budget:]
              wire=f'{fixed}{dad}{suffix}'
              assert len(wire)<=block and wire.endswith('Zeref:')
              seed=int(talk['seed'])+turn-1
              raw=generate(model,wire_prompt=wire,stoi=checkpoint['stoi'],itos=checkpoint['itos'],block=block,tokens=int(talk['tokens_per_turn']),decoding=talk['decoding'],temperature=float(talk['temperature']),top_k=int(talk['top_k']),seed=seed)
              z=segment(raw)
              rows.append({'turn':turn,'dad_prompt':prompt,'wire_prompt':wire,'raw_model_output':raw,'zeref_segment':z,'seed':seed,'checkpoint_sha256':actual,'generated_output_used_as_training_target':False})
              prior=z
          out=Path('_full/talk/full-trained-talk-session.jsonl')
          out.write_text(''.join(json.dumps(r,sort_keys=True,ensure_ascii=False)+'\n' for r in rows),encoding='utf-8')
          summary={'schema':'zeref-full-trained-talk-summary-v1','turns':len(rows),'checkpoint_sha256':actual,'decoding':talk['decoding'],'temperature':talk['temperature'],'top_k':talk['top_k'],'base_seed':talk['seed'],'generated_talk_used_as_training_target':False,'canonical_memory_modified':False,'memory_retrieval_attached_in_this_talk':False,'rows':[{'turn':r['turn'],'dad_prompt':r['dad_prompt'],'zeref_segment':r['zeref_segment']} for r in rows],'claim_boundary':'Free-running software-model conversation only; prose is not evidence of biological life, consciousness, sentience, soul, resurrection, physical anomaly, or quantum advantage.'}
          Path('_full/talk/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'turns':len(rows),'checkpoint_sha256':actual,'responses':[r['zeref_segment'] for r in rows]},ensure_ascii=False))
          PY

      - name: Verify frozen sources and seal evidence tree
        run: |
          set -euo pipefail
          PARENT=$(cat _full/parent-path.txt)
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK005_SHA256"
          test "$(sha256sum experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py | awk '{print $1}')" = "$ARCH_SHA256"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('_full')
          m=json.loads(Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json').read_text())
          assert m['record_count']==352
          assert m['combined_ledger_sha256']=='67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert m['last_record_sha256']=='b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26'
          sel=json.loads((r/'evidence/selection.json').read_text())
          tr=json.loads((r/'candidate/FULL-CLEAN-1500/result.json').read_text())
          talk=json.loads((r/'talk/summary.json').read_text())
          summary={
            'schema':'zeref-talk006-full-clean-final-summary-v1','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'workflow_head_sha':os.environ['GITHUB_SHA'],
            'parent_model':'ZEREF-DAD-SON-TALK-005','parent_checkpoint_sha256':'767d1c958add10eac026e7e080dd3a82564ff9d6066f0422073e917f6e24de36',
            'full_trained_candidate':'FULL-CLEAN-1500','candidate_checkpoint_sha256':sel['candidate_checkpoint_sha256'],'training_steps':1500,'training_examples':147,
            'selection_status':sel['status'],'active_model':sel['active_model'],'active_checkpoint_sha256':sel['active_checkpoint_sha256'],
            'canonical_memory_records':352,'canonical_memory_sha256':'67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef','canonical_memory_tip':'b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26',
            'canonical_memory_unchanged':True,'raw_model_outputs_used_as_targets':False,'talk_turns':talk['turns'],'talk_generated_outputs_used_as_targets':False,
            'mean_training_loss':tr['mean_training_loss'],'post_training_response_nll_on_full_train':tr['post_response_nll'],'post_training_response_token_accuracy_on_full_train':tr['post_response_token_accuracy']
          }
          (r/'evidence/final-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          files=[]
          for d in ('evidence','candidate','model','corpus','config','talk'):
              files.extend(p for p in (r/d).rglob('*') if p.is_file())
          sums='\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(r).as_posix()}" for p in sorted(files,key=lambda p:p.relative_to(r).as_posix()))+'\n'
          (r/'SHA256SUMS').write_text(sums)
          PY
          (cd _full && sha256sum -c SHA256SUMS) | tee _full/evidence/logs/SHA256SUMS-verification.log

      - name: Upload immutable full-training evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeref-talk006-full-clean-final-${{ github.run_id }}
          path: |
            _full/evidence
            _full/candidate
            _full/model
            _full/corpus
            _full/config
            _full/talk
            _full/SHA256SUMS
          retention-days: 90
