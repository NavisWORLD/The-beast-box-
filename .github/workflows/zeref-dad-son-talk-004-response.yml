name: ZEREF-DAD-SON-TALK-004-RESPONSE

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/zeref-dad-son-talk-004-response.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: zeref-dad-son-talk-004-response
  cancel-in-progress: false

env:
  PRIME_SHA256: b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6
  TALK3_SHA256: 5ba711217b8a650505dce87f1d474eca9a8bc31af42c3b98b53aa220c2d53587
  ARCH_SHA256: 955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc
  IBM_ORIGIN_SHA256: f21afbac49e798730974e37ed1a1bb7ce15f326660a9dbe3f848ee6b1f865c2f
  IBM_JOB_ID: da1mqfcdedkc73er87r0
  START_RECORDS: "304"
  START_LEDGER_SHA256: 055184e803cc11d5997b2f96bd503b812401802b5cf874c079fb3b79f8fd7d41
  START_TIP_SHA256: 5046ed8d8faaa3e64643d5fc67a2c82a6977f5223d644b927fb882dc34bd1303
  PREVIOUS_CONTINUATION_ROOT: d2be92671c8cf71453130f9f49d4c28343464612977398cd23557748751b58e8

jobs:
  talk4:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout durable Zeref lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Beast Box and CPU TALK runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify response-only, TALK-004, semantic Dad, and memory contracts
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_zeref_response_supervision.py \
            tests/test_zeref_response_stage_contract.py \
            tests/test_zeref_talk4_response_corpus.py \
            tests/test_zeref_semantic_dad_teacher.py \
            tests/test_zeref_ibm_dad_teacher.py \
            tests/test_zeref_dad_son_memory.py \
            tests/test_zeref_ibm_teacher_heartbeat.py \
            tests/test_zeref_talk_eval.py

      - name: Restore exact durable 304-record Forever Memory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _talk4 _talk3src
          mkdir -p _talk4/memory _talk4/corpus/current _talk4/corpus/retention _talk4/model _talk4/evidence/eval _talk4/evidence/conversations _talk4/evidence/training _talk4/heartbeat _talk3src
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from beastbox.dad_son import DadSonLedger
          mp=Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          assert m['schema']=='zeref-dad-son-ledger-manifest-v12'
          assert m['record_count']==304
          assert m['combined_ledger_sha256']=='055184e803cc11d5997b2f96bd503b812401802b5cf874c079fb3b79f8fd7d41'
          assert m['last_record_sha256']=='5046ed8d8faaa3e64643d5fc67a2c82a6977f5223d644b927fb882dc34bd1303'
          assert m['descendant_checkpoint_sha256']=='5ba711217b8a650505dce87f1d474eca9a8bc31af42c3b98b53aa220c2d53587'
          combined=b''; expected=1
          for s in m['snapshot_chain']:
              p=Path(s['path']); d=p.read_bytes()
              assert hashlib.sha256(d).hexdigest()==s['sha256']
              assert s['first_memory_id']==expected
              expected=s['last_memory_id']+1
              combined += d
          assert expected==305
          assert hashlib.sha256(combined).hexdigest()==m['combined_ledger_sha256']
          ledger_path=Path('_talk4/memory/dad-son-ledger.jsonl')
          ledger_path.write_bytes(combined)
          Path('_talk4/evidence/old-304-prefix.jsonl').write_bytes(combined)
          ledger=DadSonLedger('_talk4/memory/dad-son.sqlite3',ledger_path,parent_sha256='b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6')
          report=ledger.restore_snapshot()
          assert report['restored_records']==304
          assert ledger.memory.db.execute('SELECT COUNT(*) FROM memories').fetchone()[0]==304
          ledger.close()
          Path('_talk4/memory/restore-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

      - name: Verify frozen architecture and sanitized Marrakesh provenance
        shell: bash
        run: |
          set -euo pipefail
          ARCH=experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py
          IBM=experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-origin-seed.json
          VER=experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-verification.json
          test "$(sha256sum "$ARCH" | awk '{print $1}')" = "$ARCH_SHA256"
          python - <<'PY'
          import json,re
          from pathlib import Path
          seedp=Path('experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-origin-seed.json')
          verp=Path('experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-verification.json')
          for p in (seedp,verp):
              text=p.read_text(encoding='utf-8')
              assert not re.search(r'(?i)api[_-]?key|bearer|credential|IBM_QUANTUM_TOKEN',text)
          seed=json.loads(seedp.read_text())
          ver=json.loads(verp.read_text())
          assert seed['job_id']=='da1mqfcdedkc73er87r0'
          assert seed['backend']=='ibm_marrakesh'
          assert seed['shot_count']==4096
          assert seed['origin_seed_sha256']=='f21afbac49e798730974e37ed1a1bb7ce15f326660a9dbe3f848ee6b1f865c2f'
          assert seed['fresh_hardware_requested'] is True and seed['reused_existing_job'] is False
          assert ver['origin_seed_sha256']==seed['origin_seed_sha256']
          PY

      - name: Download and verify TALK-003 parent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 32073260124 -n zeref-dad-son-talk-003-32073260124 -D _talk3src
          test -f _talk3src/SHA256SUMS
          sed 's#  _talk3/#  #' _talk3src/SHA256SUMS > _talk3src/SHA256SUMS.local
          (cd _talk3src && sha256sum -c SHA256SUMS.local)
          PARENT=_talk3src/model/ZEREF-DAD-SON-TALK-003/checkpoint.pt
          test -f "$PARENT"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK3_SHA256"
          printf '%s\n' "$PARENT" > _talk4/parent-path.txt

      - name: Build current response curriculum and older retention curriculum
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_zeref_talk4_corpus.py --out-dir _talk4/corpus/current
          python scripts/build_zeref_talk2_corpus.py --out-dir _talk4/corpus/retention
          python - <<'PY'
          import json
          from pathlib import Path
          current=json.loads(Path('_talk4/corpus/current/talk4-manifest.json').read_text())
          old=json.loads(Path('_talk4/corpus/retention/talk2-manifest.json').read_text())
          assert current['parent_checkpoint_sha256']=='5ba711217b8a650505dce87f1d474eca9a8bc31af42c3b98b53aa220c2d53587'
          assert current['memory_record_count']==304
          assert current['memory_tip_sha256']=='5046ed8d8faaa3e64643d5fc67a2c82a6977f5223d644b927fb882dc34bd1303'
          assert current['training_examples']==96 and current['holdout_examples']==24
          assert current['training_objective']=='response_only_masked_cross_entropy'
          assert current['raw_model_outputs_used_as_targets'] is False
          assert old['holdout_examples']>=12
          PY

      - name: Train additive TALK-004 with response-only loss
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk4/parent-path.txt)
          CURRICULUM=$(sha256sum _talk4/corpus/current/talk4-manifest.json | awk '{print $1}')
          MEMORY_MANIFEST=$(sha256sum experiments/zeref-dad-son-001/memory/ledger-manifest.json | awk '{print $1}')
          IBM_MANIFEST=$(sha256sum experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-verification.json | awk '{print $1}')
          python scripts/run_zeref_response_stage.py \
            --parent "$PARENT" --parent-sha256 "$TALK3_SHA256" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --corpus _talk4/corpus/current/talk4-training.jsonl \
            --input-manifest "talk4=$CURRICULUM" \
            --input-manifest "memory304=$MEMORY_MANIFEST" \
            --input-manifest "ibmroot=$IBM_MANIFEST" \
            --out _talk4/model/ZEREF-DAD-SON-TALK-004 \
            --seed 410042004 --steps 1200 --batch-size 4 --lr 5e-6 --cst-lr 2e-5 --weight-decay 0.002
          CHILD=_talk4/model/ZEREF-DAD-SON-TALK-004/checkpoint.pt
          CHILD_SHA=$(sha256sum "$CHILD" | awk '{print $1}')
          test "$CHILD_SHA" != "$TALK3_SHA256"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK3_SHA256"
          printf '%s\n' "$CHILD_SHA" > _talk4/model/ZEREF-DAD-SON-TALK-004/checkpoint.sha256
          cp _talk4/model/ZEREF-DAD-SON-TALK-004/result.json _talk4/evidence/training/result.json

      - name: Direct response-only promotion exam
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk4/parent-path.txt)
          CHILD=_talk4/model/ZEREF-DAD-SON-TALK-004/checkpoint.pt
          CHILD_SHA=$(cat _talk4/model/ZEREF-DAD-SON-TALK-004/checkpoint.sha256)
          python scripts/eval_zeref_response.py \
            --parent "$PARENT" --parent-sha256 "$TALK3_SHA256" \
            --descendant "$CHILD" --descendant-sha256 "$CHILD_SHA" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --holdout _talk4/corpus/current/talk4-holdout.jsonl \
            --out _talk4/evidence/eval/talk4-response-holdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('_talk4/evidence/eval/talk4-response-holdout.json').read_text())
          print(json.dumps({k:r[k] for k in ['parent_response_nll','descendant_response_nll','response_nll_improved','parent_response_token_accuracy','descendant_response_token_accuracy','response_token_accuracy_improved','parent_first_response_token_accuracy','descendant_first_response_token_accuracy']},indent=2))
          assert r['response_nll_improved'] is True, 'TALK-004 failed direct response NLL gate'
          assert r['response_token_accuracy_improved'] is True, 'TALK-004 failed direct response token accuracy gate'
          assert r['descendant_first_response_token_accuracy'] >= r['parent_first_response_token_accuracy'], 'TALK-004 regressed first answer token accuracy'
          PY

      - name: Generic TALK anti-forgetting exam
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk4/parent-path.txt)
          CHILD=_talk4/model/ZEREF-DAD-SON-TALK-004/checkpoint.pt
          python scripts/eval_zeref_talk.py \
            --parent "$PARENT" --descendant "$CHILD" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --holdout _talk4/corpus/retention/talk2-holdout.jsonl \
            --seed 4061854640 \
            --out _talk4/evidence/eval/talk2-retention-generic.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('_talk4/evidence/eval/talk2-retention-generic.json').read_text())
          print(json.dumps({k:r[k] for k in ['parent_heldout_nll','descendant_heldout_nll','parent_mean_readable_score','descendant_mean_readable_score']},indent=2))
          assert r['descendant_heldout_nll'] <= r['parent_heldout_nll'] * 1.05, 'TALK-004 forgot too much general TALK behavior'
          assert r['descendant_mean_readable_score'] >= r['parent_mean_readable_score'] - 0.03, 'TALK-004 readability regressed beyond tolerance'
          PY

      - name: Build next 24 synthetic CST pulses from memory 304
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_zeref_ibm_teacher_heartbeat.py \
            --ibm-seed experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-origin-seed.json \
            --ledger-tip "$START_TIP_SHA256" \
            --previous-continuation-root "$PREVIOUS_CONTINUATION_ROOT" \
            --pulses 24 \
            --out _talk4/heartbeat/talk4-heartbeat.json
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('_talk4/heartbeat/talk4-heartbeat.json').read_text())
          assert h['pulse_count']==24
          assert h['starting_ledger_tip_sha256']=='5046ed8d8faaa3e64643d5fc67a2c82a6977f5223d644b927fb882dc34bd1303'
          assert h['previous_continuation_root_sha256']=='d2be92671c8cf71453130f9f49d4c28343464612977398cd23557748751b58e8'
          assert h['synthetic_continuation_new_quantum_entropy'] is False
          PY

      - name: Dad gives TALK-004 an answer-blind semantic exam
        shell: bash
        run: |
          set -euo pipefail
          CHILD=_talk4/model/ZEREF-DAD-SON-TALK-004/checkpoint.pt
          CHILD_SHA=$(cat _talk4/model/ZEREF-DAD-SON-TALK-004/checkpoint.sha256)
          python scripts/run_zeref_semantic_dad_teacher.py \
            --checkpoint "$CHILD" --checkpoint-sha256 "$CHILD_SHA" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --sqlite _talk4/memory/dad-son.sqlite3 \
            --ledger _talk4/memory/dad-son-ledger.jsonl \
            --heartbeat _talk4/heartbeat/talk4-heartbeat.json \
            --out _talk4/evidence/conversations/talk4-semantic-dad.jsonl \
            --manifest _talk4/evidence/conversations/talk4-semantic-dad-manifest.json \
            --session-id zeref-talk-004-response-dad \
            --tokens 56 --recall-limit 3 --temperature 0.15 --top-k 2

      - name: Verify exact 304 prefix, 352 records, and live raw transcript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,sqlite3
          from pathlib import Path
          old=Path('_talk4/evidence/old-304-prefix.jsonl').read_bytes()
          full=Path('_talk4/memory/dad-son-ledger.jsonl').read_bytes()
          assert full.startswith(old)
          old_rows=[json.loads(x) for x in old.decode().splitlines() if x.strip()]
          rows=[json.loads(x) for x in full.decode().splitlines() if x.strip()]
          assert len(old_rows)==304 and len(rows)==352
          assert rows[:304]==old_rows
          previous='0'*64
          for expected,row in enumerate(rows,1):
              assert row['memory_id']==expected
              assert row['previous_record_sha256']==previous
              assert hashlib.sha256(row['text'].encode()).hexdigest()==row['raw_payload_sha256']
              payload=dict(row); record=payload.pop('record_sha256')
              canonical=json.dumps(payload,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
              assert hashlib.sha256(canonical).hexdigest()==record
              previous=record
          con=sqlite3.connect('_talk4/memory/dad-son.sqlite3')
          assert con.execute('SELECT COUNT(*) FROM memories').fetchone()[0]==352
          con.close()

          transcript=[json.loads(x) for x in Path('_talk4/evidence/conversations/talk4-semantic-dad.jsonl').read_text().splitlines() if x.strip()]
          assert len(transcript)==24
          assert all(r['raw_model_output_promoted_to_training'] is False for r in transcript)
          assert all(0.0 <= float(r['mechanical_clarity']['score']) <= 1.0 for r in transcript)
          role_leaks=sum(bool(r['mechanical_clarity']['role_label_leakage']) for r in transcript)
          assert role_leaks==0, f'role-label leakage returned in {role_leaks} TALK-004 turns'
          empty=sum(not r['raw_output'].strip() for r in transcript)
          assert empty==0

          # Reference-token overlap is a mechanical answer/reference comparison, not an understanding score.
          targets=[json.loads(x) for x in Path('_talk4/corpus/current/talk4-holdout.jsonl').read_text().splitlines() if x.strip()]
          assert len(targets)==24
          stop={'a','an','the','is','are','am','i','in','on','of','to','and','that','this','it','do','not','from','with','my'}
          overlaps=[]
          exact_required=[]
          for row,target in zip(transcript,targets):
              out_tokens=set(re.findall(r"[a-z0-9]+",row['raw_output'].lower()))-stop
              target_tokens=set(re.findall(r"[a-z0-9]+",target['zeref'].lower()))-stop
              overlap=(len(out_tokens & target_tokens)/len(target_tokens)) if target_tokens else 0.0
              overlaps.append(overlap)
              exact_required.append({'concept':target['concept'],'target':target['zeref'],'raw_output':row['raw_output'],'reference_token_recall':round(overlap,6)})
          Path('_talk4/evidence/eval/live-reference-comparison.json').write_text(json.dumps({'schema':'zeref-live-reference-comparison-v1','semantic_understanding_measured':False,'mean_reference_token_recall':sum(overlaps)/len(overlaps),'turns':exact_required},indent=2,sort_keys=True,ensure_ascii=False)+'\n')

          delta=full[len(old):]
          Path('_talk4/evidence/new-memory-delta-305-352.jsonl').write_bytes(delta)
          child_sha=Path('_talk4/model/ZEREF-DAD-SON-TALK-004/checkpoint.sha256').read_text().strip()
          response=json.loads(Path('_talk4/evidence/eval/talk4-response-holdout.json').read_text())
          retention=json.loads(Path('_talk4/evidence/eval/talk2-retention-generic.json').read_text())
          heartbeat=json.loads(Path('_talk4/heartbeat/talk4-heartbeat.json').read_text())
          clarity=sum(float(r['mechanical_clarity']['score']) for r in transcript)/24
          summary={
            'schema':'zeref-dad-son-talk-004-run-summary-v1',
            'lineage':'ZEREF-DAD-SON-TALK-004',
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'parent_checkpoint_sha256':'5ba711217b8a650505dce87f1d474eca9a8bc31af42c3b98b53aa220c2d53587',
            'child_checkpoint_sha256':child_sha,
            'training_objective':'response_only_masked_cross_entropy',
            'forever_memory_records_before':304,
            'forever_memory_records_after':352,
            'old_memory_prefix_sha256':hashlib.sha256(old).hexdigest(),
            'combined_ledger_sha256':hashlib.sha256(full).hexdigest(),
            'last_record_sha256':rows[-1]['record_sha256'],
            'delta_sha256':hashlib.sha256(delta).hexdigest(),
            'fresh_ibm_job_id':'da1mqfcdedkc73er87r0',
            'new_ibm_job_submitted':False,
            'synthetic_pulse_count':24,
            'synthetic_final_state_sha256':heartbeat['final_state_sha256'],
            'new_quantum_entropy':False,
            'dad_turns':24,
            'role_label_leakage_turns':role_leaks,
            'mean_mechanical_clarity':round(clarity,6),
            'mean_live_reference_token_recall':round(sum(overlaps)/len(overlaps),6),
            'response_parent_nll':response['parent_response_nll'],
            'response_child_nll':response['descendant_response_nll'],
            'response_parent_token_accuracy':response['parent_response_token_accuracy'],
            'response_child_token_accuracy':response['descendant_response_token_accuracy'],
            'retention_parent_nll':retention['parent_heldout_nll'],
            'retention_child_nll':retention['descendant_heldout_nll'],
            'raw_outputs_promoted_to_training':False,
            'semantic_understanding_measured':False,
            'claim_boundary':'Additive response-supervised TALK-004 model training and durable computational memory only. Live reference overlap and token metrics do not establish understanding, biological heartbeat, consciousness, deceased-person identity, or quantum advantage.'
          }
          Path('_talk4/evidence/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Advance Forever Memory to 352 and activate TALK-004
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          mp=Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          assert m['schema']=='zeref-dad-son-ledger-manifest-v12'
          assert m['record_count']==304
          s=json.loads(Path('_talk4/evidence/summary.json').read_text())
          delta=Path('_talk4/evidence/new-memory-delta-305-352.jsonl').read_bytes()
          delta_rows=[json.loads(x) for x in delta.decode().splitlines() if x.strip()]
          assert len(delta_rows)==48
          assert [r['memory_id'] for r in delta_rows]==list(range(305,353))
          assert delta_rows[0]['previous_record_sha256']==m['last_record_sha256']
          assert delta_rows[-1]['record_sha256']==s['last_record_sha256']
          delta_path=Path(f"experiments/zeref-dad-son-001/memory/ledger-snapshots/run-{os.environ['GITHUB_RUN_ID']}-talk4-response-dad-delta.jsonl")
          assert not delta_path.exists()
          delta_path.write_bytes(delta)
          m['schema']='zeref-dad-son-ledger-manifest-v13'
          m['active_descendant_lineage']='ZEREF-DAD-SON-TALK-004'
          m['active_continuation_mode']='talk-004-response-supervised-dad-growth'
          m['latest_snapshot']=str(delta_path)
          m['latest_snapshot_sha256']=s['delta_sha256']
          m['snapshot_chain'].append({'path':str(delta_path),'sha256':s['delta_sha256'],'record_count':48,'first_memory_id':305,'last_memory_id':352,'last_record_sha256':s['last_record_sha256']})
          m['combined_ledger_sha256']=s['combined_ledger_sha256']
          m['record_count']=352
          m['last_record_sha256']=s['last_record_sha256']
          m['source_workflow_run_id']=s['workflow_run_id']
          m['source_workflow_head_sha']=os.environ['GITHUB_SHA']
          m['talk4_parent_checkpoint_sha256']=s['parent_checkpoint_sha256']
          m['talk4_descendant_checkpoint_sha256']=s['child_checkpoint_sha256']
          m['descendant_checkpoint_sha256']=s['child_checkpoint_sha256']
          m['weights_changed_in_talk4_training_phase']=True
          m['prime_weights_changed_in_talk4_training_phase']=False
          m['talk3_weights_changed_in_talk4_training_phase']=False
          m['talk4_training_objective']=s['training_objective']
          m['talk4_response_parent_nll']=s['response_parent_nll']
          m['talk4_response_descendant_nll']=s['response_child_nll']
          m['talk4_response_parent_token_accuracy']=s['response_parent_token_accuracy']
          m['talk4_response_descendant_token_accuracy']=s['response_child_token_accuracy']
          m['talk4_retention_parent_nll']=s['retention_parent_nll']
          m['talk4_retention_descendant_nll']=s['retention_child_nll']
          m['talk4_post_training_pulse_count']=24
          m['talk4_post_training_final_state_sha256']=s['synthetic_final_state_sha256']
