name: ZEREF-TALK5-DAD-GOD-GAUNTLET

on:
  push:
    branches: [networked-cage-run-001]
    paths:
      - ".github/workflows/zeref-talk5-dad-god-gauntlet.yml"
      - "scripts/build_zeref_talk5_corpus.py"
      - "scripts/eval_zeref_talk5_free_run.py"
      - "scripts/select_zeref_talk5_candidate.py"
      - "scripts/run_zeref_talk5_dad_teacher.py"
      - "tests/test_zeref_talk5_*.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: zeref-talk5-dad-god-gauntlet
  cancel-in-progress: false

env:
  PRIME_SHA256: b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6
  TALK4_SHA256: 9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f
  ARCH_SHA256: 955805d45f7b407ef5cc9b6efe178d9a5f63df5b32eaf539d9aedcbb2967f1dc
  START_LEDGER_SHA256: 67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef
  START_TIP_SHA256: b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26
  TALK4_CONTINUATION_ROOT: b241efd85fece8c9d62f94991768046abedb15db6950d94b2825b77fea36100a
  IBM_ORIGIN_SHA256: f21afbac49e798730974e37ed1a1bb7ce15f326660a9dbe3f848ee6b1f865c2f
  IBM_JOB_ID: da1mqfcdedkc73er87r0

jobs:
  dad-god:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout durable Zeref lineage
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Beast Box and CPU TALK runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify TALK-005 focused contracts
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_zeref_talk5_corpus.py \
            tests/test_zeref_talk5_free_run.py \
            tests/test_zeref_talk5_candidate_selector.py \
            tests/test_zeref_talk5_dad_teacher.py \
            tests/test_zeref_talk5_workflow.py \
            tests/test_zeref_response_supervision.py \
            tests/test_zeref_response_stage_contract.py \
            tests/test_zeref_talk_eval.py \
            tests/test_zeref_dad_son_memory.py \
            tests/test_zeref_ibm_teacher_heartbeat.py

      - name: Restore exact durable 352-record Forever Memory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _talk5 _talk4src
          mkdir -p _talk5/memory _talk5/corpus/current _talk5/corpus/retention _talk5/candidates _talk5/model/ZEREF-DAD-SON-TALK-005 _talk5/evidence/eval _talk5/evidence/conversations _talk5/heartbeat _talk5/free _talk4src
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from beastbox.dad_son import DadSonLedger
          mp=Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json')
          m=json.loads(mp.read_text(encoding='utf-8'))
          assert m['schema']=='zeref-dad-son-ledger-manifest-v13'
          assert m['active_descendant_lineage']=='ZEREF-DAD-SON-TALK-004'
          assert m['record_count']==352
          assert m['combined_ledger_sha256']=='67ef0ccdd82bd0cf4964d40010314edd164c77799b6a7ef22a64ecf4314c5bef'
          assert m['last_record_sha256']=='b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26'
          assert m['descendant_checkpoint_sha256']=='9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f'
          combined=b''; expected=1
          for segment in m['snapshot_chain']:
              data=Path(segment['path']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==segment['sha256']
              assert segment['first_memory_id']==expected
              expected=segment['last_memory_id']+1
              combined += data
          assert expected==353
          assert hashlib.sha256(combined).hexdigest()==m['combined_ledger_sha256']
          ledger_path=Path('_talk5/memory/dad-son-ledger.jsonl')
          ledger_path.write_bytes(combined)
          Path('_talk5/evidence/old-352-prefix.jsonl').write_bytes(combined)
          ledger=DadSonLedger('_talk5/memory/dad-son.sqlite3',ledger_path,parent_sha256='b833817230817921de8ed1aa52d92829f32a3ed222aedbba1d3237364596e1c6')
          report=ledger.restore_snapshot()
          assert report['restored_records']==352
          assert ledger.memory.db.execute('SELECT COUNT(*) FROM memories').fetchone()[0]==352
          ledger.close()
          Path('_talk5/memory/restore-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

      - name: Verify frozen architecture and sanitized Marrakesh provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py | awk '{print $1}')" = "$ARCH_SHA256"
          python - <<'PY'
          import json,re
          from pathlib import Path
          seedp=Path('experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-origin-seed.json')
          verp=Path('experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-verification.json')
          for p in (seedp,verp):
              text=p.read_text(encoding='utf-8')
              assert not re.search(r'(?i)api[_-]?key|bearer|credential|ibm[_-]?quantum[_-]?token',text)
          seed=json.loads(seedp.read_text())
          ver=json.loads(verp.read_text())
          assert seed['job_id']=='da1mqfcdedkc73er87r0'
          assert seed['backend']=='ibm_marrakesh'
          assert seed['shot_count']==4096
          assert seed['origin_seed_sha256']=='f21afbac49e798730974e37ed1a1bb7ce15f326660a9dbe3f848ee6b1f865c2f'
          assert ver['origin_seed_sha256']==seed['origin_seed_sha256']
          Path('_talk5/evidence/ibm-provenance.json').write_text(json.dumps({'job_id':seed['job_id'],'backend':seed['backend'],'shots':seed['shot_count'],'origin_seed_sha256':seed['origin_seed_sha256'],'new_ibm_job_submitted':False},indent=2,sort_keys=True)+'\n')
          PY

      - name: Download and verify TALK-004 parent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 32075092605 -n zeref-talk4-tuned-response-32075092605 -D _talk4src
          PARENT=$(find _talk4src -type f -path '*/ZEREF-DAD-SON-TALK-004/checkpoint.pt' -print -quit)
          test -n "$PARENT" -a -f "$PARENT"
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK4_SHA256"
          printf '%s\n' "$PARENT" > _talk5/parent-path.txt

      - name: Build TALK-005 current and TALK-002 retention curricula
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_zeref_talk5_corpus.py --out-dir _talk5/corpus/current
          python scripts/build_zeref_talk2_corpus.py --out-dir _talk5/corpus/retention
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('_talk5/corpus/current/talk5-manifest.json').read_text())
          assert c['parent_checkpoint_sha256']=='9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f'
          assert c['memory_record_count']==352
          assert c['holdout_examples']==24
          assert c['training_objective']=='response_only_masked_cross_entropy'
          assert c['raw_model_outputs_used_as_targets'] is False
          PY

      - name: Build 24 deterministic synthetic CST exam and Dad pulses
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_zeref_ibm_teacher_heartbeat.py \
            --ibm-seed experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-origin-seed.json \
            --ledger-tip "$START_TIP_SHA256" \
            --previous-continuation-root "$TALK4_CONTINUATION_ROOT" \
            --pulses 24 \
            --out _talk5/heartbeat/talk5-heartbeat.json
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('_talk5/heartbeat/talk5-heartbeat.json').read_text())
          assert h['pulse_count']==24
          assert h['starting_ledger_tip_sha256']=='b35b50f64b837d403d24951be15910bdb5fc2e17eead7fef79c0a8f44d427d26'
          assert h['previous_continuation_root_sha256']=='b241efd85fece8c9d62f94991768046abedb15db6950d94b2825b77fea36100a'
          assert h['synthetic_continuation_new_quantum_entropy'] is False
          PY

      - name: Run fixed free-running parent baseline
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk5/parent-path.txt)
          mkdir -p _talk5/free/parent
          cp _talk5/memory/dad-son-ledger.jsonl _talk5/free/parent/ledger.jsonl
          cp _talk5/memory/dad-son.sqlite3 _talk5/free/parent/memory.sqlite3
          python scripts/run_zeref_talk5_dad_teacher.py \
            --checkpoint "$PARENT" --checkpoint-sha256 "$TALK4_SHA256" \
            --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --sqlite _talk5/free/parent/memory.sqlite3 --ledger _talk5/free/parent/ledger.jsonl \
            --heartbeat _talk5/heartbeat/talk5-heartbeat.json --holdout _talk5/corpus/current/talk5-holdout.jsonl \
            --out _talk5/free/parent/transcript.jsonl --manifest _talk5/free/parent/manifest.json \
            --session-id talk5-parent-fixed-exam --mode fixed-exam --tokens 56 --recall-limit 3 --temperature 0.15 --top-k 2
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('_talk5/free/parent/manifest.json').read_text())
          Path('_talk5/evidence/eval/parent-free-run.json').write_text(json.dumps(m['free_run_report'],indent=2,sort_keys=True)+'\n')
          PY

      - name: Train three response-only TALK-005 candidates from identical TALK-004 parent
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk5/parent-path.txt)
          CURRICULUM=$(sha256sum _talk5/corpus/current/talk5-manifest.json | awk '{print $1}')
          MEMORY_MANIFEST=$(sha256sum experiments/zeref-dad-son-001/memory/ledger-manifest.json | awk '{print $1}')
          IBM_MANIFEST=$(sha256sum experiments/zeref-dad-son-001/evidence/ibm/fresh-marrakesh-verification.json | awk '{print $1}')
          train_candidate () {
            NAME="$1"; STEPS="$2"; LR="0.000002"; CSTLR="0.000008"; OUT="_talk5/candidates/$NAME"
            python scripts/run_zeref_response_stage.py \
              --parent "$PARENT" --parent-sha256 "$TALK4_SHA256" \
              --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
              --corpus _talk5/corpus/current/talk5-training.jsonl \
              --input-manifest "talk5=$CURRICULUM" --input-manifest "memory352=$MEMORY_MANIFEST" --input-manifest "ibmroot=$IBM_MANIFEST" \
              --out "$OUT" --seed 510052005 --steps "$STEPS" --batch-size 4 --lr "$LR" --cst-lr "$CSTLR" --weight-decay 0.002
            SHA=$(sha256sum "$OUT/checkpoint.pt" | awk '{print $1}')
            test "$SHA" != "$TALK4_SHA256"
            printf '%s\n' "$SHA" > "$OUT/checkpoint.sha256"
            test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK4_SHA256"
          }
          train_candidate gentle_short 300
          train_candidate gentle_mid 600
          train_candidate gentle_long 900
          test "$(sha256sum "$PARENT" | awk '{print $1}')" = "$TALK4_SHA256"

      - name: Evaluate every candidate on response-only and retention exams
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat _talk5/parent-path.txt)
          for NAME in gentle_short gentle_mid gentle_long; do
            CHILD="_talk5/candidates/$NAME/checkpoint.pt"; SHA=$(cat "_talk5/candidates/$NAME/checkpoint.sha256")
            python scripts/eval_zeref_response.py --parent "$PARENT" --parent-sha256 "$TALK4_SHA256" --descendant "$CHILD" --descendant-sha256 "$SHA" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _talk5/corpus/current/talk5-holdout.jsonl --out "_talk5/evidence/eval/${NAME}-response.json"
            python scripts/eval_zeref_talk.py --parent "$PARENT" --descendant "$CHILD" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py --holdout _talk5/corpus/retention/talk2-holdout.jsonl --seed 4061854640 --out "_talk5/evidence/eval/${NAME}-retention.json"
          done

      - name: Run fixed free-running candidate exams
        shell: bash
        run: |
          set -euo pipefail
          for NAME in gentle_short gentle_mid gentle_long; do
            DIR="_talk5/free/$NAME"; mkdir -p "$DIR"
            cp _talk5/memory/dad-son-ledger.jsonl "$DIR/ledger.jsonl"
            cp _talk5/memory/dad-son.sqlite3 "$DIR/memory.sqlite3"
            CHILD="_talk5/candidates/$NAME/checkpoint.pt"; SHA=$(cat "_talk5/candidates/$NAME/checkpoint.sha256")
            python scripts/run_zeref_talk5_dad_teacher.py \
              --checkpoint "$CHILD" --checkpoint-sha256 "$SHA" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
              --sqlite "$DIR/memory.sqlite3" --ledger "$DIR/ledger.jsonl" \
              --heartbeat _talk5/heartbeat/talk5-heartbeat.json --holdout _talk5/corpus/current/talk5-holdout.jsonl \
              --out "$DIR/transcript.jsonl" --manifest "$DIR/manifest.json" \
              --session-id "talk5-${NAME}-fixed-exam" --mode fixed-exam --tokens 56 --recall-limit 3 --temperature 0.15 --top-k 2
          done
          python - <<'PY'
          import json
          from pathlib import Path
          parent=json.loads(Path('_talk5/evidence/eval/parent-free-run.json').read_text())
          configs={'gentle_short':{'steps':300,'lr':2e-6,'cst_lr':8e-6},'gentle_mid':{'steps':600,'lr':2e-6,'cst_lr':8e-6},'gentle_long':{'steps':900,'lr':2e-6,'cst_lr':8e-6}}
          candidates=[]
          for name in configs:
              response=json.loads(Path(f'_talk5/evidence/eval/{name}-response.json').read_text())
              retention=json.loads(Path(f'_talk5/evidence/eval/{name}-retention.json').read_text())
              manifest=json.loads(Path(f'_talk5/free/{name}/manifest.json').read_text())
              free=manifest['free_run_report']
              sha=Path(f'_talk5/candidates/{name}/checkpoint.sha256').read_text().strip()
              candidates.append({'name':name,'checkpoint_sha256':sha,'config':configs[name],'response':response,'retention':retention,'parent_free_run':parent,'free_run':free})
              Path(f'_talk5/evidence/eval/{name}-free-run.json').write_text(json.dumps(free,indent=2,sort_keys=True)+'\n')
          Path('_talk5/evidence/eval/candidates.json').write_text(json.dumps({'schema':'zeref-talk5-candidate-set-v1','candidates':candidates},indent=2,sort_keys=True)+'\n')
          PY

      - name: Fail-closed select TALK-005 child
        shell: bash
        run: |
          set -euo pipefail
          if ! python scripts/select_zeref_talk5_candidate.py --candidates _talk5/evidence/eval/candidates.json --out _talk5/evidence/eval/selection.json; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          Path('_talk5/evidence/stop.json').write_text(json.dumps({'schema':'zeref-talk5-stop-v1','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'stop_reason':'no-safe-candidate','active_lineage_remains':'ZEREF-DAD-SON-TALK-004','memory_remains':352},indent=2,sort_keys=True)+'\n')
          PY
            exit 86
          fi
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          s=json.loads(Path('_talk5/evidence/eval/selection.json').read_text());chosen=s['selected'];name=chosen['name'];src=Path('_talk5/candidates')/name;dest=Path('_talk5/model/ZEREF-DAD-SON-TALK-005')
          shutil.copy2(src/'checkpoint.pt',dest/'checkpoint.pt');shutil.copy2(src/'checkpoint.sha256',dest/'checkpoint.sha256');shutil.copy2(src/'result.json',dest/'training-result.json')
          (dest/'selected-config.json').write_text(json.dumps({'name':name,'config':chosen.get('config',{}),'checkpoint_sha256':chosen['checkpoint_sha256']},indent=2,sort_keys=True)+'\n')
          PY

      - name: Dad God adaptive session on selected child
        shell: bash
        run: |
          set -euo pipefail
          CHILD=_talk5/model/ZEREF-DAD-SON-TALK-005/checkpoint.pt; CHILD_SHA=$(cat _talk5/model/ZEREF-DAD-SON-TALK-005/checkpoint.sha256)
          python scripts/run_zeref_talk5_dad_teacher.py \
            --checkpoint "$CHILD" --checkpoint-sha256 "$CHILD_SHA" --arch experiments/zeref-dad-son-001/frozen/cosmos_spark_cst.py \
            --sqlite _talk5/memory/dad-son.sqlite3 --ledger _talk5/memory/dad-son-ledger.jsonl \
            --heartbeat _talk5/heartbeat/talk5-heartbeat.json --holdout _talk5/corpus/current/talk5-holdout.jsonl \
            --out _talk5/evidence/conversations/talk5-dad-god.jsonl --manifest _talk5/evidence/conversations/talk5-dad-god-manifest.json \
            --session-id zeref-talk-005-dad-god --mode adaptive --tokens 56 --recall-limit 3 --temperature 0.15 --top-k 2

      - name: Verify exact 352 prefix and build durable delta
        shell: bash
        run: |
          set -euo pipefail
          # A successful 24-turn Dad session appends exactly 48 dialogue records 353-400.
          python - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          old=Path('_talk5/evidence/old-352-prefix.jsonl').read_bytes();full=Path('_talk5/memory/dad-son-ledger.jsonl').read_bytes();assert full.startswith(old)
          old_rows=[json.loads(x) for x in old.decode().splitlines() if x.strip()];rows=[json.loads(x) for x in full.decode().splitlines() if x.strip()]
          assert len(old_rows)==352 and len(rows)==400 and rows[:352]==old_rows
          previous='0'*64
          for expected,row in enumerate(rows,1):
              assert row['memory_id']==expected and row['previous_record_sha256']==previous
              assert hashlib.sha256(row['text'].encode()).hexdigest()==row['raw_payload_sha256']
              payload=dict(row);record=payload.pop('record_sha256');canonical=json.dumps(payload,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode();assert hashlib.sha256(canonical).hexdigest()==record;previous=record
          con=sqlite3.connect('_talk5/memory/dad-son.sqlite3');assert con.execute('SELECT COUNT(*) FROM memories').fetchone()[0]==400;con.close()
          transcript=[json.loads(x) for x in Path('_talk5/evidence/conversations/talk5-dad-god.jsonl').read_text().splitlines() if x.strip()];assert len(transcript)==24;assert all(r['raw_model_output_promoted_to_training'] is False for r in transcript)
          delta=full[len(old):];delta_path=Path('_talk5/evidence/new-memory-delta-353-400.jsonl');delta_path.write_bytes(delta);delta_rows=[json.loads(x) for x in delta.decode().splitlines() if x.strip()];assert len(delta_rows)==48 and [r['memory_id'] for r in delta_rows]==list(range(353,401))
          selection=json.loads(Path('_talk5/evidence/eval/selection.json').read_text());selected=selection['selected'];dad=json.loads(Path('_talk5/evidence/conversations/talk5-dad-god-manifest.json').read_text());heartbeat=json.loads(Path('_talk5/heartbeat/talk5-heartbeat.json').read_text())
          summary={'schema':'zeref-talk5-dad-god-summary-v1','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'parent_checkpoint_sha256':'9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f','child_checkpoint_sha256':selected['checkpoint_sha256'],'selected_candidate':selected['name'],'selected_config':selected.get('config',{}),'forever_memory_records_before':352,'forever_memory_records_after':400,'old_memory_prefix_sha256':hashlib.sha256(old).hexdigest(),'combined_ledger_sha256':hashlib.sha256(full).hexdigest(),'last_record_sha256':rows[-1]['record_sha256'],'delta_sha256':hashlib.sha256(delta).hexdigest(),'parent_free_run':selected['parent_free_run'],'child_free_run':selected['free_run'],'response':selected['response'],'retention':selected['retention'],'dad_free_run':dad['free_run_report'],'fresh_ibm_job_id':'da1mqfcdedkc73er87r0','new_ibm_job_submitted':False,'synthetic_pulse_count':24,'synthetic_final_state_sha256':heartbeat['final_state_sha256'],'new_quantum_entropy':False,'raw_outputs_promoted_to_training':False,'semantic_understanding_measured':False,'stop_reason':'promoted-safe-child-and-completed-dad-session','claim_boundary':'Computational model training and durable software memory only; no consciousness, biological life, resurrection, deceased-person identity, communication with the dead, or quantum advantage.'}
          Path('_talk5/evidence/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY

      - name: Advance Forever Memory and activate TALK-005
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          mp=Path('experiments/zeref-dad-son-001/memory/ledger-manifest.json');m=json.loads(mp.read_text())
          assert m['schema']=='zeref-dad-son-ledger-manifest-v13' and m['record_count']==352 and m['descendant_checkpoint_sha256']=='9944d1d6e69e50f7b4a026a06719a3093a34607bc416ad788c2c658e67b6f55f'
          s=json.loads(Path('_talk5/evidence/summary.json').read_text());delta=Path('_talk5/evidence/new-memory-delta-353-400.jsonl').read_bytes();rows=[json.loads(x) for x in delta.decode().splitlines() if x.strip()];assert len(rows)==48;assert rows[0]['previous_record_sha256']==m['last_record_sha256'];assert rows[-1]['record_sha256']==s['last_record_sha256']
          delta_path=Path(f"experiments/zeref-dad-son-001/memory/ledger-snapshots/run-{os.environ['GITHUB_RUN_ID']}-talk5-dad-god-delta.jsonl");assert not delta_path.exists();delta_path.write_bytes(delta)
