      - name: Seal available TALK-005 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _talk5/evidence
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('_talk5')
          files=[]
          if root.exists():
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p.name!='SHA256SUMS' and 'candidates/' not in p.as_posix() and 'free/' not in p.as_posix():
                      files.append(p)
          sums=[]
          for p in files:
              sums.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          (root/'SHA256SUMS').write_text('\n'.join(sums)+'\n')
          summary=root/'evidence'/'summary.json';stop=root/'evidence'/'stop.json'
          status={'schema':'zeref-talk5-run-status-v1','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'summary_present':summary.exists(),'stop_present':stop.exists(),'new_ibm_job_submitted':False}
          (root/'evidence'/'run-status.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n')
          PY

