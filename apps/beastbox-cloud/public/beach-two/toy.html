<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beach Two</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
:root{--bg:#0b1122;--panel:#111a33;--ink:#e8f1ff;--dim:#9aadd4;--line:#2b3d6b;--acc:#7ee7ff;--coral:#ff8a6c;--teal:#26b8c0}
body.light{--bg:#eef4f6;--panel:#ffffff;--ink:#14284a;--dim:#4a5d80;--line:#c4d2e0;--acc:#1674a0}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}
#app{display:flex;height:100%}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#score{position:absolute;left:50%;top:8px;transform:translateX(-50%);image-rendering:pixelated;pointer-events:none}
#rail{width:300px;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:10px 12px}
.row{margin:8px 0}.row b{display:block;font-size:11px;letter-spacing:.12em;color:var(--dim);margin-bottom:4px;text-transform:uppercase}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{min-height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 13px system-ui;cursor:pointer}
button[aria-pressed=true]{background:var(--acc);color:#04121c;border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
details{border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin:8px 0}summary{cursor:pointer;font-weight:700;min-height:28px}
.label{font-size:12px;color:var(--acc);border-left:3px solid var(--acc);padding-left:7px;margin:6px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;margin:6px 0}dt{color:var(--dim)}dd{margin:0;word-break:break-all}
.inj{display:block;width:100%;text-align:left;margin:3px 0;padding:5px 8px;height:auto}.inj small{display:block;color:var(--dim);font-weight:400}
#signals{font:11px ui-monospace,monospace;color:var(--dim);max-height:90px;overflow:auto;white-space:pre}
#hint{position:absolute;left:8px;bottom:8px;font-size:11px;background:#000a;color:#fff;padding:3px 7px;border-radius:6px;pointer-events:none}
#err{position:absolute;inset:auto 8px 40px 8px;color:#ffb4a8;font-size:12px}
@media (max-width:760px){#app{flex-direction:column}#stage{flex:none;height:62vh}#rail{width:auto;border-left:0;border-top:1px solid var(--line);flex:1}}
#railToggle{display:none}
/* E3 (Cosmo): on phones the control panel collapses to one bar so the beach gets the screen. */
@media (max-width:760px){#railToggle{display:block;width:100%;margin:0 0 6px}#rail.collapsed>*:not(#railToggle):not(#seedline){display:none}#rail.collapsed{flex:none}#app.railc #stage{height:calc(100dvh - 96px)}}
</style></head><body>
<div id="app" class="railc"><div id="stage"><canvas id="c"></canvas><canvas id="score"></canvas><div id="hint"></div><div id="err"></div></div>
<aside id="rail" class="collapsed" aria-label="Beach Two controls">
<button id="railToggle" type="button" aria-expanded="false" aria-controls="rail">Controls ▾</button>
<div class="row"><b>Time</b><div class="seg" id="time"></div></div>
<div class="row"><b>Wind <span id="wms"></span></b><div class="seg" id="wind"></div></div>
<div class="row"><b>Attack style</b><div class="seg" id="attack"></div></div>
<div class="row seg"><button id="newm"></button><button id="pause" aria-pressed="false"></button><button id="raw" aria-pressed="false"></button><button id="theme">Light/Dark</button></div>
<div class="row"><b id="viewl">View</b><div class="seg"><button id="rotl" aria-label="Rotate left">⟲ 90°</button><button id="rotr" aria-label="Rotate right">⟳ 90°</button><button id="zin">＋</button><button id="zout">－</button></div></div>
<p class="label" id="seedline" data-beach-seedline>Seeded by four real IBM quantum runs.</p>
<details id="synapse"><summary>Details</summary>
<p class="label" id="seedlabel"></p>
<dl><dt id="f_inj"></dt><dd id="v_inj">—</dd><dt id="f_job"></dt><dd id="v_job">—</dd><dt id="f_rounds"></dt><dd id="v_rounds">—</dd><dt id="f_win"></dt><dd id="v_win">—</dd><dt id="f_stream"></dt><dd id="v_stream">0</dd><dt>SHA-256</dt><dd id="v_sha">—</dd></dl>
<b id="switchl" style="font-size:11px;color:var(--dim)"></b><div id="inj"></div>
<div id="signals" aria-live="off"></div></details>
<details id="how"><summary>How it's drawn</summary><ul id="howl" style="padding-left:18px;font-size:12px"></ul></details>
</aside></div>
<script>(function(){var r=document.getElementById("rail"),a=document.getElementById("app"),b=document.getElementById("railToggle");b.addEventListener("click",function(){var c=r.classList.toggle("collapsed");a.classList.toggle("railc",c);b.setAttribute("aria-expanded",String(!c));b.textContent=c?"Controls ▾":"Hide controls ▴";setTimeout(function(){dispatchEvent(new Event("resize"));},30);});})();</script>
<script type="module" src="./toy.js"></script>
</body></html>
