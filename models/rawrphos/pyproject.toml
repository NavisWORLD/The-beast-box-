[build-system]
requires = ["setuptools>=78.1.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rawrphos"
version = "0.1.0"
description = "Cory Davis native PHOS/CST language-model research"
requires-python = ">=3.10"
license = "LicenseRef-Beast-Box-Source-Available"
dependencies = ["torch>=2.2", "numpy>=1.26", "tokenizers>=0.20", "safetensors>=0.4.5"]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
dev = ["pytest>=8", "psutil>=6", "pyarrow>=15"]

[tool.setuptools]
package-dir = {rawrphos = "."}
packages = ["rawrphos", "rawrphos.architecture", "rawrphos.tokenizer", "rawrphos.data", "rawrphos.training", "rawrphos.inference", "rawrphos.adapters", "rawrphos.evaluation", "rawrphos.scripts"]
